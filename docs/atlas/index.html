heck** | A document that links to a file that does not exist is reported instead of failing silently |\n\nNavigation: the **⌂ Atlas home** button on every page, the wordmark top-left, or the browser's Back. Each document has its own address (`#docs-tasks-03-…`, `#references`, `#mockup-dealer`), so you can send someone a link to one.\n\n## Regenerating it\n\nThe page is generated from the real files, so it cannot drift from the repo — but it does not update itself. After changing any document:\n\n```bash\npython3 docs/atlas/build.py . docs/atlas ../ marked.min.js\n```\n\nThe four arguments are the repo root, the output folder, the prefix the page uses to reach `docs/ux/` assets, and where it loads `marked` from. It needs Python 3 and nothing else; it writes only `index.html`.\n\nThe command prints the document count, the link and backlink totals, and **every unresolved link**. That makes it a cheap documentation check before a merge: if it reports a broken link, a document points at a file that is not there.\n\n## What is vendored here\n\n- `marked.min.js` — marked 12.0.2, MIT, the Markdown renderer, kept next to the page so the atlas works with no internet access. This matters inside the bank, where cdnjs is not reachable.\n- Fonts come from Google Fonts when there is a network and fall back to the system stack when there is not. Nothing else is fetched.\n\nLinks to files the page cannot show — the PDFs in `fund-documents/`, the fixture JSON — appear as a dashed path chip rather than a dead link. Open those from the repo.\n", "bytes": 2921}, {"path": "docs/build-workflow.md", "slug": "docs-build-workflow", "title": "Build workflow: from an empty repo to the demo", "label": "Build workflow: from an empty repo to the demo", "group": "build", "body": "# Build workflow: from an empty repo to the demo\n\nHow FundEli5 gets built at the event, with coding agents. The modules come from [architecture.md](architecture.md#modules), the technical decisions from [tech-choices.md](tech-choices.md), the screens from [ux/](ux/README.md).\n\nA timed rehearsal (1–3 Nov 2026) rebuilt every component from a repo like this one: 29 tickets, about 3 hours of agent work in all. Waiting was the real cost: plan limits, and agents stopping on a decision nobody had written down. So this workflow front-loads the decisions and keeps two tracks apart.\n\n## Two tracks\n\n| Track | What | Who decides | Starts |\n|---|---|---|---|\n| **Platform** | Everything that does not depend on the team's rules: skeleton, shell and design tokens, ports and fixture adapters, LLM egress (replay and Foundry), Privacy Gate, Request Parser, Share Class catalog, Check Record, Rule Card pipeline, validation module, the engine frame (Verdict combination, Citations, Draft vs Validated) | Fixed by the ADRs, [tech-choices.md](tech-choices.md) and [ux/](ux/README.md) | At once, while the team runs [tasks 1–3](tasks/README.md) |\n| **Content** | The demo story, cast, funds, rule kinds and their readings, answer key, emails, wording | The team, through its map | After [task 1](tasks/01-chart-the-map.md); its scenarios land in `specs/` |\n\nThe tracks meet at the **rule plug-ins** (one class per rule kind, [tech-choices](tech-choices.md#rule-catalog-one-plug-in-per-rule-kind)) and the **answer key**: the engine ticket waits for the team's first answer-key rows.\n\n## The rules\n\n1. **`specs/` is the definition of done.** The team writes it ([specs/README.md](../specs/README.md)). A content ticket is done when its tag passes and `@answer-key` still passes. A platform ticket is done when its JUnit tests and the four promises (`FourPromisesTest`) pass.\n2. **Agents never edit `specs/` or [hypotheses.md](hypotheses.md).** An agent that thinks a scenario is wrong stops and says why. Otherwise an agent can make a scenario pass by rewriting it. Before a merge, `git diff main -- specs/ docs/hypotheses.md` must be empty unless the ticket says the change is the point.\n3. **A missing business answer becomes a hypothesis, not a guess in code.** The agent stops; the team adds the row to [hypotheses.md](hypotheses.md) with its `@assumed` scenario; the ticket restarts.\n4. **Screens are built against the mockups.** A screen ticket's gate includes the [screen definition of done](ux/README.md#definition-of-done-for-a-screen): a Playwright screenshot per state, compared with the mockup.\n5. **The API serves the screen.** A ticket that adds a screen state also adds what the API must return for it. No screen derives data by combining calls.\n\n## Order\n\n### Spine: one ticket at a time\n\n| # | Ticket | Done when | Mode |\n|---|---|---|---|\n| S1 | **Skeleton**: Spring Boot 4 with a `pipeline` profile, devtools, springdoc; ArchUnit rules; Angular shell with `tokens.css` as `styles.css`, the top bar and both routes; the client generated from OpenAPI (one npm script); Cucumber runner on `specs/` with `not @live-llm`; Playwright in `frontend/e2e` with one test that screenshots the shell; `./start.sh` | `./mvnw test` passes; `ng build` passes; the shell screenshot matches the mockups' top bar | HITL |\n| S2 | **Schemas and ports**: Rule Card, Subscription Request, Verdict, Check Record types; the out ports with fixture adapters on [contracts/fixtures](contracts/fixtures/); `LlmEgress` with the replay adapter | Fixtures load through each port; replay serves one recorded answer | HITL |\n| S3 | **Walking skeleton**: an email runs through every seam with stubs (Privacy Gate → Request Parser on replay → engine with a fixed Verdict → template reply → Check Record), shown on the dealer screen **in the mockup's answered layout** with the shared `ui/` components | The flow runs over HTTP from the screen; the e2e test screenshots `answered` | HITL |\n| S4 | **Rule Engine frame and the team's first rule kinds**, `/tdd`, one answer-key row at a time | `@rule-engine` and `@answer-key` pass on the team's rows; `engine-purity-reviewer` reports nothing | HITL |\n\nS1–S3 need no content and start while the team charts its map. S4 starts when the team's first answer-key rows exist (task 3).\n\n### Waves: at most 3 worktrees at once\n\nEach wave's tickets touch disjoint packages. Start each with `claude --worktree \u003cmodule>`.\n\n| Wave | Tickets | Needs |\n|---|---|---|\n| A | Privacy Gate with Presidio ([ADR 0009](adr/0009-presidio-detects-personal-data-in-emails.md)) · Share Class catalog · Check Record with its API (the screen gets the record id in the answer) | S2, S3 |\n| B | Request Parser and Reply Drafter on the Foundry adapter · explanation templates (the Verdict sentences, from task 2's wording) · validation module | A; the Verdict sentences from task 2 |\n| C | Dealer screen, all states of `dealer.html` · validation screen, all states of `validation.html` · Rule Card pipeline (Jev ranking, drafting, quote check) for the team's funds | B for the screens; the team's fund list for the pipeline |\n| Integrate | Merge, then `demo-flow-verifier` on `@must` | All of the above |\n\nThe rest of the team's rule kinds join as tickets in any wave once their rows are in the answer key: one plug-in class each.\n\n## How much an agent does alone\n\n| Modules | Mode | Gate before the builder reads the diff |\n|---|---|---|\n| Rule Engine, rule plug-ins, Scale Mapping | HITL: `/tdd`, the builder picks each next example | module tag + `@answer-key`; `engine-purity-reviewer` |\n| Privacy Gate, Request Parser, Reply Drafter, LLM egress | HITL | module tests; `privacy-gate-auditor` |\n| Share Class catalog, Check Record, validation module, Rule Card pipeline, explanation templates | AFK: `/implement` in a worktree until the gate passes | module tests; `java-reviewer` |\n| Angular screens | AFK | the [screen definition of done](ux/README.md#definition-of-done-for-a-screen); `typescript-reviewer` |\n\nAn AFK agent that hits a stop condition stops and reports. It never works around it.\n\n## The build ticket\n\n`/to-tickets` publishes one issue per row above, labelled `ready-for-agent` (AFK) or `ready-for-human` (HITL), with blocking edges that follow the spine and the waves. Every body uses this template, so an agent starting cold has what it needs:\n\n```markdown\n## Goal\n\u003cone sentence in GLOSSARY.md terms: what the module does in the demo story>\n\n## Done when\n- \u003cmodule tests or Cucumber tags> pass, with no undefined step\n- `@answer-key` still passes; `FourPromisesTest` passes\n- \u003cfor a screen> the Playwright test of each listed state passes and its screenshot matches docs/ux/screens/\u003cfile>\n- \u003cgate agents> report nothing\n\n## Read first\n- GLOSSARY.md; ADRs \u003cnumbers>; architecture.md row \"\u003cmodule>\"\n- contract or schema: \u003cpath>; screens: docs/ux/README.md section \"\u003csection>\", mockup state \u003cfile#state>\n- hypotheses.md rows: \u003crows>, or \"none\"\n\n## Seam\nMay change: \u003cpackages / folders>. Calls only: \u003cports or modules>.\nAPI it must return for the screen: \u003cfields>, or \"none\"\n\n## Must not\n- edit specs/, docs/hypotheses.md, generated client code, or another module's package\n- call an LLM except through the egress client (ADR 0004)\n- put a raw colour, enum, ISO date or file id on screen\n\n## Stop and ask when\n- a scenario looks wrong or contradicts an ADR\n- a business answer is needed that hypotheses.md does not give\n- a port or schema signature must change\n- the mockup has no state for what the screen must show\n```\n\n## Day to day\n\n| When | Do |\n|---|---|\n| Start a ticket | `claude --worktree \u003cmodule>`, then `/tdd \u003cissue>` (HITL) or `/implement \u003cissue>` (AFK) |\n| Before merging | the module's tests and tags, `@answer-key`, the gate agents, the empty `specs/` diff; for a screen, look at its screenshots |\n| API changed | regenerate the Angular client, commit both sides together |\n| A hypothesis changes | update [hypotheses.md](hypotheses.md); the failing scenarios become the follow-up ticket |\n| Integration, freeze, rehearsal | `demo-flow-verifier` on `@must` |\n", "bytes": 8102}, {"path": "docs/contracts/client-profile.md", "slug": "docs-contracts-client-profile", "title": "Client Profile contract", "label": "Client Profile contract", "group": "contracts", "body": "# Client Profile contract\n\nWhy the app reads bank data only through contracts like this one: [ADR 0008](../adr/0008-bank-data-enters-through-canonical-contracts.md).\n\nThe app reads a **Client Profile** (see `GLOSSARY.md`) through one out port, `ClientProfiles`. Two adapters implement it, chosen per port ([ADR 0008](../adr/0008-bank-data-enters-through-canonical-contracts.md)). **At the event the fixture adapter runs inside the bank too**: DEV's CRM holds mock clients, and the fixtures are the coverage set's answer key. The CRM adapter below is the production path.\n\n```\nPrivacy Gate ──┐\nRule Engine  ──┴─► ClientProfiles (out port)\n                     ├── FixtureClientProfiles   external environment: reads fixtures/client-profiles/*.json\n                     └── CrmClientProfiles       internal environment: CRM GraphQL portfolio + person → Client Profile\n```\n\nNothing above the port knows which adapter runs or that the CRM speaks GraphQL. This page is a specification: the Java interface and records are written from it before the event.\n\n## The port\n\n```\ninterface ClientProfiles {\n\n  /** For the Privacy Gate. Empty when the CRM does not know the reference. */\n  Optional\u003cPortfolioId> portfolioId(PortfolioReference ref);\n\n  /** For the Rule Engine. Throws PortfolioNotFound or ClientDataUnavailable. */\n  ClientProfile clientProfile(PortfolioReference ref);\n}\n```\n\n- `PortfolioReference`: the bank's identifier, `^[A-Z]{3}\\d{8}$` (Legal Entity code, 6-digit client number, 2-digit dossier number). Client-identifying: never sent to an LLM.\n- `PortfolioId`: a UUID, one to one with the Portfolio Reference. May be sent to an LLM.\n- `portfolioId` exists so the Privacy Gate never loads client facts it does not need. The CRM adapter selects only that field.\n\n### Outcomes\n\n| Case | Port | What the app does |\n|---|---|---|\n| Unknown Portfolio Reference | `portfolioId` empty; `clientProfile` throws `PortfolioNotFound` | Privacy Gate: no LLM call, the dealer enters the request by hand. Check: Needs Review \"portfolio not found\" |\n| Portfolio found, some facts missing | `ClientProfile` with those fields absent | Each rule that reads a missing field gives Review; other rules run normally |\n| No classification for the portfolio's Legal Entity | `classification` absent | Needs Review \"no Investor Classification\" |\n| Bank system down or timing out | `clientProfile` throws `ClientDataUnavailable` | No Verdict; the screen says \"client data unavailable, retry\". Never a Verdict on partial data |\n\nA profile with gaps is a normal answer, not an error. **The adapter never fills a default**: absent means unknown, and unknown leads to Review, never to a guess.\n\n## The Client Profile\n\nThree blocks, one per level of the glossary's Client Profile: the person (`client`), the classification the portfolio's Legal Entity gives them (`classification`), and the dossier (`portfolio`).\n\n```json\n{\n  \"portfolioRef\": \"LOC90000201\",\n  \"portfolioId\": \"4b0f6f3e-2f7a-4c55-9a59-0c8f1d5b7e21\",\n  \"legalEntity\": \"LOC\",\n  \"retrievedAt\": \"2026-11-02T08:00:00Z\",\n  \"client\": {\n    \"residenceCountry\": \"CH\",\n    \"nationalities\": [\"CH\", \"US\"],\n    \"taxResidences\": [\"CH\", \"US\"],\n    \"birthCountry\": \"US\",\n    \"usPerson\": { \"fatcaStatus\": \"us_person\", \"usPermanentResident\": false },\n    \"knowledgeAndExperience\": [\n      { \"productType\": { \"code\": \"FUNDS\", \"label\": \"Investment funds\" }, \"level\": { \"code\": \"EXPERT\", \"label\": \"Expert\" } }\n    ]\n  },\n  \"classification\": {\n    \"regime\": \"finsa\",\n    \"category\": \"professional\",\n    \"classifiedOn\": \"2024-05-14\",\n    \"declarations\": [\n      { \"type\": \"finsa_hnwi_opt_out\", \"date\": \"2024-05-14\", \"label\": \"HNWI opt-out, FinSA art. 5(1)\" }\n    ]\n  },\n  \"portfolio\": {\n    \"referenceCurrency\": \"CHF\",\n    \"mandate\": { \"type\": \"advisory\" },\n    \"investmentProfile\": {\n      \"riskProfile\": { \"code\": \"4\", \"label\": \"Growth\" },\n      \"abilityToBearLosses\": { \"code\": \"FULL_LOSS\", \"label\": \"Full loss\" },\n      \"horizonYears\": 10,\n      \"assessedOn\": \"2026-03-10\"\n    }\n  }\n}\n```\n\n### Two kinds of values\n\n- **Bank codes**, `{ \"code\": \"...\", \"label\": \"...\" }`: the bank's own scales, passed through unchanged. The validated **Scale Mapping** translates them to Target Market values; no code does. Inside the bank only the Scale Mapping table changes.\n- **Canonical enums** (lower snake case): legal categories that are closed lists set by law. The CRM adapter maps the bank's codes onto them. Rules branch on them directly.\n\n### Fields\n\nColumns: **LLM** is whether the field may reach an LLM under the [allow-list](../architecture.md#privacy-boundary) (only the fields a call needs, through the Privacy Gate). **Unknown** is what an absent value leads to. Every field is optional unless marked *required*.\n\n#### Top level\n\n| Field | Type | Meaning | Read by | LLM | Unknown |\n|---|---|---|---|---|---|\n| `portfolioRef` | string, `^[A-Z]{3}\\d{8}$`, *required* | The Portfolio Reference asked for, echoed back | Check Record, reply | **no** | — |\n| `portfolioId` | UUID, *required* | The portfolio's Portfolio Id | Privacy Gate | yes | — |\n| `legalEntity` | string, `^[A-Z]{3}$`, *required* | The Legal Entity holding the portfolio: the first 3 letters of the Portfolio Reference. Sets the regime: `LOC` → CH, `LUX` → LU, anything else → not covered | every rule (regime) | yes | — (other codes give Needs Review \"regime not covered\") |\n| `retrievedAt` | date-time, *required* | When the adapter read the bank's systems (for fixtures: when they were written) | Check Record | no | — |\n| `client` | object | Facts about the person; see below | | | the block's fields are all unknown |\n| `classification` | object | The Investor Classification the portfolio's Legal Entity gives the client; see below | | | Needs Review \"no Investor Classification\" |\n| `portfolio` | object | Facts about the dossier; see below | | | the block's fields are all unknown |\n\n#### `client`: the person\n\n| Field | Type | Meaning | Read by | LLM | Unknown |\n|---|---|---|---|---|---|\n| `residenceCountry` | ISO 3166-1 alpha-2 | Country of legal residence | Fund Registration (country of distribution); US Person under residence-based definitions (Reg S) | yes | Fund Registration: Review. US Person: Review when the card's definition looks at residence |\n| `nationalities` | array of ISO 3166-1 alpha-2, every nationality held | Citizenships. `[\"CH\",\"US\"]` is a US citizen even if resident in Switzerland | US Person under citizenship-based definitions (\"investors with U.S. citizenship\", US tax code) | yes | US Person: Review when the card's definition looks at citizenship |\n| `taxResidences` | array of ISO 3166-1 alpha-2 | Countries where the client is tax resident | US Person (tax-code definitions); shown in the Justification | yes | US Person: Review when the card's definition looks at tax residence |\n| `birthCountry` | ISO 3166-1 alpha-2 | Country of birth only, never city or date | US Person: a US birthplace is a US indication | as \"US-born yes/no\" only | US Person: Review when needed and nothing else settles it |\n| `usPerson.fatcaStatus` | `us_person` \\| `non_us_person` | The bank's own FATCA determination for the client | US Person: shown in the Justification next to the card's own definition; never replaces it | yes | Review on every US Person rule ([answer-key row 23](https://github.com/smnajid/fund-gate/blob/main/specs/99-answer-key.feature)) |\n| `usPerson.usPermanentResident` | boolean | Holds a US green card | US Person (tax-code definitions count green card holders) | yes | taken from `fatcaStatus`: `non_us_person` means no green card; otherwise Review |\n| `knowledgeAndExperience` | array of `{ productType, level }` | Knowledge and experience per product type, as the bank assesses it | Target Market (knowledge and experience), for the product type the Share Class catalog gives the Share Class | yes | no entry for the Share Class's product type: Target Market Review |\n| `knowledgeAndExperience[].productType` | bank code | The bank's product type, e.g. `FUNDS`, `PRIVATE_EQUITY` | Share Class catalog → which entry applies | yes | entry ignored |\n| `knowledgeAndExperience[].level` | bank code | The bank's level for that product type, e.g. `NONE`, `BASIC`, `INFORMED`, `EXPERT`. Translated by the Scale Mapping | Target Market | yes | entry ignored |\n\nThe engine derives each card's US Person answer from these raw facts: one flag cannot answer Reg S (residence), \"US citizens\" and the US tax code at once. Tom Whitfield is not a US Person under Reg S but is excluded as a US citizen elsewhere.\n\n#### `classification`: given by the portfolio's Legal Entity\n\nOnly the portfolio's own Legal Entity: a client served by LOC and LUX has two classifications, and a `LUX` portfolio gets only the LUX one.\n\n| Field | Type | Meaning | Read by | LLM | Unknown |\n|---|---|---|---|---|---|\n| `regime` | `finsa` \\| `mifid` | The law under which the classification was made: FinSA for LOC, MiFID II for LUX | consistency check with `legalEntity` | yes | taken from `legalEntity` |\n| `category` | `retail` \\| `professional` \\| `institutional` | The Investor Classification. `institutional` covers eligible counterparties (MiFID) and institutional clients (FinSA) | investor category; KID required for retail; Fund Registration (classification); deriving qualified (CH) and well-informed (LU) | yes | Needs Review \"no Investor Classification\" |\n| `classifiedOn` | date | When the category was last set | Justification, Check Record | no | — |\n| `declarations` | array | Opting declarations on file for this Legal Entity. Empty array: none on file. Absent: unknown | deriving qualified investor (CH) and well-informed investor (LU) | type only | rules that need a declaration: Review |\n| `declarations[].type` | `finsa_hnwi_opt_out` \\| `finsa_opt_in_retail` \\| `mifid_professional_on_request` \\| `lu_well_informed_confirmation` \\| `other` | `finsa_hnwi_opt_out`: a high-net-worth retail client declared to be treated as professional (FinSA art. 5(1)). `finsa_opt_in_retail`: a professional asked to be treated as retail (FinSA art. 5(5)). `mifid_professional_on_request`: a retail client treated as professional on request (MiFID II Annex II.II). `lu_well_informed_confirmation`: written confirmation of well-informed investor status (LU SIF/RAIF laws). `other`: anything else, kept with its `label` | qualified / well-informed derivation; `other` gives Review where a declaration matters | yes | — |\n| `declarations[].date` | date | When the declaration was signed | Justification | no | the declaration still counts; shown as undated |\n| `declarations[].label` | string | The bank's own wording, for the dealer | dealer screen | no | — |\n\nQualified investor (CH) and well-informed investor (LU) are never fields: the engine derives them from `category`, `declarations`, `mandate` and the amount, as the glossary says.\n\n#### `portfolio`: the dossier\n\n| Field | Type | Meaning | Read by | LLM | Unknown |\n|---|---|---|---|---|---|\n| `referenceCurrency` | ISO 4217 | The portfolio's reference currency | not read by any rule; shown to the dealer. The Subscription Request carries its own amount and currency | no | — |\n| `mandate.type` | `advisory` \\| `discretionary` \\| `execution_only` | How the portfolio is managed | mandate-only class; investor category (a discretionary mandate counts as institutional under art. 174 of the 2010 Law, coverage row 2); qualified investor through a mandate (CISA art. 10(3ter)) | yes | Review on those rules |\n| `mandate.startDate` | date | When the mandate started | Justification | no | — |\n| `mandate.manager.kind` | `bank` \\| `external_supervised` \\| `external_other` | Who manages a discretionary mandate: the bank itself, an external manager supervised by a regulator, or another external manager | CISA art. 10(3ter) (supervised manager); mandate-only classes | yes | Review on those rules |\n| `mandate.manager.name` | string | The manager's name when external, e.g. a fund house for a class reserved to its own mandates | mandate-only class naming a manager (Swiss Life AM class, coverage row 18) | no | Review when the card names a manager |\n| `investmentProfile.riskProfile` | bank code | The bank's risk profile, e.g. `3` \"Balanced\". Translated to a maximum SRI by the Scale Mapping | Target Market (risk tolerance) | yes | Target Market Review |\n| `investmentProfile.abilityToBearLosses` | bank code | e.g. `NO_LOSS`, `LIMITED_LOSS`, `FULL_LOSS`. Translated by the Scale Mapping | Target Market (ability to bear losses) | yes | Target Market Review |\n| `investmentProfile.horizonYears` | integer ≥ 0 | Investment horizon of the portfolio in years | Target Market: Pass if ≥ the KID's recommended holding period | yes | Target Market Review |\n| `investmentProfile.assessedOn` | date | When the investment profile was last assessed | Justification; an Advisory Suggestion may ask whether it is current | no | — |\n\n`mandate` absent: unknown. A portfolio without a mandate is `{ \"type\": \"advisory\" }` or `{ \"type\": \"execution_only\" }`, never an absent block.\n\n**Not in the contract**, because no rule reads them: name, address, phone, email, exact birth date, place of birth below country, balances and positions, and any person identifier. The CRM adapter must not put them in the profile, so they never reach the Check Record snapshot or an LLM.\n\n## Fixtures\n\n[`fixtures/client-profiles/`](fixtures/client-profiles/): the 15 portfolios of [demo-dataset.md](fixtures/README.md), one file per Portfolio Reference, in the invented bank scales of that page. The fixture adapter reads them as they are. Portfolio Ids are fixed random UUIDs; regenerate them at the event if the bank wants fresh ones.\n\n## Inside the bank: the CRM adapter\n\nThe CRM is a GraphQL API with a `portfolio` query and a `person` query, both taking the Portfolio Reference. Only this adapter knows that. At the event:\n\n1. Read the CRM schema and fill the mapping table below.\n2. `portfolioId(ref)`: `portfolio(ref)` selecting only the Portfolio Id.\n3. `clientProfile(ref)`: `portfolio(ref)` and `person(ref)`, mapped onto the Client Profile. Select only the mapped fields, so nothing outside the contract is fetched.\n4. Map the bank's legal-category codes onto the canonical enums. Codes that match none: `other` for declarations; for `category` and `mandate.type`, leave the field absent (unknown) and log the code.\n5. Replace the Scale Mapping's bank side with the bank's real scales (risk profile, knowledge and experience levels and product types, ability to bear losses). This is a validated table, not adapter code.\n6. Run the coverage set against portfolios the desk picks.\n\nExpected query shape, to adjust to the real schema:\n\n```graphql\nquery ClientProfile($ref: String!) {\n  portfolio(ref: $ref) { id legalEntity referenceCurrency mandate { type startDate manager { kind name } }\n                         riskProfile { code label } lossCapacity { code label } horizon assessedOn }\n  person(ref: $ref)    { residence nationalities taxResidences birthCountry fatcaStatus greenCard\n                         knowledge { productType { code label } level { code label } } }\n}\n```\n\n| Contract field | CRM field (fill at the event) | Notes |\n|---|---|---|\n| `portfolioId` | `portfolio.?` | |\n| `client.residenceCountry` | `person.?` | ISO alpha-2 |\n| `client.nationalities` | `person.?` | all of them |\n| `client.taxResidences` | `person.?` | |\n| `client.birthCountry` | `person.?` | country only |\n| `client.usPerson.fatcaStatus` | `person.?` | map to `us_person` / `non_us_person` |\n| `client.usPerson.usPermanentResident` | `person.?` | |\n| `client.knowledgeAndExperience` | `person.?` | per product type |\n| `classification.*` | `portfolio.?` or `person.?` | unknown which query holds it; one entry per Legal Entity, keep the portfolio's |\n| `portfolio.referenceCurrency` | `portfolio.?` | |\n| `portfolio.mandate.*` | `portfolio.?` | |\n| `portfolio.investmentProfile.*` | `portfolio.?` or `person.?` | risk profile may be held per client |\n", "bytes": 16053}, {"path": "docs/contracts/fixtures/README.md", "slug": "docs-contracts-fixtures-readme", "title": "Seed data", "label": "Seed data", "group": "contracts", "body": "# Seed data\n\nThe fixture files in this folder are **seed data**: a reference cast, four public funds and their bank-side facts, prepared before the event so the platform runs on day one. They are disposable. The team's demo story decides which clients, funds and cases stay ([task 3](../../tasks/03-write-the-demo-story-and-answer-key.md)). Whatever the team keeps, it covers with its own scenarios in `specs/`; the rest gets deleted. No test reads this folder: platform tests use their own frozen fixtures under `backend/src/test/resources`.\n\nThe expected answers for this seed (the 26-row reference answer key and the emails) are **not** in this repo. They live in the public reference build, [smnajid/fund-gate `specs/`](https://github.com/smnajid/fund-gate/tree/main/specs), and the team opens them only at the comparison step of task 3.\n\nVocabulary: [GLOSSARY.md](../../../GLOSSARY.md). Fund facts: [sample funds research](../../research/sample-funds.md).\n\n## Conventions\n\n- **Synthetic client numbers** come from the reserved range **900001–900099**, so they can never be mistaken for a real client. Portfolio Reference = Legal Entity + client number + dossier number, e.g. `LOC90000101`.\n- **Portfolio Ids** are random UUIDs, generated with the fixtures. Only Portfolio Ids reach the LLM.\n- Values use the **bank scales** below. The Scale Mapping is the only thing that translates them.\n- *Assumed* marks a fact we chose, not one read from a source. Replace it with the bank's data at the event.\n\n## Share Classes used\n\n| Short name | Fund / class | ISIN | Class currency | Regime of fund |\n|---|---|---|---|---|\n| GCE-BP | Nordea 1 – Global Climate and Environment, BP-EUR | `LU0348926287` | EUR | LU UCITS |\n| GCE-BI | Nordea 1 – Global Climate and Environment, BI-EUR | `LU0348927095` | EUR | LU UCITS |\n| SIF-W | Nordea SIF – Global Private Equity, BW-SEK | `LU2607415275` | SEK (minimums in EUR, fixed 1 EUR = 10 SEK) | LU SIF |\n| BNP-A | BNP PARIBAS (CH) Bonds CHF, A | `CH0112537516` | CHF | CH |\n| BNP-AAC | BNP PARIBAS (CH) Bonds CHF, A AC | `CH0114292532` | CHF | CH |\n| BNP-I | BNP PARIBAS (CH) Bonds CHF, I | `CH0112537557` | CHF | CH |\n| SL-ICAP | Swiss Life iFunds (CH), I Cap | *ISIN to confirm* | CHF | CH |\n| SL-AMCAP | Swiss Life iFunds (CH), AM Cap | *ISIN to confirm* | CHF | CH |\n| SL-IA1 | Swiss Life iFunds (CH), I-A 1 | *ISIN to confirm* | CHF | CH |\n\nSwiss Life class↔ISIN pairs are unverified (see the research). Pick one sub-fund, e.g. Bond Swiss Francs Domestic, and confirm the ISINs before the event.\n\n## Bank scales and Scale Mapping\n\nThe bank scales are invented and deliberately differ from the Target Market scales, so the Scale Mapping does real work. At the event the bank's real scales replace this one table.\n\n| Bank field | Bank value | Target Market value |\n|---|---|---|\n| Risk profile | 1 Conservative | max SRI 2 |\n| | 2 Income | max SRI 3 |\n| | 3 Balanced | max SRI 4 |\n| | 4 Growth | max SRI 5 |\n| | 5 Dynamic | max SRI 7 |\n| Knowledge & experience (per product type) | none | below basic |\n| | basic | basic |\n| | informed | informed |\n| | expert | advanced |\n| Ability to bear losses | no loss | no capital loss |\n| | limited loss | limited capital loss |\n| | full loss | can bear loss of entire capital |\n| Investment horizon | years | compared with the KID's recommended holding period (pass if ≥ RHP) |\n\n## Fund Registration\n\n| Share Class | Country | Investor Classification | Registered | Source |\n|---|---|---|---|---|\n| GCE-BP, GCE-BI | CH | all | yes | *assumed* (Swiss representative named, prospectus p.146) |\n| GCE-BP, GCE-BI | LU | all | yes | home jurisdiction |\n| SIF-W | LU | well-informed | yes | home jurisdiction |\n| SIF-W | CH | any | **no** | no Swiss representative named |\n| BNP-A, BNP-AAC, BNP-I | CH | all (I: qualified only) | yes | home jurisdiction |\n| BNP-A, BNP-AAC, BNP-I | LU | any | **no** | \"no issue or redemption abroad\" (prospectus p.16) |\n| SL-* | CH | qualified | yes | \"distribution approved: Switzerland\" (appendix p.45) |\n| SL-* | LU | any | **no** | same |\n\nFixture: [`contracts/fixtures/fund-registrations.json`](fund-registrations.json). DEV FMD carries registration data, so at the event the engine reads FMD instead ([contract](../fund-registrations.md)). Compare this table with FMD before the event if DEV can be reached, otherwise at the event; where they differ, FMD wins and the answer-key rows in `specs/` that depend on it change.\n\n## FX\n\n| Pair | Rate | Date | Source |\n|---|---|---|---|\n| EUR/CHF | 1 EUR = 0.9350 CHF | 2026-11-02 | *assumed*, \"bank FX table\" |\n\nThe planned SEK rate is not needed. SIF minimums are stated in EUR, and the prospectus fixes 1 EUR = 10 SEK for converting them.\n\n## Client Profiles\n\nFields follow the Rule Card model: client (client number) / client × Legal Entity / portfolio (dossier).\n\n### Client level\n\n| Client | Name | Residence | Nationalities | Tax residence | Place of birth | US Person / FATCA | Knowledge & experience |\n|---|---|---|---|---|---|---|---|\n| 900001 | Anna Steinmann | CH | CH | CH | Zürich | not a US Person / non-US | funds: informed |\n| 900002 | Tom Whitfield | CH | CH, US | CH, US | Boston, US | US citizen / specified US person | funds: expert |\n| 900003 | Claire Dupont | LU | FR | LU | Lyon, FR | not a US Person / non-US | funds: basic |\n| 900004 | (coverage) | LU | LU | LU | Luxembourg | not a US Person | funds: expert, private equity: expert |\n| 900005 | (coverage) | LU | BE | LU | Liège, BE | not a US Person | funds: informed, private equity: informed |\n| 900006 | (coverage) | LU | DE | LU | Trier, DE | not a US Person | funds: informed, private equity: **none** |\n| 900007 | (coverage) | CH | CH | CH | Bern | not a US Person | funds: expert |\n| 900008 | (coverage) | LU | LU | LU | Luxembourg | not a US Person | funds: basic |\n| 900009 | (coverage) | CH | CH | CH | Geneva | not a US Person | funds: expert |\n| 900010 | (coverage) | CH | CH | CH | Basel | not a US Person | funds: basic |\n| 900011 | (coverage) | CH | CH | CH | Lausanne | not a US Person | funds: informed |\n| 900012 | (coverage) | CH | CH | CH | Lugano | **missing** | funds: basic |\n| 900013 | (coverage) | SG | SG | SG | Singapore | not a US Person | funds: informed |\n| 900014 | (coverage) | CH | CH | CH | Zürich | not a US Person | funds: basic |\n\n### Client × Legal Entity\n\n| Client | Legal Entity | Classification | Declarations |\n|---|---|---|---|\n| 900001 | LOC | FinSA retail | none |\n| 900002 | LOC | FinSA professional | HNWI opt-out (FinSA art. 5(1)), 2024-05-14 |\n| 900003 | LUX | MiFID retail | none |\n| 900004 | LUX | MiFID professional (per se) | none |\n| 900005 | LUX | MiFID retail | well-informed written confirmation, 2026-09-15 |\n| 900006 | LUX | MiFID retail | well-informed written confirmation, 2026-09-20 |\n| 900007 | LOC | FinSA professional | HNWI opt-out, 2023-02-01 |\n| 900008 | LUX | MiFID retail | none |\n| 900009 | LOC | FinSA professional | HNWI opt-out, 2022-11-10 |\n| 900010 | LOC | FinSA retail | none |\n| 900011 | LOC | FinSA retail | none |\n| 900012 | LOC | FinSA retail | none |\n| 900013 | SIN | (not covered) | none |\n| 900014 | LOC | FinSA retail | none |\n\n### Portfolio level\n\n| Portfolio Reference | Mandate type (start) | Risk profile | Ability to bear losses | Horizon | Ref. currency |\n|---|---|---|---|---|---|\n| `LOC90000101` | advisory | 3 Balanced | full loss | 7y | CHF |\n| `LOC90000102` | discretionary mandate (2021-03-01) | 4 Growth | full loss | 10y | EUR |\n| `LOC90000201` | advisory | 4 Growth | full loss | 10y | CHF |\n| `LUX90000301` | advisory | 2 Income | limited loss | 2y | EUR |\n| `LUX90000401` | advisory | 5 Dynamic | full loss | 12y | EUR |\n| `LUX90000501` | advisory | 2 Income | full loss | 5y | EUR |\n| `LUX90000601` | advisory | 5 Dynamic | full loss | 12y | EUR |\n| `LOC90000701` | advisory | 5 Dynamic | full loss | 12y | CHF |\n| `LUX90000801` | advisory | 2 Income | limited loss | 5y | EUR |\n| `LOC90000901` | advisory | 3 Balanced | full loss | 5y | CHF |\n| `LOC90001001` | discretionary mandate (2019-06-01), not with Swiss Life | 3 Balanced | full loss | 7y | CHF |\n| `LOC90001101` | discretionary mandate (2020-01-15) | 3 Balanced | full loss | 7y | CHF |\n| `LOC90001201` | advisory | 2 Income | limited loss | 5y | CHF |\n| `SIN90001301` | advisory | 3 Balanced | full loss | 5y | USD |\n| `LOC90001401` | advisory | 2 Income | limited loss | 5y | CHF |\n\n## Demo cast\n\nThis is the reference story the seed was built for. Row numbers refer to the [reference answer key](https://github.com/smnajid/fund-gate/blob/main/specs/99-answer-key.feature). It is the strawman to beat, not the team's story.\n\n- **Anna Steinmann, the hero: same client, same fund, two portfolios.** Marc Aebi's email lists `LOC90000101` and `LOC90000102` and no client data. One check per reference gives Not Eligible and Eligible on GCE-BI (rows 1 and 2), and the reply suggests GCE-BP for portfolio 01 (row 3).\n- **Tom Whitfield, the closing flourish: one client, three US Person definitions.** No email: the dealer runs \"what can this portfolio buy?\" on `LOC90000201` with CHF 2,000,000, deterministic and with no LLM. The same US citizen passes Nordea's Reg S test and fails BNP's and Swiss Life's (rows 4–9).\n- **Claire Dupont: the Target Market binds in Luxembourg.** Sophie Lentz's email is in French and names the fund but no Share Class, so every class of the fund is checked (rows 10 and 11). The reply, in French, recommends BP-EUR.\n\nTwo more emails exercise the edges: the **guard email** names Anna, so the Privacy Gate makes no LLM call and the dealer enters the request by hand; the **amount-to-follow email** gives row 26.\n\nThe emails are drafts. Replace them with real request wording from the desk.\n\n## At the event\n\n1. Map the canonical fields above onto the bank's export, and swap the Scale Mapping for the bank's scales.\n2. Generate fixtures in the bank's shape, with fresh Portfolio Ids.\n3. Compare the Fund Registration table with DEV FMD and update the team's answer-key rows in `specs/` where they differ; replace the FX table with the bank's if it provides one.\n4. Run the answer key (`@answer-key`); every row must pass before the demo is rehearsed.\n", "bytes": 10198}, {"path": "docs/contracts/fund-documents.md", "slug": "docs-contracts-fund-documents", "title": "Fund Documents contract", "label": "Fund Documents contract", "group": "contracts", "body": "# Fund Documents contract\n\nWhy the app reads bank data only through contracts like this one: [ADR 0008](../adr/0008-bank-data-enters-through-canonical-contracts.md).\n\nThe offline Rule Card pipeline reads **Fund Documentation** through one out port, `FundDocuments`: which documents a fund has, and their PDFs. Two adapters implement it:\n\n```\nRule Card pipeline ──► FundDocuments (out port)\n(offline CLI)            ├── FolderFundDocuments   reads a folder of PDFs and fixtures/fund-documents.json\n                         └── FmdFundDocuments      FMD document metadata + PDFs\n```\n\n**At the event `FolderFundDocuments` runs inside the bank too.** DEV FMD, the only environment we can reach, serves mock PDFs, and a Rule Card drafted from a mock is meaningless. So the PDFs come from the funds' public websites or from the bank by hand, and `FmdFundDocuments` is specified here but not built. In production it replaces the folder adapter, and nothing else changes. This page is a specification; the Java interface and records are written from it before the event.\n\n## The port\n\n```\ninterface FundDocuments {\n\n  /** Every document of the fund the Share Class belongs to: its prospectus and every KID. */\n  List\u003cFundDocument> documents(Isin anyShareClassOfTheFund);\n\n  /** The PDF. Throws DocumentUnavailable. */\n  byte[] content(DocumentId id);\n}\n```\n\n### The manifest\n\nInside the bank, the folder adapter's manifest is **generated from DEV FMD's document metadata**, which is real (type, language, edition date, Share Classes covered). Only the PDF comes from elsewhere. That keeps each entry true to the bank's data, and narrows the production gap to fetching the PDF too. Outside the bank, the manifest is the fixture below.\n\n### Outcomes\n\n| Case | What the pipeline does |\n|---|---|\n| A document with no `contentSha256`, or bytes that don't match it | Refuses it. This guards against drafting from a mock PDF or the wrong file |\n| `confidentiality` is `confidential`, or absent | Refuses it: no LLM call. The pipeline drafts only public Fund Documentation, through the one LLM egress client ([ADR 0004](../adr/0004-two-runtimes-one-llm-egress.md)). Admitting confidential documents would need its own decision first. The spike's Claude-plan drafter is never part of the product |\n| `fmdEditionDate` and `pdfEditionDate` differ | Drafts anyway. The validation screen shows \"the PDF is the 2026-03 edition, FMD lists 2026-09\" |\n| FMD later lists a newer edition than a Validated card was drafted from | The card becomes a **Stale Rule Card**: the dealer screen and the validation screen warn \"newer edition available\". The Verdict does not change |\n| The fund has no documents | No card. Its Share Classes give Needs Review \"fund not covered\" |\n| `content` throws `DocumentUnavailable` | No draft for that fund this run; retry |\n\n### What the Rule Card keeps\n\nFor each document a card was drafted from: `documentId`, `contentSha256`, both edition dates and `confidentiality`. For the drafting itself: the model id and the endpoint the egress client called. That is what makes \"newer edition available\" possible, and it lets an auditor fetch the exact PDF a Citation points into and see which model read it.\n\n## The Fund Document\n\n```json\n{\n  \"documentId\": \"nordea1-prospectus-2026-06\",\n  \"isins\": [\"LU0348926287\", \"LU0348927095\"],\n  \"type\": \"prospectus\",\n  \"language\": \"en\",\n  \"fmdEditionDate\": null,\n  \"pdfEditionDate\": \"2026-06\",\n  \"confidentiality\": \"public\",\n  \"contentSha256\": \"77cf3ae3082a99539306781c237c2bb6f138ed029e57c7c91874a781d717c8b4\",\n  \"sourceUrl\": null,\n  \"file\": \"prospectus.pdf\"\n}\n```\n\n### Fields\n\nColumns as in the [Client Profile contract](client-profile.md#fields). Fund Documentation describes a fund, not a client, so no per-investor document (a side letter, a subscription form) belongs in this port. A document's content reaches an LLM only when it is `public`. Every field is optional unless marked *required*.\n\n| Field | Type | Meaning | Read by | LLM | Unknown |\n|---|---|---|---|---|---|\n| `documentId` | string, *required* | FMD's document id; in the folder adapter, the manifest's own id. **Ask the desk whether FMD has one** | the Rule Card's sources, Citations | yes | — |\n| `isins` | array of ISIN, *required* | The Share Classes the document covers: every class of the fund for a prospectus, one for a KID | `documents(isin)`; the Share Class map of the draft | yes | — |\n| `type` | `prospectus` \\| `kid` \\| `supplement` \\| `fund_contract` \\| `ppm` \\| `other` | What the document is. `fund_contract`: a Swiss fund contract. `ppm`: a private placement memorandum, always `confidential` whatever the manifest says | page selection (an umbrella prospectus needs it); which rules a KID can source (Target Market) | yes | `other` |\n| `language` | ISO 639-1 | The document's language | page selection (English, German, French) | yes | detected from the text |\n| `fmdEditionDate` | date or `YYYY-MM` | The edition FMD lists. Absent outside the bank | Stale Rule Card; the edition warning | yes | no edition check |\n| `pdfEditionDate` | date or `YYYY-MM` | The edition printed in the PDF, read by whoever adds it to the folder | the edition warning; the Check Record | yes | no edition check |\n| `confidentiality` | `public` \\| `confidential` | `public`: published by the fund on its website. `confidential`: a PPM, or anything the bank hands over under its terms | whether the pipeline may draft it | yes | treated as `confidential` |\n| `contentSha256` | hex SHA-256, *required* | Hash of the PDF bytes | the guard above; the Rule Card's sources | no | — (the pipeline refuses the document) |\n| `sourceUrl` | URL | Where the PDF was downloaded from, for a public document. **Ask the desk whether FMD keeps one** | validation screen, audit | no (an internal URL could name a bank host) | blank |\n| `file` | path relative to the folder | The PDF's file name. Folder adapter only | `content` | no | — |\n\n## Fixtures\n\n[`fixtures/fund-documents.json`](fixtures/fund-documents.json): the 9 sample documents behind the demo dataset's 4 funds, as the extraction spike downloaded them. Hashes are of those PDFs; `pdfEditionDate` is left empty where the PDF prints no edition date. The PDFs themselves stay out of git (they are in the spike's ignored `docs/` folder); snapshot them again close to the event, as the map's open item says, and update the hashes.\n\n## Inside the bank\n\n1. Generate the manifest from DEV FMD's document metadata for the demo funds' ISINs: fill `documentId`, `isins`, `type`, `language`, `fmdEditionDate` and, if FMD keeps it, `sourceUrl`.\n2. Put the real PDF next to each entry, fill `file`, `pdfEditionDate`, `confidentiality` and `contentSha256`. Mark `public` only a PDF downloaded from the fund's public website; a file the bank hands over is `confidential` unless the bank confirms it is published.\n3. Never point `file` at a PDF fetched from DEV FMD: those are mocks.\n4. **Production (slide only):** `FmdFundDocuments` fetches the PDF from FMD PROD as well, and the manifest disappears.\n\n| Contract field | FMD field (fill at the event) | Notes |\n|---|---|---|\n| `documentId` | `?` | ask the desk |\n| `isins` | `?` | a KID per class, the prospectus per fund |\n| `type` | `?` | map to the enum; unknown codes give `other` |\n| `language` | `?` | |\n| `fmdEditionDate` | `?` | |\n| `sourceUrl` | `?` | ask the desk |\n", "bytes": 7390}, {"path": "docs/contracts/fund-registrations.md", "slug": "docs-contracts-fund-registrations", "title": "Fund Registrations contract", "label": "Fund Registrations contract", "group": "contracts", "body": "# Fund Registrations contract\n\nWhy the app reads bank data only through contracts like this one: [ADR 0008](../adr/0008-bank-data-enters-through-canonical-contracts.md).\n\nThe Rule Engine reads **Fund Registration** (see `GLOSSARY.md`) through one out port, `FundRegistrations`: whether the bank's records say a Share Class may be offered in a country, and to which investor types. Two adapters implement it:\n\n```\nRule Engine ──► FundRegistrations (out port)\n                  ├── FixtureFundRegistrations   reads fixtures/fund-registrations.json\n                  └── FmdFundRegistrations       FMD registration data → Registration\n```\n\n**At the event `FmdFundRegistrations` runs inside the bank**: DEV FMD carries registration data per Share Class and country. This page is a specification; the Java interface and records are written from it before the event.\n\nThe port returns **the bank's record only**. What the Fund Documentation says about where the fund may be sold is a **Selling Restriction**. The pipeline extracts it with its Citation and shows it on the validation screen beside the bank's record, with a banner when the two disagree. It is never an input to the engine.\n\n## The port\n\n```\ninterface FundRegistrations {\n\n  /** The bank's record for one Share Class in one country. Throws FundDataUnavailable. */\n  Registration registration(Isin isin, Country country);\n}\n\nsealed interface Registration {\n  record Registered(Set\u003cInvestorType> investorTypes) implements Registration {}\n  record NotRegistered() implements Registration {}\n  record Unknown() implements Registration {}\n}\n```\n\n- `country` is the Client Profile's `client.residenceCountry`: the country the class would be offered in. An absent residence gives Review before the port is called.\n- `NotRegistered` and `Unknown` differ on purpose. \"The country is missing from a list that exists\" is a fact. \"There is no list\" is unknown.\n\n### What the engine does with it\n\n| Registration | Client initiated the order? | Fund Registration outcome |\n|---|---|---|\n| `Registered`, the client's investor type covered | either | Pass |\n| `Registered`, the client's investor type not covered | no | Fail |\n| `NotRegistered` | no | Fail (coverage rows 9, 15, 17) |\n| `Registered` but type not covered, or `NotRegistered` | **yes** | Review: reverse solicitation, the dealer records evidence (row 16) |\n| `Unknown` | either | Review |\n| port throws `FundDataUnavailable` | either | no Verdict; the screen says \"fund data unavailable, retry\" |\n\n\"Covered\" compares the client's Investor Classification, and the qualified (CH) or well-informed (LU) status the engine derives, with `investorTypes`. `all` covers everyone.\n\n## The Registration\n\n```json\n{\n  \"isin\": \"LU2607415275\",\n  \"registrations\": [\n    { \"country\": \"LU\", \"investorTypes\": [\"well_informed\"] }\n  ],\n  \"retrievedAt\": \"2026-11-02T08:00:00Z\"\n}\n```\n\n### Fields\n\nColumns as in the [Client Profile contract](client-profile.md#fields). Nothing here is client data, so every field may reach an LLM, but only when the call needs it, per the allow-list: a Justification built from a registration result also names the client's country. The adapter never logs the country together with a portfolio identifier. Every field is optional unless marked *required*.\n\n| Field | Type | Meaning | Read by | LLM | Unknown |\n|---|---|---|---|---|---|\n| `isin` | ISIN, *required* | The Share Class | | yes | — |\n| `registrations` | array | One entry per country the class is registered in. Present but without the client's country: `NotRegistered`. Absent: `Unknown` | Fund Registration | yes | Review |\n| `registrations[].country` | ISO 3166-1 alpha-2, *required* | The country of distribution | Fund Registration | yes | — |\n| `registrations[].investorTypes` | array of `all` \\| `retail` \\| `professional` \\| `institutional` \\| `qualified` \\| `well_informed` | Who the class may be offered to in that country. A canonical enum the adapter maps (a legal category, ADR 0008). If FMD carries countries only: `[\"all\"]`. **Ask the desk whether FMD carries investor types** | Fund Registration | yes | `[\"all\"]` only if FMD has no such field at all; an entry whose type code matches no value gives Review |\n| `retrievedAt` | date-time, *required* | When the adapter read FMD | Check Record | no | — |\n\nFMD may also carry a status or a date per entry (registered since, withdrawn on). Ask the desk. If it does, a withdrawn entry counts as absent, and the date goes in the Justification.\n\n## Fixtures\n\n[`fixtures/fund-registrations.json`](fixtures/fund-registrations.json): the [demo dataset's Fund Registration table](fixtures/README.md#fund-registration), one entry per Share Class. Several rows in it are *assumed*.\n\n## Inside the bank: the FMD adapter\n\n1. Find FMD's registration fields on one real ISIN, e.g. Nordea 1 GCE BP-EUR (`LU0348926287`): the list should include LU, CH and many EU countries.\n2. Fill the mapping table below, and map FMD's investor-type codes onto the enum.\n3. **Compare the fixture table with FMD for the demo funds**, before the event if DEV can be reached, or else at the event. Where they differ, FMD wins: update the demo dataset's table and the coverage set rows that depend on it, then rerun the coverage set.\n\n| Contract field | FMD field (fill at the event) | Notes |\n|---|---|---|\n| `registrations[].country` | `?` | e.g. `registeredCountries`, `distributionCountries`, `countriesOfSale`, `Vertriebszulassung` |\n| `registrations[].investorTypes` | `?` | ask the desk |\n| status or date per entry | `?` | ask the desk |\n", "bytes": 5581}, {"path": "docs/contracts/share-classes.md", "slug": "docs-contracts-share-classes", "title": "Share Classes contract", "label": "Share Classes contract", "group": "contracts", "body": "# Share Classes contract\n\nWhy the app reads bank data only through contracts like this one: [ADR 0008](../adr/0008-bank-data-enters-through-canonical-contracts.md).\n\nThe online runtime reads the **Share Class catalog** through one out port, `ShareClasses`. The catalog feeds the matcher (an email's fund mention or an ISIN → Share Classes), the dealer form's dropdown and the reverse lookup. Two adapters implement it:\n\n```\nShare Class catalog ──► ShareClasses (out port)\n(matcher, reverse lookup)  ├── FixtureShareClasses   reads fixtures/share-classes.json\n                           └── FmdShareClasses       FMD instrument data → Share Classes\n```\n\n**At the event `FmdShareClasses` runs inside the bank**: DEV FMD's instrument data is real, so real ISINs resolve. This page is a specification; the Java interface and records are written from it before the event.\n\n## The port\n\n```\ninterface ShareClasses {\n\n  /** Every Share Class the bank distributes. Throws FundDataUnavailable. */\n  List\u003cShareClass> all();\n}\n```\n\n- One operation. The catalog loads it at startup, keeps it in memory, and reloads it on demand (an admin action, not a schedule).\n- There is no lookup by ISIN. An ISIN outside `all()` is a fund the bank does not distribute, and gets the same answer as any other uncovered fund.\n\n### What is in the catalog\n\nOnly the Share Classes **the bank distributes**, not FMD's whole universe. Otherwise Tom's reverse lookup lists thousands of \"Fund not covered\" rows. The bank adapter applies the filter: FMD's distribution or approved-list flag if it has one, or else a list of ISINs from the desk, each fetched from FMD. Nothing above the port knows which.\n\nThe fixture adapter serves the 9 Share Classes of the [demo dataset](fixtures/README.md#share-classes-used) and 2 classes with no Rule Card, so the reverse lookup shows \"Fund not covered\".\n\n### Outcomes\n\n| Case | Port | What the app does |\n|---|---|---|\n| ISIN or fund mention not in the catalog | not in `all()` | Needs Review \"fund not covered\", with no LLM call for that class |\n| Share Class in the catalog, no Rule Card | in `all()` | Needs Review \"fund not covered\" ([screens](../ux/README.md)) |\n| Share Class in the catalog, Draft card only | in `all()` | Needs Review \"Rule Card not validated\" (coverage row 25) |\n| An FMD instrument with no ISIN | left out by the adapter, logged | not offered |\n| FMD down at startup | `all()` throws `FundDataUnavailable` | The online runtime does not start. An empty catalog would turn every check into \"fund not covered\" |\n| FMD down on reload | `all()` throws `FundDataUnavailable` | Keep the loaded catalog; the screen shows when it was loaded |\n\n## The Share Class\n\n```json\n{\n  \"isin\": \"LU0348927095\",\n  \"fundId\": null,\n  \"fundName\": \"Nordea 1 – Global Climate and Environment Fund\",\n  \"umbrellaName\": \"Nordea 1, SICAV\",\n  \"shareClassName\": \"BI-EUR\",\n  \"currency\": \"EUR\",\n  \"domicile\": \"LU\",\n  \"fundType\": \"ucits\",\n  \"productType\": { \"code\": \"FUNDS\", \"label\": \"Investment funds\" },\n  \"valor\": null,\n  \"internalCode\": null,\n  \"retrievedAt\": \"2026-11-02T08:00:00Z\"\n}\n```\n\n### Fields\n\nColumns as in the [Client Profile contract](client-profile.md#fields). Nothing here is client data, so every field may reach an LLM when the call needs it, per the allow-list: the Request Parser needs the names to match a mention. Every field is optional unless marked *required*.\n\n| Field | Type | Meaning | Read by | LLM | Unknown |\n|---|---|---|---|---|---|\n| `isin` | ISIN, `^[A-Z]{2}[A-Z0-9]{9}\\d$`, *required* | The Share Class's key | everything: the Subscription Request, the Rule Card, Fund Registration, the Check Record | yes | — (no ISIN: not in the catalog) |\n| `fundId` | string | FMD's id of the fund (sub-fund) the class belongs to, shared by its sister classes. **Unconfirmed: ask the desk whether FMD has one** | the Rule Card's key (see below); fans a fund mention out to its classes | yes | the Rule Card's ISIN list joins instead |\n| `fundName` | string, *required* | The fund (sub-fund) name as FMD holds it | matcher, screens, reply | yes | — |\n| `umbrellaName` | string | The umbrella (SICAV, FCP or Swiss umbrella fund), when the fund is a sub-fund | matcher, screens | yes | shown as blank |\n| `shareClassName` | string, *required* | The class label, e.g. `BI-EUR`, `I Cap` | matcher, screens, reply | yes | — |\n| `currency` | ISO 4217, *required* | The class currency | minimum initial subscription (FX from the amount's currency) | yes | — |\n| `domicile` | ISO 3166-1 alpha-2 | Where the fund is domiciled | screens | yes | shown as blank |\n| `fundType` | `ucits` \\| `sif` \\| `raif` \\| `part_ii` \\| `ch_securities_fund` \\| `ch_other_fund` \\| `ch_qualified_investor_fund` \\| `other` | The fund's legal form, a canonical enum the adapter maps (a legal category, ADR 0008) | screens (\"fund regime\"), Justification | yes | shown as blank |\n| `productType` | bank code | The bank's product type for the class, the same scale as the Client Profile's `knowledgeAndExperience[].productType`, e.g. `FUNDS`, `PRIVATE_EQUITY` | Target Market (knowledge and experience): picks the client's entry for this product type | yes | Target Market Review |\n| `valor` | string | The Swiss Valor number | matcher, screens | yes | not searchable by Valor |\n| `internalCode` | string | The bank's own fund code | matcher, screens | yes | not searchable by code |\n| `retrievedAt` | date-time, *required* | When the adapter read FMD | Check Record | no | — |\n\n### Joining a Share Class to its Rule Card\n\nA Rule Card covers one fund and lists its Share Classes. A check finds the card through the class's ISIN:\n\n- **If FMD has a fund id**, the card is stored under it, and every ISIN with that `fundId` finds it.\n- **If not**, the card's own ISIN list is the join, as the [extraction spike](https://github.com/smnajid/fund-gate/tree/spike/restriction-routing/spikes/java-rule-card-extraction)'s `RuleCard.shareClasses` already does. A fund mention fans out to the classes of the card that names it.\n\nEither way, a class whose ISIN no card lists has no card.\n\n## Fixtures\n\n[`fixtures/share-classes.json`](fixtures/share-classes.json): the demo dataset's 9 classes and 2 card-less ones. The Swiss Life ISINs are unconfirmed (see the demo dataset), so the fixture uses placeholders starting `XX`, which no real ISIN uses; the 2 card-less classes do too. Replace them with real ISINs from DEV FMD at the event.\n\n## Inside the bank: the FMD adapter\n\n1. Find the FMD call that returns instruments by ISIN, and the one that lists what the bank distributes (or get the desk's ISIN list).\n2. Fill the mapping table below. Map FMD's legal-form codes onto `fundType`; a code that matches none gives `other`, logged.\n3. `productType` must use the same codes as the CRM's knowledge-and-experience product types, or the Scale Mapping gets a row that maps one to the other.\n4. Check that the demo dataset's ISINs come back with the expected names and currencies.\n\n| Contract field | FMD field (fill at the event) | Notes |\n|---|---|---|\n| `isin` | `?` | |\n| `fundId` | `?` | ask the desk: does it exist? |\n| `fundName`, `umbrellaName`, `shareClassName` | `?` | |\n| `currency` | `?` | |\n| `domicile`, `fundType` | `?` | map to the enum |\n| `productType` | `?` | same scale as the CRM's |\n| `valor`, `internalCode` | `?` | |\n| distribution filter | `?` | a flag, or the desk's list |\n", "bytes": 7404}, {"path": "docs/hypotheses.md", "slug": "docs-hypotheses", "title": "Working hypotheses", "label": "Working hypotheses", "group": "build", "body": "# Working hypotheses\n\nA business question the build needs answered before the team or the desk can answer it gets a **working hypothesis** here, so the build can go on and the change later is cheap. The team owns this file; agents never edit it ([build-workflow.md](build-workflow.md), rule 2).\n\n## How to add one\n\n1. An agent stops on a missing business answer and says what it needs.\n2. The team writes the row below: the question, the working choice, and the `@assumed` scenario that encodes it.\n3. The ticket restarts.\n\n## How to change one\n\n1. Record the answer (from the desk or the team) on the question's ticket and close it.\n2. Edit the scenarios listed under **Encoded in**: remove `@assumed` from a confirmed one, change the example of a corrected one.\n3. Run the module's tag. The failing scenarios show the code to change.\n4. Strike the row here.\n\nA hypothesis written only in this file, with no scenario, is hidden from the build.\n\n## Business hypotheses\n\n| Question | Working choice | Encoded in | Confirmed by |\n|---|---|---|---|\n\n## Technical choices taken while the business answers wait\n\n| Question | Working choice | Encoded in |\n|---|---|---|\n| What does the validation screen show instead of the extractor's self-rated confidence? | Only signals the code checks: quote found on its page, a value with no supporting quote, a contradiction between documents. The confidence stays in the Draft card, off screen | [ux/README.md](ux/README.md#rule-card-validation-screen-the-document-beside-the-rules) |\n", "bytes": 1521}, {"path": "docs/reference/rule-card-extraction/elasticsearch-prototype/README.md", "slug": "docs-reference-rule-card-extraction-elasticsearch-prototype-readme", "title": "Page selection by retrieval (PROTOTYPE, ticket #32)", "label": "Page selection by retrieval (PROTOTYPE, ticket #32)", "group": "research", "body": "# Page selection by retrieval (PROTOTYPE, ticket #32)\n\nThrowaway. Compares v2 keyword selection with BM25, kNN (multilingual-e5-small) and hybrid RRF in Elasticsearch 8.17\n(Docker, trial licence), on the Java spike's answer keys (`../page-recall-key*.json`), same page budget. Ran on\nazure-vm1 (D8s_v3 for the run): copy `../docs/*.pages.json` and both keys next to `rag_es.py`, then `./run.sh`\n(resumable, result in `report.md`). Python because it is a measurement, not product code (ADR 0006).\n\nResult (40-page budget, unseen set, 74 rules): v2 keywords 72, kNN 69, hybrid 63, BM25 58, hybrid+v2 72; demo set\n35/35 for all. See `report.md` per document.\n", "bytes": 656}, {"path": "docs/reference/rule-card-extraction/elasticsearch-prototype/report.md", "slug": "docs-reference-rule-card-extraction-elasticsearch-prototype-report", "title": "Page selection by retrieval (ticket #32, PROTOTYPE)", "label": "Page selection by retrieval (ticket #32, PROTOTYPE)", "group": "research", "body": "# Page selection by retrieval (ticket #32, PROTOTYPE)\n\nElasticsearch 8.17.0, embeddings `intfloat/multilingual-e5-small`, passages 1000 chars (stride 800), page = best passage, front matter pages 1-5 always sent, round-robin over 7 rule-kind queries. v1 (Nordea-tuned keywords, measured in Java): unseen 40/74, demo 35/35.\n\n\n## Budget 40 pages\n\n| set | v2 | bm25 | 40p) |\n| x-lafrancaise-fr | 76 | 4/4 (19p) | 4/4 (25p) | 4/4 (25p) | 4/4 (25p) | 4/4 (25p) |\n| x-mg-lux-en | 204 | 4/4 (40p) | 4/4 (25p) | 4/4 (25p) | 4/4 (25p) | 4/4 (40p) |\n| x-pictet-en | 685 | 4/4 (25p) | 2/4 (25p) ✗ share-class eligibility, minimum | 2/4 (25p) ✗ description, minimum | 2/4 (25p) ✗ share-class eligibility, minimum | 4/4 (25p) |\n| x-robeco-cgf-de | 545 | 4/4 (30p) | 1/4 (25p) ✗ description, share-class eligibility, minimum | 4/4 (25p) | 2/4 (25p) ✗ share-class eligibility, minimum | 4/4 (30p) |\n| x-vontobel-ch-en | 72 | 5/5 (28p) | 5/5 (25p) | 5/5 (25p) | 5/5 (25p) | 5/5 (28p) |\n| x-vontobel-lu-en | 448 | 4/4 (40p) | 3/4 (25p) ✗ minimum | 3/4 (25p) ✗ minimum | 3/4 (25p) ✗ minimum | 4/4 (40p) |\n| x-swisscanto-kid-de | 3 | 1/1 (3p) | 1/1 (3p) | 1/1 (3p) | 1/1 (3p) | 1/1 (3p) |\n", "bytes": 7227}, {"path": "docs/reference/rule-card-extraction/spike-README.md", "slug": "docs-reference-rule-card-extraction-spike-readme", "title": "PROTOTYPE: Rule Card extraction on Spring Boot 4, Spring AI, Java 25", "label": "PROTOTYPE: Rule Card extraction on Spring Boot 4, Spring AI, Java 25", "group": "research", "body": "# PROTOTYPE: Rule Card extraction on Spring Boot 4, Spring AI, Java 25\n\nThrowaway spike for [ticket #31](https://github.com/smnajid/fund-gate/issues/31). It ports the Python spike from [#7](https://github.com/smnajid/fund-gate/issues/7) (branch `prototype/rule-card-extraction`) to the hackathon stack. It runs on the same fund, against the same gold Rule Card, with the same scoring. Not hackathon product code.\n\n## Run\n\n```bash\n# fetch the Nordea 1 GCE prospectus + 2 KIDs into docs/ (gitignored); URLs in docs/research/sample-funds.md\n./run.sh --check-gold        # PDFBox text: every gold quote on its page, Jev's 25 pages cover the gold pages\n./run.sh --dry-run           # Jev page selection and \"possibly missed\" coverage only, no LLM\n./run.sh --pages=3,5,16,123,124,134,138,139,146 --label=gold-pages   # Claude plan (headless claude -p)\n./run.sh --label=auto        # the 25 pages Jev choice selects (--max-pages=N to change)\nSPRING_PROFILES_ACTIVE=spring-ai ./run.sh --label=api   # Anthropic API / Foundry; needs ANTHROPIC_API_KEY\n./run.sh --score             # rescore the latest run\n./run.sh --recall=page-recall-key-unseen.json   # page recall of Jev's selection, no LLM\n./run.sh --dry-run --fundeli5.fund-id=robeco    # robeco | bgf: the other two funds with a gold card\n```\n\nJev needs `TYPESAFE_API_KEY` unless the ranking is cached (`fundeli5.jev.cache-dir`, default `jev-rankings/`). Each run\nwrites `runs/\u003cstamp>-\u003clabel>.json` (the Draft Rule Card plus usage) and a `.md` score.\n\n**Page selection is Jev only since 2026-10-17** (ticket #39): choice selects, with the page before its top pages, and\nper page flags \"possibly missed\". Keyword selection v1 (`PageSelection`) and v2 (`PageSelectionV2`), `--v2`, `--sweep`,\n`--select` and `--jev-prev` are gone; the results sections below keep the commands as they were run. The last commit\nwith them is `5a06179`. Per page alone was tried as the selector and dropped: at 40 pages it still missed Robeco p.243\n(target market, 0.97 but ranked 46th behind other sub-funds' target market pages) and BlackRock p.156, and coverage\nflagged neither.\n\n## Shape\n\n```\nfundeli5.rulecard\n├── domain                      pure Java: RuleCard (always DRAFT out of extraction), Rule, Citation,\n│                               FundDocument, QuoteCheck\n├── application                 DraftRuleCardService: rank pages → drafter → quote check → Draft card\n│   ├── port/in   DraftRuleCard\n│   └── port/out  FundDocuments, PageRanking, RuleCardDrafter (the LLM egress), ExtractionRuns\n├── adapter\n│   ├── in/cli                  PipelineCommand (ApplicationRunner, no web server)\n│   └── out\n│       ├── pdf                 PdfBoxFundDocuments (page text cache, page excerpts)\n│       ├── jev                 JevPageRanking: choice selects, per page flags \"possibly missed\"; JevClient\n│       ├── llm/claudeplan      ClaudePlanDrafter: claude -p --json-schema, model writes {file,page,quote}\n│       ├── llm/springai        SpringAiCitationsDrafter: pass 1 PDF + Citations, pass 2 outputSchema\n│       └── store               JsonExtractionRuns\n├── PipelineWiring              the only class that knows which adapter plugs into which port\n└── spike                       GoldScorer (port of score.py), PageRecall: spike-only\n```\n\n`domain` and `application` import no Spring, Jackson, PDFBox or Spring AI classes.\n\n## Results (2026-10-12, Claude plan, Opus 5.5)\n\n| Run | Prospectus pages | Rules found | Correct values | Quotes on the cited page | Time | Cost* |\n|---|---|---|---|---|---|---|\n| hand-picked pages | 9 | 18/18 | 18/18 | 38/38 | 82 s | $0.62 |\n| automatic page selection | 27 of 944 | 18/18 | 18/18 | 38/38 | 131 s | $1.81 |\n| automatic, with a sub-fund name bug (23 pages) | 23 | 18/18 | 18/18 | 35/35 | 78 s | $0.96 |\n\n\\* Claude Code's list-price estimate, not a bill. Both traps handled every time (mandate-only BI avoided, KID-vs-prospectus contradiction flagged). Same scores as the Python spike's best run.\n\n- PDFBox replaces pypdf: all 24 gold quotes found on their page, 944 pages to text in 5.5 s, auto scope = 27 pages, as in Python.\n- The Spring AI adapter compiles and wires (`spring-ai` profile) but was **not run live**: no API credits.\n- Spring AI 2.0.1's Anthropic module sits on the official Anthropic Java SDK and supports PDF documents with Citations (`AnthropicCitationDocument`) and structured output (`outputSchema`). But `ChatModel` joins all text blocks and returns citations as one flat metadata list, so it loses which passage supports which statement. Pass 1 therefore calls `AnthropicChatModel.getAnthropicClient()` (the SDK client Spring AI configured) directly; pass 2 uses `ChatModel`.\n\n## Page recall on unseen documents (ticket #32, 2026-10-12, no LLM)\n\n`./run.sh --recall` scores `PageSelection` against `page-recall-key.json` (page plus a quote that must sit on it, per\nHard Restriction; the funds' PDFs are downloaded into `docs/` from the URLs in `docs/research/sample-funds.md` on\n`research/sample-funds`). `./run.sh --sweep` runs every Nordea 1 sub-fund (`nordea1-subfunds.json`) against the shared\nrule pages 3, 5, 123, 124, 138 plus its own description page.\n\n- Before the fixes: 25/26 pages over 9 documents (Nordea 1, Nordea SIF GPE, BNP (CH) Bonds CHF in EN and FR, 4 KIDs,\n  Swiss Life iFunds). The one miss: Swiss Life p.2, the FINMA exemption that says there is no KID (no Target Market\n  source). The French prospectus scored 4/4 with English keywords (fund name + \"restrict\"); the KIDs are 3 pages.\n- Sweep: 89/89 Nordea 1 sub-funds keep every expected page, 25–32 pages each.\n- Fund-name spelling is the real weak point: \"Global Climate & Environment Fund\" or a share-class suffix silently drops\n  the sub-fund's own description page. Now a hard error on documents over 100 pages.\n- Front matter (pages 1–5) is now always kept: it fixes the Swiss Life miss. After both fixes: 26/26.\n- Small documents barely shrink (BNP 26 of 34 pages, Swiss Life 14 of 47, SIF 18 of 63); selection only pays on umbrellas.\n- `QuoteCheck` normalised whitespace with Java `\\s`, which misses the no-break spaces French typesetting uses\n  (\"1 000 000\", \"n’y a pas\"); true French quotes failed. Now `[\\s\\p{Z}]`.\n\n### 20 unseen fund documents (ticket #32, follow-up)\n\n`page-recall-key-unseen.json`: 22 documents downloaded into `docs/x-*.pdf` (not committed; URLs in `unseen-sources.txt`),\n12 publishers (Allianz GI, Amundi/Lyxor, BlackRock ×2, Candriam EN+FR, UBP, Swiss Rock, DWS ×2, JPMorgan ×2,\nLa Française, M&G, Pictet DE, Robeco DE, Vontobel CH+LU, Swisscanto KID DE, Schroders, Goldman Sachs). One sub-fund\nper umbrella; per rule kind (description, US Person, share-class eligibility, minimum, sometimes Target Market) the\npage with a quote verified on it, plus `alt` pages that state the same rule. Key pages were found with different,\nmultilingual searches from the selector's keywords and confirmed by reading the snippet.\n\n| | v1 (`PageSelection`, Nordea-tuned) | v2 (`spike/PageSelectionV2`, `--v2`) |\n|---|---|---|\n| unseen, 19 docs with text, 74 rules | **40/74**; 7 docs stop at the name guard | **72/74** at 40 pages |\n| demo set, 9 docs, 35 rules | 35/35 | 35/35 |\n| scope, unseen | 10–40 | 3–40 (median ~28) |\n\n- v1 is Nordea-tuned: \"own page\" = name in the first 400 chars next to English \"investment objective\"; DE/FR and\n  other layouts never match, and its English keywords miss \"Minimum Subscription\", \"Class X … reserved\",\n  \"Mindestzeichnung\".\n- v2: front matter; sub-fund section = first page where the name is followed by an objective/currency heading\n  (EN/DE/FR), plus 3 pages; the 10 pages naming it most; then pages ranked by the number of **distinct** EN/DE/FR\n  rule keywords (counting occurrences let AGIF's repeated \"Investment Restrictions\" table crowd out the rule pages).\n  Designed after seeing v1's failures on this set, so 72/74 is optimistic.\n- Nordea 1 sweep with v2: 89/89 sub-funds, 40 pages each.\n- v2 misses: AGIF p.26 \"3.3 Minimum Investment Amount\" (one keyword only) and BlackRock BGF's description page (no\n  heading after the name; its rule pages were all found).\n- 2 of 21 PDFs have **no text layer** (Schroders 1,428 pp, GS supplement): no keyword selection and no quote check is\n  possible; they need OCR first (Document Intelligence, #13's pass 0).\n\n## Page selection by Jev (ticket #39, 2026-10-16)\n\n[TypeSafe Jev](https://docs.typesafe.ai/introduction) ranks the pages for each of six rule kinds: the sub-fund's own\ndescription, US Person, investor eligibility, minimum, target market, other restriction. Then the same selection as the\nElasticsearch prototype: pages 1–5, then round-robin over the six rankings until the budget is used. Documents no longer\nthan the budget are sent whole. `spike/JevClient`, `spike/JevPageRanking`; rankings cached in `jev-rankings/`, so other\nbudgets cost nothing.\n\n- **jev-page**: one request per page, one yes/no (noul) question per rule kind, the page as state. Scores compare across\n  the whole document. This is the pattern of JEV's own RAG-classification and re-ranking cookbooks.\n- **jev-choice**: per rule kind, a choice question whose options are the pages plus \"none\". A question holds about 20\n  pages (32k tokens), so the pages play a knockout: the top 3 of each batch go on until one batch is left.\n\nRule recall (pages selected, summed over the documents with text):\n\n| budget | set | v2 (keywords) | jev-page | jev-choice |\n|---|---|---|---|---|\n| 40 | demo, 35 rules | 35/35 | 35/35 | 35/35 |\n| 40 | unseen, 74 rules | 72/74 | **74/74** | **74/74** |\n| 25 | demo | 35/35 (104 p) | 35/35 (137 p) | 35/35 (137 p) |\n| 25 | unseen | 69/74 (416 p) | 73/74 (453 p) | **74/74** (453 p) |\n| 15 | demo | 31/35 (82 p) | **35/35** (87 p) | 34/35 (87 p) |\n| 15 | unseen | 50/74 (279 p) | 69/74 (273 p) | **71/74** (273 p) |\n| 10 | demo | 29/35 (80 p) | **31/35** (62 p) | 30/35 (62 p) |\n| 10 | unseen | 36/74 (239 p) | 60/74 (183 p) | **67/74** (183 p) |\n\n| | jev-page | jev-choice |\n|---|---|---|\n| cost, all 27 documents (~8,000 pages) | $0.40 | $1.84 |\n| cost, Nordea prospectus (944 pages) | $0.05, 944 requests, 32 s | $0.20, 328 requests, 18 s |\n| tokens per page | ~1,250 (state counted once for 6 questions) | ~5,000 (6 questions, plus later rounds) |\n\n- Both Jev variants beat the keywords at every budget, and the gap grows as the budget shrinks: at 15 pages the\n  keywords lose 24 of 74 rules, Jev loses 3–5. v2 was tuned on the unseen set; the Jev questions were written once from\n  the rule kinds and not tuned. v2's fixed parts (front matter, 4 section pages, 10 name pages) eat a small budget.\n- German and French pages were not a problem at 25 pages or more, despite the docs saying English is Jev's best language.\n  Several of the 10-page misses are DE (Mindestzeichnung, Anlegerart).\n- **jev-choice** ranks better (74/74 at 25 pages), at about 4–5× the tokens of jev-page. At these prices both are noise\n  next to the Citations call ($1–2 per Nordea run).\n- **jev-page**'s one miss at 25 pages: JPMorgan's US Person rule (p.45, also stated on pp. 292 and 303; none selected).\n- Remaining misses are tables that only make sense with their heading on the page before (JPMorgan p.280 \"base share\n  classes\", Amundi p.81 minimums) and Nordea p.138 at 10–15 pages.\n- No text layer still means no selection (Schroders, GS supplement): Jev reads text, OCR first.\n\n### Recommendation (2026-10-16)\n\nAdopt **Jev choice** to select the pages (best recall at every budget, the only variant tested end to end) and keep\n**Jev per page** as a cheap extra pass: per rule kind, the best per-page score among the selected pages; under 0.5 is a\n\"possibly missed\" candidate for the validation screen. Both: about $0.25 per 944-page prospectus.\n`./run.sh --select=jev-choice --max-pages=25` does both before extraction (`--dry-run` stops before the LLM).\n\nMethod 1 (every part of the prospectus through Citations) was not run: Jev already finds 74/74, and Method 1 would send\nabout 38× more pass-1 input on Nordea (944 pages at ~600 tokens vs 25) and risks rules from other sub-funds. If Jev\nis not allowed as a second vendor (#5), fall back to keywords v2 at 40 pages (72/74).\n\n### End to end on Nordea: Rule Card from Jev's pages (2026-10-16, Claude plan, Opus 5.5)\n\nJev choice's 25 pages (`--pages=1,2,3,4,5,6,16,67,106,123,124,131,136,137,138,210,248,249,857,859,860,861,880,936,944\n--label=jev-choice-25`), same drafter and gold card as the runs above:\n\n| Run | Prospectus pages | Rules found | Correct values | Quotes on the cited page | Time | Cost* |\n|---|---|---|---|---|---|---|\n| hand-picked pages | 9 | 18/18 | 18/18 | 38/38 | 82 s | $0.62 |\n| keyword selection (v1) | 27 of 944 | 18/18 | 18/18 | 38/38 | 131 s | $1.81 |\n| **Jev choice, 25 pages** | 25 of 944 | **18/18** | **18/18** | **40/40** | 90 s | $1.00 + $0.20 Jev |\n\n\\* Claude Code's list-price estimate, not a bill. Both traps handled (mandate-only BI avoided, KID-vs-prospectus\ncontradiction flagged). Jev's pages skip three of the nine hand-picked pages (134, 139, 146),\nbut the gold card cites none of them: it cites prospectus pages 3, 5, 123, 124 and 138, all in Jev's 25. This run cited\nthose plus 16, 136 and 137, and KID pages 1 and 3. One run on one fund: the Citations API path (`spring-ai` profile) is still untested\nlive.\n\n### End to end on the Citations API (2026-10-16, Anthropic API)\n\n`SPRING_PROFILES_ACTIVE=spring-ai ./run.sh --select=jev-choice --max-pages=25 --label=citations-jev-choice-25`: Jev\nchoice's 25 pages, pass 1 Opus 5.5 with PDFs and Citations, pass 2 Sonnet 5.5 with structured output. First live run of\n`SpringAiCitationsDrafter`.\n\n| | Rules found | Correct values | Quotes on the cited page | Time | Cost |\n|---|---|---|---|---|---|\n| Citations API, Jev choice 25 pages | **18/18** | **18/18** | **45/45** | 149 s | $0.21 (cache read) |\n\n- Coverage pass flagged nothing: every rule kind has a selected page scoring 0.87–0.96.\n- Both traps handled (mandate-only BI avoided, KID-vs-prospectus contradiction flagged). Four Unmodelled Restrictions,\n  including market timing, which the Claude-plan runs did not list.\n- **First live run failed silently**: pass 1 cited 39 passages, pass 2 wrote 5.7k tokens, but the drafter parsed only\n  `getResult()` and saved a 0-rule card ($0.68, kept in `runs/` as `20261016-230854`). Fixed: every generation is\n  searched, and a missing card now fails with the raw text in `runs/pass2-unparsed.txt`.\n- The cost is real API billing. Pass 1 re-read the cached PDFs (100k tokens at the cache-read price), so a cold run\n  costs about $0.68: Opus pass 1 $0.61, Sonnet pass 2 $0.07.\n- Scorer change: BP's minimum came back as amount 0 with no currency, which is right (the prospectus says \"None\") but\n  was scored wrong because gold expected \"EUR\". `gold-rule-card.json` now accepts no currency for that rule; every\n  earlier run keeps its score.\n\n### Does Jev repeat itself? (2026-10-16)\n\nEvery unseen document was ranked a second time (`jev-rankings-rerun/`, `--jev-cache=jev-rankings-rerun`, about $1.75 of\nJev). The order of pages changes a little between runs (top 10 pages per rule kind mostly the same, swapped around), so\nrecall moves at small budgets:\n\n| budget | jev-page run 1 / run 2 | jev-choice run 1 / run 2 |\n|---|---|---|\n| 25 | 73/74 / 73/74 | **74/74 / 74/74** |\n| 15 | 69/74 / 70/74 | 71/74 / 70/74 |\n| 10 | 60/74 / 62/74 | 67/74 / 63/74 |\n\nAt 25 pages both runs agree exactly. Below that, choice's lead is partly noise: at 10 pages it is 7 rules in run 1 and\n1 rule in run 2.\n\n**BlackRock p.156, missed both times.** It is the only page saying \"Class A Shares are available to all investors\"\n(gold rule category-A). It ranks about #30–40 for investor eligibility in choice and #14 (score ~0.5) per page, in both\nruns. The page is mostly another sub-fund's description (World Technology Fund); the \"Classes and Form of Shares\"\nsection starts at character 4,456 of 6,124. Jev judges the page as a whole, so a rule in the last quarter of a mixed\npage ranks low. Not a cut-off: pages are sent up to 6,000 characters (627 of 7,980 pages are longer and are cut).\n\n### Two more funds end to end: Robeco (DE) and BlackRock BGF (EN) (2026-10-16, Citations API)\n\n`SPRING_PROFILES_ACTIVE=spring-ai ./run.sh --fundeli5.fund-id=robeco|bgf --select=jev-choice --jev-prev --max-pages=25`.\nProspectus only (no KIDs downloaded). Gold cards in `gold/`, drafted from the page text and checked against a blind\nanswer key written by a separate Claude agent that saw only the two prospectuses: every scored rule agreed. Not yet\nchecked by a person.\n\n`--j
