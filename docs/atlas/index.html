ev-prev` adds the page before Jev's top pages in the first two rounds. It was added because Jev missed BlackRock\np.156 in both Jev runs (Class A \"available to all investors\" at the bottom of another sub-fund's page). With it all gold\npages of the three funds are selected; the cost is budget: unseen recall at 25 pages 74/74 and 73/74 over the two Jev\nruns (Amundi's minimum lost in run 2), at 15 pages 68 and 64 (without: 71 and 70).\n\n| Fund | Rules found | Correct values | Quotes on the cited page | Trap | Time | Cost |\n|---|---|---|---|---|---|---|\n| Robeco Smart Energy (DE, 545 pp) | 8/8 | **8/8** | 29/31, really 31/31 (see below) | mandate-only I avoided | 83 s | $0.62 |\n| BlackRock Global Allocation (EN, 724 pp) | 6/6 | **4/6** | 33/33 | mandate-only I avoided | 144 s | $0.20 |\n\n- Coverage pass flagged nothing on either fund.\n- **BlackRock US Person, \"wrong\" on both classes**: the model set `excludes_us_citizens` to null (\"whether US citizenship\n  alone excludes an investor is not stated\"), gold says false. The prospectus defines US Person as \"any US resident or\n  other person specified in Regulation S\", which is residence-based, but never says so about citizens in words. A\n  defensible \"unclear\" for the validator rather than a misreading; gold is left unchanged.\n- BlackRock Class A eligibility: found and correct, citing p.156, which `--jev-prev` brought in.\n- **Robeco's two unverified quotes are real**: the Citations API returns the line-break hyphen of \"nicht-institutionelle\"\n  (p.22) as U+0002. `QuoteCheck` now reads control characters as a hyphen and ignores soft hyphens; the run file keeps\n  the original 29/31.\n- BlackRock's run reports 94k cached input tokens read and none written, although this excerpt had not been sent\n  before; hence $0.20 instead of about $0.65. Not explained; check the Console bill.\n", "bytes": 18548}, {"path": "docs/research/foundry-models.md", "slug": "docs-research-foundry-models", "title": "Which Microsoft Foundry models and features can run the cited extraction pipeline?", "label": "Which Microsoft Foundry models and features can run the cited extraction pipeline?", "group": "research", "body": "# Which Microsoft Foundry models and features can run the cited extraction pipeline?\n\nResearch for issue #13 (wayfinder map #1). It builds on #4 ([`llm-rule-extraction.md`](https://github.com/smnajid/fund-gate/blob/research/llm-rule-extraction/docs/research/llm-rule-extraction.md)) and ADR 0001 (`docs/adr/0001-llm-extracts-rules-engine-decides.md`). Researched **2026-10-03** against primary docs: Microsoft Learn, Anthropic and OpenAI. Each Microsoft Learn page is cited with its `ms.date`.\n\nThe pipeline being checked comes from #4:\n\n- **Pass 1:** the whole prospectus PDF goes in as native PDF input with Citations turned on, and Claude drafts rules with verbatim passages and page numbers.\n- **Pass 2:** structured output turns the draft into Rule Card JSON.\n- **Pass 0, only for scanned pages:** OCR with Azure Document Intelligence.\n\nThe constraint: Fund Documentation may go to an external LLM, but client-identifying data may not.\n\n## TL;DR\n\n- **Yes, the #4 pipeline runs on Foundry unchanged.** Claude Opus 5.5 and Sonnet 5.5 are in the Foundry catalogue as GA, in both hosting options. Through Foundry you get PDF input, Citations, prompt caching (5-minute, 1-hour and automatic), structured outputs and strict tool use, token counting, and the 1M context window. You call them with Anthropic's own SDK (`AnthropicFoundry`), so the code is the same as for the direct API except for how the client is built.\n- **Catch 1: the Files API is missing on \"Hosted on Azure\" deployments** (they return a 400). Send the PDF inline as base64. The request is still capped at 32 MB, and base64 adds about 33%, so the raw PDF must be under about 24 MB. Prompt caching still means the PDF is only paid for in full once per 5-minute or 1-hour window.\n- **Catch 2: default rate limits depend on the subscription type, and this could block the spike.**\n  - Pay-as-you-go subscriptions default to **40K input tokens per minute (ITPM) and 8K output tokens per minute (OTPM)** for Opus 5.5 and Sonnet 5.5. A single 300K–800K-token prospectus request is far over that.\n  - Enterprise and MCA-E subscriptions default to **10M ITPM and 2M OTPM**.\n  - Free-trial, student, sponsored-credit and **CSP subscriptions cannot deploy Claude at all.**\n  - **Ask the organisers what subscription type the event uses.** If it is pay-as-you-go or CSP, use our own Anthropic API key or our own Enterprise Azure subscription.\n- **Catch 3: there is no EU or Swiss residency for Claude on Foundry.**\n  - \"Hosted on Azure\" offers Global Standard everywhere, plus a **US-only** Data Zone. There is no EU Data Zone.\n  - The only European region for deploying Claude is **Sweden Central**, and that is still a Global deployment, so processing can happen anywhere.\n  - \"Hosted on Anthropic\" may process data outside Azure entirely.\n  - Fund Documentation is public, so this is acceptable for our use. It would not be acceptable for client data, which already stays out of every LLM.\n- **The OpenAI-in-Foundry alternative works only partly.** GPT-5.5, GPT-5.6 and GPT-6 accept PDFs (extracted text plus page images, 50 MB), support structured outputs, and have a 1.05M context (about 922K usable input). **But no OpenAI path returns page-anchored citations.** PDF input has no citation feature. `file_search` annotations carry only `file_id`, `filename` and `index`, with no page and no quote. So we would have to build page anchoring ourselves: the model returns `{quote, page}` and we verify it against the text of each page. That is the \"Plan B\" from #4. GPT models do run in the EU Data Zone, and in-region Swiss options exist.\n- **Azure Document Intelligence Layout** handles up to 2,000 pages and 500 MB per document. It returns paragraphs and tables, each with `boundingRegions[].pageNumber` and a polygon, plus Markdown output. It processes data in the region where the resource lives and deletes inputs and results after 24 hours. It is the right page-anchored text layer: as an OCR fallback for Claude, and as the verification layer for the GPT path.\n- **Recommendation:** run the spike on **Claude Opus 5.5 in Foundry, Hosted on Azure, Global Standard**, with the PDF inline and Citations and caching turned on, and Sonnet 5.5 for pass 2.\n  - **Fallback 1:** the same code against the **direct Anthropic API** with our own key. Use it if the event subscription can't deploy Claude or its limits are too low.\n  - **Fallback 2:** **GPT-5.5 or GPT-6 in Foundry**, with structured output of `{rule, quote, page}`, verified against Document Intelligence Layout text.\n\n## 1. Claude in the Foundry catalogue\n\n### Models (Anthropic \"Claude in Microsoft Foundry\", fetched 2026-10-03; MS Learn \"Claude models\", ms.date 2026-09-21)\n\n| Model | Hosted on Azure | Hosted on Anthropic | Context / max output |\n|---|---|---|---|\n| Claude Opus 5.5 (`claude-opus-5-5`) | GA | GA | 1M / 128K |\n| Claude Sonnet 5.5 (`claude-sonnet-5-5`) | GA (Global Standard only) | GA | 1M / 128K |\n| Claude Opus 5, Opus 4.8, Sonnet 5 | GA | GA | 1M / 128K |\n| Claude Haiku 4.5 | GA | GA | 200K / 64K |\n| Claude Fable 5.1, Fable 5 | no | Preview | 1M / 128K |\n| Claude Opus 4.7, 4.6, 4.5; Sonnet 4.6, 4.5 | no | GA | 1M (4.5 models: 200K) |\n| Mythos 5.1, Mythos 5, Mythos Preview | no | gated research preview | 1M / 128K |\n\n[Anthropic Foundry] [MS Claude models]\n\n### How it is deployed\n\n- **Not classic serverless MaaS.** Claude is a third-party **Azure Marketplace** offer (\"Claude Platform on Foundry\"). The flow:\n  1. Create a Foundry resource or project.\n  2. Find the model in the catalogue and choose **Deploy → Custom settings**.\n  3. On your first Claude deployment, accept the Marketplace terms.\n  4. Pick the hosting option (shown as **version 1 = Hosted on Anthropic, version 2 = Hosted on Azure**) and the region scope (**Global**, or **Data Zone** for US only).\n\n  [Anthropic Foundry] [MS deploy Claude, ms.date 2026-09-21]\n- **Endpoint:** `https://{resource}.services.ai.azure.com/anthropic/v1/messages`.\n  - Auth uses an Azure API key (`api-key` or `x-api-key` header) or a Microsoft Entra ID token.\n  - The deployment name goes in `model`.\n  - SDKs: the Python `AnthropicFoundry` client, `@anthropic-ai/foundry-sdk`, and Java `FoundryBackend` (`com.anthropic:anthropic-java-foundry`), plus C#, Go and PHP. Ruby is not supported. [Anthropic Foundry]\n- **Two hosting options:**\n  - **Hosted on Azure:** \"Anthropic-operated service running on Azure infrastructure\". Global Standard or US Data Zone Standard.\n  - **Hosted on Anthropic:** runs on Anthropic infrastructure, Global Standard only.\n  - Anthropic recommends Hosted on Azure \"for most workloads\". [Anthropic Foundry]\n- **Billing:**\n  - Charged as Claude Consumption Units (CCU) on the Azure invoice, metered hourly.\n  - Pay-as-you-go, with no prepaid credits.\n  - **Counts toward a Microsoft Azure Consumption Commitment (MACC)** for both hosting options. [MS hosting comparison, ms.date 2026-09-21]\n  - Per-token rates are the same as Anthropic's first-party API, for example Opus 5.5 at $4 in / $20 out per million tokens. [claude-api skill pricing note, cached 2026-09-25; not re-fetched from the pricing page]\n- **Regions for Global Standard deployments:**\n  - Americas: centralus, eastus, **eastus2**, northcentralus, southcentralus, westcentralus, westus, westus3.\n  - Europe: **swedencentral only**.\n  - Fable 5 and 5.1 are only in eastus2 and swedencentral. [MS partners region table, ms.date 2026-09-21]\n- **Data Zone Standard:** US only. It is available for Hosted-on-Azure Opus 5.5, Opus 5, Opus 4.8, Sonnet 5 and Sonnet 5.5. The Europe tab says \"Not available\". [MS partners region table]\n  - *Inconsistency, not resolved:* the MS Global Standard region table lists only version 1 (Hosted on Anthropic) for `claude-sonnet-5-5`. The other MS and Anthropic pages say Sonnet 5.5 is GA Hosted on Azure. Check in the portal.\n\n### Subscriptions and agreements required (MS deploy Claude, ms.date 2026-09-21)\n\n- You need a **paid Azure subscription with a billing account in a country where Anthropic sells the offer**. The offer region is \"Microsoft Managed Countries/Regions (except Belarus and Russia)\". *I did not check whether CH and LU are on that list. It is very likely, but confirm in Partner Center.*\n- **Not supported:**\n  - Enterprise Accounts in South Korea\n  - **Cloud Solution Provider (CSP) subscriptions**\n  - subscriptions without an active pay-as-you-go payment method (student, **free trial**, **startup-credit**)\n  - **sponsored subscriptions that only use Azure credits**\n- **Permissions:**\n  - Owner or Contributor on the subscription, for the Marketplace SaaS actions `Microsoft.MarketplaceOrdering/*`, `Microsoft.SaaS/register/action` and `Microsoft.SaaS/resources/*`.\n  - To call the model: Foundry User or Cognitive Services User. [MS partners]\n- **Terms:** Claude is a \"Non-Microsoft Product under the Product Terms\". **Anthropic is the seller, operator and an independent data processor** for both hosting options, and Anthropic's Commercial Terms and Data Processing Addendum (DPA) apply. [MS Claude data privacy, ms.date 2026-06-23] [MS hosting comparison]\n- **Covered Models:** Fable 5, Fable 5.1 and the Mythos models require 30-day retention. A subscription with zero data retention (ZDR) gets a 400 when calling them. This does not affect Opus 5.5 or Sonnet 5.5. [MS deploy Claude troubleshooting] [Anthropic data retention]\n\n## 2. Feature support: Foundry vs the direct Anthropic API\n\n| Feature the pipeline needs | Direct Anthropic API | Foundry, Hosted on Azure | Foundry, Hosted on Anthropic | Source |\n|---|---|---|---|---|\n| PDF document input (text + page images) | Yes | **Yes** (base64 or URL) | Yes | [MS Claude models] [Anthropic PDF] |\n| Citations (`page_location`, verbatim `cited_text`) | Yes | **Yes** | Yes | [MS Claude models] [claude-api skill platform table] |\n| Prompt caching (5 min, 1 h, automatic) | Yes | **Yes** | Yes | [MS Claude models] |\n| Structured outputs (`output_config.format`) and strict tool use | Yes | **Yes** (also accepts the legacy `output_format`) | Yes | [MS Claude models] |\n| Tool use (client tools) | Yes | Yes | Yes | [MS Claude models] |\n| Token counting (`/v1/messages/count_tokens`) | Yes | **Yes** | Yes | [MS Claude models] [MS hosting comparison] |\n| Files API (`/v1/files`) | Yes | **No (400)** | Yes (beta) | [Anthropic Foundry] [MS Claude models] |\n| Message Batches API | Yes | **No** | **No** | [Anthropic Foundry] |\n| Models API, Admin API, server-side `fallbacks`, fast mode | Yes | No | No | [Anthropic Foundry] [claude-api skill] |\n| Code execution, Agent Skills, programmatic tool calling, newer web search/fetch | Yes | No (400) | Yes | [Anthropic Foundry] |\n| `inference_geo` (EU/US pinning per request) | `us` / `global` only | n/a (use the US Data Zone) | n/a | [Anthropic data residency] |\n| 1M context (Opus 5.5 / Sonnet 5.5) | Yes | Yes | Yes | [Anthropic Foundry] |\n\nNotes:\n\n- **Citations and structured outputs are still mutually exclusive** (a 400 if both are set). This is an API rule, not a platform one, so the two-pass design from #4 stays. [#4, Citations]\n- **PDF limits are the same as on the direct API:** 32 MB per request, and 600 pages on 1M-context models. With no Files API on Hosted on Azure, the PDF has to go inline as base64 in every pass-1 call. With `cache_control` on the document block, repeat calls in the same window (one per Share Class) read it from the cache. *I did not test whether the \"URL\" PDF source avoids the 32 MB payload limit.*\n- **Rate-limit headers:** Foundry does **not** return the `anthropic-ratelimit-*` headers. Monitor through Azure instead. [Anthropic Foundry]\n- **Opus 5.5 specifics on Foundry:**\n  - Thinking is always on, and effort defaults to `medium`. Set `high` for extraction.\n  - `temperature` and `top_k` are not supported.\n  - `top_p` must be 0.99.\n\n  [MS partners table] [MS Claude models]\n\n### Rate limits (MS \"Claude model quotas and rate limits\", ms.date 2026-09-21)\n\nQuota is **per subscription, shared across all regions**: one pool per model and version for Global Standard. Cache reads don't count toward ITPM.\n\n| Subscription type | Opus 5.5 / Sonnet 5.5 (Global or US Data Zone) | Haiku 4.5 |\n|---|---|---|\n| **Pay-as-you-go** | **40 RPM / 40,000 ITPM / 8,000 OTPM** | 80 / 80,000 / 16,000 |\n| **Enterprise and MCA-E** | **10,000 RPM / 10,000,000 ITPM / 2,000,000 OTPM** | same |\n| Free Trial | 0 (can't use) | 0 |\n\n- **Why this matters:** one uncached pass-1 call on a whole prospectus is about 300K–800K input tokens (#4). On a pay-as-you-go default of 40K ITPM, that **will not fit in a minute's budget**.\n  - *I did not verify how Foundry treats a single request larger than the per-minute ITPM. Expect a 429.*\n  - You can request more quota (aka.ms/oai/stuquotarequest), but approval is \"evaluated individually and aren't guaranteed\".\n- **Direct Anthropic API, for comparison:** Opus 5.5 gets **2M ITPM / 400K OTPM even at the Start tier** (#4, [Rate limits]).\n\n## 3. The OpenAI-in-Foundry alternative (GPT)\n\n### Models and limits (MS \"Foundry Models sold by Azure\", ms.date 2026-09-21; region page ms.date 2026-09-03)\n\n- **Current models:** `gpt-6.1-sol` (2026-09-29), `gpt-6-sol` / `gpt-6-luna` / `gpt-6-astra`, `gpt-5.6-sol` / `terra` / `luna`, and `gpt-5.5`.\n- **Context:** all have a **1,050,000-token context window, with about 922,000 tokens of input and 128,000 of output.** For example, for GPT-5.5: \"You can't combine a 922,000-token prompt with 128,000 generated tokens in one request.\"\n- **Structured outputs:** all list \"Structured outputs\", meaning a JSON schema in `text.format` on the Responses API, or `response_format` on Chat Completions. [MS Responses, ms.date 2026-08-18]\n- **Input:** all take text and images and return text. GPT-6 and GPT-5.6 price short-context and long-context requests differently.\n- **Regions:**\n  - Global Standard covers essentially every region, including switzerlandnorth, switzerlandwest and swedencentral.\n  - **Data Zone Standard (EU)** is available for gpt-5.5, gpt-5.6 and gpt-6.x from resources in francecentral, germanywestcentral, italynorth, norwayeast, polandcentral, spaincentral, swedencentral, **switzerlandnorth** and westeurope.\n  - **Regional Standard in switzerlandnorth** (processing stays in that region) is only available for older models: gpt-4.1, gpt-4.1-mini and gpt-4o (2024-11-20). gpt-4.1 has a 1M context, but its provisioned deployments are capped below 128K. [MS region availability]\n  - *Note:* an EU Data Zone deployment processes \"within any EU member nation\". A Swiss resource on the EU Data Zone does not keep processing inside Switzerland.\n\n### PDF input\n\n- The Responses API takes `input_file`, either as a base64 data URI or a `file_id` (upload with `purpose=\"assistants\"`; `user_data` isn't supported on Azure).\n- Limits: **under 50 MB per file and per request.**\n- \"Both extracted text and rendered images of each page are included in the model's context.\"\n- Only models that take both text and images accept PDFs.\n\n[MS Responses] [OpenAI PDF files]\n\n### Page-anchored citations: **not available**\n\n- **OpenAI PDF input** has no citation feature at all. [OpenAI PDF files]\n- **`file_search`** (vector stores):\n  - Annotations are `file_citation` with **`file_id`, `filename` and `index`**. They carry **no page number and no quoted text**. [OpenAI file search]\n  - On Foundry, documents are chunked into 800-token chunks with 400-token overlap, up to 20 chunks go into context, and files can be up to 512 MB. The C# sample only shows `FileId`. [MS Foundry file search, ms.date 2026-09-30]\n  - A community Q&A reports that Azure's Responses `file_search` \"searches only one attached vector store\". This is secondary and I did not verify it.\n  - Retrieval is also the wrong shape for us. We want the model to read the whole prospectus for one Share Class, not the top 20 chunks.\n- **So the GPT path needs the \"Plan B\" from #4:**\n  1. Give each page's text a page marker. Either put DI Layout or PyMuPDF text into the prompt as `[[PAGE 37]] …`, or send the PDF.\n  2. Have structured outputs return `{rule, quote, page}`.\n  3. Fuzzy-match each `quote` against the text of that page, deterministically.\n  4. Mark any rule whose quote fails the check as Needs Review.\n\n  This works, but the guarantee that citations are valid now comes from our verifier, not from the API.\n\n## 4. Azure Document Intelligence: Layout as preprocessor or fallback\n\nFrom MS Learn \"Document layout analysis\" (v4.0 `2024-11-30` GA; ms.date 2026-05-01):\n\n- **Limits:** PDFs and TIFFs **up to 2,000 pages**, and **500 MB on the paid S0 tier**. The free F0 tier processes only the first 2 pages and 4 MB. The `pages` query parameter analyses chosen page ranges.\n- **Output:**\n  - `pages[]` with `pageNumber`, lines and words (each with a polygon and a confidence).\n  - `paragraphs[]` with `content`, `boundingRegions` (page number plus polygon), `spans`, and a `role`: `title`, `sectionHeading`, `pageHeader`, `pageFooter`, `pageNumber` or `footnote`.\n  - Tables with cells and spans.\n  - Figures and sections.\n  - The whole result can also come back as **Markdown**.\n  - OCR covers scanned pages and handwriting.\n- **Data handling:** data \"is processed in the same region where the Document Intelligence resource was created\". Inputs and results are stored for **24 hours** and then deleted automatically, or earlier through `Delete Analyze Result`. [MS DI data privacy, ms.date 2026-07-22]\n- **Regions:** Document Intelligence is generally available in Switzerland North and Switzerland West. *That comes from a Microsoft Q&A answer. I did not confirm it on the product region page.*\n- **Where it fits:**\n  - **With Claude:** turn DI paragraphs and table rows into a **custom content document** (one block per paragraph or row). Citations then come back as `content_block_location`, which we map to DI's `pageNumber` and polygon so the UI can highlight the passage. Use this **only for scanned or low-quality pages**. Native PDF input is better when the text layer is good (#4).\n  - **With GPT:** DI page text is the reference the quote verifier matches against, and it supplies the `[[PAGE n]]` markers.\n\n## 5. Data residency and data handling (Swiss and Luxembourg bank view)\n\nWhat goes to the LLM is **public Fund Documentation only** (prospectus, KID, EMT). No Client Profile data goes to any LLM (constraint and ADR 0001). So residency here is something to tell the jury about, not a blocker. It would only become a blocker if client data were ever sent, and it won't be.\n\n| Option | Where prompts are processed | Retention | Training on our data | Processor and terms |\n|---|---|---|---|---|\n| **Claude on Foundry, Hosted on Azure** | Azure infrastructure. \"Data at rest is stored in the selected Azure geography\". Processing follows the Global scope (any region) or the US Data Zone. **No EU or CH Data Zone.** Only content flagged by safety systems, plus usage metadata, goes to Anthropic. | Under Anthropic's DPA and Commercial Terms | No (Anthropic: \"never used for model training without your express permission\") | Anthropic is an independent processor. Microsoft bills. [MS Claude data privacy] [Anthropic Foundry] |\n| **Claude on Foundry, Hosted on Anthropic** | Anthropic infrastructure. \"Data might be processed outside of Azure including outside of your selected Azure region.\" | Same | No | Anthropic. Microsoft shares contact and usage details with Anthropic. [MS Claude data privacy] |\n| **Direct Anthropic API** | `inference_geo` is `global` (default) or `us` only (US costs 1.1×). Workspace geo (data at rest) is **US only**. No EU option. | API inputs and outputs deleted **within 30 days**. Usage-policy violations kept up to 2 years. ZDR available by contract. Files API files kept until deleted. | No | Anthropic Commercial Terms and DPA. [Anthropic data residency] [Anthropic data retention] [Anthropic privacy: commercial retention, updated 2026-07-01] |\n| **Azure OpenAI (GPT) in Foundry** | Regional Standard: the deployment's region (switzerlandnorth possible for gpt-4.1 / 4o). Data Zone EU: any EU member state. Global: anywhere. Data at rest stays in the resource's geography. | Abuse-monitoring store in the resource's geography (reviewed by people located in the EEA for EEA deployments). You can apply for modified abuse monitoring, which removes storage and human review. Responses API, Files and vector stores persist data until you delete it. | No. Prompts and outputs are \"NOT available to OpenAI\" and \"NOT used… to train\" | Microsoft, under the Microsoft Products and Services DPA. [MS Azure OpenAI data privacy, ms.date 2026-05-18] |\n| **Azure Document Intelligence** | The resource's region (for example switzerlandnorth) | 24 hours, then deleted | Not stated on that page | Microsoft DPA. [MS DI data privacy] |\n\n- **The best residency story is Azure OpenAI + Document Intelligence in a Swiss or EU Data Zone.** Microsoft is the sole processor, there is EEA-located human review, and nothing goes to OpenAI.\n- **For Claude on Foundry**, the honest pitch is: \"public documents only, processed on Azure (Hosted on Azure), Anthropic as processor under a DPA, no training\". Foundry offers no in-EU guarantee for Claude today.\n- **Not verified:** whether the event's Foundry tenant has any policy that restricts Marketplace (third-party) models. Ask the organisers (#5).\n- **Not verified:** whether `store: false` on Azure's Responses API avoids persisting the data, as it does on OpenAI. The Azure privacy page only says the Responses API \"stores message history\".\n\n## 6. Recommendation\n\n**Run the extraction spike on Claude Opus 5.5 in Microsoft Foundry: Hosted on Azure, Global Standard deployment, resource in Sweden Central or East US 2.**\n\n- **Why:** every feature the #4 pipeline relies on is supported on Hosted on Azure: native PDF, Citations with guaranteed-valid page pointers, prompt caching, structured outputs and `count_tokens`. It runs on the event's own infrastructure, which matches the organisers' expectation, and prompts stay on Azure.\n- **Changes from #4:**\n  - Send the PDF **inline as base64**, not by Files API `file_id`, with `cache_control` on the document block.\n  - Keep the raw PDF under about 24 MB, or split it and keep a page map.\n  - Use `AnthropicFoundry` (Python) or `FoundryBackend` (Java) as the client, with the deployment name as `model`.\n  - Use Sonnet 5.5 for pass 2.\n- **Day-1 checks, before building on it:**\n  1. What **subscription type** does the event's Foundry use? Pay-as-you-go means a 40K ITPM default, which is unusable for whole-prospectus calls. CSP or sponsored-credit subscriptions can't deploy Claude at all.\n  2. Is the Claude Marketplace offer allowed in the tenant, and do we have Contributor/Owner to accept the terms?\n  3. Make a smoke-test call: one 200-page PDF with `citations.enabled` plus `count_tokens`, against our deployment.\n\n**Fallback 1 (same code, different client): the direct Anthropic API with our own key.**\n- Use it if checks 1–3 fail.\n- It has higher default limits (2M ITPM at the Start tier), the Files API, Batches, and fast mode.\n- It is the same request shape, so switching is one line.\n- Trade-off: it isn't the event infrastructure, and residency is global or US only.\n\n**Fallback 2 (Foundry-native, no Claude): GPT-5.5 or gpt-6-sol on Azure OpenAI, plus Document Intelligence Layout.**\n- Use it if Claude is unavailable and we must stay on event infra, or if the jury pushes hard on EU/CH residency. GPT runs in the EU Data Zone from a switzerlandnorth resource, and DI runs in the Swiss region.\n- The cost is building the citation layer ourselves: DI page text, a structured `{rule, quote, page}` output, and a deterministic quote verifier. Plan that as about half a day of extra work. That is my estimate.\n\n**Azure Document Intelligence Layout is needed in every option**, but only for scanned or table-heavy pages (Claude: a custom content document) or as the verification text layer (GPT).\n\n## Not verified / open\n\n- Whether Switzerland and Luxembourg billing accounts are on Anthropic's Marketplace offer list (\"Microsoft Managed Countries\").\n- How Foundry handles a single request whose input tokens exceed the per-minute ITPM quota.\n- Whether a URL-sourced PDF avoids the 32 MB base64 payload limit on Hosted on Azure.\n- Whether `claude-sonnet-5-5` is actually deployable Hosted on Azure in Global Standard. The MS region table and the model tables disagree.\n- The event subscription's type and tenant policies. This is a question for the organisers (#5).\n- Whether `store: false` is honoured on the Azure Responses API.\n- Document Intelligence availability in Switzerland North (secondary source only).\n- No latency or accuracy was measured. Everything here comes from the docs, not from a test call.\n\n## Sources\n\nMicrosoft Learn (all fetched 2026-10-03):\n\n- [MS Claude models] Claude models in Microsoft Foundry, ms.date 2026-09-21: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models\n- [MS deploy Claude] Deploy and use Claude models in Microsoft Foundry, ms.date 2026-09-21: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-claude\n- [MS Claude quotas] Claude model quotas and rate limits, ms.date 2026-09-21: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models-quotas-limits\n- [MS hosting comparison] Compare hosting options for Claude models, ms.date 2026-09-21: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models-hosting-comparison\n- [MS partners] Foundry Models from partners and community (offer regions, region tables), ms.date 2026-09-21: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-from-partners\n- [MS Claude data privacy] Data, privacy, and security for Claude models in Foundry, ms.date 2026-06-23: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/claude-models/data-privacy\n- [MS models sold by Azure] GPT model capabilities and context windows, ms.date 2026-09-21: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure\n- [MS region availability] Region availability for Foundry Models sold by Azure, ms.date 2026-09-03: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure-region-availability\n- [MS Responses] Azure OpenAI Responses API (PDF input, structured outputs, regions), ms.date 2026-08-18: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses\n- [MS Foundry file search] File search tool for Foundry agents, ms.date 2026-09-30: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/file-search\n- [MS Azure OpenAI data privacy] Data, privacy, and security for Foundry Models sold by Azure, ms.date 2026-05-18: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy\n- [MS DI Layout] Document layout analysis (v4.0 2024-11-30), ms.date 2026-05-01: https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout\n- [MS DI data privacy] Data, privacy, and security for Document Intelligence, ms.date 2026-07-22: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/document-intelligence/data-privacy-security\n- Secondary (Microsoft Q&A, not authoritative): Claude on Azure EU infrastructure timeline (https://learn.microsoft.com/en-us/answers/questions/5867930/), which predates the \"Hosted on Azure\" option and is superseded; Document Intelligence in Switzerland North (https://learn.microsoft.com/en-us/answers/questions/2156548/).\n\nAnthropic (fetched 2026-10-03):\n\n- [Anthropic Foundry] Claude in Microsoft Foundry: https://platform.claude.com/docs/en/build-with-claude/claude-in-microsoft-foundry\n- [Anthropic data residency] Data residency (`inference_geo`, workspace geo): https://platform.claude.com/docs/en/manage-claude/data-residency\n- [Anthropic data retention] API and data retention (covers Foundry, ZDR, Covered Models): https://platform.claude.com/docs/en/manage-claude/api-and-data-retention\n- [Anthropic privacy] How long do you store my organization's data? (updated 2026-07-01): https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data\n- [Anthropic PDF], [Citations], [Rate limits]: as cited in #4 (https://platform.claude.com/docs/en/build-with-claude/pdf-support, …/citations, https://platform.claude.com/docs/en/api/rate-limits)\n- [claude-api skill] Bundled Claude API reference, platform-availability table and pricing note, cached 2026-09-25\n\nOpenAI (fetched 2026-10-03; the pages show no dates):\n\n- [OpenAI PDF files] https://developers.openai.com/api/docs/guides/pdf-files\n- [OpenAI file search] https://developers.openai.com/api/docs/guides/tools-file-search\n", "bytes": 28833}, {"path": "docs/research/llm-rule-extraction.md", "slug": "docs-research-llm-rule-extraction", "title": "How well can an LLM extract a cited Rule Card from a 200-page prospectus?", "label": "How well can an LLM extract a cited Rule Card from a 200-page prospectus?", "group": "research", "body": "# How well can an LLM extract a cited Rule Card from a 200-page prospectus?\n\nResearch for issue #4 (wayfinder map #1). Researched 2026-10-03 against primary vendor docs. Context: ADR 0001 (`docs/adr/0001-llm-extracts-rules-engine-decides.md`). The LLM drafts a **Rule Card** (Hard Restrictions and Target Market criteria, each with a **Citation**) once per **Share Class**, a human validates it, and a deterministic engine decides.\n\n## TL;DR\n\n- **It's feasible, and the platform features fit this task well.** Claude takes a whole PDF natively (text plus a rendered image of every page, so tables and charts are visible) up to **600 pages / 32 MB per request** on 1M-context models. The **Citations** feature returns verbatim `cited_text` plus **1-indexed page numbers**, and the API guarantees those are valid pointers into the document. That is what we need for passage-level Citations.\n- **The catch: Citations and structured outputs are mutually exclusive** (a request that sets both returns a 400). That forces a **two-pass pipeline**. Pass 1 extracts with Citations on. Pass 2 normalises the result into the Rule Card JSON schema with structured outputs and no documents attached.\n- **Watch the context limit.** A dense 200-page prospectus sent as a native PDF can come to roughly **0.5M–1.5M tokens**, which may not fit in 1M. Run `count_tokens` first. Then either **scope the input** (general section plus the relevant sub-fund appendix) or fall back to text-only input.\n- **Cost is a few dollars per prospectus** on Claude Opus 5.5 (about $1.50–$4 for the first Share Class). Each further Share Class from the same cached prospectus costs about **$0.50**. **Latency** is likely **2–6 minutes per document** (my estimate, not measured). Both are fine for a \"once per Share Class, offline\" step. Precompute Rule Cards before the demo.\n- **The EMT probably needs no LLM.** The European MiFID Template is a standardised FinDatEx data file (spreadsheet/CSV) with Target Market fields. Parse it deterministically and save the LLM for the prospectus and KID.\n- **Accuracy:** I found **no public benchmark for this exact task**. Expect strong results on explicitly stated restrictions. The risky cases are cross-references, defined terms, exceptions, umbrella vs sub-fund overrides, and share-class tables that span pages. The spike should hand-label a gold Rule Card for 2–3 prospectuses and measure against it (see [Evaluation](#evaluation-for-the-spike)).\n\n## 1. Capabilities (Claude, primary docs)\n\n### PDF input\n\n- Any standard PDF (no passwords or encryption). Limits: **32 MB request size; 600 pages per request (100 when the context window is under 1M tokens)**. Both limits cover the whole request payload. Upload large PDFs with the Files API and reference them by `file_id`. [PDF support]\n- How the PDF is processed: \"The system converts each page of the document into an image. The text from each page is extracted and provided alongside each page's image.\" So Claude reasons over table layout and charts, not just the text layer. [PDF support]\n- Token cost: \"Each page typically uses **1,500–3,000 tokens** per page depending on content density\" for text, **plus** image tokens for each page image. [PDF support]\n- Image tokens: an image costs `⌈w/28⌉ × ⌈h/28⌉` visual tokens. Claude 4.7 and later (including Opus 5.5 and Sonnet 5.5) use the high-resolution tier, capped at **2576 px long edge / 4,784 visual tokens** per image. [Vision]\n- The docs warn about density: \"Dense PDFs (many small-font pages, complex tables, or heavy graphics) can fill the context window before reaching the page limit… Try splitting the document into sections.\" [PDF support]\n- PDF input is available on every platform: Claude API, Claude Platform on AWS, Bedrock, Google Cloud, Microsoft Foundry. **Bedrock gotcha:** in the Converse API, the visual (page-image) mode is used only when citations are enabled. Without citations it falls back to text extraction only. [PDF support]\n\n### Citations\n\n- Turn it on per document block with `citations: {enabled: true}`. PDF text is **chunked into sentences**. Claude can cite a single sentence or chain consecutive sentences into a passage. A PDF citation has type `page_location` with `start_page_number` / `end_page_number` (1-indexed) and the verbatim `cited_text`. [Citations]\n- Reliability: \"citations are guaranteed to contain valid pointers to the provided documents.\" `cited_text` **does not count toward output tokens**. [Citations]\n- Limits:\n  - Only text can be cited, not images.\n  - **Scanned PDFs with no extractable text cannot be cited.** Run OCR first, for example with Azure Document Intelligence (see §4).\n  - Citations and structured outputs **cannot be used together**: \"If you enable citations on any user-provided document… and also include the `output_config.format` parameter… the API returns a 400 error.\" [Citations]\n- **Custom content documents** let you supply your own chunks (for example, one paragraph or table row per block). Citations then come back as `content_block_location` block indices. This is the hook for joining Claude citations to an OCR layer that carries page numbers and bounding boxes. [Citations]\n- Citations work together with prompt caching, token counting, and batch processing. [Citations]\n\n### Structured outputs / strict tool use\n\n- `output_config.format` (JSON Schema) or `strict: true` on a tool guarantees schema-valid output. GA on Opus 5.5, Sonnet 5.5, and Haiku 4.5. **Not available on \"Claude in Amazon Bedrock\"** (the legacy integration only, up to Opus 4.6). [Structured outputs]\n- Schema limits: no recursive schemas, and no `minimum`/`maximum`/`minLength` constraints (SDK helpers move these into descriptions and validate client-side). `additionalProperties` must be `false`. A request may have at most 20 strict tools, **24 optional parameters**, and 16 union-typed parameters in total. Compiled grammars are cached for 24 hours. [Structured outputs]\n- On Opus 5.5 and Sonnet 5.5, forced `tool_choice` (`any` / `tool`) **returns a 400**. Use `output_config.format` instead. [claude-api skill, model notes]\n\n### Models, context, pricing (Claude API, first-party)\n\n| Model | ID | Context | Input $/MTok | Output $/MTok | Cache read | Batch (in/out) |\n|---|---|---|---|---|---|---|\n| Claude Opus 5.5 | `claude-opus-5-5` | 1M | 4 | 20 | 0.20 | 2 / 10 |\n| Claude Sonnet 5.5 | `claude-sonnet-5-5` | 1M | 2 | 10 | 0.20 | 1 / 5 |\n| Claude Haiku 4.5 | `claude-haiku-4-5` | 200K (so 100-page PDF cap) | 1 | 5 | 0.10 | 0.5 / 2.5 |\n\n- There is **no long-context surcharge**: \"A 900k-token request is billed at the same per-token rate as a 9k-token request.\" [Pricing]\n- Cache writes cost 1.25× the input price (5-minute TTL) or 2× (1-hour TTL). Batch is −50%, and the discounts stack. [Pricing]\n- The 4.7+ tokenizer produces \"approximately 30% more tokens for the same text\". [Pricing]\n- Rate limits are not a blocker even at the Start tier (Opus 5.5: **2M ITPM, 400K OTPM**), and cached reads don't count toward ITPM. [Rate limits]\n- Opus 5.5 thinking is always on and is controlled by `output_config.effort`. The default is `medium`; use `high` for extraction. [claude-api skill]\n\n## 2. Limits and risks for this use case\n\n| Risk | Why it matters | Mitigation |\n|---|---|---|\n| Context overflow on dense PDFs | 200 pages × (1.5–3K text + up to ~4.8K image) can reach ≈0.5M–1.5M tokens, over the 1M window | `count_tokens` first. Scope pages: general section plus the sub-fund appendix. Or send text only. |\n| Scanned / image-only pages | Not citable (no extractable text) | OCR (Azure DI Layout) → custom content document |\n| Citations ⟂ structured outputs | Can't get schema JSON and native citations in one call | Two-pass pipeline (§5) |\n| Page-number offsets | If you split the PDF, cited pages are relative to the sub-document | Keep a `subdoc_page → original_page` map |\n| Cross-references and defined terms (\"US Person as defined in Section 12\") | Rule text and definition live on different pages | Prompt Claude to cite both the rule and the definition. Allow multiple Citations per rule. |\n| Umbrella vs sub-fund overrides, exceptions (\"except for Class I…\") | Easy to pull the general rule and miss the override | Ask Claude to extract per Share Class. In the gold set, specifically check overrides. |\n| Share-class tables spanning pages | Minimum subscription and eligible investors often sit in a table | Native PDF (sees page images) does better than text-only. Azure DI handles cross-page tables. |\n| Hallucinated or loose rules | A Rule Card feeds a deterministic gate | Citation required for every rule, a deterministic quote check, and human validation (ADR 0001) |\n\n## 3. Cost and latency estimate for a ~200-page prospectus\n\nAssumptions:\n\n- Output is about 20K tokens per extraction (thinking plus rules).\n- The normalise pass takes about 10K tokens in and 5K out.\n- Token counts are estimates. **Measure them with `count_tokens` on real documents.**\n\n| Scenario | Input tokens | Opus 5.5 | Sonnet 5.5 |\n|---|---|---|---|\n| A. Whole prospectus, native PDF | ~800K | $3.20 + $0.40 = **~$3.60** | **~$1.80** |\n| B. Whole prospectus, text only | ~400K | $1.60 + $0.40 = **~$2.00** | **~$1.00** |\n| C. Scoped: ~60 pp general + ~10 pp sub-fund, native | ~280K | $1.12 + $0.40 = **~$1.50** | **~$0.75** |\n| Extra Share Class reusing cached A | 800K cache read | $0.16 + $0.40 = **~$0.56** | **~$0.36** |\n| Normalise pass (pass 2) | ~10K | **~$0.14** | **~$0.07** |\n\n- Caching the prospectus for a 5-minute TTL raises the first call by 0.25× input (A: $3.20 → $4.00). It pays off from the second Share Class onwards.\n- The Batch API halves everything, but results can take up to 24 hours. Use it to pre-compute a corpus, not live in the demo.\n- A hackathon budget of a few dozen prospectuses comes to **well under $100**.\n\nLatency is an **estimate, not a vendor figure**. Prefilling several hundred thousand tokens plus generating 10–20K tokens with thinking at high effort comes to roughly **2–6 minutes** per uncached extraction. Cached follow-up calls and pass 2 take seconds to about a minute. Measure this in the spike. If it matters, Opus 5.5 fast mode (Claude API only, $8/$40) speeds up output generation.\n\n## 4. Alternatives (brief)\n\n| Option | What it gives | Limits / price | Fit for us |\n|---|---|---|---|\n| **Azure AI Document Intelligence: Layout** | OCR, paragraphs with roles (title, sectionHeading…), tables with cells and spans, **Markdown output**, figures, sections. Bounding `polygon` and character `spans` for every element. [Azure DI Layout] | Up to **2,000 pages**, 500 MB (S0). Price: see the Azure calculator (not retrievable from the pricing page). | Best preprocessor for scanned docs and tricky tables. Feed paragraphs and table rows to Claude as a **custom content document**. The `content_block_location` citations then map to page and polygon, so the UI can highlight the passage. |\n| **Google Document AI: Layout Parser** | Hierarchical layout, tables, figure descriptions, context-aware chunks with **page spans**. [Google Layout Parser] | Online: 15 pages / 20 MB. Batch: **500 pages** / 1 GB. Pricing on a separate page. | Comparable to Azure DI. Batch-only at 200 pages, which adds friction. |\n| **LlamaParse (LlamaCloud)** | PDF → Markdown/JSON with layout-aware parsing, tables, charts, custom schemas. [LlamaParse] | Credits at $1.25/1K. Per page: Fast 1, Cost-effective 3, Agentic 10, Agentic Plus 45. **200 pages ≈ $0.25 / $0.75 / $2.50 / $11.25.** [LlamaParse pricing] | Good Markdown quality, but it adds a vendor and doesn't give us citation semantics by itself. |\n| **OpenAI file inputs (Responses API)** | Extracts text **and page images** and sends both to vision models, with a `detail` control. [OpenAI PDF files] | 50 MB per file and per request | Functionally similar to Claude's native PDF input. That page documents no page-level citation feature, so we would need our own quote-verification. |\n\n## 5. Recommended extraction pipeline for the spike\n\n```\n            ┌──────────────┐  EMT (xlsx/csv) ──► deterministic parser ──► Target Market fields (cite: EMT field id)\n            │ Fund Docs    │\n            └──────┬───────┘\n                   │ prospectus + KID (PDF)\n   0. Prep  ───────┼─► pypdf: locate general section + sub-fund appendix (TOC / bookmarks / keyword scan)\n                   │   keep page map; count_tokens; if >~700K or scanned → Azure DI Layout → custom content doc\n                   ▼\n   1. Draft  Claude Opus 5.5, effort=high, Files API file_id, citations:{enabled:true}, cache_control on doc\n             Prompt: \"For Share Class \u003cX> list every Hard Restriction and Target Market criterion,\n                      one per paragraph, prefixed [RULE:\u003ctype>]; cite rule text AND any definition it relies on.\"\n             → text blocks, each with citations[] (page_location, cited_text)  ← guaranteed-valid pointers\n                   ▼\n   2. Normalise  Claude (Sonnet 5.5 is enough), NO documents, output_config.format = RuleCard JSON schema\n             Input: pass-1 rules with citation ids C1..Cn → output typed rules referencing citation ids\n             (e.g. {type:\"US_PERSON_EXCLUDED\", value:true, citations:[\"C3\",\"C7\"]},\n                   {type:\"MIN_INITIAL_SUBSCRIPTION\", amount:1000000, currency:\"EUR\", citations:[\"C12\"]})\n                   ▼\n   3. Verify (deterministic)  every rule has ≥1 citation; citation ids resolve; values (amounts, ISO country\n             codes, investor classes) parse into engine enums; map sub-doc pages → original pages\n                   ▼\n   4. Human validation UI  show each rule beside cited_text + page link; approve / edit / reject\n                   ▼\n   5. Rule Card (validated, versioned per Share Class + doc hash) ──► deterministic Eligibility Check engine\n```\n\nWhy this shape:\n\n- **Pass 1 keeps the API's guarantee that citations are valid.** The Citation on every rule is a real passage on a real page, with no fuzzy matching to write. This directly answers \"what if the AI is wrong?\" (ADR 0001).\n- **Pass 2 gets schema-valid JSON** for the engine. Its input is small (no documents), so it is cheap and fast. Citation ids carry the link from each rule back to its passage.\n- **One cached prospectus serves many Share Classes.** Umbrella prospectuses cover many sub-funds, so caching the document and querying per Share Class costs about $0.50 per extra class.\n- **Plan B if Citations prove awkward**: run a single pass with structured outputs, where each rule carries a verbatim `quote` and `page`. Then verify deterministically by fuzzy-matching the quote against that page's text layer (PyMuPDF/pdfplumber) and flag any rule that fails as Needs Review. It is simpler to build, but citation validity is no longer guaranteed by the API.\n- **Hackathon shortcuts**:\n  - Pre-compute Rule Cards for the demo funds.\n  - Use the Claude API directly. Bedrock lacks structured outputs on the current integration and needs citations on for visual PDF mode in Converse.\n  - Skip Azure DI unless a demo document is scanned.\n\n### Evaluation for the spike\n\n1. Hand-label a gold Rule Card for **2–3 real prospectuses** (one umbrella with several share classes, one with a scanned or table-heavy appendix).\n2. Metrics:\n   - **Rule recall** (did it find every Hard Restriction?) and **precision**\n   - **Value accuracy** (amounts, currencies, jurisdictions)\n   - **Citation support rate** (does the cited passage actually support the rule? Judge by hand or with an LLM judge)\n   - Tokens, $, and latency per document\n3. Compare: native PDF vs text-only, Opus 5.5 vs Sonnet 5.5, whole doc vs scoped pages.\n\n## Sources\n\n- [PDF support] https://platform.claude.com/docs/en/build-with-claude/pdf-support\n- [Citations] https://platform.claude.com/docs/en/build-with-claude/citations\n- [Structured outputs] https://platform.claude.com/docs/en/build-with-claude/structured-outputs\n- [Vision] https://platform.claude.com/docs/en/build-with-claude/vision\n- [Pricing] https://platform.claude.com/docs/en/about-claude/pricing\n- [Rate limits] https://platform.claude.com/docs/en/api/rate-limits\n- [claude-api skill] Bundled Claude API reference (model ids, Opus 5.5 thinking/effort and `tool_choice` notes), cached 2026-09-25. Also see https://platform.claude.com/docs/en/about-claude/models/overview\n- [Azure DI Layout] https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout\n- [Google Layout Parser] https://docs.cloud.google.com/document-ai/docs/layout-parse-chunk\n- [LlamaParse] https://developers.llamaindex.ai/python/cloud/llamaparse/overview\n- [LlamaParse pricing] https://developers.llamaindex.ai/python/cloud/general/pricing\n- [OpenAI PDF files] https://developers.openai.com/api/docs/guides/pdf-files\n- EMT background: FinDatEx (https://findatex.eu). Not fetched in this research. Confirm the current EMT version and field list before building the parser.\n", "bytes": 17109}, {"path": "docs/research/sample-funds.md", "slug": "docs-research-sample-funds", "title": "Sample Fund Documentation for the demo", "label": "Sample Fund Documentation for the demo", "group": "research", "body": "# Sample Fund Documentation for the demo\n\n*Which public funds should be our sample Fund Documentation?*\n\nResearched 2026-10-03. Each fact below was read directly from the fund's own document (PDF text extraction). Page numbers are the PDF page numbers, which match the printed page numbers in every document used here. PDFs are **not** committed; links only.\n\n## Recommendation (TL;DR)\n\nUse these four funds. Between them they exercise every Hard Restriction type in [GLOSSARY.md](../../GLOSSARY.md) and give both positive and negative Target Market outcomes.\n\n| # | Fund (Share Classes used) | Regime | Why it is in the set |\n|---|---|---|---|\n| 1 | **Nordea 1 – Global Climate and Environment Fund** (BP-EUR retail, BI-EUR institutional) | LU UCITS SICAV | Retail and institutional class of the same fund: EUR 0 vs EUR 75,000 minimum, \"all investors\" vs \"institutional investors\". Reg S-style US Person exclusion. Swiss representative named, so CH distribution is possible. PRIIPs KID with Target Market text. |\n| 2 | **Nordea Specialised Investment Fund, SICAV-FIS – Global Private Equity Fund** (BW-SEK, plus the class table) | LU SIF (AIF) | Well-informed investors only (SIF Law art. 2). Minimums of EUR 10k, 100k, 1m and 5m depending on class/channel. SRI 6, 10-year RHP: gives a strong **negative** Target Market case. KID present, no factsheet. |\n| 3 | **BNP PARIBAS (CH) Fund – Bonds CHF** (A retail, I qualified-only) | CH contractual fund (FinSA/CISA) | Same fund has a retail class (no minimum) and a **qualified-investor-only** class (CHF 1m minimum). US Person exclusion names US citizenship explicitly. \"No issue or redemption abroad\" (a distribution-jurisdiction rule). Swiss KID per class with different \"Kleinanleger-Zielgruppe\" text. |\n| 4 | **Swiss Life iFunds (CH)** umbrella (I Cap / I Dis vs AM / M / I-A classes) | CH fund for qualified investors only | Whole fund is limited to qualified investors. Class rules depend on the *kind* of qualified investor: HNWI opt-outs and Art. 10(3ter) mandate clients are excluded from some classes. **No KID and no prospectus** (FINMA exemptions), so no Target Market source exists. Strictest US Person definition (IRC-based: any US citizen, dual nationals included). |\n\nNot covered: a LU **RAIF**. A SIF covers the \"well-informed investor\" rule the same way, and RAIF offering documents are rarely published. No **EMT** is public for any of the four (see [EMT availability](#emt-availability)).\n\n---\n\n## Document URL patterns\n\n**Nordea (funds 1 and 2).** These ISIN-keyed URLs always serve the current version:\n\n```\nhttps://docs.fundconnect.com/GetDocument.aspx?clientid=i1g0xyvk-ztaq-jdr2-cm3y-0sshe4ukztmc&Isin=\u003cISIN>&lang=en-GB&type=\u003cTYPE>&save=False\n```\n\n`TYPE` values that worked: `Prospectus`, `PRIIPS+KID`, `Factsheet`, `Annual+Report`. `EMT`, `KID`, and `Fact+Sheet` return 404. SIF Share Classes have no `Factsheet`.\n\n**Swiss Fund Data (funds 3 and 4).** Files are versioned by date, so each **new edition gets a new URL**. Re-check before the hackathon:\n\n```\nhttps://www.swissfunddata.ch/sfdpub/docs/\u003cdoctype>-\u003cfundId>[_\u003csub>_\u003cclass>]-\u003cyyyymmdd>-\u003clang>.pdf\n```\n\nObserved doctypes: `fpd`/`frd` prospectus or fund contract, `prp` KID (Basisinformationsblatt), `fsm` monthly factsheet, `anr` annual report, `sar` semi-annual report, `emr` ESG report (*not* an EMT). Listings come from `https://www.swissfunddata.ch/sfdpub/en/funds/documents?text=\u003cISIN>`.\n\n---\n\n## 1. Nordea 1 – Global Climate and Environment Fund (LU UCITS)\n\nManager: Nordea Investment Funds S.A. Umbrella: Nordea 1, SICAV (UCITS, Luxembourg). Base currency: EUR.\n\n### Share Classes\n\n| Class | ISIN | Available to | Min. initial |\n|---|---|---|---|\n| BP-EUR (accumulating) | `LU0348926287` | All investors | None (factsheet shows \"0 EUR\") |\n| BI-EUR (accumulating) | `LU0348927095` | Institutional investors | EUR 75,000 or equivalent |\n\n### Documents\n\n| Doc | URL | Version |\n|---|---|---|\n| Prospectus | [Prospectus](https://docs.fundconnect.com/GetDocument.aspx?clientid=i1g0xyvk-ztaq-jdr2-cm3y-0sshe4ukztmc&Isin=LU0348926287&lang=en-GB&type=Prospectus&save=False) | June 2026, 944 pp. (umbrella-wide) |\n| KID BP-EUR | [KID](https://docs.fundconnect.com/GetDocument.aspx?clientid=i1g0xyvk-ztaq-jdr2-cm3y-0sshe4ukztmc&Isin=LU0348926287&lang=en-GB&type=PRIIPS+KID&save=False) | published 20/05/2026 |\n| KID BI-EUR | [KID](https://docs.fundconnect.com/GetDocument.aspx?clientid=i1g0xyvk-ztaq-jdr2-cm3y-0sshe4ukztmc&Isin=LU0348927095&lang=en-GB&type=PRIIPS+KID&save=False) | published 20/05/2026 |\n| Factsheet BP-EUR | [Factsheet](https://docs.fundconnect.com/GetDocument.aspx?clientid=i1g0xyvk-ztaq-jdr2-cm3y-0sshe4ukztmc&Isin=LU0348926287&lang=en-GB&type=Factsheet&save=False) | as of 31/08/2026 |\n| EMT | not public | n/a |\n\n### Hard Restrictions (with Citations)\n\n- **US Person exclusion.** \"The shares in the SICAV may not be directly or indirectly offered or sold in the USA. Unless otherwise decided by the board or the management company, US persons may not subscribe for shares in the SICAV.\" US persons exclude \"Non-United States person\" under CFTC Rule 4.7, so US *taxpayers* may subscribe if they are not US persons. *(Prospectus p.3, \"Who can invest in these funds\")*. The definition is Reg S-style: residents, US entities, accounts, \"any other U.S. person defined by US Rule 902\". Citizenship alone is **not** listed. *(Prospectus p.5, \"US person\")*\n- **Distribution jurisdiction.** Offering is legal \"only where the shares are registered for public sale or where sale is not prohibited by local law\". *(Prospectus p.3)*. Switzerland has a named Representative and Paying Agent (BNP PARIBAS, Paris, Zurich branch). *(Prospectus p.146)*\n- **Investor classification / share-class restriction.** Core class table: **P** = \"All investors\", no minimum. **I** = \"Institutional investors\", min EUR 75,000. Other classes need a written agreement, e.g. D, N, X, X1. *(Prospectus p.123, \"Core share class characteristics\")*. \"Institutional investors\" means investors within the meaning of art. 174 of the 2010 Law, including \"financial professionals investing on behalf of … retail [clients] in connection with a discretionary management agreement\". *(Prospectus p.5)*\n- **Minimum initial subscription.** BP: none. BI: EUR 75,000. *(Prospectus p.123; factsheet \"Share class details\": BP minimum 0 EUR)*\n\n### Target Market\n\n- Prospectus: \"Suitability: The fund is suitable for all types of investors through all distribution channels. Investor profile: Investors who understand the risks of the fund and plan to invest for at least 5 years.\" *(Prospectus p.16, \"Investor Considerations\")*\n- KID (both classes, \"Intended retail investor\", p.1): intended for investors who accept that \"the invested amount can be lost entirely\". \"Suitable for all types of investors through all distribution channels\". Recommended holding period **5 years**.\n- Risk: **SRI 4/7** in the KID (p.1). The factsheet's older UCITS-style \"Risk & Reward Profile\" shows **category 5**, which is a different scale. Use the KID SRI.\n\n### Demo edge cases enabled\n\n- Retail client, EUR 10k into BP-EUR: **Eligible**. The same client into BI-EUR: **Not Eligible** for two reasons (institutional-only class, below EUR 75k). One fund, two Verdicts.\n- The BI-EUR KID still says \"suitable for all types of investors\". The Hard Restriction from the prospectus must win over the generic KID text.\n- US citizen resident in Switzerland: **not** a US Person under Nordea's Reg S definition. Contrast with funds 3 and 4.\n- Client horizon of 2 years against a 5-year RHP: Target Market mismatch on horizon.\n\n---\n\n## 2. Nordea Specialised Investment Fund, SICAV-FIS – Global Private Equity Fund (LU SIF)\n\nAIFM: Nordea Investment Funds S.A. Governed by the Luxembourg law of 13 February 2007 (SIF Law). Base currency: EUR.\n\n### Share Classes\n\n| Class | ISIN | Notes |\n|---|---|---|\n| BW-SEK (W core class, accumulating \"B\") | `LU2607415275` | KID available |\n| (sibling fund) Global Private Credit Fund HBW-SEK | `LU2607416596` | Same class rules. Its link also serves the umbrella prospectus |\n\nCore class rules from the prospectus table *(p.22, \"Core share class characteristics\")*. Minimums are stated in EUR; SEK/NOK convert at a fixed 1 EUR = 10 SEK/NOK:\n\n| Core class | Available to | Min. initial | Min. subsequent |\n|---|---|---|---|\n| W, U | Well-informed investors at AIFM discretion | EUR 100,000 | EUR 10,000 |\n| T | Well-informed investors subscribing **through Nordea Group** | EUR 10,000 | EUR 10,000 |\n| K | Well-informed, through intermediaries, **written agreement** | EUR 10,000 | EUR 10,000 |\n| O | Well-informed, through intermediaries | EUR 10,000 | EUR 10,000 |\n| I | Institutional investors | EUR 1,000,000 | EUR 100,000 |\n| R | Institutional, Global Private Equity Fund shareholders only | EUR 1,000,000 | EUR 100,000 |\n| X | Institutional, written agreement, custody at AIFM | EUR 5,000,000 | EUR 500,000 |\n\n### Documents\n\n| Doc | URL | Version |\n|---|---|---|\n| Prospectus | [Prospectus](https://docs.fundconnect.com/GetDocument.aspx?clientid=i1g0xyvk-ztaq-jdr2-cm3y-0sshe4ukztmc&Isin=LU2607415275&lang=en-GB&type=Prospectus&save=False) | September 2026, 63 pp. (visa 2026-08-27) |\n| KID BW-SEK | [KID](https://docs.fundconnect.com/GetDocument.aspx?clientid=i1g0xyvk-ztaq-jdr2-cm3y-0sshe4ukztmc&Isin=LU2607415275&lang=en-GB&type=PRIIPS+KID&save=False) | published 20/05/2026 |\n| Factsheet | none published (404) | n/a |\n| EMT | not public | n/a |\n\n### Hard Restrictions (with Citations)\n\n- **Investor classification.** \"The shares in the SICAV-FIS are exclusively offered to well-informed [investors] as defined in article 2 of the SIF Law.\" *(Prospectus p.3, \"Who can invest in these funds\")*. \"investor\" is defined as \"a well-informed investor\". *(p.5)*\n  - Statutory test, SIF Law art. 2(1): an institutional investor, a MiFID II Annex II professional, or any other investor who (a) confirms the status **in writing** and (b) either (i) invests at least **EUR 100,000**, or (ii) has an assessment by a credit institution, investment firm, UCITS ManCo or AIFM certifying their expertise. The threshold was lowered from EUR 125,000 by the Law of 21 July 2023. *([CSSF consolidated SIF Law](https://www.cssf.lu/wp-content/uploads/L_130207_SIF.pdf), p.4, art. 2 and footnote 5)*\n- **US Person exclusion.** Same wording as Nordea 1 (Reg S-style, Rule 4.7 carve-out). *(Prospectus p.3; definition p.5)*\n- **Distribution jurisdiction.** Legal \"only where the shares are registered for public sale or where sale is not prohibited\". *(p.3)*. Unlike Nordea 1, **no Swiss representative** is named. For Swiss clients, treat this as an offer to qualified investors only and route to **Needs Review** (CISA art. 120 FINMA approval requirement for offering foreign funds to non-qualified investors; *not verified against Fedlex in this pass*).\n- **Share-class restriction / channel.** T requires Nordea Group as the channel. K requires a written agreement. All classes are \"at the discretion of the AIFM\". *(p.22)*. The board/AIFM may reject applications and compulsorily redeem ineligible holders. *(p.30, \"Rights We Reserve\")*\n- **Minimum initial subscription.** See the table above *(p.22)*. The AIFM may waive minimums. *(p.30)*\n\n### Target Market\n\n- Prospectus: \"Investments in these funds are only suitable for well-informed investors who can afford the risks involved.\" *(p.3)*\n- KID BW-SEK, \"Intended retail investor\" (p.1): for well-informed investors \"with knowledge and/or experience of these types of products\" who accept that \"the invested amount can be lost entirely. The fund is not suitable for well-informed investors that are unable to sustain long-term investment.\" **RHP 10 years.**\n- **SRI 6/7** (\"second-highest risk class\") *(KID p.1)*. Listed illiquidity risks: Liquidity, Over-commitment, Funds of funds, Private equity investments.\n\n### Demo edge cases enabled\n\n- Retail client with no well-informed confirmation: **Not Eligible** (investor classification).\n- Retail client who signs the written confirmation and invests EUR 100k in a W class: passes the SIF Law test. The class is still \"at AIFM discretion\", so the Verdict is **Needs Review**.\n- Professional client with EUR 50k into W: **Not Eligible**, below the EUR 100k minimum. The same amount into O (EUR 10k minimum via an intermediary) passes.\n- Conservative client (risk tolerance 3, horizon 5y): **negative Target Market** against SRI 6 and RHP 10y.\n- Swiss-domiciled client: **Needs Review** (no Swiss distribution set-up named).\n\n---\n\n## 3. BNP PARIBAS (CH) Fund – Bonds CHF (CH fund, retail plus qualified-only class)\n\nFund management company: BNP PARIBAS ASSET MANAGEMENT Switzerland AG (formerly AXA IM; documents still reference axa-im.ch). Contractual umbrella fund, \"Other Funds for Traditional Investments\", under CISA. Not UCITS.\n\n### Share Classes\n\n| Class | ISIN | Available to | Min. initial / subsequent |\n|---|---|---|---|\n| A (distributing) | `CH0112537516` | All investors | None |\n| A AC (accumulating) | `CH0114292532` | All investors | None |\n| I (distributing) | `CH0112537557` | **Qualified investors only** (CISA art. 10 para 3 and 3ter) | **CHF 1,000,000** / CHF 10,000 |\n| I AC (accumulating) | `CH0114292540` | Qualified investors only | CHF 1,000,000 / CHF 10,000 |\n| F / F AC | `CH0295589375` / `CH0295589508` | Distributors with separate fee agreements, or at FMC discretion | CHF 10,000 / CHF 5,000 |\n| S / S AC | `CH0593936047` / `CH0593936054` | Investors with a written advisory/asset-management contract with an AXA Group company or the FMC; AXA/BNP Group companies | None |\n\n*(ISINs: prospectus p.15, §5.1 \"Key data\". Eligibility and minimums: p.5, §1.5 a)*\n\n### Documents\n\n| Doc | URL | Version |\n|---|---|---|\n| Prospectus with integrated fund contract (EN) | [frd-5415-20260629-en.pdf](https://www.swissfunddata.ch/sfdpub/docs/frd-5415-20260629-en.pdf) | 29 June 2026, 34 pp. Swiss Fund Data now also lists a 23 July 2026 edition, FR only: [fpd-5415-20260723-fr.pdf](https://www.swissfunddata.ch/sfdpub/docs/fpd-5415-20260723-fr.pdf). Not checked for changes. |\n| KID class A (DE) | [prp-5415_01_01-20260507-de.pdf](https://www.swissfunddata.ch/sfdpub/docs/prp-5415_01_01-20260507-de.pdf) | created 01/05/2026 |\n| KID class I (DE) | [prp-5415_01_02-20260507-de.pdf](https://www.swissfunddata.ch/sfdpub/docs/prp-5415_01_02-20260507-de.pdf) | created 01/05/2026 |\n| Factsheet class A | [fsm-5415_01_01-20260831-en.pdf](https://www.swissfunddata.ch/sfdpub/docs/fsm-5415_01_01-20260831-en.pdf) | as of 31/08/2026 |\n| Factsheet class I | [fsm-5415_01_02-20260831-en.pdf](https://www.swissfunddata.ch/sfdpub/docs/fsm-5415_01_02-20260831-en.pdf) | as of 31/08/2026 |\n| EMT | not public | n/a |\n\n### Hard Restrictions (with Citations)\n\n- **Investor classification / share-class restriction.** \"Class 'I' and class 'I AC' units may only be held by qualified investors within the meaning of Art. 10 para 3 and 3ter CISA.\" *(Prospectus p.5, §1.5 a; repeated in the fund contract, p.19, §6.4)*. Qualified investors \"include, in particular, regulated financial intermediaries … regulated insurance companies, public entities and retirement provision institutions with professional treasury departments … companies with professional treasury departments, as well as private clients who have declared their wish to opt out\" (CISA art. 10(3)/(3ter) with FinSA art. 4(3)–(5), art. 5(1) and (4)). *(p.5)*\n- **Minimum initial subscription.** A: none. F: CHF 10,000. I: CHF 1,000,000 (subsequent CHF 10,000). *(p.5)*. Also stated in the I-class KID: \"Mindestzeichnungsbetrag bei Erstzeichnung: CHF 1'000'000\" *(KID I, p.1)*\n- **US Person exclusion.** Units \"may not be offered, sold or delivered to investors who are U.S. Persons within the meaning of Regulation S … **in particular investors with U.S. citizenship** or investors who are resident or domiciled in the United States\". US employee benefit plans (ERISA) are also excluded. *(Prospectus p.16, §5.3 \"Sales restrictions\")*\n- **Distribution jurisdiction.** \"No issue or redemption of units of the subfunds shall take place abroad; in particular, units … may not be offered, sold or delivered within the United States.\" *(p.16, §5.3)*. The factsheet confirms \"UCITS Compliant: No\", so there is no EU passport.\n\n### Target Market\n\n- Prospectus, \"Profile of the typical investor\" (Bonds CHF): \"appropriate for investors with a medium- to long-term investment horizon who primarily seek regular income from the point of view of capital security. Investors can accept temporary fluctuations …\" *(p.16, §6 a)*\n- KIDs (\"Kleinanleger-Zielgruppe\", p.1). The text **differs by class**:\n  - **A**: retail investors \"die **kein** finanzielles Know-how und keine Kenntnisse besitzen\" (basic investors), can bear total loss, seek growth, income and ESG, horizon at least 3 years.\n  - **I**: retail investors \"die ein **gewisses** finanzielles Know-how oder Kenntnisse besitzen\" (informed investors), otherwise the same.\n- **SRI 2/7**, RHP **3 years** (both KIDs, p.1). Both factsheets show the same SRI 2.\n\nNote: FinSA has no MiFID-style product-governance Target Market duty. The Swiss KID \"Zielgruppe\" plus the prospectus \"typical investor profile\" are the closest equivalents.\n\n### Demo edge cases enabled\n\n- Swiss retail client, CHF 50k: **Eligible** for A. **Not Eligible** for I (not qualified, and below CHF 1m).\n- Conflicting documents: the I-class KID addresses \"Privatanleger\", but the prospectus restricts I to qualified investors. Show that the Justification cites the prospectus Hard Restriction over the KID text.\n- Swiss-resident **US citizen** (dual national): **Not Eligible** here because citizenship is named. The same person would pass Nordea 1's US Person test.\n- Luxembourg-resident client: \"no issue … abroad\" leads to **Not Eligible** or Needs Review on distribution jurisdiction.\n- Swiss HNWI who opted out under FinSA art. 5(1), CHF 2m: **Eligible** for I.\n\n---\n\n## 4. Swiss Life iFunds (CH) (CH fund for qualified investors only)\n\nFund management company: Swiss Life Asset Management Ltd, Zurich. Custodian: UBS Switzerland AG. Contractual umbrella, \"other funds for traditional investments\", **for qualified investors**. Sub-funds include Equity Switzerland (CHF), Equity Switzerland Small & Mid Cap (CHF), Bond Swiss Francs Domestic/Foreign (CHF), Bond Global Corporates/Government+/Aggregate (CHF hedged).\n\n### Share Classes / ISINs\n\nThe fund contract dated 1 October 2026 defines these classes: **I Cap, I Dis** (all qualified investors), **AM Cap/Dis, M Cap/Dis** (qualified investors with a Swiss Life mandate), **I-A 1 / I-A 1 Cap** (mandate clients, 3ter excluded), and **I-A 3** (life insurers' tied assets) *(fund contract pp.7–8, §6.4)*. The latest annual report (30 Sept 2025) still uses the older names:\n\n| Sub-fund | Class (annual report naming) | ISIN |\n|---|---|---|\n| Equity Switzerland Small & Mid Cap (CHF) | I-A1 / I-A2 | `CH0023989467` / `CH1197235372` |\n| Equity Switzerland (CHF) | I-A1 | `CH0108009199` |\n| Bond Swiss Francs Domestic (CHF) | I-A1 / I-A2 | `CH0023989764` / `CH0324001053` |\n| Bond Swiss Francs Foreign (CHF) | I-A1 / I-A2 | `CH0023989582` / `CH0219870471` |\n\n*(Annual report 2024/25, p.3 contents table, and the per-sub-fund \"Class … ISIN\" lines, e.g. p.30.)* A class launched 20/03/2026 for Small & Mid Cap, `CH1533828468`, appears on third-party data sites. Its mapping to the new class names is **unverified**. Confirm with Swiss Life before relying on a specific class name and ISIN pair.\n\n### Documents\n\n| Doc | URL | Version |\n|---|---|---|\n| Fund contract with appendix (EN; German binding) | [fpd-1405-20261001-en.pdf](https://www.swissfunddata.ch/sfdpub/docs/fpd-1405-20261001-en.pdf) | effective 1 October 2026, 47 pp. |\n| Annual report | [anr-1405-20250930-en.pdf](https://www.swissfunddata.ch/sfdpub/docs/anr-1405-20250930-en.pdf) | FY to 30 Sept 2025 |\n| Prospectus | **none**: FINMA exemption | n/a |\n| KID | **none**: FINMA exemption | n/a |\n| Factsheet | none found on Swiss Fund Data or swisslife.ch | n/a |\n| EMT | not public | n/a |\n\n### Hard Restrictions (with Citations)\n\n- **Investor classification (fund level).** \"The group of investors of all sub-funds is limited to qualified investors as per Art. 10, cl. 3 and 3ter CISA in conjunction with Art. 4, cl. 3-5 and Art. 5, cl. 1 and 4 FinSA.\" The FMC and custodian ensure eligibility. *(Fund contract p.5, §5.1)*\n- **Share-class restriction (by kind of qualified investor).** *(pp.7–8, §6.4)*\n  - I Cap / I Dis: \"exclusively open to all qualified investors pursuant to Art. 10, cl. 3 and 3ter CISA.\"\n  - AM Cap / AM Dis: qualified investors under art. 10(3) **with an asset management or other paid financial services contract** with Swiss Life (or a cooperating FinSA art. 4(3)(a)/(b) intermediary). \"Qualified investors pursuant to Art. 10, cl. 3ter CISA and **high net worth individuals pursuant to Art. 5, cl. 1 FinSA are excluded**.\"\n  - M Cap / M Dis: as AM, plus withholding-tax reporting-procedure eligibility, and custody at the custodian bank.\n  - I-A 1 / I-A 1 Cap: qualified investors with a Swiss Life mandate. \"Qualified investors pursuant to Art. 10, cl. 3ter CISA are excluded.\"\n  - I-A 3: Swiss and foreign life insurers' tied assets only.\n  - Investors who stop qualifying must redeem or convert within 30 days, otherwise there is a forced conversion or redemption. *(p.9, §6.6)*\n- **US Person exclusion (strictest of the set).** \"Units … may not be offered, sold or delivered to US persons. US person means: (i) a US citizen (including dual or multiple citizenship); (ii) a US resident (… Green Card or … substantial presence test); … (vi) a person subject to US tax law for any other reason …\" The definition is construed under the US Internal Revenue Code. *(Appendix p.45, §5.3 b)*\n- **Distribution jurisdiction.** \"Distribution activities have been approved in the following countries: Switzerland.\" *(p.45, §5.3 a)*\n- **Minimum initial subscription.** None stated. The contract only says classes *may* differ in minimum investment. *(p.7, §6.3)*\n\n### Target Market\n\n- **None published.** \"FINMA has exempted this investment fund … pursuant to Art. 10, cl. 5 CISA from … c) the obligation to produce a key information document\", and \"from the duty to publish a prospectus in accordance with Art. 50 [FinSA]\". *(Fund contract p.2, §1.6)*. An appendix replaces the prospectus. *(p.3, §1.8)*\n\n### Demo edge cases enabled\n\n- Swiss retail client: **Not Eligible** at fund level.\n- Swiss HNWI who opted out (FinSA art. 5(1)): **Eligible** for I Cap, **Not Eligible** for AM Cap (HNWI explicitly excluded). This is a nuanced share-class rule.\n- Retail client under a discretionary mandate (CISA art. 10(3ter)): **Eligible** for I Cap, **Not Eligible** for I-A 1.\n- **Missing Target Market source.** With no KID or EMT, the TM step cannot run. Return **Needs Review** with a Justification citing the FINMA exemption in §1.6, or skip TM for professional clients. Either way the \"no data\" path gets tested.\n- Dual US/Swiss national: **Not Eligible** (citizenship named).\n- Any non-Swiss client: **Not Eligible** or Needs Review (distribution approved only in CH).\n\n---\n\n## Verdict coverage matrix (suggested demo clients)\n\n| Client Profile | F1 BP-EUR | F1 BI-EUR | F2 W class | F3 A | F3 I | F4 I Cap |\n|---|---|---|---|---|---|---|\n| LU retail, French national, EUR/CHF 20k, SRI tolerance 4, 5y | Eligible | Not Eligible (class + min) | Not Eligible (not well-informed) | Not Eligible / Review (no issue abroad) | Not Eligible | Not Eligible |\n| LU retail, signed well-informed confirmation, EUR 150k, SRI 6, 10y | Eligible | Not Eligible | Needs Review (AIFM discretion) | Review (abroad) | Not Eligible | Not Eligible |\n| DE professional, EUR 50k, SRI 3, 3y | Eligible (TM horizon warning) | Not Eligible (min) | Not Eligible (min, TM SRI/horizon) | Review (abroad) | Review (abroad) | Not Eligible (CH-only) |\n| CH retail, CHF 50k, no knowledge, SRI 2, 3y | TM mismatch (SRI 4, 5y) | Not Eligible | Needs Review (CH) | **Eligible** | Not Eligible (QI + min) | Not Eligible |\n| CH HNWI opted out, CHF 2m, informed | Eligible | Eligible (if treated as institutional; Needs Review) | Needs Review (CH) | Eligible | **Eligible** | **Eligible** (but AM Cap Not Eligible) |\n| CH-resident US citizen, HNWI opted out | Eligible (not a Reg S US Person) | Needs Review | Needs Review | **Not Eligible (US)** | **Not Eligible (US)** | **Not Eligible (US)** |\n\n---\n\n## EMT availability\n\nNo public EMT was found for funds 1–4. Nordea's fundconnect returns 404 for `EMT`. Swiss Fund Data's `emr` files are ESG reports. Both Nordea and BNP AM supply EMTs to distributors through data vendors.\n\nIf the demo needs a real EMT row, **UBS publishes FinDatEx EMT v4.1/v4.2 files publicly** at \u003chttps://www.ubs.com/funds-regulatoryinformation>, one CSV/XLSX per ManCo, including UBS Asset Management (Europe) S.A. (LU) and UBS Fund Management (Switzerland) AG. Example: `https://www.ubs.com/2/e/priip/EMT/EMT_UBS_FMCH_v_4.2.csv`. Scripted `curl` gets HTTP 403 (Akamai); a browser download works. Otherwise, take Target Market from the KID \"Intended retail investor\" section, as above.\n\n## Caveats\n\n- Swiss Fund Data URLs embed the edition date and will change when documents are updated. Nordea URLs are stable.\n- BNP CH KIDs were taken in German, the only language listed. English factsheets are available.\n- The CISA art. 120 point (fund 2, Swiss clients) is stated from general knowledge of Swiss law and was not checked against Fedlex in this pass ([CISA on Fedlex](https://www.fedlex.admin.ch/eli/cc/2006/822/en)). The CISA art. 10(3)/(3ter) definition is quoted as restated in the fund documents.\n- A RAIF was not sourced. Add one later only if the demo must name the RAIF regime explicitly; the SIF covers the same Hard Restriction.\n", "bytes": 25903}, {"path": "docs/tasks/01-chart-the-map.md", "slug": "docs-tasks-01-chart-the-map", "title": "Task 1: Chart the map", "label": "1. Chart the map", "group": "tasks", "body": "# Task 1: Chart the map\n\n**Why.** The map is the team's plan: what the demo shows, which decisions are still open, and in what order the work happens. Every content ticket comes from it, so the team owns what gets built. Without it, the agents build the wrong thing quickly.\n\n**Time box.** 60 minutes. **Who:** the whole team in one Claude Code session on a shared screen. One person types; everyone speaks for themselves. **Tool:** the `/wayfinder` skill.\n\n**Output.**\n- One issue labelled `wayfinder:map`, with the **destination** written in the team's words.\n- Its child tickets, labelled by type (`grilling`, `prototype`, `research`, `task`), with blocking edges. The first two are tasks 2 and 3 of this folder.\n- The platform's build tickets (spine S1–S3 and waves A–C from [build-workflow.md](../build-workflow.md)), labelled `ready-for-agent` or `ready-for-human`, so the builder can start right after the session.\n\n## Before the session (builder, 15 minutes)\n\n1. The repo is on the tracker the team will use, and everyone can open it.\n2. `docs/agents/issue-tracker.md` describes that tracker. It is written for GitHub. If the bank's repo is on Azure DevOps or GitLab, ask Claude to rewrite it for that tracker and test one issue create, label, child link and close before the session.\n3. The labels exist: `wayfinder:map`, `wayfinder:grilling`, `wayfinder:prototype`, `wayfinder:research`, `wayfinder:task`, plus the five triage labels of [triage-labels.md](../agents/triage-labels.md).\n4. `claude` starts at the repo root, and `/wayfinder` appears when you type `/` ([setup.md](../agents/setup.md)).\n\n## Steps\n\n| Minutes | Step | What happens |\n|---|---|---|\n| 0–5 | **Open** | Run `claude` at the repo root on the shared screen. Type `/wayfinder` and paste the prompt below. |\n| 5–20 | **Destination** | Claude asks what the 5-minute jury demo shows and what must work for it (the Must tier). Answer in the desk's words: who sends what, what the dealer sees, what the jury should remember. Push back until the destination fits in two lines. |\n| 20–45 | **Breadth first** | Claude walks the open questions (who uses FundEli5 and for which steps of their work, which funds, which clients and cases, which rules decide, what the answer key must prove, what each organiser capability looks like). Don't answer them now. For each one, agree on **what kind of ticket** it is and **what blocks it**. Claude creates the tickets. |\n| 45–55 | **Check the frontier** | Ask Claude: \"List the frontier.\" Tasks 2 and 3 must be on it, unblocked. The platform build tickets must be published from build-workflow.md's spine and waves. |\n| 55–60 | **Split** | Decide who takes which frontier ticket. Tasks 2 and 3 go to different people, so they run in parallel. The builder takes S1. |\n\n## The prompt\n\nPaste after `/wayfinder`:\n\n```\nChart the map for FundEli5 at the hackathon, with the whole team present.\nEvery person in the session speaks for themselves: ask the team, never answer for them.\n\nDestination to grill first: what the 5-minute demo to the jury shows, and the Must tier\nbehind it.\n\nFixed frame, not up for decision (ask only how to use it):\n- The four promises (docs/adr): no LLM decides a Verdict; no client data reaches an LLM;\n  every rule outcome cites its source; a person validates every rule before it decides.\n- The organisers ask for: explain eligibility like I'm five, guide the subscription form,\n  alert on deadlines, answer questions about eligibility.\n- The repo holds no code. The platform is rebuilt from docs/architecture.md,\n  docs/tech-choices.md and docs/ux/ (screens, design system, mockups). Its build tickets\n  come from docs/build-workflow.md (spine S1-S3, waves A-C) and need no grilling:\n  publish them with /to-tickets, labelled ready-for-agent or ready-for-human, with\n  blocking edges as the workflow says.\n- The content is the team's: demo story, cast, funds, rule kinds and readings, answer\n  key, emails, wording. docs/contracts/fixtures/ is disposable seed data.\n- About 20 build hours.\n\nOut of scope: regimes other than CH/LU, suitability, the reverse lookup.\n\nThe first two tickets of the map, unblocked:\n- \"Walk the screens\" (prototype), as docs/tasks/02-walk-the-screens.md describes.\n- \"Write the demo story and the answer key\" (grilling), as\n  docs/tasks/03-write-the-demo-story-and-answer-key.md describes.\n\nBreadth-first after that, surface at least:
