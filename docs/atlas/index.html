ervice layer**: Prefer `Optional\u003cT>` over returning null\n- **[QUARKUS] Not leveraging build-time init**: Using runtime reflection or classpath scanning that could be replaced by Quarkus build-time extensions or `@RegisterForReflection`\n\n### MEDIUM -- Testing\n- **Over-scoped test annotations**:\n  - **[SPRING]**: `@SpringBootTest` for unit tests — use `@WebMvcTest` for controllers, `@DataJpaTest` for repositories\n  - **[QUARKUS]**: `@QuarkusTest` for unit tests — reserve for integration tests; use plain JUnit 5 + Mockito for units\n- **Missing mock setup**:\n  - **[SPRING]**: Service tests must use `@ExtendWith(MockitoExtension.class)`\n  - **[QUARKUS]**: `@InjectMock` misuse — reserve for CDI integration tests, use plain Mockito for unit tests\n- **[QUARKUS] Missing `@QuarkusTestResource`**: Integration tests requiring external services should use Dev Services or `@QuarkusTestResource` with Testcontainers\n- **`Thread.sleep()` in tests**: Use `Awaitility` for async assertions\n- **Weak test names**: `testFindUser` gives no information — use `should_return_404_when_user_not_found`\n\n### MEDIUM -- Workflow and State Machine (payment / event-driven code)\n- **Idempotency key checked after processing**: Must be checked before any state mutation\n- **Illegal state transitions**: No guard on transitions like `CANCELLED → PROCESSING`\n- **Non-atomic compensation**: Rollback/compensation logic that can partially succeed\n- **Missing jitter on retry**: Exponential backoff without jitter causes thundering herd\n  - **[SPRING]**: Check Spring Retry configuration\n  - **[QUARKUS]**: Check `@Retry` from MicroProfile Fault Tolerance\n- **No dead-letter handling**: Failed async events with no fallback or alerting\n  - **[SPRING]**: Spring Kafka / AMQP error handlers\n  - **[QUARKUS]**: SmallRye Reactive Messaging `@Incoming` dead-letter or `nack` strategy\n\n---\n\n## Diagnostic Commands\n\n```bash\n# Common\ngit diff -- '*.java'\n\n# Build & verify\n./mvnw verify -q                             # Maven\n./gradlew check                              # Gradle\n\n# Static analysis\n./mvnw checkstyle:check\n./mvnw spotbugs:check\n./mvnw dependency-check:check                # CVE scan (OWASP plugin)\n\n# Framework detection greps\ngrep -rn \"@Autowired\" src/main/java --include=\"*.java\"          # [SPRING]\ngrep -rn \"@Inject\" src/main/java --include=\"*.java\"             # [QUARKUS]\ngrep -rn \"FetchType.EAGER\" src/main/java --include=\"*.java\"\ngrep -rn \"@Singleton\" src/main/java --include=\"*.java\"          # [QUARKUS]\ngrep -rn \"listAll\\|findAll\" src/main/java --include=\"*.java\"\ngrep -rn \"PanacheMongoEntity\\|PanacheMongoRepository\" src/main/java --include=\"*.java\"  # [QUARKUS]\n```\n\nRead `pom.xml`, `build.gradle`, or `build.gradle.kts` to determine the build tool and framework version before reviewing.\n\n## Approval Criteria\n- **Approve**: No CRITICAL or HIGH issues\n- **Warning**: MEDIUM issues only\n- **Block**: CRITICAL or HIGH issues found\n\nFund Gate rules come first: read `docs/adr/` and `GLOSSARY.md` when a finding touches the Rule Engine, the Privacy Gate or the Check Record.\n", "bytes": 12506}, {"path": ".claude/agents/privacy-gate-auditor.md", "slug": "claude-agents-privacy-gate-auditor", "title": "privacy-gate-auditor", "label": "privacy-gate-auditor", "group": "gates", "body": "---\nname: privacy-gate-auditor\ndescription: Audits a diff or module for client data that could reach an LLM, against ADR 0004. Use before merging anything that touches Intake, the Privacy Gate, the LLM egress client, the Request Parser, the Reply Drafter, the advisory lane or the Check Record, and before every rehearsal.\ntools: Read, Grep, Glob, Bash\nmodel: sonnet\n---\n\nYou audit the Fund Gate dealer app for one failure: client-identifying data reaching an external LLM. You report; you never edit.\n\nRead first: `docs/adr/0004-two-runtimes-one-llm-egress.md`, `docs/adr/0005-advisory-llm-lane-after-the-engine.md`, the \"Privacy boundary\" section of `docs/architecture.md`, and `GLOSSARY.md` for the vocabulary.\n\n## What to check\n\n1. **One egress.** Find every call to an LLM SDK or HTTP endpoint (Anthropic, `AnthropicFoundry`, Azure OpenAI, `fetch`/`RestClient`/`WebClient` to a model URL). Every one must sit inside the LLM egress client. Any other call site is a finding.\n2. **Gate-only input on the online side.** The egress client's online entry point must accept only the Privacy Gate's output type, not a raw `String` or a Client Profile.\n3. **Fail closed.** If a known client name or a Portfolio Reference the CRM does not know (`[A-Z]{3}\\d{8}`) remains after pseudonymisation, no LLM call is made. Look for catch blocks, defaults or feature flags that skip the re-scan.\n4. **Allow-list.** Fields sent per call must be a subset of the allow-list in architecture.md, and the minimum for that call. Never: client name, Portfolio Reference, address, phone, email, exact birth date, place of birth, balances.\n5. **Logged.** Each Check Record stores exactly which fields went out, the gated prompt, the response and the model id.\n6. **Swap back locally.** Portfolio Ids become Portfolio References again only after the LLM response, on our side.\n7. **Logs and errors.** Exceptions, debug logs and telemetry must not print pre-gate text.\n\n## Output\n\nA list of findings, most severe first. Each one gives `path:line`, the rule broken (1–7 above), a concrete scenario where client data leaks, and the smallest fix. If you find nothing, say which call sites you checked.\n", "bytes": 2175}, {"path": ".claude/agents/ts-build-resolver.md", "slug": "claude-agents-ts-build-resolver", "title": "Build Error Resolver", "label": "ts-build-resolver", "group": "gates", "body": "---\nname: ts-build-resolver\ndescription: \"Fixes Angular and TypeScript build and type errors with minimal diffs, no refactoring. Use when ng build, ng serve, ng test or tsc fails.\"\ntools: Read, Write, Edit, Bash, Grep, Glob\nmodel: inherit\n---\n\n\u003c!-- Vendored from ECC v2.2.3 (https://github.com/affaan-m/ECC/blob/v2.2.3/agents/build-error-resolver.md), MIT, (c) 2026 Affaan Mustafa. See .claude/THIRD_PARTY_NOTICES.md. Edited for Fund Gate. -->\n\n# Build Error Resolver\n\nYou are an expert build error resolution specialist. Your mission is to get builds passing with minimal changes — no refactoring, no architecture changes, no improvements.\n\n## Core Responsibilities\n\n1. **TypeScript Error Resolution** — Fix type errors, inference issues, generic constraints\n2. **Build Error Fixing** — Resolve compilation failures, module resolution\n3. **Dependency Issues** — Fix import errors, missing packages, version conflicts\n4. **Configuration Errors** — Resolve tsconfig and `angular.json` issues\n5. **Minimal Diffs** — Make smallest possible changes to fix errors\n6. **No Architecture Changes** — Only fix errors, don't redesign\n\n## Diagnostic Commands\n\n```bash\nnpx ng build                                    # Angular compiler errors, including templates\nnpx ng test --watch=false\nnpx tsc --noEmit --pretty -p tsconfig.app.json\nnpx eslint . --ext .ts,.tsx,.js,.jsx\n```\n\n## Workflow\n\n### 1. Collect All Errors\n- Run `npx tsc --noEmit --pretty` to get all type errors\n- Categorize: type inference, missing types, imports, config, dependencies\n- Prioritize: build-blocking first, then type errors, then warnings\n\n### 2. Fix Strategy (MINIMAL CHANGES)\nFor each error:\n1. Read the error message carefully — understand expected vs actual\n2. Find the minimal fix (type annotation, null check, import fix)\n3. Verify fix doesn't break other code — rerun tsc\n4. Iterate until build passes\n\n### 3. Common Fixes\n\n| Error | Fix |\n|-------|-----|\n| `implicitly has 'any' type` | Add type annotation |\n| `Object is possibly 'undefined'` | Optional chaining `?.` or null check |\n| `Property does not exist` | Add to interface or use optional `?` |\n| `Cannot find module` | Check tsconfig paths, install package, or fix import path |\n| `Type 'X' not assignable to 'Y'` | Parse/convert type or fix the type |\n| `Generic constraint` | Add `extends { ... }` |\n| `NG8001: 'x' is not a known element` | Add the component to the standalone component's `imports` |\n| `NG0203: inject() must be called from an injection context` | Move `inject()` to a field initialiser or constructor |\n| `NG0100: ExpressionChangedAfterItHasBeenChecked` | Derive the value with `computed()` instead of setting it after render |\n| `'await' outside async` | Add `async` keyword |\n\n## DO and DON'T\n\n**DO:**\n- Add type annotations where missing\n- Add null checks where needed\n- Fix imports/exports\n- Add missing dependencies\n- Update type definitions\n- Fix configuration files\n\n**DON'T:**\n- Refactor unrelated code\n- Change architecture\n- Rename variables (unless causing error)\n- Add new features\n- Change logic flow (unless fixing error)\n- Optimize performance or style\n\n## Priority Levels\n\n| Level | Symptoms | Action |\n|-------|----------|--------|\n| CRITICAL | Build completely broken, no dev server | Fix immediately |\n| HIGH | Single file failing, new code type errors | Fix soon |\n| MEDIUM | Linter warnings, deprecated APIs | Fix when possible |\n\n## Quick Recovery\n\n```bash\n# Nuclear option: clear all caches\nrm -rf .angular/cache && npx ng build\n\n# Reinstall dependencies\nrm -rf node_modules package-lock.json && npm install\n\n# Fix ESLint auto-fixable\nnpx eslint . --fix\n```\n\n## Success Metrics\n\n- `npx tsc --noEmit` exits with code 0\n- `npm run build` completes successfully\n- No new errors introduced\n- Minimal lines changed (\u003c 5% of affected file)\n- Tests still passing\n\n## When NOT to Use\n\n- Refactoring or architecture changes: use the `codebase-design` skill\n- Failing tests: use the `tdd` or `diagnosing-bugs` skill\n\n---\n\n**Remember**: Fix the error, verify the build passes, move on. Speed and precision over perfection.\n", "bytes": 4108}, {"path": ".claude/agents/typescript-reviewer.md", "slug": "claude-agents-typescript-reviewer", "title": "typescript-reviewer", "label": "typescript-reviewer", "group": "gates", "body": "---\nname: typescript-reviewer\ndescription: \"TypeScript and Angular code reviewer: type safety, async correctness, web security, Angular signals, change detection and templates. Use on Angular/TS changes before merging. Reports findings, never edits.\"\ntools: Read, Grep, Glob, Bash\nmodel: inherit\n---\n\n\u003c!-- Vendored from ECC v2.2.3 (https://github.com/affaan-m/ECC/blob/v2.2.3/agents/typescript-reviewer.md), MIT, (c) 2026 Affaan Mustafa. See .claude/THIRD_PARTY_NOTICES.md. Edited for Fund Gate. -->\n\nYou are a senior TypeScript engineer ensuring high standards of type-safe, idiomatic TypeScript and JavaScript.\n\nWhen invoked:\n1. Establish the review scope before commenting:\n   - For PR review, use the actual PR base branch when available (for example via `gh pr view --json baseRefName`) or the current branch's upstream/merge-base. Do not hard-code `main`.\n   - For local review, prefer `git diff --staged` and `git diff` first.\n   - If history is shallow or only a single commit is available, fall back to `git show --patch HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx'` so you still inspect code-level changes.\n2. Before reviewing a PR, inspect merge readiness when metadata is available (for example via `gh pr view --json mergeStateStatus,statusCheckRollup`):\n   - If required checks are failing or pending, stop and report that review should wait for green CI.\n   - If the PR shows merge conflicts or a non-mergeable state, stop and report that conflicts must be resolved first.\n   - If merge readiness cannot be verified from the available context, say so explicitly before continuing.\n3. Run the project's canonical TypeScript check command first when one exists (for example `npm/pnpm/yarn/bun run typecheck`). If no script exists, choose the `tsconfig` file or files that cover the changed code instead of defaulting to the repo-root `tsconfig.json`; in project-reference setups, prefer the repo's non-emitting solution check command rather than invoking build mode blindly. Otherwise use `tsc --noEmit -p \u003crelevant-config>`. Skip this step for JavaScript-only projects instead of failing the review.\n4. Run `eslint . --ext .ts,.tsx,.js,.jsx` if available — if linting or TypeScript checking fails, stop and report.\n5. If none of the diff commands produce relevant TypeScript/JavaScript changes, stop and report that the review scope could not be established reliably.\n6. Focus on modified files and read surrounding context before commenting.\n7. Begin review\n\nYou DO NOT refactor or rewrite code — you report findings only.\n\n## Review Priorities\n\n### CRITICAL -- Security\n- **Injection via `eval` / `new Function`**: User-controlled input passed to dynamic execution — never execute untrusted strings\n- **XSS**: Unsanitised user input assigned to `innerHTML`, `dangerouslySetInnerHTML`, or `document.write`\n- **SQL/NoSQL injection**: String concatenation in queries — use parameterised queries or an ORM\n- **Path traversal**: User-controlled input in `fs.readFile`, `path.join` without `path.resolve` + prefix validation\n- **Hardcoded secrets**: API keys, tokens, passwords in source — use environment variables\n- **Prototype pollution**: Merging untrusted objects without `Object.create(null)` or schema validation\n- **`child_process` with user input**: Validate and allowlist before passing to `exec`/`spawn`\n\n### HIGH -- Type Safety\n- **`any` without justification**: Disables type checking — use `unknown` and narrow, or a precise type\n- **Non-null assertion abuse**: `value!` without a preceding guard — add a runtime check\n- **`as` casts that bypass checks**: Casting to unrelated types to silence errors — fix the type instead\n- **Relaxed compiler settings**: If `tsconfig.json` is touched and weakens strictness, call it out explicitly\n\n### HIGH -- Async Correctness\n- **Unhandled promise rejections**: `async` functions called without `await` or `.catch()`\n- **Sequential awaits for independent work**: `await` inside loops when operations could safely run in parallel — consider `Promise.all`\n- **Floating promises**: Fire-and-forget without error handling in event handlers or constructors\n- **`async` with `forEach`**: `array.forEach(async fn)` does not await — use `for...of` or `Promise.all`\n\n### HIGH -- Error Handling\n- **Swallowed errors**: Empty `catch` blocks or `catch (e) {}` with no action\n- **`JSON.parse` without try/catch**: Throws on invalid input — always wrap\n- **Throwing non-Error objects**: `throw \"message\"` — always `throw new Error(\"message\")`\n- **Unhandled HTTP errors**: `HttpClient` / `httpResource` calls with no error state shown to the user\n\n### HIGH -- Idiomatic Patterns\n- **Mutable shared state**: Module-level mutable variables — prefer immutable data and pure functions\n- **`var` usage**: Use `const` by default, `let` when reassignment is needed\n- **Implicit `any` from missing return types**: Public functions should have explicit return types\n- **Callback-style async**: Mixing callbacks with `async/await` — standardise on promises\n- **`==` instead of `===`**: Use strict equality throughout\n\n### HIGH -- Node.js Specifics\n- **Synchronous fs in request handlers**: `fs.readFileSync` blocks the event loop — use async variants\n- **Missing input validation at boundaries**: No schema validation (zod, joi, yup) on external data\n- **Unvalidated `process.env` access**: Access without fallback or startup validation\n- **`require()` in ESM context**: Mixing module systems without clear intent\n\n### HIGH -- Angular\n\nCheck the project's Angular version first (`ng version` or `package.json`); the `angular-developer` skill holds the current best practices.\n\n- **Signals misuse**: `effect()` used to derive state — use `computed()` or `linkedSignal()`; writing signals inside `computed()`\n- **Manual subscriptions**: `.subscribe()` in components without `takeUntilDestroyed()` or the `async` pipe — leaks; prefer `toSignal()` / `httpResource`\n- **Old patterns in new code**: `@Input()`/`@Output()` decorators instead of `input()`/`output()`, `*ngIf`/`*ngFor` instead of `@if`/`@for`, NgModules instead of standalone components\n- **`@for` without a stable `track`**: tracking by `$index` on lists that reorder\n- **Change detection**: components not `OnPush`, or heavy method calls in templates — move them to `computed()` or a pure pipe\n- **XSS bypass**: `bypassSecurityTrust*` or `[innerHTML]` with unsanitised data\n- **Logic in templates or components** that belongs in a service; HTTP calls made directly from components\n\n### MEDIUM -- Performance\n- **N+1 queries**: Database or API calls inside loops — batch or use `Promise.all`\n- **Eager loading**: feature routes not lazy-loaded with `loadComponent` / `loadChildren`\n- **Large bundle imports**: `import _ from 'lodash'` — use named imports or tree-shakeable alternatives\n\n### MEDIUM -- Best Practices\n- **`console.log` left in production code**: Use a structured logger\n- **Magic numbers/strings**: Use named constants or enums\n- **Deep optional chaining without fallback**: `a?.b?.c?.d` with no default — add `?? fallback`\n- **Inconsistent naming**: camelCase for variables/functions, PascalCase for types/classes/components\n\n## Diagnostic Commands\n\n```bash\nnpm run typecheck --if-present       # Canonical TypeScript check when the project defines one\ntsc --noEmit -p \u003crelevant-config>    # Fallback type check for the tsconfig that owns the changed files\neslint . --ext .ts,.tsx,.js,.jsx    # Linting\nprettier --check .                  # Format check\nnpm audit                           # Dependency vulnerabilities (or the equivalent yarn/pnpm/bun audit command)\nvitest run                          # Tests (Vitest)\njest --ci                           # Tests (Jest)\n```\n\n## Approval Criteria\n\n- **Approve**: No CRITICAL or HIGH issues\n- **Warning**: MEDIUM issues only (can merge with caution)\n- **Block**: CRITICAL or HIGH issues found\n\n## Reference\n\nFund Gate rules come first: read `docs/adr/` and `GLOSSARY.md` when a finding touches the Rule Engine, the Privacy Gate or the Check Record.\n\n---\n\nReview with the mindset: \"Would this code pass review at a top TypeScript shop or well-maintained open-source project?\"\n", "bytes": 8172}, {"path": ".claude/skills/code-review/SKILL.md", "slug": "claude-skills-code-review-skill", "title": "SKILL", "label": "/code-review", "group": "skills", "body": "---\nname: code-review\ndescription: \"Review the changes since a fixed point (commit, branch, tag, or merge-base) along two axes: Standards (does the code follow this repo's documented coding standards?) and Spec (does the code match what the originating issue/spec asked for?). Runs both reviews in parallel sub-agents and reports them side by side. Use when the user wants to review a branch, a PR, work-in-progress changes, or asks to \\\"review since X\\\".\"\n---\n\nTwo-axis review of the diff between `HEAD` and a fixed point the user supplies:\n\n- **Standards**: does the code conform to this repo's documented coding standards?\n- **Spec**: does the code faithfully implement the originating issue / spec?\n\nBoth axes run as **parallel sub-agents** so they don't pollute each other's context, then this skill aggregates their findings.\n\nThe issue tracker should have been provided to you. If `docs/agents/issue-tracker.md` is missing, tell the user to run `/setup-matt-pocock-skills`.\n\n## Process\n\n### 1. Pin the fixed point\n\nWhatever the user said is the fixed point (a commit SHA, branch name, tag, `main`, `HEAD~5`, etc.). If they didn't specify one, ask for it.\n\nCapture the diff command once: `git diff \u003cfixed-point>...HEAD` (three-dot, so the comparison is against the merge-base). Also note the list of commits via `git log \u003cfixed-point>..HEAD --oneline`.\n\nBefore going further, confirm the fixed point resolves (`git rev-parse \u003cfixed-point>`) and the diff is non-empty. A bad ref or empty diff should fail here, not inside two parallel sub-agents.\n\n### 2. Identify the spec source\n\nLook for the originating spec, in this order:\n\n1. Issue references in the commit messages (`#123`, `Closes #45`, GitLab `!67`, etc.), fetched via the workflow in `docs/agents/issue-tracker.md`.\n2. A path the user passed as an argument.\n3. A spec file under `docs/`, `specs/`, or `.scratch/` matching the branch name or feature.\n4. If nothing is found, ask the user where the spec is. If they say there isn't one, the **Spec** sub-agent will skip and report \"no spec available\".\n\n### 3. Identify the standards sources\n\nAnything in the repo that documents how code should be written, such as `CODING_STANDARDS.md` or `CONTRIBUTING.md`.\n\nOn top of whatever the repo documents, the Standards axis always carries the **smell baseline** below: a fixed set of Fowler code smells (_Refactoring_, ch.3) that applies even when a repo documents nothing. Two rules bind it:\n\n- **The repo overrides.** A documented repo standard always wins; where it endorses something the baseline would flag, suppress the smell.\n- **Always a judgement call.** Each smell is a labelled heuristic (\"possible Feature Envy\"), never a hard violation. Like any standard here, skip anything tooling already enforces.\n\nEach smell reads *what it is* → *how to fix*; match it against the diff:\n\n- **Mysterious Name**: a function, variable, or type whose name doesn't reveal what it does or holds. → rename it; if no honest name comes, the design's murky.\n- **Duplicated Code**: the same logic shape appears in more than one hunk or file in the change. → extract the shared shape, call it from both.\n- **Feature Envy**: a method that reaches into another object's data more than its own. → move the method onto the data it envies.\n- **Data Clumps**: the same few fields or params keep travelling together (a type wanting to be born). → bundle them into one type, pass that.\n- **Primitive Obsession**: a primitive or string standing in for a domain concept that deserves its own type. → give the concept its own small type.\n- **Repeated Switches**: the same `switch`/`if`-cascade on the same type recurs across the change. → replace with polymorphism, or one map both sites share.\n- **Shotgun Surgery**: one logical change forces scattered edits across many files in the diff. → gather what changes together into one module.\n- **Divergent Change**: one file or module is edited for several unrelated reasons. → split so each module changes for one reason.\n- **Speculative Generality**: abstraction, parameters, or hooks added for needs the spec doesn't have. → delete it; inline back until a real need shows.\n- **Message Chains**: long `a.b().c().d()` navigation the caller shouldn't depend on. → hide the walk behind one method on the first object.\n- **Middle Man**: a class or function that mostly just delegates onward. → cut it, call the real target direct.\n- **Refused Bequest**: a subclass or implementer that ignores or overrides most of what it inherits. → drop the inheritance, use composition.\n\n### 4. Spawn both sub-agents in parallel\n\n**Standards sub-agent prompt** should include:\n\n- The full diff command and commit list.\n- The list of standards-source files you found in step 3, **plus the smell baseline from step 3** pasted in full (the sub-agent has no other access to it).\n- The brief: \"Report, per file/hunk where relevant, (a) every place the diff violates a documented standard: cite the standard (file + the rule); and (b) any baseline smell you spot: name it and quote the hunk. Distinguish hard violations from judgement calls: documented-standard breaches can be hard, but baseline smells are always judgement calls, and a documented repo standard overrides the baseline. Skip anything tooling enforces. Under 400 words.\"\n\n**Spec sub-agent prompt** should include:\n\n- The diff command and commit list.\n- The path or fetched contents of the spec.\n- The brief: \"Report: (a) requirements the spec asked for that are missing or partial; (b) behaviour in the diff that wasn't asked for (scope creep); (c) requirements that look implemented but where the implementation looks wrong. Quote the spec line for each finding. Under 400 words.\"\n\nIf the spec is missing, skip the Spec sub-agent and note this in the final report.\n\n### 5. Aggregate\n\nPresent the two reports under `## Standards` and `## Spec` headings, verbatim or lightly cleaned. Do **not** merge or rerank findings, because the two axes are deliberately separate (see _Why two axes_).\n\nEnd with a one-line summary: total findings per axis, and the worst issue _within each axis_ (if any). Don't pick a single winner across axes: that's the reranking the separation exists to prevent.\n\n## Why two axes\n\nA change can pass one axis and fail the other:\n\n- Code that follows every standard but implements the wrong thing → **Standards pass, Spec fail.**\n- Code that does exactly what the issue asked but breaks the project's conventions → **Spec pass, Standards fail.**\n\nReporting them separately stops one axis from masking the other.\n", "bytes": 6589}, {"path": ".claude/skills/diagnosing-bugs/SKILL.md", "slug": "claude-skills-diagnosing-bugs-skill", "title": "Diagnosing Bugs", "label": "/diagnosing-bugs", "group": "skills", "body": "---\nname: diagnosing-bugs\ndescription: Diagnosis loop for hard bugs and performance regressions. Use when the user says \"diagnose\"/\"debug this\", or reports something broken/throwing/failing/slow.\n---\n\n# Diagnosing Bugs\n\nA discipline for hard bugs. Skip phases only when explicitly justified.\n\nWhen exploring the codebase, read `GLOSSARY.md` (if it exists) to get a clear mental model of the relevant modules, and check ADRs in the area you're touching.\n\n## Redact\n\nThis skill has you show commands, outputs and captured artifacts. **Redact every secret first**: write `\u003cREDACTED>` in its place. Build loops against env vars, so the credential stays in the environment rather than in what you show. Captured artifacts carry auth headers: quote only the lines that carry the signal.\n\nIf the redacted output is not enough to diagnose the bug, say so and ask the user.\n\n## Phase 1: Build a feedback loop\n\n**This is the skill.** Everything else is mechanical. If you have a **tight** pass/fail signal for the bug (one that goes red on _this_ bug), you will find the cause; bisection, hypothesis-testing, and instrumentation all just consume it. If you don't have one, no amount of staring at code will save you.\n\nSpend disproportionate effort here. **Be aggressive. Be creative. Refuse to give up.**\n\n### Ways to construct one, in roughly this order\n\n1. **Failing test** at whatever seam reaches the bug: unit, integration, e2e.\n2. **Curl / HTTP script** against a running dev server.\n3. **CLI invocation** with a fixture input, diffing stdout against a known-good snapshot.\n4. **Headless browser script** (Playwright / Puppeteer) that drives the UI and asserts on DOM/console/network.\n5. **Replay a captured trace.** Save a real network request / payload / event log to disk; replay it through the code path in isolation.\n6. **Throwaway harness.** Spin up a minimal subset of the system (one service, mocked deps) that exercises the bug code path with a single function call.\n7. **Property / fuzz loop.** If the bug is \"sometimes wrong output\", run 1000 random inputs and look for the failure mode.\n8. **Bisection harness.** If the bug appeared between two known states (commit, dataset, version), automate \"boot at state X, check, repeat\" so you can `git bisect run` it.\n9. **Differential loop.** Run the same input through old-version vs new-version (or two configs) and diff outputs.\n10. **HITL bash script.** Last resort. If a human must click, drive _them_ with `scripts/hitl-loop.template.sh` so the loop is still structured. Captured output feeds back to you.\n\nBuild the right feedback loop, and the bug is 90% fixed.\n\n### Tighten the loop\n\nTreat the loop as a product. Once you have _a_ loop, **tighten** it:\n\n- Can I make it faster? (Cache setup, skip unrelated init, narrow the test scope.)\n- Can I make the signal sharper? (Assert on the specific symptom, not \"didn't crash\".)\n- Can I make it more deterministic? (Pin time, seed RNG, isolate filesystem, freeze network.)\n\nA 30-second flaky loop is barely better than no loop; a 2-second deterministic one is tight, a debugging superpower.\n\n### Non-deterministic bugs\n\nThe goal is not a clean repro but a **higher reproduction rate**. Loop the trigger 100×, parallelise, add stress, narrow timing windows, inject sleeps. A 50%-flake bug is debuggable; 1% is not, so keep raising the rate until it's debuggable.\n\n### When you genuinely cannot build a loop\n\nStop and say so explicitly. List what you tried. Ask the user for: (a) access to whatever environment reproduces it, (b) a redacted captured artifact (HAR file, log dump, core dump, screen recording with timestamps), or (c) permission to add temporary production instrumentation. Do **not** proceed to hypothesise without a loop.\n\n### Completion criterion: a tight loop that goes red\n\nPhase 1 is done when the loop is **tight** and **red-capable**: you can name **one command** (a script path, a test invocation, a curl) that you have **already run at least once** (show the invocation and its output, redacted), and that is:\n\n- [ ] **Red-capable**: it drives the actual bug code path and asserts the **user's exact symptom**, so it can go red on this bug and green once fixed. Not \"runs without erroring\"; it must be able to _catch this specific bug_.\n- [ ] **Deterministic**: same verdict every run (flaky bugs: a pinned, high reproduction rate, per above).\n- [ ] **Fast**: seconds, not minutes.\n- [ ] **Agent-runnable**: you can run it unattended; a human in the loop only via `scripts/hitl-loop.template.sh`.\n\nIf you catch yourself reading code to build a theory before this command exists, **stop: jumping straight to a hypothesis is the exact failure this skill prevents.** No red-capable command, no Phase 2.\n\n## Phase 2: Reproduce + minimise\n\nRun the loop. Watch it go red as the bug appears.\n\nConfirm:\n\n- [ ] The loop produces the failure mode the **user** described, not a different failure that happens to be nearby. Wrong bug = wrong fix.\n- [ ] The failure is reproducible across multiple runs (or, for non-deterministic bugs, reproducible at a high enough rate to debug against).\n- [ ] You have captured the exact symptom (error message, wrong output, slow timing) so later phases can verify the fix actually addresses it.\n\n### Minimise\n\nOnce it's red, shrink the repro to the **smallest scenario that still goes red**. Cut inputs, callers, config, data, and steps **one at a time**, re-running the loop after each cut, and keep only what's load-bearing for the failure.\n\nWhy bother: a minimal repro shrinks the hypothesis space in Phase 3 (fewer moving parts left to suspect) and becomes the clean regression test in Phase 5.\n\nDone when **every remaining element is load-bearing**: removing any one of them makes the loop go green.\n\nDo not proceed until you have reproduced **and** minimised.\n\n## Phase 3: Hypothesise\n\nGenerate **3–5 ranked hypotheses** before testing any of them. Single-hypothesis generation anchors on the first plausible idea.\n\nEach hypothesis must be **falsifiable**: state the prediction it makes.\n\n> Format: \"If \u003cX> is the cause, then \u003cchanging Y> will make the bug disappear / \u003cchanging Z> will make it worse.\"\n\nIf you cannot state the prediction, the hypothesis is a vibe: discard or sharpen it.\n\n**Show the ranked list to the user before testing.** They often have domain knowledge that re-ranks instantly (\"we just deployed a change to #3\"), or know hypotheses they've already ruled out. Cheap checkpoint, big time saver. Don't block on it; proceed with your ranking if the user is AFK.\n\n## Phase 4: Instrument\n\nEach probe must map to a specific prediction from Phase 3. **Change one variable at a time.**\n\nTool preference:\n\n1. **Debugger / REPL inspection** if the env supports it. One breakpoint beats ten logs.\n2. **Targeted logs** at the boundaries that distinguish hypotheses.\n3. Never \"log everything and grep\".\n\n**Tag every debug log** with a unique prefix, e.g. `[DEBUG-a4f2]`. Cleanup at the end becomes a single grep. Untagged logs survive; tagged logs die.\n\n**Perf branch.** For performance regressions, logs are usually wrong. Instead: establish a baseline measurement (timing harness, `performance.now()`, profiler, query plan), then bisect. Measure first, fix second.\n\n## Phase 5: Fix + regression test\n\nWrite the regression test **before the fix**, but only if there is a **correct seam** for it.\n\nA correct seam is one where the test exercises the **real bug pattern** as it occurs at the call site. If the only available seam is too shallow (single-caller test when the bug needs multiple callers, unit test that can't replicate the chain that triggered the bug), a regression test there gives false confidence.\n\n**If no correct seam exists, that itself is the finding.** Note it. The codebase architecture is preventing the bug from being locked down. Flag this for the next phase.\n\nIf a correct seam exists:\n\n1. Turn the minimised repro into a failing test at that seam.\n2. Watch it fail.\n3. Apply the fix.\n4. Watch it pass.\n5. Re-run the Phase 1 feedback loop against the original (un-minimised) scenario.\n\n## Phase 6: Cleanup\n\nRequired before declaring done:\n\n- [ ] Original repro no longer reproduces (re-run the Phase 1 loop)\n- [ ] Regression test passes (or absence of seam is documented)\n- [ ] All `[DEBUG-...]` instrumentation removed (`grep` the prefix)\n- [ ] Throwaway prototypes deleted (or moved to a clearly-marked debug location)\n- [ ] The hypothesis that turned out correct is stated in the commit / PR message, so the next debugger learns\n", "bytes": 8530}, {"path": ".claude/skills/domain-modeling/ADR-FORMAT.md", "slug": "claude-skills-domain-modeling-adr-format", "title": "ADR Format", "label": "/domain-modeling · ADR-FORMAT", "group": "skills", "body": "# ADR Format\n\nADRs live in `docs/adr/` and use sequential numbering: `0001-slug.md`, `0002-slug.md`, etc.\n\nCreate the `docs/adr/` directory lazily: only when the first ADR is needed.\n\n## Template\n\n```md\n# {Short title of the decision}\n\n{1-3 sentences: what's the context, what did we decide, and why.}\n```\n\nThat's it. An ADR can be a single paragraph. The value is in recording *that* a decision was made and *why*, not in filling out sections.\n\n## Optional sections\n\nOnly include these when they add genuine value. Most ADRs won't need them.\n\n- **Status** frontmatter (`proposed | accepted | deprecated | superseded by ADR-NNNN`): useful when decisions are revisited\n- **Considered Options**: only when the rejected alternatives are worth remembering\n- **Consequences**: only when non-obvious downstream effects need to be called out\n\n## Numbering\n\nScan `docs/adr/` for the highest existing number and increment by one.\n\n## When to offer an ADR\n\nAll three of these must be true:\n\n1. **Hard to reverse**: the cost of changing your mind later is meaningful\n2. **Surprising without context**: a future reader will look at the code and wonder \"why on earth did they do it this way?\"\n3. **The result of a real trade-off**: there were genuine alternatives and you picked one for specific reasons\n\nIf a decision is easy to reverse, skip it: you'll just reverse it. If it's not surprising, nobody will wonder why. If there was no real alternative, there's nothing to record beyond \"we did the obvious thing.\"\n\n### What qualifies\n\n- **Architectural shape.** \"We're using a monorepo.\" \"The write model is event-sourced, the read model is projected into Postgres.\"\n- **Integration patterns between contexts.** \"Ordering and Billing communicate via domain events, not synchronous HTTP.\"\n- **Technology choices that carry lock-in.** Database, message bus, auth provider, deployment target. Not every library: just the ones that would take a quarter to swap out.\n- **Boundary and scope decisions.** \"Customer data is owned by the Customer context; other contexts reference it by ID only.\" The explicit no-s are as valuable as the yes-s.\n- **Deliberate deviations from the obvious path.** \"We're using manual SQL instead of an ORM because X.\" Anything where a reasonable reader would assume the opposite. These stop the next engineer from \"fixing\" something that was deliberate.\n- **Constraints not visible in the code.** \"We can't use AWS because of compliance requirements.\" \"Response times must be under 200ms because of the partner API contract.\"\n- **Rejected alternatives when the rejection is non-obvious.** If you considered GraphQL and picked REST for subtle reasons, record it; otherwise someone will suggest GraphQL again in six months.\n", "bytes": 2733}, {"path": ".claude/skills/domain-modeling/GLOSSARY-FORMAT.md", "slug": "claude-skills-domain-modeling-glossary-format", "title": "GLOSSARY.md Format", "label": "/domain-modeling · GLOSSARY-FORMAT", "group": "skills", "body": "# GLOSSARY.md Format\n\n## Structure\n\n```md\n# {Context Name}\n\n{One or two sentence description of what this context is and why it exists.}\n\n## Language\n\n**Order**:\n{A one or two sentence description of the term}\n_Avoid_: Purchase, transaction\n\n**Invoice**:\nA request for payment sent to a customer after delivery.\n_Avoid_: Bill, payment request\n\n**Customer**:\nA person or organization that places orders.\n_Avoid_: Client, buyer, account\n```\n\n## Rules\n\n- **Be opinionated.** When multiple words exist for the same concept, pick the best one and list the others under `_Avoid_`.\n- **Keep definitions tight.** One or two sentences max. Define what it IS, not what it does.\n- **Only include terms specific to this project's context.** General programming concepts (timeouts, error types, utility patterns) don't belong even if the project uses them extensively. Before adding a term, ask: is this a concept unique to this context, or a general programming concept? Only the former belongs.\n- **Group terms under subheadings** when natural clusters emerge. If all terms belong to a single cohesive area, a flat list is fine.\n\n## Single vs multi-context repos\n\n**Single context (most repos):** One `GLOSSARY.md` at the repo root.\n\n**Multiple contexts:** A `GLOSSARY-MAP.md` at the repo root lists the contexts, where they live, and how they relate to each other:\n\n```md\n# Glossary Map\n\n## Contexts\n\n- [Ordering](./src/ordering/GLOSSARY.md): receives and tracks customer orders\n- [Billing](./src/billing/GLOSSARY.md): generates invoices and processes payments\n- [Fulfillment](./src/fulfillment/GLOSSARY.md): manages warehouse picking and shipping\n\n## Relationships\n\n- **Ordering → Fulfillment**: Ordering emits `OrderPlaced` events; Fulfillment consumes them to start picking\n- **Fulfillment → Billing**: Fulfillment emits `ShipmentDispatched` events; Billing consumes them to generate invoices\n- **Ordering ↔ Billing**: Shared types for `CustomerId` and `Money`\n```\n\nThe skill infers which structure applies:\n\n- If `GLOSSARY-MAP.md` exists, read it to find contexts\n- If only a root `GLOSSARY.md` exists, single context\n- If neither exists, create a root `GLOSSARY.md` lazily when the first term is resolved\n\nWhen multiple contexts exist, infer which one the current topic relates to. If unclear, ask.\n", "bytes": 2300}, {"path": ".claude/skills/domain-modeling/SKILL.md", "slug": "claude-skills-domain-modeling-skill", "title": "Domain Modeling", "label": "/domain-modeling", "group": "skills", "body": "---\nname: domain-modeling\ndescription: Build and sharpen a project's domain model. Use when discussing codebase terminology, writing or editing a GLOSSARY.md, or recording or editing an ADR.\n---\n\n# Domain Modeling\n\nActively build and sharpen the project's domain model as you design. This is the *active* discipline: challenging terms, inventing edge-case scenarios, and writing the glossary and decisions down the moment they crystallise. (Merely *reading* `GLOSSARY.md` for vocabulary is not this skill: that's a one-line habit any skill can do. This skill is for when you're changing the model, not just consuming it.)\n\n## File structure\n\nMost repos have a single context:\n\n```\n/\n├── GLOSSARY.md\n├── docs/\n│   └── adr/\n│       ├── 0001-event-sourced-orders.md\n│       └── 0002-postgres-for-write-model.md\n└── src/\n```\n\nIf a `GLOSSARY-MAP.md` exists at the root, the repo has multiple contexts. The map points to where each one lives:\n\n```\n/\n├── GLOSSARY-MAP.md\n├── docs/\n│   └── adr/                          ← system-wide decisions\n├── src/\n│   ├── ordering/\n│   │   ├── GLOSSARY.md\n│   │   └── docs/adr/                 ← context-specific decisions\n│   └── billing/\n│       ├── GLOSSARY.md\n│       └── docs/adr/\n```\n\nCreate files lazily: only when you have something to write. If no `GLOSSARY.md` exists, create one when the first term is resolved. If no `docs/adr/` exists, create it when the first ADR is needed.\n\n## During the session\n\n### Challenge against the glossary\n\nWhen the user uses a term that conflicts with the existing language in `GLOSSARY.md`, call it out immediately. \"Your glossary defines 'cancellation' as X, but you seem to mean Y. Which is it?\"\n\n### Sharpen fuzzy language\n\nWhen the user uses vague or overloaded terms, propose a precise canonical term. \"You're saying 'account': do you mean the Customer or the User? Those are different things.\"\n\n### Discuss concrete scenarios\n\nWhen domain relationships are being discussed, stress-test them with specific scenarios. Invent scenarios that probe edge cases and force the user to be precise about the boundaries between concepts.\n\n### Cross-reference with code\n\nWhen the user states how something works, check whether the code agrees. If you find a contradiction, surface it: \"Your code cancels entire Orders, but you just said partial cancellation is possible. Which is right?\"\n\n### Update GLOSSARY.md inline\n\nWhen a term is resolved, update `GLOSSARY.md` right there. Don't batch these up: capture them as they happen. Use the format in [GLOSSARY-FORMAT.md](./GLOSSARY-FORMAT.md).\n\n`GLOSSARY.md` should be totally devoid of implementation details. Do not treat `GLOSSARY.md` as a spec, a scratch pad, or a repository for implementation decisions. It is a glossary and nothing else.\n\n### Offer ADRs sparingly\n\nOnly offer to create an ADR when all three are true:\n\n1. **Hard to reverse**: the cost of changing your mind later is meaningful\n2. **Surprising without context**: a future reader will wonder \"why did they do it this way?\"\n3. **The result of a real trade-off**: there were genuine alternatives and you picked one for specific reasons\n\nIf any of the three is missing, skip the ADR. Use the format in [ADR-FORMAT.md](./ADR-FORMAT.md).\n", "bytes": 3346}, {"path": ".claude/skills/grill-with-docs/SKILL.md", "slug": "claude-skills-grill-with-docs-skill", "title": "SKILL", "label": "/grill-with-docs", "group": "skills", "body": "---\nname: grill-with-docs\ndescription: A relentless interview to sharpen a plan or design, which also creates docs (ADR's and glossary) as we go.\ndisable-model-invocation: true\n---\n\nCall the Skill tool twice, for \"grilling\" and \"domain-modeling\".\n", "bytes": 247}, {"path": ".claude/skills/grilling/SKILL.md", "slug": "claude-skills-grilling-skill", "title": "SKILL", "label": "/grilling", "group": "skills", "body": "---\nname: grilling\ndescription: Grill the user relentlessly about a plan, decision, or idea. Use when the user wants to stress-test their thinking, or uses any 'grill' trigger phrases.\n---\n\nInterview the user relentlessly until you reach a shared understanding. Map this as a **design tree**: every decision branches into the decisions that hang off it.\n\nWork the tree in **rounds**. The **frontier** is every decision whose prerequisites are already settled: the questions you can ask _now_ without guessing at answers you haven't heard yet. Ask the whole frontier in one round: number each question and give your recommended answer. Then wait for the user's answers before the next round.\n\nFormat a round like so:\n\n```\n❓ **Q1** - **\u003cquestion title>**: \u003cquestion body, might be multiple paragraphs, including multiple choices>\n\n➡️ \u003cyour recommended answer>\n\n---\n\n❓ **Q2** - **\u003cquestion title>**: \u003cquestion body, might be multiple paragraphs, including multiple choices>\n\n➡️ \u003cyour recommended answer>\n```\n\nEach round the user answers reshapes the tree: settled decisions push the frontier outward and unblock questions that depended on them. Recompute the frontier and ask the next round. A question whose answer depends on another question still open in this round belongs to a _later_ round, not this one.\n\nFinding _facts_ is your job, never the user's. When a frontier question needs a fact from the environment (filesystem, tools, etc.), dispatch a sub-agent to find it; don't ask the user for anything you could look up yourself. Don't block on it: a running exploration is an unsettled prerequisite, so only the questions downstream of it wait for the sub-agent to report; ask the rest of the frontier now. The _decisions_ are the user's: put each to them and wait.\n\nThe session is done when the frontier is empty: every branch of the design tree visited, nothing left silently assumed. Do not act on it until the user confirms you have reached a shared understanding.\n", "bytes": 1987}, {"path": ".claude/skills/implement/SKILL.md", "slug": "claude-skills-implement-skill", "title": "SKILL", "label": "/implement", "group": "skills", "body": "---\nname: implement\ndescription: \"Implement a piece of work based on a spec or set of tickets.\"\ndisable-model-invocation: true\n---\n\nImplement the work described by the user in the spec or tickets.\n\nUse /tdd where possible, at pre-agreed seams.\n\nRun typechecking regularly, single test files regularly, and the full test suite once at the end.\n\nOnce done, use /code-review to review the work.\n\nCommit your work to the current branch.\n", "bytes": 433}, {"path": ".claude/skills/prototype/LOGIC.md", "slug": "claude-skills-prototype-logic", "title": "Logic Prototype", "label": "/prototype · LOGIC", "group": "skills", "body": "# Logic Prototype\n\nA single, self-contained HTML file (a **shareable demo**) that lets anyone drive a state model by clicking buttons. Use this when the question is about **business logic, state transitions, or data shape**: the kind of thing that looks reasonable on paper but only feels wrong once you push it through real cases.\n\nBecause it's one file with nothing to install, you can hand it to a non-developer (a designer, a PM, a domain expert) and let them feel the model for themselves. So it speaks their language, not the code's.\n\n## When this is the right shape\n\n- \"I'm not sure if this state machine handles the edge case where X then Y.\"\n- \"Does this data model actually let me represent the case where...\"\n- \"I want to feel out what the API should look like before writing it.\"\n- Anything where someone wants to **press buttons and watch state change**.\n\nIf the question is \"what should this look like,\" this is the wrong branch. Use [UI.md](UI.md).\n\n## Process\n\n### 1. State the question\n\nBefore writing code, write down what state model and what question you're prototyping. One paragraph, at the top of the demo (in a visible intro, not just a comment). A logic prototype that answers the wrong question is pure waste, so make the question explicit so it can be checked later, whether the user is watching now or returning to it AFK.\n\n### 2. Isolate the logic in a portable module\n\nPut the actual logic (the bit that's answering the question) in a single `\u003cscript>` block written as a small, pure module that could be lifted out and dropped into the real codebase later. The page around it is throwaway; this module isn't.\n\nThe right shape depends on the question:\n\n- **A pure reducer**: `(state, action) => state`. Good when actions are discrete events and state is a single value.\n- **A state machine**: explicit states and transitions. Good when \"which actions are even legal right now\" is part of the question.\n- **A small set of pure functions** over a plain data type. Good when there's no implicit current state, just transformations.\n- **A class or module with a clear method surface** when the logic genuinely owns ongoing internal state.\n\nPick whichever shape best fits the question being asked, *not* whichever is easiest to wire to a page. Keep it pure: no DOM, no `document`, no button handlers reaching inside it. The page calls into it; nothing flows the other direction. This is what makes the prototype useful past its own lifetime: once the question's answered, the validated reducer / machine / function set lifts into the real module on its own.\n\n### 3. Build the shareable HTML file\n\nOne file, plain HTML/CSS/JS: no framework, no bundler, no server, everything inline so it opens by double-click and survives being emailed around. Anyone should be able to run it by opening it.\n\nWrite it for a non-developer. Every label is in **domain language**, not code: buttons and state read like the business, not the reducer. Explain in plain words what's happening.\n\nLay it out with a clean hierarchy, top to bottom:\n\n1. **Title and one-line explanation** of what this demo lets you explore (the question from step 1).\n2. **Current state**: the full relevant state, rendered as a readable panel (labelled fields, not a raw JSON dump), re-rendered after every click so the change is visible. Where it helps a non-developer follow, call out what just changed.\n3. **Free-play buttons**: one button per action, always available, so anyone can poke at the model in any order. Each click dispatches its action and re-renders the state.\n4. **Guided walkthroughs**: a set of **scenarios**, one per tab. Each tab holds a short plain-language description of the scenario (the situation it sets up and what to watch for) and underneath it, the ordered **buttons to press** for that scenario. Each step is a real button: clicking it performs that action and moves to the next step. Starting a walkthrough resets to a known initial state so the scenario runs the same way every time.\n\nChoose scenarios that demonstrate the awkward cases, the ones hard to reason about on paper: the happy path, a tricky edge case, an attempt at something that should be illegal.\n\nKeep it beautiful but restrained: clean typography, generous spacing, one accent colour. No animations, no gimmicks: nothing that competes with the state and the buttons.\n\n### 4. Hand it over\n\nSend them the file, or open it for them. They'll click through the walkthroughs and free-play whenever they get to it; the interesting moments are when they say \"wait, that shouldn't be possible\" or \"huh, I assumed X would be different\"; those are the bugs in the _idea_, which is the whole point. If they want new actions or a new scenario, add them. Prototypes evolve.\n\n### 5. Capture the answer and the prototype\n\nOnce the prototype has answered its question, capture the answer, then capture the prototype the way the [SKILL](SKILL.md) describes. The logic-specific mapping: the validated reducer / machine / function set lifts into the real module (the decision, absorbed); the HTML shell rides along to the throwaway branch that keeps the prototype as a primary source, and being one self-contained file, it stays trivially re-runnable there.\n\n## Anti-patterns\n\n- **Don't add tests.** A prototype that needs tests is no longer a prototype.\n- **Don't wire it to the real database.** Use in-memory state unless the question is specifically about persistence.\n- **Don't generalise.** No \"what if we wanted to support X later.\" The prototype answers one question.\n- **Don't blur the logic and the page together.** If the pure module references the DOM, `document`, or button handlers, it's no longer liftable. Keep the page as a thin shell over a pure module.\n- **Don't reach for a framework, bundler, or server.** One file the recipient double-clicks; a React app or a dev server defeats \"shareable\".\n- **Don't ship the HTML shell into production.** The page is optimised for being clicked through by hand. The logic module behind it is the bit worth keeping.\n", "bytes": 6036}, {"path": ".claude/skills/prototype/SKILL.md", "slug": "claude-skills-prototype-skill", "title": "Prototype", "label": "/prototype", "group": "skills", "body": "---\nname: prototype\ndescription: Build a throwaway prototype to answer a design question. Use when the user wants to sanity-check whether a state model or logic feels right, or explore what a UI should look like.\n---\n\n# Prototype\n\nA prototype is **throwaway code that answers a question**. The question decides the shape.\n\n## Pick a branch\n\nIdentify which question is being answered, using the user's prompt, the surrounding code, or by asking if the user is around:\n\n- **\"Does this logic / state model feel right?\"** → [LOGIC.md](LOGIC.md). Build a single shareable HTML file (free-play buttons plus tabbed guided walkthroughs) that pushes the state machine through cases that are hard to reason about on paper, and that a non-developer can drive.\n- **\"What should this look like?\"** → [UI.md](UI.md). Generate several radically different UI variations on a single route, switchable via a URL search param and a floating bottom bar.\n\nThe two branches produce very different artifacts, so getting this wrong wastes the whole prototype. If the question is genuinely ambiguous and the user isn't reachable, default to whichever branch better matches the surrounding code (a backend module → logic; a page or component → UI) and state the assumption at the top of the prototype.\n\n## Rules that apply to both\n\n1. **Throwaway from day one, and clearly marked as such.** Locate the prototype code close to where it will actually be used (next to the module or page it's prototyping for) so context is obvious, but name it so a casual reader can see it's a prototype, not production. For throwaway UI routes, obey whatever routing convention the project already uses; don't invent a new top-level structure.\n2. **Trivial to run.** A UI prototype starts from one command in the project's task runner: `pnpm \u003cname>`, `python \u003cpath>`, `bun \u003cpath>`, etc. A logic demo is a single HTML file the user double-clicks. Either way, no thinking required to start it.\n3. **No persistence by default.** State lives in memory. Persistence is the thing the prototype is _checking_, not something it should depend on. If the question explicitly involves a database, hit a scratch DB or a local file with a clear \"PROTOTYPE, wipe me\" name.\n4. **Skip the polish.** No tests, no error handling beyond what makes the prototype _runnable_, no abstractions. The point is to learn something fast.\n5. **Surface the state.** After every action (logic) or on every variant switch (UI), print or render the full relevant state so the user can see what changed.\n6. **Capture it when done.** Fold any validated decision into the real code, then capture the prototype itself as a **primary source**: commit it to a throwaway branch, out of main, and leave a context pointer to that branch on the implementation issue. Capture the answer too (the verdict and the question it settled) in the issue or a commit. The main branch keeps only the validated decision.\n", "bytes": 2931}, {"path": ".claude/skills/prototype/UI.md", "slug": "claude-skills-prototype-ui", "title": "UI Prototype", "label": "/prototype · UI", "group": "skills", "body": "# UI Prototype\n\nGenerate **several radically different UI variations** on a single route, switchable from a floating bottom bar. The user flips between variants in the browser, picks one (or steals bits from each), then throws the rest away.\n\nIf the question is about logic/state rather than what something looks like, this is the wrong branch. Use [LOGIC.md](LOGIC.md).\n\n## When this is the right shape\n\n- \"What should this page look like?\"\n- \"I want to see a few options for this dashboard before committing.\"\n- \"Try a different layout for the settings screen.\"\n- Any time the user would otherwise spend a day picking between three vague mockups in their head.\n\n## Two sub-shapes: strongly prefer sub-shape A\n\nA UI prototype is much easier to judge when it's **butting up against the rest of the app**: real header, real sidebar, real data, real density. A throwaway route on its own is a vacuum: every variant looks fine in isolation. Default to sub-shape A whenever there's a plausible existing page to host the variants. Only reach for sub-shape B if the prototype genuinely has no nearby home.\n\n### Sub-shape A: adjustment to an existing page (preferred)\n\nThe route already exists. Variants are rendered **on the same route**, gated by a `?variant=` URL search param. The existing data fetching, params, and auth all stay. Only the rendering swaps. This is the default; pick it unless there's a specific reason not to.\n\nIf the prototype is for something that doesn't yet have a page but *would naturally live inside one* (a new section of the dashboard, a new card on the settings screen, a new step in an existing flow), it's still sub-shape A. Mount the variants inside the host page.\n\n### Sub-shape B: a new page (last resort)\n\nOnly use this when the thing being prototyped genuinely has no existing page to live inside (e.g. an entirely new top-level surface, or a flow that can't be embedded anywhere sensible).\n\nCreate a **throwaway route** following whatever routing convention the project already uses. Don't invent a new top-level structure. Name it so it's obviously a prototype (e.g. include the word `prototype` in the path or filename). Same `?variant=` pattern.\n\nBefore committing to sub-shape B, sanity-check: is there really no existing page this could be embedded in? An empty route hides design problems that a populated one would expose.\n\nIn both sub-shapes the floating bottom bar is identical.\n\n## Process\n\n### 1. State the question and pick N\n\nDefault to **3 variants**. More than 5 stops being radically different and starts being noise, so cap there.\n\nWrite down the plan in one line, in the prototype's location or a top-of-file comment:\n\n> \"Three variants of the settings page, switchable via `?variant=`, on the existing `/settings` route.\"\n\nThis works whether the user is here to push back or not.\n\n### 2. Generate radically different variants\n\nDraft each variant. Hold each one to:\n\n- The page's purpose and the data it has access to.\n- The project's component library / styling system (TailwindCSS, shadcn, MUI, plain CSS, whatever).\n- A clear exported component name, e.g. `VariantA`, `VariantB`, `VariantC`.\n\nVariants must be **structurally different**: different layout, different information hierarchy, different primary affordance, not just different colours. Three slightly-tweaked card grids isn't a UI prototype, it's wallpaper. If two drafts come out too similar, redo one with explicit \"do not use a card grid\" guidance.\n\n### 3. Wire them together\n\nCreate a single switcher component on the route:\n\n```tsx\n// pseudo-code, adapt to the project's framework\nconst variant = searchParams.get('variant') ?? 'A';\nreturn (\n  \u003c>\n    {variant === 'A' && \u003cVariantA {...data} />}\n    {variant === 'B' && \u003cVariantB {...data} />}\n    {variant === 'C' && \u003cVariantC {...data} />}\n    \u003cPrototypeSwitcher variants={['A','B','C']} current={variant} />\n  \u003c/>\n);\n```\n\nFor sub-shape A (existing page): keep all the existing data fetching above the switcher; only the rendered subtree changes per variant.\n\nFor sub-shape B (new page): the throwaway route under `/prototype/\u003cname>` mounts the same switcher.\n\n### 4. Build the floating switcher\n\nA small fixed-position bar at the bottom-centre of the screen with three pieces:\n\n- **Left arrow**: cycles to the previous variant (wraps around).\n- **Variant label**: shows the current variant key and, if the variant exports a name, that name too. e.g. `B (Sidebar layout)`.\n- **Right arrow**: cycles forward (wraps around).\n\nBehaviour:\n\n- Clicking an arrow updates the URL search param (use the framework's router, e.g. `router.replace` on Next, `navigate` on React Router, etc) so the variant is shareable and reload-stable.\n- Keyboard: `←` and `→` arrow keys also cycle. Don't intercept arrow keys when an `\u003cinput>`, `\u003ctextarea>`, or `[contenteditable]` is focused.\n- Visually distinct from the page (e.g. high-contrast pill, subtle shadow) so it's obviously not part of the design being evaluated.\n- Hidden in production builds: gate on `process.env.NODE_ENV !== 'production'` or an equivalent check, so a stray prototype merge can't ship the bar to users.\n\nPut the switcher in a single shared component so both sub-shapes can reuse it. Locate it wherever shared UI lives in the project.\n\n### 5. Hand it over\n\nSurface the URL (and the `?variant=` keys). The user will flip through whenever they get to it. The interesting feedback is usually **\"I want the header from B with the sidebar from C\"**, which is the actual design they want.\n\n### 6. Capture the answer and clean up\n\nOnce a variant has won, capture the answer (which variant and why), then capture the prototype the way the [SKILL](SKILL.md) describes. Fold the winner into the real code and move the rest onto the throwaway branch, not into main:\n\n- **Sub-shape A**: fold the winner into the existing page; drop the losing variants and the switcher from main.\n- **Sub-shape B**: promote the winning variant to a real route; drop the throwaway route and the switcher from main.\n\nThe full set of variants is the primary source, so it lands on the throwaway branch, not the bin, since variant components and the switcher left in the main branch rot fast and confuse the next reader.\n\n## Anti-patterns\n\n- **Variants that differ only in colour or copy.** That's a tweak, not a prototype. Real variants disagree about structure.\n- **Sharing too much code between variants.** A shared `\u003cHeader>` is fine; a shared `\u003cLayout>` defeats the point. Each variant should be free to throw out the layout.\n- **Wiring variants to real mutations.** Read-only prototypes are fine. If a variant needs to mutate, point it at a stub: the question is \"what should this look like\", not \"does the backend work\".\n- **Promoting the prototype directly to production.** The variant code was written under prototype constraints (no tests, minimal error handling). Rewrite it properly when you fold it in.\n", "bytes": 6913}, {"path": ".claude/skills/research/SKILL.md", "slug": "claude-skills-research-skill", "title": "SKILL", "label": "/research", "group": "skills", "body": "---\nname: research\ndescription: Investigate a question against high-trust primary sources and capture the findings as a Markdown file in the repo. Use when the user wants a topic researched, docs or API facts gathered, or reading legwork delegated to a background agent.\n---\n\nSpin up a **background agent** to do the research, so you keep working while it reads.\n\nIts job:\n\n1. Investigate the question against **primary sources** (official docs, source code, specs, first-party APIs), not a secondary write-up of them. Follow every claim back to the source that owns it.\n2. Write the findings to a single Markdown file, citing each claim's source.\n3. Save it where the repo already keeps such notes; match the existing convention, and if there is none, put it somewhere sensible and say where.\n", "bytes": 794}, {"path": ".claude/skills/tdd/SKILL.md", "slug": "claude-skills-tdd-skill", "title": "Test-Driven Development", "label": "/tdd", "group": "skills", "body": "---\nname: tdd\ndescription: Test-driven development. Use when the user wants to build features or fix bugs test-first, mentions \"red-green-refactor\", or wants integration tests.\n---\n\n# Test-Driven Development\n\nTDD is the red → green loop. This skill is the reference that makes that loop produce tests worth keeping: what a good test is, where tests go, the anti-patterns, and the rules of the loop. Every section applies on every cycle: consult them before and during the loop, not after.\n\nWhen exploring the codebase, read `GLOSSARY.md` (if it exists) so test names and interface vocabulary match the project's domain language, and respect ADRs in the area you're touching.\n\n## What a good test is\n\nTests verify behavior through public interfaces, not implementation details. Code can change entirely; tests shouldn't. A good test reads like a specification: \"user can checkout with valid cart\" tells you exactly what capability exists, and it survives refactors because it doesn't care about internal structure.\n\nSee [tests.md](tests.md) for examples and [mocking.md](mocking.md) for mocking guidelines.\n\n## Seams: where tests go\n\nA **seam** is the public boundary you test at: the interface where you observe behavior without reaching inside. Tests live at seams, never against internals.\n\n**Test only at pre-agreed seams.** Before writing any test, write down the seams under test and confirm them with the user. No test is written at an unconfirmed seam. You can't test everything, so agreeing the seams up front is how testing effort lands on the critical paths and complex logic instead of every edge case.\n\nAsk: \"What's the public interface, and which seams should we test?\"\n\nWhen the shape of that interface is itself in question (how deep the module is, where the seam belongs, what the interface should expose), call the Skill tool with \"codebase-design\" for the vocabulary. It is the shared source of the module, interface, depth, seam, adapter, leverage and locality terms, and it is a reference to consult, not a session to run.\n\n## Anti-patterns\n\n- **Implementation-coupled**: mocks internal collaborators, tests private methods, or verifies through a side channel (querying the database instead of using the interface). The tell: the test breaks when you refactor but behavior hasn't changed.\n- **Tautological**: the assertion recomputes the expected value the way the code does (`expect(add(a, b)).toBe(a + b)`, a snapshot derived by hand the same way, a constant asserted equal to itself), so it passes by construction and can never disagree with the code. Expected values must come from an independent source of truth: a known-good literal, a worked example, the spec.\n- **Horizontal slicing**: writing all tests first, then all implementation. Bulk tests verify _imagined_ behavior: you test the _shape_ of things rather than user-facing behavior, the tests go insensitive to real changes, and you commit to test structure before understanding the implementation. Work in **vertical slices** instead: one test → one implementation → repeat, each test a **tracer bullet** that responds to what the last cycle taught you.\n\n## Rules of the loop\n\n- **Red before green.** Write the failing test first, then only enough code to pass it. Don't anticipate future tests or add speculative features.\n- **One slice at a time.** One seam, one test, one minimal implementation per cycle.\n- **Refactoring is not part of the loop.** It belongs to the review stage (see the `code-review` skill), not the red → green implementation cycle.\n", "bytes": 3550}, {"path": ".claude/skills/tdd/mocking.md", "slug": "claude-skills-tdd-mocking", "title": "When to Mock", "label": "/tdd · mocking", "group": "skills", "body": "# When to Mock\n\nMock at **system boundaries** only:\n\n- External APIs (payment, email, etc.)\n- Databases (sometimes - prefer test DB)\n- Time/randomness\n- File system (sometimes)\n\nDon't mock:\n\n- Your own classes/modules\n- Internal collaborators\n- Anything you control\n\n## Designing for Mockability\n\nAt system boundaries, design interfaces that are easy to mock:\n\n**1. Use dependency injection**\n\nPass external dependencies in rather than creating them internally:\n\n```typescript\n// Easy to mock\nfunction processPayment(order, paymentClient) {\n  return paymentClient.charge(order.total);\n}\n\n// Hard to mock\nfunction processPayment(order) {\n  const client = new StripeClient(process.env.STRIPE_KEY);\n  return client.charge(order.total);\n}\n```\n\n**2. Prefer SDK-style interfaces over generic fetchers**\n\nCreate specific functions for each external operation instead of one generic function with conditional logic:\n\n```typescript\n// GOOD: Each function is independently mockable\nconst api = {\n  getUser: (id) => fetch(`/users/${id}`),\n  getOrders: (userId) => fetch(`/users/${userId}/orders`),\n  createOrder: (data) => fetch('/orders', { method: 'POST', body: data }),\n};\n\n// BAD: Mocking requires conditional logic inside the mock\nconst api = {\n  fetch: (endpoint, options) => fetch(endpoint, options),\n};\n```\n\nThe SDK approach means:\n- Each mock returns one specific shape\n- No conditional logic in test setup\n- Easier to see which endpoints a test exercises\n- Type safety per endpoint\n", "bytes": 1481}, {"path": ".claude/skills/tdd/tests.md", "slug": "claude-skills-tdd-tests", "title": "Good and Bad Tests", "label": "/tdd · tests", "group": "skills", "body": "# Good and Bad Tests\n\n## Good Tests\n\n**Integration-style**: Test through real interfaces, not mocks of internal parts.\n\n```typescript\n// GOOD: Tests observable behavior\ntest(\"user can checkout with valid cart\", async () => {\n  const cart = createCart();\n  cart.add(product);\n  const result = await checkout(cart, paymentMethod);\n  expect(result.status).toBe(\"confirmed\");\n});\n```\n\nCharacteristics:\n\n- Tests behavior users/callers care about\n- Uses public API only\n- Survives internal refactors\n- Describes WHAT, not HOW\n- One logical assertion per test\n\n## Bad Tests\n\n**Implementation-detail tests**: Coupled to internal structure.\n\n```typescript\n// BAD: Tests implementation details\ntest(\"checkout calls paymentService.process\", async () => {\n  const mockPayment = jest.mock(paymentService);\n  await checkout(cart, payment);\n  expect(mockPayment.process).toHaveBeenCalledWith(cart.total);\n});\n```\n\nRed flags:\n\n- Mocking internal collaborators\n- Testing private methods\n- Asserting on call counts/order\n- Test breaks when refactoring without behavior change\n- Test name describes HOW not WHAT\n- Verifying through external means instead of interface\n\n```typescript\n// BAD: Bypasses interface to verify\ntest(\"createUser saves to database\", async () => {\n  await createUser({ name: \"Alice\" });\n  const row = await db.query(\"SELECT * FROM users WHERE name = ?\", [\"Alice\"]);\n  expect(row).toBeDefined();\n});\n\n// GOOD: Verifies through interface\ntest(\"createUser makes user retrievable\", async () => {\n  const user = await createUser({ name: \"Alice\" });\n  const retrieved = await getUser(user.id);\n  expect(retrieved.name).toBe(\"Alice\");\n});\n```\n\n**Tautological tests**: Expected value restates the implementation, so the test passes by construction.\n\n```typescript\n// BAD: Expected value is recomputed the way the code computes it\ntest(\"calculateTotal sums line items\", () => {\n  const items = [{ price: 10 }, { price: 5 }];\n  const expected = items.reduce((sum, i) => sum + i.price, 0);\n  expect(calculateTotal(items)).toBe(expected);\n});\n\n// GOOD: Expected value is an independent, known literal\ntest(\"calculateTotal sums line items\", () => {\n  expect(calculateTotal([{ price: 10 }, { price: 5 }])).toBe(15);\n});\n```\n", "bytes": 2214}, {"path": ".claude/skills/to-tickets/SKILL.md", "slug": "claude-skills-to-tickets-skill", "title": "To Tickets", "label": "/to-tickets", "group": "skills", "body": "---\nname: to-tickets\ndescription: Break a plan, spec, or the current conversation into a set of tracer-bullet tickets, each declaring its blocking edges, published to the configured tracker (edges as text in one file per ticket locally, or native blocking links on a real tracker).\ndisable-model-invocation: true\n---\n\n# To Tickets\n\nBreak a plan, spec, or conversation into a set of **tickets**: tracer-bullet vertical slices, each declaring the tickets that **block** it.\n\nThe issue tracker and triage label vocabulary should have been provided to you. If not, tell the user to run `/setup-matt-pocock-skills`.\n\n## Process\n\n### 1. Gather context\n\nWork from whatever is already in the conversation context. If the user passes a reference (a spec path, an issue number or URL) as an argument, fetch it and read its full body and comments.\n\n### 2. Explore the codebase (optional)\n\nIf you have not already explored the codebase, do so to understand the current state of the code. Ticket titles and descriptions should use the project's domain glossary vocabulary, and respect ADRs in the area you're touching.\n\nLook for opportunities to prefactor the code to make the implementation easier. \"Make the change easy, then make the easy change.\"\n\n### 3. Draft vertical slices\n\nBreak the work into **tracer bullet** tickets.\n\n\u003cvertical-slice-rules>\n\n- Each slice cuts a narrow but COMPLETE path through every layer (schema, API, UI, tests): vertical, NOT a horizontal slice of one layer\n- A completed slice is demoable or verifiable on its own\n- Each slice is sized to fit in a single fresh context window\n- Any prefactoring should be done first\n\n\u003c/vertical-slice-rules>\n\nGive each ticket its **blocking edges**: the other tickets that must complete before it can start. A ticket with no blockers can start immediately.\n\n**Wide refactors are the exception to vertical slicing.** A **wide refactor** is one mechanical change (rename a column, retype a shared symbol) whose **blast radius** fans across the whole codebase, so a single edit breaks thousands of call sites at once and no vertical slice can land green. Don't force it into a tracer bullet; sequence it as **expand–contract**. First expand: add the new form beside the old so nothing breaks. Then migrate the call sites over in batches sized by blast radius (per package, per directory), each batch its own ticket blocked by the expand, keeping CI green batch to batch because the old form still exists. Finally contract: delete the old form once no caller remains, in a ticket blocked by every migrate batch. When even the batches can't stay green alone, keep the sequence but let them share an integration branch that all block a final integrate-and-verify ticket; green is promised only there.\n\n### 4. Quiz the user\n\nPresent the proposed breakdown as a numbered list. For each ticket, show:\n\n- **Title**: short descriptive name\n- **Blocked by**: which other tickets (if any) must complete first\n- **What it delivers**: the end-to-end behaviour this ticket makes work\n\nAsk the user:\n\n- Does the granularity feel right? (too coarse / too fine)\n- Are the blocking edges correct: does each ticket only depend on tickets that genuinely gate it?\n- Should any tickets be merged or split further?\n\nIterate until the user approves the breakdown.\n\n### 5. Publish the tickets to the configured tracker\n\nPublish the approved tickets. **How** depends on the tracker `/setup-matt-pocock-skills` configured; the tickets are the same either way, only the shape of the blocking edges changes:\n\n- **Local files** → write one file per ticket under `.scratch/\u003cfeature-slug>/issues/\u003cNN>-\u003cslug>.md`, numbered from `01` in dependency order (blockers first). Each file's \"Blocked by\" lists the numbers/titles it depends on. Use the per-ticket file template below: one ticket per file, never a single combined file.\n- **A real issue tracker (GitHub, Linear, …)** → publish one issue per ticket in dependency order (blockers first) so each ticket's blocking edges can reference real identifiers. Use the platform's native blocking / sub-issue relationship where it has one; otherwise set each ticket's \"Blocked by\" to the blocking issues. Apply the `ready-for-agent` triage label unless instructed otherwise; the tickets are agent-grabbable by construction.\n\nWork the **frontier**: any ticket whose blockers are all done. For a purely linear chain that means top to bottom.\n\nDo NOT close or modify any parent issue.\n\n\u003clocal-ticket-template>\n\n# \u003cNN>: \u003cTicket title>\n\n**What to build:** the end-to-end behaviour this ticket makes work, from the user's perspective, not a layer-by-layer implementation list.\n\n**Blocked by:** the numbers/titles of the tickets that gate this one, or \"None (can start immediately)\".\n\n**Status:** ready-for-agent\n\n- [ ] Acceptance criterion 1\n- [ ] Acceptance criterion 2\n\n\u003c/local-ticket-template>\n\n\u003cissue-template>\n\n## Parent\n\nA reference to the parent issue on the tracker (if the source was an existing issue, otherwise omit this section).\n\n## What to build\n\nThe end-to-end behaviour this ticket makes work, from the user's perspective, not layer-by-layer implementation.\n\n## Acceptance criteria\n\n- [ ] Criterion 1\n- [ ] Criterion 2\n\n## Blocked by\n\n- A reference to each blocking ticket, or \"None (can start immediately)\".\n\n\u003c/issue-template>\n\nIn either form, avoid specific file paths or code snippets: they go stale fast. Exception: if a prototype produced a snippet that encodes a decision more precisely than prose can (state machine, reducer, schema, type shape), inline it and note briefly that it came from a prototype. Trim to the decision-rich parts, not a working demo, just the important bits.\n", "bytes": 5671}, {"path": ".claude/skills/wayfinder/SKILL.md", "slug": "claude-skills-wayfinder-skill", "title": "SKILL", "label": "/wayfinder", "group": "skills", "body": "---\nname: wayfinder\ndescription: Plan a huge chunk of work (more than one agent session can hold) as a shared map of decision tickets on your issue tracker, and resolve them one at a time until the way to the destination is clear.\ndisable-model-invocation: true\n---\n\nA loose idea has arrived, too big for one agent session, and wrapped in fog: the way from here to the **destination** isn't visible yet. Wayfinding is about finding that way, not charging at the destination. This skill charts the way as a **shared map** on the repo's issue tracker, then works its **decision tickets** (questions whose resolution is a decision, not slices of a build to execute) one at a time until the route is clear.\n\nThe destination varies per effort, and naming it is the first act of charting: it shapes every ticket. It might be a spec to hand off and iterate on, a decision to lock before planning starts, or a change made in place like a data-structure migration. The map is domain-agnostic: engineering work, course content, whatever fits the shape.\n\n## Plan, don't do\n\nWayfinder is **planning** by default: each ticket resolves a decision, and the map is done when the way is clear, with nothing left to decide before someone goes and does the thing. The pull to just do the work is usually the signal you've reached the edge of the map and it's time to hand off. An effort can override this in its **Notes**, carrying execution into the map itself, but absent that, produce deci
