who uses FundEli5 and for which steps of\ntheir work; which funds; which clients and cases; which rules decide eligibility; what\nthe answer key must prove; what each organiser capability looks like for the desk.\n\nEach grilling ticket closes by creating its build ticket(s) with /to-tickets, linked to\nit and using the build-ticket template of docs/build-workflow.md.\nWho takes which ticket is decided by the team once the map is ready.\nUse GLOSSARY.md vocabulary; the team may change it.\n```\n\n## Done when\n\n- [ ] The map issue exists, and its destination is two lines the whole team agrees with.\n- [ ] \"Walk the screens\" and \"Write the demo story and the answer key\" are open, unblocked and assigned.\n- [ ] S1 is published as a build ticket and assigned to the builder.\n- [ ] Every open question raised in the session is either a ticket or under \"Not yet specified\" or \"Out of scope\" on the map.\n\n## Pitfalls\n\n- **Claude answering for the team.** If Claude proposes an answer to a business question, say \"ask us\" and move on. A grilling agent that answers its own questions has broken the skill.\n- **Solving tickets during the charting.** The hour is for naming the questions, not answering them. Park the discussion in the ticket.\n- **Re-deciding the platform.** The stack, the four promises and the screens' layout are decided. A real objection becomes a ticket, not a debate in the session.\n", "bytes": 5806}, {"path": "docs/tasks/02-walk-the-screens.md", "slug": "docs-tasks-02-walk-the-screens", "title": "Task 2: Walk the screens", "label": "2. Walk the screens", "group": "tasks", "body": "# Task 2: Walk the screens\n\n**Why.** The screens are what the jury sees and what the desk would use. The last build got working screens nobody wanted to look at, because the people who know the desk's work saw them only at the end. This task puts the business in front of the screens **before** any screen code exists. A change now costs an edit to a mockup; a change after the build costs a ticket.\n\n**Time box.** 45 minutes. **Who:** the business members, and a desk adviser if one is free. One person drives Claude; the others react. **Tool:** a browser, Claude Code with the `prototype` skill.\n\n**Output.**\n- The decisions of the session at the end of [ux/README.md](../ux/README.md#what-the-team-decides-task-2), one line each.\n- The mockups in `docs/ux/mockups/` changed to match, and their screenshots in `docs/ux/screens/` taken again.\n- A wording table, `docs/ux/wording.md`: every fixed text on screen (titles, buttons, banners, empty and error states) in English and French.\n\n## Steps\n\n1. **Open the mockups** (2 min). Open [`dealer.html`](../ux/mockups/dealer.html) in a browser, full screen on the shared display. The switcher in the bottom-left corner walks through the states.\n2. **Play the dealer** (15 min). One person reads a request email aloud, the way a relationship manager would send it. Walk the states in order: Paste → Working → Answered → Needs review → Privacy Gate → Check Record. At each state, answer the questions below and say them aloud; the driver writes them down in the Claude session.\n3. **Play the validator** (10 min). Open [`validation.html`](../ux/mockups/validation.html). Walk Queue → Draft card → Validated, asking the same questions.\n4. **Decide the open points** (10 min). Go through the list in [What the team decides](../ux/README.md#what-the-team-decides-task-2): Advisory Suggestions in or out, where the organisers' capabilities go (form guidance, deadlines, eligibility questions), and anything the walk-through raised. One decision per line.\n5. **Apply** (8 min, the driver with Claude). Paste the prompt below. Claude updates the mockups, `ux/README.md` and `wording.md`, and takes the screenshots again. Look at the new screenshots together before closing.\n\n### Questions at each state\n\n- **Would a dealer trust this?** What is missing before they would send the reply?\n- **Is the first thing you read the right thing?** What do you read first, second, third?\n- **Is any word wrong?** Desk words, not IT words. Is it the word the relationship manager uses?\n- **What would you click next?** If the answer differs between people, the screen is unclear.\n- **What would the jury remember?** If nothing, what should change?\n\n## The prompt\n\nPaste in Claude Code at the repo root after the walk-through, with the notes taken during it:\n\n```\n/prototype\n\nWe walked the FundEli5 mockups (docs/ux/mockups/dealer.html and validation.html) with the\nbusiness. Apply our decisions below to the mockups, docs/ux/README.md (record each\ndecision as one line under \"What the team decides\") and a new docs/ux/wording.md (every\nfixed text on screen, English and French). Keep the design tokens and the components of\ndocs/ux/design-system.md; add a state to a mockup if a decision needs one. Then take a\n1440 x 900 screenshot of every state with the Playwright tool and replace the files in\ndocs/ux/screens/. Show us the changed screenshots. Ask before inventing any wording\nwe did not give you.\n\nOur notes:\n\u003cpaste the notes here>\n```\n\n## Done when\n\n- [ ] Every state of both mockups was walked with the questions above.\n- [ ] Each decision is one line in `docs/ux/README.md`, and the open points listed there are settled.\n- [ ] The mockups and screenshots show the decisions, and the team looked at the new screenshots.\n- [ ] `docs/ux/wording.md` exists, in English and French.\n- [ ] The ticket \"Walk the screens\" is closed with a link to the commit.\n\n## Pitfalls\n\n- **Redesigning the colours.** The design system is fixed: green, red and amber mean Verdicts, purple means AI. Change what the screens say and show, not the palette.\n- **Adding features.** A new capability is a ticket on the map, not a box added to a mockup during the session. Add it to the mockup only once the map has it in the Must tier.\n- **Wording for the Verdict sentences.** The sentence under each Verdict (\"BI-EUR is for institutional investors…\") depends on the rule kinds, so it is written in task 3, not here.\n", "bytes": 4440}, {"path": "docs/tasks/03-write-the-demo-story-and-answer-key.md", "slug": "docs-tasks-03-write-the-demo-story-and-answer-key", "title": "Task 3: Write the demo story and the answer key", "label": "3. Write the demo story and the answer key", "group": "tasks", "body": "# Task 3: Write the demo story and the answer key\n\n**Why.** The answer key is the contract between the business and the code. It lists the cases the demo data must produce, with the expected Verdict and the outcome of every rule, written by the people who know the rules **before** the app answers. The Rule Engine is built test-first against it, so a wrong rule fails a row instead of surprising the jury. The story says which of those rows the jury sees.\n\n**Time box.** 2 to 3 hours in two sittings: the story and the rules (sitting 1, 90 min), then the answer key and the Gherkin (sitting 2, 60–90 min). **Who:** the business members; the desk confirms the rows in its daily slot. One person drives Claude. **Tools:** the `grilling` and `domain-modeling` skills (the map's grilling ticket calls them), the fund documents in `fund-documents/`.\n\n**Output.**\n- `specs/00-fundeli5.feature`: what FundEli5 does, the demo story, the reading order, the tags, what is out of the demo.\n- `specs/01-check-eligibility.feature`: one `Rule:` per rule kind the team keeps, each with its examples.\n- `specs/99-answer-key.feature`: the coverage set, one row per case ([format](../../specs/README.md#the-shape-of-an-answer-key-row)).\n- One plain-language sentence per rule kind and outcome, in English and French: the \"explain it like I'm five\" text under each Verdict.\n- Rows in [hypotheses.md](../hypotheses.md) for every reading not yet confirmed, and the matching scenarios tagged `@assumed`.\n- Build tickets, one per rule kind, from `/to-tickets`.\n\n## Sitting 1: the story and the rules (90 min)\n\nStart the map's ticket \"Write the demo story and the answer key\". Claude grills; the team answers.\n\n1. **The story** (30 min). Who sends the request, about which client, for which fund, and what the dealer does with the answer? Aim for **three cases** the jury can follow in five minutes: one clear yes and no side by side, one \"needs review\" that shows the four promises at work, one refusal by the Privacy Gate. Write each as one paragraph.\n2. **The funds** (15 min). Pick from the four seed funds (their PDFs are in `fund-documents/`, facts in [sample-funds.md](../research/sample-funds.md)) or from the bank's shelf. A new fund needs its public prospectus and KID downloaded into `fund-documents/` today, so the Rule Card pipeline can draft its card. DEV's document service serves mock PDFs, so it can't be used.\n3. **The rules** (45 min). Which rules decide whether a client may subscribe, in Switzerland and Luxembourg? For each rule: its name, what it checks on the client, where the fund document states it (document and page), and what makes it pass, fail or need review. Each kept rule becomes a **rule kind**: one plug-in class in the code, one `Rule:` in `01-check-eligibility.feature`. Common ones: investor category, US Person, minimum subscription, mandate-only class, KID required for retail, Target Market, other restrictions. Keep only those the story needs, plus the ones a dealer would never skip.\n\n## Sitting 2: the answer key and the Gherkin (60–90 min)\n\n4. **The clients** (15 min). For each case, the client facts that matter: investor classification, mandate type, residence, nationality, US Person flags, risk profile, horizon. Start from the seed Client Profiles in [contracts/fixtures](../contracts/fixtures/README.md); change or add what the story needs. Use only the synthetic number range 900001–900099.\n5. **The rows** (30 min). One row per case: Portfolio Reference, Share Class, amount and currency, the expected **outcome of every rule kind** (Pass, Fail, Review), and the Verdict. Write them **from the fund documents and the desk's practice, without the app**. Add rows until every rule kind fails at least once and passes at least once. 15 to 25 rows is a good size.\n6. **The sentences** (15 min). For every rule kind and outcome, one sentence a relationship manager could forward to a client, with `{placeholders}` for the values: \"{class} is for institutional investors; this portfolio is {classification}.\" English and French.\n7. **The Gherkin** (15 min). Paste the prompt below. Claude writes the three feature files. Read **every line**: Claude writes the code's specification, and the team is answerable for it. Tag `@assumed` every row the desk has not confirmed.\n8. **Compare with the reference** (15 min, last). Only now, open the reference build's answer key and rules: [fund-gate `specs/`](https://github.com/smnajid/fund-gate/tree/main/specs). Use it as a checklist of edge cases, not as an answer: a US citizen under Reg S, discretionary mandates counted as institutional (art. 174 of the 2010 Law), reverse solicitation, a fund named without a Share Class. For each edge case you missed, decide to add a row or leave it out, on purpose.\n\n## The prompt for step 7\n\n```\nWrite the team's executable specification in specs/, following specs/README.md and\nGLOSSARY.md, from our notes below:\n- specs/00-fundeli5.feature: what FundEli5 does in one paragraph, our demo story, the\n  reading order, the tags, and what is not in the demo.\n- specs/01-check-eligibility.feature: one Rule: per rule kind we kept, with the examples\n  that prove it, each citing the fund document and page.\n- specs/99-answer-key.feature: one Scenario Outline with one row per case, every rule\n  kind's outcome as a column.\nTag @must the rows the demo shows and @assumed every row the desk has not confirmed,\nwith a sentence saying what is assumed. Use only the facts in our notes: when something\nis missing, ask us instead of filling it in. Then add one row to docs/hypotheses.md per\n@assumed reading. Show us each file before writing the next.\n\nOur notes:\n\u003cpaste the story, the rules, the client facts, the rows and the sentences>\n```\n\nThen, once the files are committed: `/to-tickets specs/01-check-eligibility.feature`, one build ticket per rule kind, using the build-ticket template of [build-workflow.md](../build-workflow.md), blocked by S4.\n\n## Done when\n\n- [ ] `specs/00`, `01` and `99` are committed, and every team member has read them.\n- [ ] Every rule kind has at least one Pass and one Fail row in the answer key.\n- [ ] Every row the desk has not confirmed is `@assumed` and has its line in `docs/hypotheses.md`.\n- [ ] The sentences exist for every rule kind and outcome, in English and French.\n- [ ] The comparison with the reference is done, and each missed edge case is a row or a recorded \"left out\".\n- [ ] One build ticket per rule kind is published, and the builder knows S4 can start.\n\n## Pitfalls\n\n- **Writing the expected answer from what the app says.** The key is written first, from the documents. Otherwise it proves nothing.\n- **Too many rule kinds.** Each one costs a plug-in, a prompt line for the pipeline and rows in the key. Keep what the story and the desk need.\n- **Copying the reference.** The reference stays closed until step 8. The team's story beats it only if the team wrote it.\n- **Real client data.** Never. Synthetic numbers, invented names, and the Privacy Gate's refusal case uses a made-up name.\n", "bytes": 7055}, {"path": "docs/tasks/README.md", "slug": "docs-tasks-readme", "title": "The team's first three tasks", "label": "The team's first three tasks", "group": "tasks", "body": "# The team's first three tasks\n\nThe repo holds decisions and no code. Before anyone builds content, the team does three things, in this order. Each page says why the task matters, how long it takes, how to do it step by step, and what \"done\" looks like.\n\n| # | Task | Time box | Who | Output |\n|---|---|---|---|---|\n| 1 | [Chart the map](01-chart-the-map.md) | 60 min | the whole team, in one Claude Code session | the map issue, its grilling tickets, and the platform's build tickets |\n| 2 | [Walk the screens](02-walk-the-screens.md) | 45 min | the business members, the desk if available; one person drives Claude | decisions and wording in `docs/ux/`, updated mockups |\n| 3 | [Write the demo story and the answer key](03-write-the-demo-story-and-answer-key.md) | 2–3 h, in two sittings | the business members; the desk confirms | `specs/00`, `01`, `99`, and the build tickets for the rule kinds |\n\nTasks 2 and 3 run in parallel once task 1 is done, with different people. Meanwhile the builder starts the platform spine (S1–S3 in [build-workflow.md](../build-workflow.md)), which needs no content. The two tracks meet when task 3 delivers its first answer-key rows: that is when the Rule Engine ticket (S4) can start.\n\n```\n task 1: map ──┬── task 2: screens ──────────┐\n   (all)       ├── task 3: story + key ──────┼──► S4 Rule Engine on the team's rows ──► waves ──► demo\n               └── builder: S1 → S2 → S3 ────┘\n```\n\n## Before task 1 (10 minutes, everyone)\n\n- Read the four promises: [ADR 0001](../adr/0001-llm-extracts-rules-engine-decides.md), [0002](../adr/0002-no-llm-at-check-time.md), [0004](../adr/0004-two-runtimes-one-llm-egress.md), [0007](../adr/0007-advisory-suggestions-never-change-the-verdict.md). In short: no LLM decides a Verdict; no client data reaches an LLM; every rule outcome cites its source; a person validates every rule before it decides.\n- Open the two mockups in a browser: [dealer.html](../ux/mockups/dealer.html) and [validation.html](../ux/mockups/validation.html). Click through the states.\n- Skim [GLOSSARY.md](../../GLOSSARY.md). These are the words the map, the specs and the code use.\n", "bytes": 2228}, {"path": "docs/tech-choices.md", "slug": "docs-tech-choices", "title": "Technical choices", "label": "Technical choices", "group": "build", "body": "# Technical choices\n\nThe hackathon rebuilds every component from this repo, which holds no code. The technical decisions below were paid for by two earlier builds (fund-gate in October, a timed rebuild on 1–3 Nov 2026), together with the traps found along the way. They are decided: reopen one only if it blocks, and say why. Where a decision has an ADR, the ADR wins.\n\n## Stack and versions\n\n| Part | Choice | Version used in fund-gate |\n|---|---|---|\n| Backend | Spring Boot, Spring MVC (`spring-boot-starter-webmvc`), Maven wrapper | Boot 4.1.1, Java 25 |\n| API spec | `springdoc-openapi-starter-webmvc-ui` | 3.1.1 |\n| PDF text | Apache PDFBox | 3.0.8 |\n| Architecture tests | ArchUnit (`archunit-junit5`) | 1.4.2 |\n| Executable specification | `cucumber-java`, `cucumber-spring`, `cucumber-junit-platform-engine` (via `cucumber-bom`), `junit-platform-suite`, `junit-platform-testkit` | Cucumber 8.0.4 |\n| Dev loop | `spring-boot-devtools` | from Boot |\n| Frontend | Angular standalone components with signals, Vitest + jsdom, Prettier | Angular 21.2, TypeScript 5.9, Vitest 4.1 |\n| Generated client | `@openapitools/openapi-generator-cli`, generator `typescript-angular` | 2.41.0 |\n| Page selection | TypeSafe Jev over HTTPS (no SDK) | `jev-latest` |\n| Personal-data detection | Presidio analyzer (Python service, Docker image `mcr.microsoft.com/presidio-analyzer`) behind the `PersonalDataDetector` port; `fixture` adapter for tests ([ADR 0009](adr/0009-presidio-detects-personal-data-in-emails.md)) | — |\n| Python | only for real added value (ADR 0006): the Presidio service | — |\n\nGroup id `com.fundgate`, artifact `fundeli5`, base package `com.fundgate.fundeli5`.\n\n## Repository layout\n\n```\nbackend/            Spring Boot app, both runtimes (Maven runs here; paths below are relative to it)\nfrontend/           Angular workspace: shell/, ui/ (shared components), dealer-screen/, validation-screen/, generated/api/ (never edited)\nspecs/              the team's Gherkin, the definition of done (agents never edit it)\ndocs/contracts/fixtures/   the seed data the fixture adapters read\nfund-documents/     the demo funds' public PDFs (prospectus, KIDs)\n```\n\nProperties that pointed at these: `fundeli5.fixtures.dir=../docs/contracts/fixtures`, `fundeli5.documents.folder=../fund-documents`, `fundeli5.llm.recordings=src/main/resources/llm-recordings`, `fundeli5.validation.drafts=${fundeli5.fixtures.dir}/draft-rule-cards,target/draft-rule-cards`, `fundeli5.pipeline.out=target/draft-rule-cards`.\n\n## Package per module, ports and adapters\n\nOne top-level package per module of [architecture.md](architecture.md#modules), named after it: `answering` (the online flow orchestration), `privacygate`, `requestparser`, `shareclasscatalog`, `ruleengine`, `replydrafter`, `checkrecord`, `validation`, `rulecardpipeline`, `llm`; shared types in `eligibility` (Subscription Request, Verdict, Justification, Rule Outcome), `rulecard` (Rule Card, Rule, Condition, Rule Kind), `citation`, `bankdata` (codes and enums); one package per out port: `clientprofiles`, `shareclasses`, `funddocuments`, `fundregistrations`, `fxrates`.\n\n- A port is a plain Java interface in its package (`ClientProfiles`, `ShareClasses`, `FundDocuments`, `FundRegistrations`, `FxRates`, `RuleCards`, `LlmEgress`, `RuleEngine`, `RequestParser`, `ReplyDrafter`, `PrivacyGate`, `CheckRecords`). Adapters sit in sub-packages: `fixture`, `folder`, `memory`, `replay`, `stub`, `web`.\n- **Spring stays in the wiring and the web layer.** One `*Configuration` class per module at the root package or module root builds the objects; `web` sub-packages hold the controllers. Domain and application classes import no Spring, Jackson or PDFBox. An ArchUnit rule enforces it.\n- Stubs first: the walking skeleton wires `stub` adapters for Privacy Gate, Request Parser, Rule Engine and Reply Drafter, then each ticket replaces one stub.\n- Each port's adapter is chosen by a Spring property, so a bank adapter replaces a fixture adapter port by port (ADR 0008).\n\n## Architecture tests (ArchUnit), written with the skeleton\n\n1. The Rule Engine never depends on the `llm` package (ADR 0002).\n2. Only the Privacy Gate constructs a `GatedEmail` (its output type).\n3. The Request Parser and Reply Drafter never depend on `PortfolioReference` or `GatedEmail`: they see Portfolio Ids only (ADR 0004).\n4. Spring is used only in the root wiring package and `..web..` packages.\n5. `rulecard` never depends on `ruleengine`.\n6. A rule kind's `Condition` is used only by its plug-in; only the plug-ins name a kind on the card.\n\nPlus `RuntimeProfilesTest`: the dealer app starts a web server and reads Client Profiles, Share Classes and Fund Registrations; the `pipeline` profile starts with no web server, reads Fund Documents and never a Client Profile.\n\n## The four promises in JUnit (not only Gherkin)\n\n`FourPromisesTest` runs on frozen test-only fixtures under `src/test/resources/fixtures`, never the demo content, so the team can rewrite the content without breaking the guards:\n- the Privacy Gate fails closed: an unknown portfolio reaches no LLM;\n- what reaches an LLM names portfolios by Portfolio Id only;\n- every Eligibility Check writes one Check Record with the Verdict shown;\n- Verdict combination: any Fail gives Not Eligible, else any Review gives Needs Review, else Eligible;\n- only a Validated Rule Card decides (a Draft card gives Needs Review).\n\n## Rule catalog: one plug-in per rule kind\n\nEach rule kind is one class implementing a `RuleKindPlugin\u003cC extends Condition>`: its `RuleKind` constant, its condition type, its line of the drafting prompt, an optional `asDrafted` correction, `evaluate(condition, facts, lookups) → Optional\u003cFinding>`, and `accumulates()` (all rules of the kind are shown and class-level rules add to fund-level ones, versus worst finding decides and class overrides fund). A `RuleCatalog` lists the plug-ins in order. The pipeline's drafting prompt is assembled from the catalog, one line per plug-in. The kinds in the reference: investor category, US Person exclusion, minimum initial subscription, mandate-only class, KID required for retail, Unmodelled Restriction, Target Market. Adding a kind the business asks for costs one class.\n\nEngine frame rules to keep: Verdict combination above; Citations on every outcome; Draft vs Validated; a class-level rule overrides the fund-level one; contradictions between documents are flagged; a Stale card (newer document edition) still decides until the new version is validated.\n\n## LLM egress\n\n- One interface, `LlmEgress.complete(LlmRequest(model, system, prompt)) → LlmResponse`. It is the only code that calls a model (ADR 0004). On the online side the prompt is Privacy Gate output.\n- **Replay adapter** (default for tests, `fundeli5.llm.endpoint=replay`): one JSON file per recording, `{\"request\": …, \"response\": …}`, matched on the whole request (model included, so changing the model means recording again). Unknown JSON properties fail loudly, because a misspelt key would load as null and never match. An unrecorded request throws `UnrecordedLlmRequest`. The specification records live answers with a recording egress in tests.\n- **Claude plan adapter** (rehearsal only, never at the bank): runs `claude -p --output-format json --json-schema \u003cschema>` as a subprocess, prompt on stdin. The spike's `ClaudePlanDrafter` used this and got the same scores as the API (18/18 rules on Nordea). No Citations API on this path: the model writes `{file, page, quote}` itself, and the quote check verifies each quote on its page.\n- **Foundry adapter** (the event's live mode: the app's LLM calls go to Claude on Azure Foundry; see [foundry-models.md](research/foundry-models.md)): official Anthropic Java SDK. For the pipeline, pass 1 sends the selected PDF pages with Citations enabled (Opus), pass 2 turns that into the card with structured output (Sonnet). Spring AI 2.0's `ChatModel` flattens citations into one list and loses which passage supports which statement, so pass 1 calls the SDK client directly. Search **every** generation of pass 2 for the card and fail loudly when none parses: the first live run silently saved a 0-rule card.\n\n## Rule Card pipeline\n\nCommand-line mode of the same app: profile `pipeline`, `spring.main.web-application-type=none`, an `ApplicationRunner`, writes Draft cards to `fundeli5.pipeline.out`. Steps: PDF to page text (PDFBox, 944 pages in about 5 s) → page selection → drafting through the egress → quote check → Draft Rule Card.\n\n- **Page selection = Jev** behind a `PageRanking` port ([spike README](reference/rule-card-extraction/spike-README.md), issue #39 on fund-gate). Six rule kinds to rank for: the sub-fund's own description, US Person, investor eligibility, minimum, target market, other restriction. **Jev choice** selects: per kind, a choice question whose options are the pages plus \"none\", about 20 pages (32k tokens) per question, knockout rounds keeping the top 3 per batch. Keep pages 1–5 (front matter), add the page before each top page, round-robin over the six rankings up to a budget of 25 pages. Documents no longer than the budget are sent whole. **Jev per page** then runs as a check: one request per page, one yes/no question per kind; a kind whose best selected page scores under 0.5 is flagged \"possibly missed\" on the validation screen. Cost about $0.25 per 944-page prospectus. Cache rankings on disk so reruns cost nothing. Pages over 6,000 characters are cut.\n- Jev API: `POST https://api.typesafe.ai/v1/systemone`, bearer `TYPESAFE_API_KEY`, body `{state, model, questions: {\u003cid>: {type: choice|noul|score, instructions, criteria}}}`; the response has per-question probabilities and confidence. No streaming. A missing or bad key returns 403, not 401.\n- Fallback if Jev is not allowed: keyword selection v2 at 40 pages (72/74 unseen rules), described in the spike README.\n- **Quote check**: every cited quote must be found on its cited page. Normalise whitespace with `[\\s\\p{Z}]`, not `\\s` (French no-break spaces); read control characters as a hyphen (the Citations API returns a line-break hyphen as U+0002); ignore soft hyphens.\n- PDFs without a text layer (2 of 21 in the unseen set) can't be selected or checked: they need OCR first. None of the demo funds is affected.\n- Reference material for drafting: [prompts](reference/rule-card-extraction/prompts/), [Rule Card JSON schema](reference/rule-card-extraction/rule-card.schema.json), gold cards ([Nordea](reference/rule-card-extraction/gold-rule-card.json), [Robeco, BlackRock](reference/rule-card-extraction/gold/)), page-recall keys and the [unseen documents' URLs](reference/rule-card-extraction/unseen-sources.txt).\n\n## Executable specification wiring\n\nAs in [setup.md](agents/setup.md#run-the-executable-specification), with the traps:\n- `@Suite` runner `SpecificationSuite` with `@SelectDirectories(\"../specs\")`. The `cucumber.features` property finds nothing under the JUnit 6 Suite engine.\n- An undefined step is an error, so the default build runs `SpecificationRunsTest` instead (via `junit-platform-testkit`), which fails only on a scenario that really fails.\n- Default `cucumber.filter.tags=not @live-llm`; the egress in replay mode.\n- One step-definition package per module under `specs/` in test (`ruleengine`, `privacygate`, …) plus a shared `SpecificationContext`.\n\n## Frontend and the API\n\n- `npm run generate-api`: runs an `OpenApiSpecTest` in the backend that writes `target/openapi.json`, deletes `src/app/generated/api`, then regenerates it with `typescript-angular`. Commit both sides together after every API change.\n- `app.config.ts` calls `provideApi('')` (same origin); `proxy.conf.json` sends `/api` to `http://localhost:8080` under `ng serve`. Every controller lives under `/api`.\n- Two screens as routes, `dealer-screen` and `validation-screen`, inside one shell (top bar, role). Replace the Angular CLI welcome page and its spec in the skeleton.\n\n## Frontend: how the screens are built\n\nThe rebuild of 1–3 Nov produced screens that worked in tests and failed in front of a person (see [ux/README.md](ux/README.md#what-went-wrong-last-time)). These choices prevent the same result.\n\n- **The design comes first, in the skeleton.** S1 copies [`docs/ux/tokens.css`](ux/tokens.css) into `frontend/src/styles.css` and builds the shell (top bar, page grid) from it. Screen tickets use the tokens and never write a raw colour, font size or spacing value.\n- **The mockups are the visual oracle.** [`docs/ux/mockups/`](ux/mockups/) holds a static HTML page per screen and state; `docs/ux/screens/` holds their screenshots. A screen ticket is done when its Playwright screenshot, taken at 1440 × 900 on the seed data, matches the mockup's layout and the [screen checklist](ux/README.md#definition-of-done-for-a-screen) passes. Reproduce the look; do not copy the mockup's HTML.\n- **Small components, one file each.** `ui/` holds the shared pieces of the [design system](ux/design-system.md#components): `verdict-line`, `citation-marker`, `evidence-card`, `banner`, `status-chip`, `drawer`, `empty-state`. A screen is a container that composes them. No component over 250 lines; templates and styles in their own files.\n- **Labels come from one place.** `ui/labels.ts` maps every enum the API returns (rule kinds, outcomes, Verdicts, condition fields) to the words on screen, in English and French. A raw enum, ISO timestamp, array index or file id on screen is a bug.\n- **The screen owns its states.** Every async call has loading, empty, error and success states, written in the mockups. An error names what the dealer can do next, never an internal id.\n- **The API serves the screen.** If a screen needs a value (a record id, a Share Class name, a count of open rules), the backend returns it. The screen never derives it by diffing two calls.\n- **Playwright from S1.** `frontend/e2e/` runs on the started app with seed data: one test per screen state of the mockups, each saving a screenshot under `frontend/e2e/screenshots/`. The `playwright` plugin lets the agent look at them.\n- **Angular:** standalone components, signals, `@if`/`@for` control flow, OnPush. No component library: the design system is small and a library's look fights the mockups. Angular CDK only for the drawer's focus trap and overlay if needed.\n\n## Check Record\n\nThe Check Record module owns the record's shape and exposes one in port to write it; `answering` calls that port. In-memory append-only store (`memory` adapter) is enough for the demo. The engine version recorded is the app's build version, so the `RuleEngine` port stays unchanged.\n", "bytes": 14637}, {"path": "docs/ux/README.md", "slug": "docs-ux-readme", "title": "Screens: what the dealer and the validator see", "label": "Screens: what the dealer and the validator see", "group": "ux", "body": "# Screens: what the dealer and the validator see\n\nTwo screens, both Angular ([ADR 0006](../adr/0006-spring-boot-and-angular-python-only-for-real-added-value.md)), inside one shell: the **dealer screen**, which answers a subscription request, and the **Rule Card validation screen**, which turns a Draft card into a Validated one. Vocabulary: [GLOSSARY.md](../../GLOSSARY.md). Look and parts: [design-system.md](design-system.md). Tokens: [tokens.css](tokens.css).\n\n**The mockups are the visual oracle.** Open [`mockups/dealer.html`](mockups/dealer.html) and [`mockups/validation.html`](mockups/validation.html) in a browser. The switcher in the bottom-left corner walks through every state. Their screenshots are in [`screens/`](screens/). Reproduce the look, the layout and the wording; do not copy the mockup HTML. The example data is the seed cast, so the team's story will change the content but not the layout.\n\n| State | Mockup | Screenshot |\n|---|---|---|\n| Dealer: paste | `dealer.html#paste` | [dealer-1-paste.png](screens/dealer-1-paste.png) |\n| Dealer: working | `dealer.html#working` | [dealer-2-working.png](screens/dealer-2-working.png) |\n| Dealer: answered | `dealer.html#answered` | [dealer-3-answered.png](screens/dealer-3-answered.png) |\n| Dealer: Needs Review with suggestions | `dealer.html#review` | [dealer-4-review.png](screens/dealer-4-review.png) |\n| Dealer: Privacy Gate refusal | `dealer.html#refused` | [dealer-5-refused.png](screens/dealer-5-refused.png) |\n| Dealer: what the AI saw | `dealer.html#record` | [dealer-6-record.png](screens/dealer-6-record.png) |\n| Validation: queue | `validation.html#queue` | [validation-1-queue.png](screens/validation-1-queue.png) |\n| Validation: Draft card | `validation.html#draft` | [validation-2-draft.png](screens/validation-2-draft.png) |\n| Validation: Validated | `validation.html#validated` | [validation-3-validated.png](screens/validation-3-validated.png) |\n\n## Five principles\n\n1. **Answer first, evidence one click away.** The dealer reads the Verdicts in five seconds. Every claim has its source a hover away, never a page away.\n2. **Say it like a person.** A Verdict is a sentence (\"`LOC90000101` **cannot buy** BI-EUR. BI-EUR is for institutional investors; this portfolio is retail\"). That sentence is the \"explain it like I'm five\" capability. No enums, codes, array indexes or ISO timestamps on screen.\n3. **Show what the AI did, and only that.** Everything an LLM wrote is purple and labelled (reply, suggestions). Everything the Rule Engine decided carries a Verdict colour. The two never mix. \"The AI saw Portfolio Ids only\" is always visible.\n4. **Every state is designed.** Paste, working, answered, needs review, refused and error each have a mockup. The screen is never blank, never stuck, and never shows a raw error.\n5. **The next action is obvious.** One primary button per state: Answer it, Copy reply, Draft reply, Accept and next, Validate card. A disabled button says what is left, in one short line.\n\n## What went wrong last time\n\nThe rebuild of 1–3 Nov produced screens that passed their tests and failed in front of a person ([screenshots](v2-lessons/)). Each item below became a rule in [design-system.md](design-system.md) or [tech-choices.md](../tech-choices.md#frontend-how-the-screens-are-built).\n\n| Seen | Rule now |\n|---|---|\n| The dealer screen showed an error and an empty card after **Answer it**: it diffed two Check Record lists to guess the record id | The API returns what the screen needs, including the record id; the screen derives nothing |\n| Replay mode answered only a byte-exact email; one changed line gave \"The AI could not read this email\" | Demo emails are one click away (sample buttons); an unknown email in replay mode says so in words, not as a refusal |\n| The validation header listed \"rule 0 is not reviewed\" … \"rule 21 is not reviewed\" | A disabled button shows one count line: \"5 rules and 2 contradictions left\" |\n| `drafted 2026-11-02T12:10:18.702369228Z`, `reg_s true`, `client_type retail`, `loss_bearing full_loss` | Dates go through one formatter (\"1 Nov 2026, 14:10\"); enums go through `labels.ts` |\n| Tab labels were file ids (`bnp-ch-bonds-chf-prospectus-2026-06-29 p.5`) | Documents show their title and type (\"Prospectus · p.123\", \"BI-EUR KID · p.1\") |\n| 22 rules in one flat list, Target Market split into 5 lines per class, ISINs as group names | Rules grouped by \"All classes\", then by Share Class name; the 5 Target Market dimensions are one row |\n| No contradiction banner, though it is the strongest moment of the validation demo | The banner is the first thing under the card header |\n| A free-text \"Validator\" field and a dropdown of cards | The role and name sit in the top bar; cards are a queue with their status |\n| One 900-line component per screen; the styling ticket came last and took 7 minutes | Tokens in the skeleton; small shared components; a Playwright screenshot per state in every screen ticket |\n\n## Dealer screen: the answer sheet\n\nLayout: one main column and an **evidence rail** on the right (`--rail-width`), which stays in view while scrolling (sticky). Below 1100 px the rail moves under the reply.\n\n1. **Paste** (empty state). A title, one sentence on what happens, a large text area (or a dropped `.eml`), **Answer it** (⌘↵), the privacy promise in one line, and the **demo email** buttons that fill the text area. Under it, three cards explain the flow (Privacy Gate, Rule Engine, Reply), so a jury member who sees the first screen understands the product.\n2. **Working.** The request summary, then a short list of steps that tick as the backend reports them: Privacy Gate, Reading the request, Checking the rules, Drafting the reply. Each tick shows what it found (\"2 Portfolio References swapped\"). Skeleton lines hold the place of the Verdicts. A check takes seconds, and these steps are the architecture shown live.\n3. **Request summary.** One line: \"Request from Marc Aebi · today 09:42\", the subject, the green **\"The AI saw Portfolio Ids only\"** chip with each swap (`LOC90000101 → 3f6c…a4c3`), and \"Show email and parsed requests\", which unfolds the email and the editable request form.\n4. **Summary strip.** \"3 checks\", then one chip per Verdict with its count.\n5. **One Verdict line per check.** A Verdict chip, a headline sentence (Portfolio Reference in mono, the verb in the Verdict colour, the Share Class name), the plain-language reason with citation markers, and a metadata line (ISIN, amount, \"7 rules checked · 1 failed\"). **Why?** unfolds that check's rule outcomes. An alternative the reply suggests is tagged \"alternative\".\n6. **Advisory Suggestions** (Needs Review only), in the AI style, grouped **Ask the Requester** and **Dealer to-do**, each with Accept and Dismiss (with an optional note). The line \"They never change a Verdict\" stays visible ([ADR 0007](../adr/0007-advisory-suggestions-never-change-the-verdict.md)). They sit above the reply because the dealer decides on them first.\n7. **The reply**, the largest element: \"Drafted by AI · edit before sending\", the language chip, editable text, **Copy reply** (a \"Reply copied\" toast follows). Numbered markers `[1]` link to the rail: hovering a marker highlights its evidence card. On a check with suggestions the reply waits for **Draft reply**, and a line counts the undecided suggestions. A changed decision offers **Redraft**, which never overwrites the dealer's edits.\n8. **Evidence rail.** One card per marker: number, rule kind, outcome (PASS, FAIL, REVIEW), Share Class, the quoted passage highlighted, document title and page, and \"✓ quote found on page\".\n9. **What the AI saw** (link in the reply footer) opens the Check Record in a drawer: one row per check with its Rule Card version and Verdict; the engine and Scale Mapping versions; the Client Profile fields read, which stay in the bank; then one block per LLM call with model, provider, duration, the client fields sent as tags, and the gated prompt with the Portfolio Ids highlighted.\n10. **Full Justification**, folded: every rule of every check, with its outcome and Citation.\n\n**Privacy Gate refusal.** A red banner replaces everything below the paste step: \"No AI was used for this email\", what was found and where, and what happens next. The hand-entry form follows. The check runs as usual, and a template reply replaces the drafted one.\n\n### The request form: what the dealer can edit\n\nWhat the AI read is editable; what code found is not.\n\n| Field | Editable | Source |\n|---|---|---|\n| Portfolio Reference | no (yes on the hand-entry form after a refusal) | Privacy Gate: a fixed pattern match plus a CRM lookup, no AI |\n| Share Class | yes, a dropdown of catalog classes (\"Nordea 1 Global Climate BP-EUR · LU0348926287\") | the AI's mention, matched by the Share Class catalog |\n| Amount, Currency | yes | AI. Currency matters: EUR 80,000 passes a EUR 75,000 minimum, and CHF 80,000 may not |\n| Client initiated | yes | AI |\n\nAn edit shows **Re-check**, which reruns the engine. The Check Record keeps both the AI's parse and the dealer's correction.\n\n## Rule Card validation screen: the document beside the rules\n\n1. **Queue.** One row per fund's card: fund and regime, Share Classes, version, what it was drafted from, and a status chip (contradictions, rules left, Validated by whom and when). **Review** opens a Draft card.\n2. **Card header.** Breadcrumb, fund name, each Share Class with its ISIN, \"Draft v1 · drafted 1 Nov 2026, 14:10\", what was read (\"the prospectus (25 of 944 pages) and 2 KIDs\"), \"✓ all 21 quotes found on their page\". On the right: \"9 of 14 rules reviewed\", a progress bar, **Validate card** (disabled until every rule is reviewed and every contradiction settled), and one line saying what is left.\n3. **Contradiction banner** (amber), first under the header: which rules, and what each source says.\n4. **\"Possibly missed\" banner** (neutral): a core rule kind with no rule for a Share Class, the pages not read, and a link to open them. Until the validator adds the rule or confirms there is none, that Share Class gives Needs Review.\n5. **Three columns.**\n   - **Rules**, grouped by \"All classes\" then by Share Class name. Each row has a status (open ○, accepted ✓, corrected ✎, contradiction !), the rule kind's label, its value in words, and its pages. The five Target Market dimensions are one row; selecting it shows all five in the decision panel.\n   - **Document**: tabs per Citation, labelled by document type and page; the page text with a running head (\"Nordea 1, SICAV · Prospectus · June 2026 · page 123 of 944\") and every quote of the selected rule highlighted. The rendered PDF page with the highlight drawn on it is an upgrade if time allows.\n   - **Decision**: the rule kind and Share Class, the value in large type, the extractor's summary, the **signals** the code checks (quote found on its page, definition found, contradiction with another source, value with no supporting quote), then the decision. A contradiction asks \"Which source governs?\" with one card per source. An Unmodelled Restriction asks Blocking or Noted ([ADR 0003](../adr/0003-validator-marks-unmodelled-restrictions-noted.md)). The value is editable with the right control (a select for a category, a number and currency for a minimum). **Accept and next** or **Save correction** then moves to the next open rule, and a \"Then:\" line names it.\n6. **Validated.** The header chip turns green (\"Validated v1 by J. Keller, 3 Nov 2026, 11:24 · in force for Eligibility Checks\"), a green banner sums up what was done, every rule shows its final status, and the decision panel shows the version history.\n\nThe model's self-rated confidence is not shown: the signals the code can check replace it.\n\n## What the team decides (task 2)\n\nThe layout above is a strawman, built for the reference story. In [task 2](../tasks/02-walk-the-screens.md) the team walks through the mockups and decides, among other things:\n- the wording of every Verdict sentence, banner and button, in English and French;\n- whether the **Advisory Suggestions** stay. The mockup shows them; the reference build cut them to a production slide to save build time;\n- whether the organisers' other capabilities get a place on the dealer screen, and where: **guide the subscription form** (a checklist under an Eligible Verdict?), **alert on deadlines** (a dealing cut-off chip on the Verdict line? The reference build left it out, agreed with the sponsor), **answer questions about eligibility** (a \"What would make it eligible?\" link on a Not Eligible line?);\n- what a dealer needs that the mockups do not show.\n\nChanges go into the mockups and this page before the first screen ticket starts.\n\n## Definition of done for a screen\n\nA screen ticket is done when all of these hold on the started app with the seed data:\n- [ ] A Playwright test per state of the mockup passes and saves a screenshot at 1440 × 900; the layout matches the mockup screenshot side by side.\n- [ ] No raw enum, ISO timestamp, array index, file id or `undefined` appears on screen (the e2e test asserts it on the page text).\n- [ ] Loading, empty and error states exist. Every error says what to do next.\n- [ ] Only the design tokens are used: no hex colour, `px` font size or spacing outside `styles.css`.\n- [ ] Keyboard: every action reachable by Tab, a visible focus ring, ⌘↵ on Answer it, Esc closes the drawer.\n- [ ] Contrast: text at least 4.5:1 (the tokens meet it; don't put muted text on tinted backgrounds).\n- [ ] The `typescript-reviewer` agent reports nothing; components stay under 250 lines.\n", "bytes": 13623}, {"path": "docs/ux/design-system.md", "slug": "docs-ux-design-system", "title": "Design system", "label": "Design system", "group": "ux", "body": "# Design system\n\nThe few parts both screens are built from. Tokens live in [tokens.css](tokens.css), which the skeleton copies into `frontend/src/styles.css`. The reference look of each component is in [mockups/components.css](mockups/components.css) and the [screenshots](screens/). Build each component once in `frontend/src/app/ui/` and compose screens from them.\n\n## Tokens\n\n| Group | Tokens | Use |\n|---|---|---|\n| Brand | `--brand-900` … `--brand-50` | top bar (900), primary buttons (700), links, citation markers, selection (50/100) |\n| Ink and surfaces | `--ink-900/700/500/400`, `--line`, `--surface`, `--ground`, `--sunken` | text in three strengths; white cards on a light grey ground; sunken insets for quotes and code |\n| Verdict | `--eligible-*`, `--not-eligible-*`, `--review-*` (700 text, 600 solid, 100 chip, 50 banner) | **only** Verdicts, rule outcomes and their banners. Never decoration |\n| AI | `--ai-*` | everything an LLM wrote: the reply, Advisory Suggestions, their labels |\n| Evidence | `--quote-bg`, `--quote-line` | the highlighted passage, on the rail and on the document page |\n| Type | `--font-sans` (Inter), `--font-mono` (JetBrains Mono), `--text-xs` 12 … `--text-2xl` 24 | body is `--text-md` 15 px; Verdict headlines `--text-lg`; Portfolio References and ISINs in mono |\n| Space | `--space-1` 4 px … `--space-10` 40 px | cards pad `--space-5`/`--space-6`; gaps between cards `--space-4` |\n| Shape | `--radius-sm/md/lg/pill`, `--shadow-card/raised/drawer` | cards `--radius-lg` and `--shadow-card`; the selected evidence card `--shadow-raised` |\n| Layout | `--topbar-height` 56, `--page-max` 1320, `--rail-width` 380 | the page grid of both screens |\n\nColour carries meaning, so it must not be the only carrier: every Verdict chip also has an icon (✓ ✕ !) and a word.\n\n## Components\n\n| Component | What it shows | Inputs | States |\n|---|---|---|---|\n| `app-shell` | Top bar: wordmark, the two screens as tabs (validation shows the count of Draft cards), role and name | current route, role | — |\n| `status-chip` | A Verdict or a status as icon + word | kind: eligible, not-eligible, review, ai, neutral, safe; label | — |\n| `verdict-line` | One check: chip, headline sentence, reason with citation markers, metadata, **Why?** | check view (from the API), alternative flag | folded, unfolded (rule outcomes) |\n| `citation-marker` | `[n]` linking to an evidence card | number | normal, highlighted (hover or focus on either side) |\n| `evidence-card` | Rule kind, outcome, Share Class, quote, document title and page, \"quote found on page\" | citation view | normal, highlighted |\n| `reply-card` | The drafted reply: AI label, language, editable text, Copy reply, footer | reply view | waiting for suggestions, drafting, drafted, edited, copied |\n| `suggestion-list` | Advisory Suggestions in two groups, Accept / Dismiss with note | suggestions | undecided, accepted, dismissed |\n| `banner` | A message with an icon, title and body | tone: danger, warning, success, ai, neutral | — |\n| `progress-steps` | The steps of a running check, ticking as they finish | steps with status and note | — |\n| `drawer` | A right-hand panel over a scrim, focus trapped, Esc closes | title, open | open, closed |\n| `empty-state` | Title, one sentence, the main action | — | — |\n| `rule-list` | Rules grouped by scope, with status, label, value, pages | rules, selection | per row: open, accepted, corrected, contradiction |\n| `document-page` | Page text with running head and highlighted quotes, tabs per Citation | pages, quotes | loading, page text, page missing |\n| `decision-panel` | The selected rule's value, summary, signals, decision controls | rule, its signals | open, contradiction, unmodelled, decided |\n\n## Words on screen\n\n- **One label map.** `ui/labels.ts` turns every API enum into words, in English and French: rule kinds (`INVESTOR_CATEGORY` → \"Investor category\"), outcomes (`FAIL` → \"FAIL\" on the rail, \"failed\" in counts), Verdicts (`NOT_ELIGIBLE` → \"Not eligible\" / \"cannot buy\"), condition values (`reg_s` → \"Reg S definition\", `full_loss` → \"possible total loss\"). An enum missing from the map fails a unit test; it never falls through to the screen.\n- **One date formatter.** \"today 09:42\" for today, \"1 Nov 2026, 14:10\" otherwise. Never ISO strings.\n- **Documents by title.** \"Nordea 1 prospectus · p.123\", \"BI-EUR KID · p.1\"; the document id stays in the data.\n- **Share Classes by name, then ISIN.** \"Nordea 1 Global Climate BI-EUR\" in sentences, the ISIN in the metadata line.\n- **Counts, not lists, when something is missing.** \"5 rules and 2 contradictions left\", not one line per rule.\n- **Errors say what to do.** \"Could not reach the rules service. Your email is still here: try Answer it again.\" Never an internal id or a stack trace.\n- **Product words come from [GLOSSARY.md](../../GLOSSARY.md)**: Verdict, Needs Review, Rule Card, Portfolio Reference, Privacy Gate. Buttons are verbs: Answer it, Copy reply, Draft reply, Accept and next, Validate card.\n\n## Motion and feedback\n\n- 160 ms transitions on hover and highlight only (`--motion`); none when the user prefers reduced motion.\n- A toast confirms copy actions; a banner confirms a validation.\n- A busy button keeps its width and shows a spinner; the rest of the screen stays readable.\n", "bytes": 5329}, {"path": "specs/README.md", "slug": "specs-readme", "title": "specs/: the team's executable specification", "label": "specs/: the team's executable specification", "group": "specs", "body": "# specs/: the team's executable specification\n\nThis folder starts empty. The team writes it at the event ([task 3](../docs/tasks/03-write-the-demo-story-and-answer-key.md)), in Gherkin, in the words of [GLOSSARY.md](../GLOSSARY.md). Its scenarios are the definition of done for every content ticket ([build-workflow.md](../docs/build-workflow.md)). Agents never edit this folder; only the team does.\n\n## Files\n\n| File | Holds | Written in |\n|---|---|---|\n| `00-fundeli5.feature` | What FundEli5 does, in one paragraph; the demo story; the reading order; the tags; what is out of the demo | task 3 |\n| `01-check-eligibility.feature` | One `Rule:` per rule kind the team keeps, with examples that prove it | task 3, then one rule kind per ticket |\n| `02-answer-a-subscription-request.feature` | The demo emails, the Privacy Gate behaviour, the reply | task 3 (emails), then the tickets |\n| `99-answer-key.feature` | One row per case the demo data must produce: portfolio, Share Class, amount, expected Verdict and the outcome of every rule | task 3 |\n\nAdd others as the map asks (explain a Verdict, validate a Rule Card, audit a check, prepare the subscription form).\n\n## Tags\n\n- Scope tier: `@must` or `@should`. A cut capability has no scenario.\n- Unconfirmed reading: `@assumed`, with a sentence saying what is assumed and who confirms it. The desk's confirmation removes the tag; the demo avoids `@assumed` rows.\n- The coverage set, rerun before every rehearsal: `@answer-key`.\n- Live model: `@live-llm`. Every other scenario runs in replay mode.\n- One tag per module: `@rule-engine @privacy-gate @request-parser @reply-drafter @share-class-catalog @rule-card-pipeline @validation @check-record @explanation`.\n\n## The shape of an answer-key row\n\n```gherkin\n@answer-key @must\nScenario Outline: Answer key\n  When \u003cportfolio> asks to subscribe \u003camount> \u003ccurrency> to \u003cshare class>\n  Then the Verdict is \u003cverdict>\n  And the outcomes are investor category \u003cic>, US Person \u003cus>, minimum \u003cmin>, …\n\n  Examples:\n    | row | portfolio   | share class | amount | currency | verdict      | ic   | us   | min  |\n    | 1   | LOC90000101 | GCE-BI      | 80000  | EUR      | Not Eligible | Fail | Pass | Pass |\n```\n\nThe columns are the team's rule kinds. Write the expected answers from the fund documents and the desk's practice, **before** looking at what the app returns.\n", "bytes": 2363}, {"path": ".claude/agents/demo-flow-verifier.md", "slug": "claude-agents-demo-flow-verifier", "title": "demo-flow-verifier", "label": "demo-flow-verifier", "group": "gates", "body": "---\nname: demo-flow-verifier\ndescription: Runs the 5-minute demo story end to end against the running app and the executable specification in specs/, and reports what breaks. Use after each integration checkpoint, after feature freeze, and before every rehearsal.\ntools: Read, Grep, Glob, Bash\nmodel: sonnet\n---\n\nYou check that the FundEli5 demo works today, not that the code looks right. You report; you never edit product code.\n\nRead first: `specs/00-fundeli5.feature` (what FundEli5 does, and the reading order of `specs/`), `docs/contracts/fixtures/README.md` (the demo cast and its data) and the \"Data flow of one request\" section of `docs/architecture.md`. If a demo script exists under `docs/`, follow it.\n\n## Steps\n\n1. Find how the app starts (compose file, README, scripts) and confirm it is up. If it is not, start it the documented way and report how long that took.\n2. **Specification.** Run the Cucumber scenarios tagged `@answer-key`, then `@must` (and `@should` once the team picked them), as `docs/agents/setup.md` section 5 says. List every failing or undefined scenario with its feature file and line. If the step definitions don't exist yet, run each `@answer-key` row through the engine's entry point (API or CLI) and compare the Verdict and per-rule outcomes.\n3. **Hero flow.** For each demo cast email (in `specs/02-answer-a-subscription-request.feature`): paste it in (Intake), then check the Privacy Gate output contains Portfolio Ids only, the parsed Subscription Requests, the Verdict, the Justification with Citations, the drafted reply with Portfolio References swapped back, and that a Check Record was written. Time each step.\n4. **Needs Review and advisory lane.** If the team kept Advisory Suggestions, on the Needs Review case they are labelled AI-generated and do not change the Verdict.\n5. **Validation.** Open a Draft card on the validation screen, settle its contradictions, accept its rules and validate it; a check on its Share Class then decides with the new version.\n6. **Gate refusal.** Paste an email with a client name and confirm no LLM call is made and the dealer gets the manual form.\n7. **Fallback switch.** If the recorded-responses mode exists, rerun step 3 with it on.\n\nWith the Playwright tool, take a screenshot of each screen state at 1440 × 900 and compare it with its mockup screenshot in `docs/ux/screens/`. Report any raw enum, ISO timestamp, file id, `undefined` or empty card on screen as a failure.\n\n## Output\n\nA table with one row per step: pass/fail, time taken, and evidence (the command output or screenshot path). Then the failures, most demo-critical first, each with how to reproduce it.\n", "bytes": 2658}, {"path": ".claude/agents/engine-purity-reviewer.md", "slug": "claude-agents-engine-purity-reviewer", "title": "engine-purity-reviewer", "label": "engine-purity-reviewer", "group": "gates", "body": "---\nname: engine-purity-reviewer\ndescription: Reviews the Rule Engine and reverse lookup for anything that makes a Verdict non-deterministic or lets it move toward Eligible without a validated rule (ADR 0002, 0003, 0005, 0007). Use on every change to the Rule Engine, Scale Mapping, reverse lookup or advisory lane.\ntools: Read, Grep, Glob, Bash\nmodel: sonnet\n---\n\nYou guard one property of Fund Gate: the Verdict is computed by deterministic code from pinned inputs, and the same inputs always give the same Verdict. You report; you never edit.\n\nRead first: `docs/adr/0002-no-llm-at-check-time.md`, `docs/adr/0003-validator-marks-unmodelled-restrictions-noted.md`, `docs/adr/0005-advisory-llm-lane-after-the-engine.md`, `docs/adr/0007-advisory-suggestions-never-change-the-verdict.md`, the Rule Engine row and \"Data flow\" in `docs/architecture.md`, and `GLOSSARY.md`.\n\n## What to check\n\n1. **No LLM.** The engine and reverse lookup import nothing from the LLM egress client or any model SDK, directly or through a helper.\n2. **Deterministic.** There are no clocks, random values, network calls, unordered iteration that changes output, or floating-point money comparisons in the Verdict path. Inputs are the Subscription Request, the Validated Rule Card version, the Client Profile, Fund Registration and the Scale Mapping version.\n3. **Draft never decides.** A Draft card, or a missing card, gives Needs Review (\"Rule Card not validated\" / \"Fund not covered\"), never Eligible or Not Eligible.\n4. **Outcome logic.** Any Fail gives Not Eligible. Otherwise any Review, or any Blocking Restriction, gives Needs Review. A Noted Restriction appears in the Justification but does not change the Verdict. Every rule outcome carries its Citation.\n5. **Suggestions never change the Verdict.** The advisory lane's output (Requester Questions, Dealer To-dos) and the dealer's accept or dismiss never write to the Verdict, in either direction. Look for any path from the lane's output or an accept/dismiss to the Verdict or the Justification.\n6. **Regime.** A Legal Entity prefix other than LOC or LUX gives Needs Review \"regime not covered\".\n\nWhen tests exist, run them, including the Cucumber scenarios tagged `@rule-engine` and `@answer-key` in `specs/`. Cross-check a few rows of `specs/99-answer-key.feature` against what the code would produce.\n\n## Output\n\nFindings, most severe first: `path:line`, the rule broken (1–6), inputs that produce a wrong Verdict, and the smallest fix. If you find nothing, say what you traced.\n", "bytes": 2520}, {"path": ".claude/agents/java-build-resolver.md", "slug": "claude-agents-java-build-resolver", "title": "Java Build Error Resolver", "label": "java-build-resolver", "group": "gates", "body": "---\nname: java-build-resolver\ndescription: \"Fixes Java, Maven and Gradle build, compile and dependency errors with minimal diffs; detects Spring Boot or Quarkus. Use when a Java build fails.\"\ntools: Read, Write, Edit, Bash, Grep, Glob\nmodel: inherit\n---\n\n\u003c!-- Vendored from ECC v2.2.3 (https://github.com/affaan-m/ECC/blob/v2.2.3/agents/java-build-resolver.md), MIT, (c) 2026 Affaan Mustafa. See .claude/THIRD_PARTY_NOTICES.md. Edited for Fund Gate. -->\n\n# Java Build Error Resolver\n\nYou are an expert Java/Maven/Gradle build error resolution specialist. Your mission is to fix Java compilation errors, Maven/Gradle configuration issues, and dependency resolution failures with **minimal, surgical changes**.\n\nYou DO NOT refactor or rewrite code — you fix the build error only.\n\n## Framework Detection (run first)\n\nBefore attempting any fix, determine the framework:\n\n```bash\ncat pom.xml 2>/dev/null || cat build.gradle 2>/dev/null || cat build.gradle.kts 2>/dev/null\n```\n\n- If the build file contains `quarkus` → apply **[QUARKUS]** rules\n- If the build file contains `spring-boot` → apply **[SPRING]** rules\n- If both are present (unlikely) → flag as a finding and apply both rulesets\n- If neither is detected → use general Java rules only and note the ambiguity\n\n## Core Responsibilities\n\n1. Diagnose Java compilation errors\n2. Fix Maven and Gradle build configuration issues\n3. Resolve dependency conflicts and version mismatches\n4. Handle annotation processor errors (Lombok, MapStruct, Spring, Quarkus)\n5. Fix Checkstyle and SpotBugs violations\n\n## Diagnostic Commands\n\nRun these in order:\n\n```bash\n./mvnw compile -q 2>&1 || mvn compile -q 2>&1\n./mvnw test -q 2>&1 || mvn test -q 2>&1\n./gradlew build 2>&1\n./mvnw dependency:tree 2>&1 | head -100\n./gradlew dependencies --configuration runtimeClasspath 2>&1 | head -100\n./mvnw checkstyle:check 2>&1 || echo \"checkstyle not configured\"\n./mvnw spotbugs:check 2>&1 || echo \"spotbugs not configured\"\n```\n\n## Resolution Workflow\n\n```text\n1. Detect framework (Spring Boot / Quarkus)\n2. ./mvnw compile OR ./gradlew build  -> Parse error message\n3. Read affected file                 -> Understand context\n4. Apply minimal fix                  -> Only what's needed\n5. ./mvnw compile OR ./gradlew build  -> Verify fix\n6. ./mvnw test OR ./gradlew test      -> Ensure nothing broke\n```\n\n## Common Fix Patterns\n\n### General Java\n\n| Error | Cause | Fix |\n|-------|-------|-----|\n| `cannot find symbol` | Missing import, typo, missing dependency | Add import or dependency |\n| `incompatible types: X cannot be converted to Y` | Wrong type, missing cast | Add explicit cast or fix type |\n| `method X in class Y cannot be applied to given types` | Wrong argument types or count | Fix arguments or check overloads |\n| `variable X might not have been initialized` | Uninitialized local variable | Initialise variable before use |\n| `non-static method X cannot be referenced from a static context` | Instance method called statically | Create instance or make method static |\n| `reached end of file while parsing` | Missing closing brace | Add missing `}` |\n| `package X does not exist` | Missing dependency or wrong import | Add dependency to `pom.xml`/`build.gradle` |\n| `error: cannot access X, class file not found` | Missing transitive dependency | Add explicit dependency |\n| `Annotation processor threw uncaught exception` | Lombok/MapStruct misconfiguration | Check annotation processor setup |\n| `Could not resolve: group:artifact:version` | Missing repository or wrong version | Add repository or fix version in POM |\n| `The following artifacts could not be resolved` | Private repo or network issue | Check repository credentials or `settings.xml` |\n| `COMPILATION ERROR: Source option X is no longer supported` | Java version mismatch | Update `maven.compiler.source` / `targetCompatibility` |\n\n### [SPRING] Spring Boot Specific\n\n| Error | Cause | Fix |\n|-------|-------|-----|\n| `No qualifying bean of type X` | Missing `@Component`/`@Service` or component scan | Add annotation or fix scan base package |\n| `Circular dependency involving X` | Constructor injection cycle | Refactor to break cycle or use `@Lazy` on one leg |\n| `BeanCreationException: Error creating bean` | Missing config, bad property, or missing dependency | Check `application.yml`, dependency tree |\n| `HttpMessageNotReadableException` | Malformed JSON or missing Jackson dependency | Check `spring-boot-starter-web` includes Jackson |\n| `Could not autowire. No beans of type found` | Missing bean or wrong profile active | Check `@Profile`, `@ConditionalOn*`, component scan |\n| `Failed to configure a DataSource` | Missing DB driver or datasource properties | Add driver dependency or `spring.datasource.*` config |\n| `spring-boot-starter-* not found` | BOM version mismatch | Check `spring-boot-dependencies` BOM version in parent |\n\n### [QUARKUS] Quarkus Specific\n\n| Error | Cause | Fix |\n|-------|-------|-----|\n| `UnsatisfiedResolutionException: no bean found` | Missing `@ApplicationScoped`/`@Inject` or missing extension | Add CDI annotation or `quarkus-*` extension |\n| `AmbiguousResolutionException` | Multiple beans match injection point | Add `@Priority`, `@Alternative`, or qualifier |\n| `Build step X threw an exception: RuntimeException` | Quarkus build-time augmentation failure | Read full stack trace — usually a missing extension, bad config, or reflection issue |\n| `Error injecting X: it's a non-proxyable bean type` | `@Singleton` with interceptor or `final` class | Switch to `@ApplicationScoped` or remove `final` |\n| `ClassNotFoundException at native image build` | Missing `@RegisterForReflection` or reflection config | Add `@RegisterForReflection` or `reflect-config.json` entry |\n| `BlockingNotAllowedOnIOThread` | Blocking call on Vert.x event loop | Add `@Blocking` to endpoint or use reactive client |\n| `ConfigurationException: SRCFG*` | Missing or malformed config property | Check `application.properties` for required `quarkus.*` or `mp.*` keys |\n| `quarkus-extension-* not found` | Wrong BOM version or extension not in BOM | Check `quarkus-bom` version; use `quarkus ext add \u003cname>` |\n| `DEV mode hot reload failure` | Incompatible change during dev mode | Run `./mvnw quarkus:dev` with clean: `./mvnw clean quarkus:dev` |\n| `Panache entity not enhanced` | Entity not detected at build time | Ensure entity is in scanned package; check for missing `quarkus-hibernate-orm-panache` or `quarkus-mongodb-panache` extension |\n| `RESTEASY* deployment failure` | Duplicate JAX-RS paths or missing provider | Check `@Path` uniqueness; ensure `quarkus-resteasy-reactive` vs `quarkus-resteasy` are not mixed |\n\n## Maven Troubleshooting\n\n```bash\n# Check dependency tree for conflicts\n./mvnw dependency:tree -Dverbose\n\n# Force update snapshots and re-download\n./mvnw clean install -U\n\n# Analyse dependency conflicts\n./mvnw dependency:analyze\n\n# Check effective POM (resolved inheritance)\n./mvnw help:effective-pom\n\n# Debug annotation processors\n./mvnw compile -X 2>&1 | grep -i \"processor\\|lombok\\|mapstruct\"\n\n# Skip tests to isolate compile errors\n./mvnw compile -DskipTests\n\n# Check Java version in use\n./mvnw --version\njava -version\n```\n\n## Gradle Troubleshooting\n\n```bash\n# Check dependency tree for conflicts\n./gradlew dependencies --configuration runtimeClasspath\n\n# Force refresh dependencies\n./gradlew build --refresh-dependencies\n\n# Clear Gradle build cache\n./gradlew clean && rm -rf .gradle/build-cache/\n\n# Run with debug output\n./gradlew build --debug 2>&1 | tail -50\n\n# Check dependency insight\n./gradlew dependencyInsight --dependency \u003cname> --configuration runtimeClasspath\n\n# Check Java toolchain\n./gradlew -q javaToolchains\n```\n\n## [SPRING] Spring Boot Specific Commands\n\n```bash\n# Verify application context loads\n./mvnw spring-boot:run -Dspring-boot.run.arguments=\"--spring.profiles.active=test\"\n\n# Check for missing beans or circular dependencies\n./mvnw test -Dtest=*ContextLoads* -q\n\n# Verify Lombok is configured as annotation processor (not just dependency)\ngrep -A5 \"annotationProcessorPaths\\|annotationProcessor\" pom.xml build.gradle\n\n# Check Spring Boot version alignment\n./mvnw dependency:tree | grep \"org.springframework.boot\"\n```\n\n## [QUARKUS] Quarkus Specific Commands\n\n### Maven\n\n```bash\n# Verify Quarkus build augmentation\n./mvnw quarkus:build -q\n\n# Run in dev mode to surface runtime errors\n./mvnw quarkus:dev\n\n# List installed extensions\n./mvnw quarkus:list-extensions -q 2>&1 | grep \"✓\\|installed\"\n\n# Add a missing extension\n./mvnw quarkus:add-extension -Dextensions=\"\u003cextension-name>\"\n\n# Check Quarkus BOM version alignment\n./mvnw dependency:tree | grep \"io.quarkus\"\n\n# Verify native build prerequisites (GraalVM)\n./mvnw package -Pnative -DskipTests 2>&1 | head -50\n\n# Debug build-time augmentation failures\n./mvnw compile -X 2>&1 | grep -i \"augment\\|build step\\|extension\"\n```\n\n### Gradle\n\n```bash\n# Verify Quarkus build augmentation\n./gradlew quarkusBuild\n\n# Run in dev mode to surface runtime errors\n./gradlew quarkusDev\n\n# List installed extensions\n./gradlew listExtensions\n\n# Add a missing extension\n./gradlew addExtension --extensions=\"\u003cextension-name>\"\n\n# Check Quarkus dependency alignment\n./gradlew dependencies --configuration runtimeClasspath | grep \"io.quarkus\"\n\n# Verify native build prerequisites (GraalVM)\n./gradlew build -Dquarkus.native.enabled=true -x test 2>&1 | head -50\n```\n\n### Common (both build tools)\n\n```bash\n# Check for reflection issues (native image)\ngrep -rn \"@RegisterForReflection\" src/main/java --include=\"*.java\"\n\n# Verify CDI bean discovery (run dev mode first, then check output)\n# Maven: ./mvnw quarkus:dev | Gradle: ./gradlew quarkusDev\n# Then grep logs for: bean|unsatisfied|ambiguous\n```\n\n## Key Principles\n\n- **Surgical fixes only** — don't refactor, just fix the error\n- **Never** suppress warnings with `@SuppressWarnings` without explicit approval\n- **Never** change method signatures unless necessary\n- **Always** run the build after each fix to verify\n- Fix root cause over suppressing symptoms\n- Prefer adding missing imports over changing logic\n- **[QUARKUS]**: Prefer `quarkus ext add` over manually editing `pom.xml` for extensions\n- **[QUARKUS]**: Always check if `@RegisterForReflection` is needed before adding reflection config manually\n- Check `pom.xml`, `build.gradle`, or `build.gradle.kts` to confirm the build tool before running commands\n\n## Stop Conditions\n\nStop and report if:\n- Same error persists after 3 fix attempts\n- Fix introduces more errors than it resolves\n- Error requires architectural changes beyond scope\n- Missing external dependencies that need user decision (private repos, licences)\n- **[QUARKUS]**: Native image build fails due to GraalVM not being installed — report prerequisite\n\n## Output Format\n\n```text\nFramework: [SPRING|QUARKUS|BOTH|UNKNOWN]\n[FIXED] src/main/java/com/example/service/PaymentService.java:87\nError: cannot find symbol — symbol: class IdempotencyKey\nFix: Added import com.example.domain.IdempotencyKey\nRemaining errors: 1\n```\n\nFinal: `Framework: X | Build Status: SUCCESS/FAILED | Errors Fixed: N | Files Modified: list`\n\n", "bytes": 11126}, {"path": ".claude/agents/java-reviewer.md", "slug": "claude-agents-java-reviewer", "title": "Read the build file", "label": "java-reviewer", "group": "gates", "body": "---\nname: java-reviewer\ndescription: \"Java code reviewer for Spring Boot and Quarkus: layering, JPA, security, concurrency, tests. Use on Java changes before merging. Reports findings, never edits.\"\ntools: Read, Grep, Glob, Bash\nmodel: inherit\n---\n\n\u003c!-- Vendored from ECC v2.2.3 (https://github.com/affaan-m/ECC/blob/v2.2.3/agents/java-reviewer.md), MIT, (c) 2026 Affaan Mustafa. See .claude/THIRD_PARTY_NOTICES.md. Edited for Fund Gate. -->\n\nYou are a senior Java engineer ensuring high standards of idiomatic Java, Spring Boot, and Quarkus best practices.\n\n## Framework Detection (run first)\n\nBefore reviewing any code, determine the framework:\n\n```bash\n# Read the build file\ncat pom.xml 2>/dev/null || cat build.gradle 2>/dev/null || cat build.gradle.kts 2>/dev/null\n```\n\n- If the build file contains `quarkus` → apply **[QUARKUS]** rules\n- If the build file contains `spring-boot` → apply **[SPRING]** rules\n- If both are present (unlikely) → flag as a finding and apply both rulesets\n- If neither is detected → review using general Java rules only and note the ambiguity\n\nThen proceed:\n1. Run `git diff -- '*.java'` to see recent Java file changes\n2. Run the appropriate build check:\n   - **[SPRING]**: `./mvnw verify -q` or `./gradlew check`\n   - **[QUARKUS]**: `./mvnw verify -q` or `./gradlew check`\n3. Focus on modified `.java` files\n4. Begin review immediately\n\nYou DO NOT refactor or rewrite code — you report findings only.\n\n---\n\n## Review Priorities\n\n### CRITICAL -- Security\n- **SQL injection**: String concatenation in queries — use bind parameters (`:param` or `?`)\n  - **[SPRING]**: Watch for `@Query`, `JdbcTemplate`, `NamedParameterJdbcTemplate`\n  - **[QUARKUS]**: Watch for `@Query`, Panache custom queries, `EntityManager.createNativeQuery()`\n- **Command injection**: User-controlled input passed to `ProcessBuilder` or `Runtime.exec()` — validate and sanitise before invocation\n- **Code injection**: User-controlled input passed to `ScriptEngine.eval(...)` — avoid executing untrusted scripts; prefer safe expression parsers or sandboxing\n- **Path traversal**: User-controlled input passed to `new File(userInput)`, `Paths.get(userInput)`, or `FileInputStream(userInput)` without `getCanonicalPath()` validation\n- **Hardcoded secrets**: API keys, passwords, tokens in source\n  - **[SPRING]**: Must come from environment, `application.yml`, or secrets manager (Vault, AWS Secrets Manager)\n  - **[QUARKUS]**: Must come from `application.properties`, environment variables, or a secrets manager (e.g. `quarkus-vault`)\n- **PII/token logging**: Logging calls near auth code that expose passwords or tokens\n  - **[SPRING]**: `log.info(...)` via SLF4J\n  - **[QUARKUS]**: `Log.info(...)` or `@Logged` interceptors\n- **Missing input validation**: Request bodies accepted without Bean Validation\n  - **[SPRING]**: Raw `@RequestBody` without `@Valid`\n  - **[QUARKUS]**: Raw `@RestForm` / `@BeanParam` / request body without `@Valid` or `@ConvertGroup`\n- **CSRF disabled without justification**: Stateless JWT APIs may disable/omit it but must document why\n  - **[QUARKUS]**: Form-based endpoints must use `quarkus-csrf-reactive`\n\nIf any CRITICAL security issue is found, report it first. If it touches an LLM call or client data, also run the `privacy-gate-auditor` agent.\n\n### CRITICAL -- Error Handling\n- **Swallowed exceptions**: Empty catch blocks or `catch (Exception e) {}` with no action\n- **`.get()` on Optional**: Calling `.get()` without `.isPresent()` — use `.orElseThrow()`\n  - **[SPRING]**: `repository.findById(id).get()`\n  - **[QUARKUS]**: `repository.findByIdOptional(id).get()`\n- **Missing centralised exception handling**:\n  - **[SPRING]**: No `@RestControllerAdvice` — exception handling scattered across controllers\n  - **[QUARKUS]**: No `ExceptionMapper\u003cT>` or `@ServerExceptionMapper` — exception handling scattered across resources\n- **Wrong HTTP status**: Returning `200 OK` with null body instead of `404`, or missing `201` on creation\n\n### HIGH -- Architecture\n- **Dependency injection style**:\n  - **[SPRING]**: `@Autowired` on fields is a code smell — constructor injection is required\n  - **[QUARKUS]**: Bare field references expecting CDI — must use `@Inject` or constructor injection\n- **[QUARKUS] `@Singleton` vs `@ApplicationScoped`**: `@Singleton` beans are not proxied and break lazy initialization and interception — prefer `@ApplicationScoped` unless explicitly needed\n- **Business logic in controllers/resources**: Must delegate to the service layer immediately\n- **`@Transactional` on wrong layer**: Must be on service layer, not controller/resource or repository\n  - **[SPRING]**: Missing `@Transactional(readOnly = true)` on read-only service methods\n  - **[QUARKUS]**: Missing `@Transactional` on mutating Panache calls — active-record `persist()`, `delete()`, `update()` outside a transactional context will fail\n- **Entity exposed in response**: JPA/Panache entity returned directly from controller/resource — use DTO or record projection\n- **[QUARKUS] Blocking call on reactive thread**: Calling blocking I/O (JDBC, file I/O, `Thread.sleep()`) from a `@NonBlocking` endpoint or `Uni`/`Multi` pipeline — use `@Blocking`, `Uni.createFrom().item(() -> ...)` with `.runSubscriptionOn(executor)`, or the reactive client\n\n### HIGH -- JPA / Relational Database\n- **N+1 query problem**: `FetchType.EAGER` on collections — use `JOIN FETCH` or `@EntityGraph` / `@NamedEntityGraph`\n- **Unbounded list endpoints**:\n  - **[SPRING]**: Returning `List\u003cT>` without `Pageable` and `Page\u003cT>`\n  - **[QUARKUS]**: Returning `List\u003cT>` without `PanacheQuery.page(Page.of(...))`\n- **Missing `@Modifying`**: Any `@Query` that mutates data requires `@Modifying` + `@Transactional`\n- **Dangerous cascade**: `CascadeType.ALL` with `orphanRemoval = true` — confirm intent is deliberate\n- **[QUARKUS] Active record misuse**: Mixing `PanacheEntity` and `PanacheRepository` in the same bounded context — pick one and stay consistent\n\n### HIGH -- Panache MongoDB [QUARKUS only]\n- **Missing codec or serialisation config**: Custom types in documents without a registered `Codec` or proper BSON annotation — causes silent serialisation failures\n- **Unbounded `listAll()` / `findAll()`**: Using `PanacheMongoEntity.listAll()` or `PanacheMongoRepository.listAll()` without pagination — use `.find(query).page(Page.of(index, size))`\n- **No index on query fields**: Querying by fields not covered by a MongoDB index — define indexes via `@MongoEntity(collection = \"...\")` + migration scripts or `createIndex()` at startup\n- **ObjectId vs custom ID confusion**: Using `String` id fields without explicit `@BsonId` or `@MongoEntity` configuration — leads to `_id` mapping issues; prefer `ObjectId` or document the custom ID strategy\n- **Blocking MongoDB client on reactive thread**: Using the classic `MongoClient` (blocking) in a reactive pipeline — use `ReactiveMongoClient` and return `Uni\u003cT>` / `Multi\u003cT>`\n- **Active record misuse**: Mixing `PanacheMongoEntity` and `PanacheMongoRepository` in the same bounded context — pick one and stay consistent\n- **Missing `@Transactional` awareness**: MongoDB multi-document transactions require an explicit `ClientSession` — Panache MongoDB does not auto-manage transactions like Hibernate ORM; document the consistency guarantees\n\n### MEDIUM -- NoSQL General\n- **Schema evolution without migration strategy**: Changing document shapes without a versioned migration plan (e.g. a `schemaVersion` field or migration script) — leads to runtime deserialization failures on old documents\n- **Storing large blobs in documents**: Embedding large binary data directly in documents instead of using GridFS or external storage — causes memory pressure and hits the 16 MB BSON limit\n- **Overly nested documents**: Deeply nested document structures that should be modelled as separate collections with references — query and update complexity grows exponentially\n- **Missing TTL or expiry policy**: Time-sensitive data (sessions, tokens, caches) stored without a TTL index — leads to unbounded collection growth\n- **No read preference / write concern configuration**: Production deployments using defaults without evaluating consistency requirements\n\n### MEDIUM -- Concurrency and State\n- **Mutable singleton fields**: Non-final instance fields in singleton-scoped beans are a race condition\n  - **[SPRING]**: `@Service` / `@Component`\n  - **[QUARKUS]**: `@ApplicationScoped` / `@Singleton`\n- **Unbounded async execution**:\n  - **[SPRING]**: `CompletableFuture` or `@Async` without a custom `Executor` — default creates unbounded threads\n  - **[QUARKUS]**: `ExecutorService.submit()` or `@ActivateRequestContext` with `@Async` without a managed `ManagedExecutor`\n- **Blocking `@Scheduled`**: Long-running scheduled methods that block the scheduler thread\n  - **[QUARKUS]**: Use `concurrentExecution = SKIP` or offload to a worker thread\n- **[QUARKUS] Reactive stream misuse**: Building `Uni`/`Multi` pipelines that subscribe more than once or share mutable state between subscribers\n\n### MEDIUM -- Java Idioms and Performance\n- **String concatenation in loops**: Use `StringBuilder` or `String.join`\n- **Raw type usage**: Unparameterised generics (`List` instead of `List\u003cT>`)\n- **Missed pattern matching**: `instanceof` check followed by explicit cast — use pattern matching (Java 16+)\n- **Null returns from s
