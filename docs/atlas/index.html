sions, not deliverables.\n\n## Refer by name\n\nEvery map and ticket is an issue, so it has a **name**: its title. In everything the human reads (narration, the map's Decisions-so-far), refer to it by that name, never by a bare id, number, or slug. A wall of `#42, #43, #44` is illegible; names read at a glance. The id and URL don't vanish; a name wraps its link, but they ride _inside_ the name, never stand in for it.\n\n## The Map\n\nThe map is a single issue on this repo's issue tracker, labelled `wayfinder:map`, the canonical artifact. Its tickets are child issues of the map.\n\nThe map is an **index**, not a store. It lists the decisions made and points at the tickets that hold their detail; a decision lives in exactly one place, its ticket, so the map never restates it, only gists it and links.\n\n**Where the map, its child tickets, blocking, and frontier queries physically live is tracker-specific.** The issue tracker should have been provided to you. If not, tell the user to run `/setup-matt-pocock-skills`. Consult the tracker doc's \"Wayfinding operations\" section for how _this_ repo expresses them. If no tracker has been provided, default to the local-markdown tracker.\n\n### The map body\n\nThe whole map at low resolution, loaded once per session. Open tickets are **not** listed: they are open child issues, found by query.\n\n```markdown\n## Destination\n\n\u003cwhat reaching the end of this map looks like: the spec, decision, or change this effort is finding its way to. One or two lines; every session orients to it before choosing a ticket.>\n\n## Notes\n\n\u003cdomain; skills every session should consult; standing preferences for this effort>\n\n## Decisions so far\n\n\u003c!-- the index: one line per closed ticket, enough to judge relevance, then zoom the link for the detail the ticket holds -->\n\n- [\u003cclosed ticket title>](link): \u003cone-line gist of the answer>\n\n## Not yet specified\n\n\u003c!-- see \"Fog of war\": in-scope fog you can't ticket yet; graduates as the frontier advances -->\n\n## Out of scope\n\n\u003c!-- see \"Out of scope\": work ruled beyond the destination; closed, never graduates -->\n```\n\n### Tickets\n\nEach ticket is a **child issue** of the map; the tracker's issue id is its identity. Its body is the question, sized to one 100K token agent session:\n\n```markdown\n## Question\n\n\u003cthe decision or investigation this ticket resolves>\n```\n\nEach ticket carries a `wayfinder:\u003ctype>` label, one of `research`, `prototype`, `grilling`, `task` (see [Ticket Types](#ticket-types)).\n\nA session **claims** a ticket by assigning it to the dev driving the map, **first**, before any work, so concurrent sessions skip it. That assignee _is_ the claim: an open, unassigned ticket is unclaimed.\n\nBlocking uses the tracker's **native** dependency relationship: essential because it renders the frontier _visually_ in the tracker's own UI, so the human sees what's takeable without opening the map. Only a tracker that lacks native blocking falls back to a body convention. A ticket is **unblocked** when every ticket blocking it is closed; the **frontier** is the open, unblocked, unclaimed children, the edge of the known.\n\nThe answer isn't part of the body; it's recorded on resolution (see [Work through the map](#work-through-the-map)). Assets created while resolving a ticket are linked from the issue, not pasted in.\n\n## Ticket Types\n\nEvery ticket is either **HITL** (human in the loop, worked _with_ a human who speaks for themselves) or **AFK**, driven by the agent alone. A HITL ticket only resolves through that live exchange; the agent never stands in for the human's side of it (a grilling agent that answers its own questions has broken this).\n\n- **Research** (AFK): Reading documentation, third-party APIs, or local resources like knowledge bases to surface a fact a decision waits on. Resolved by a subagent that calls the Skill tool with \"research\". Use when knowledge outside the current working directory is required.\n- **Prototype** (HITL): Raise the fidelity of the discussion by making a cheap, rough, concrete artifact to react to (an outline, a rough take, a stub, or UI/logic code) by calling the Skill tool with \"prototype\". Links the prototype as an asset. Use when \"how should it look\" or \"how should it behave\" is the key question.\n- **Grilling** (HITL): Conversation. The default case. Always call the Skill tool twice, for \"grilling\" and \"domain-modeling\".\n- **Task** (HITL or AFK): Manual work that must happen before a _decision_ can be made: nothing to decide, prototype, or research, but the discussion is blocked until it's done. Signing up for a service so its API can be judged, provisioning access, moving data so its shape can be seen. This is the one type that _does_ rather than decides, and it earns its place by unblocking a decision, not by delivering the destination. The agent drives it alone where it can (AFK); otherwise it hands the human a precise checklist (HITL). Resolved when the work is done; the answer records what was done and any resulting facts (credentials location, new URLs, row counts) later tickets depend on.\n\n## Fog of war\n\nThe map is _deliberately_ incomplete: don't chart what you can't yet see. Beyond the live tickets lies the **fog of war**: the dim view of decisions and investigations you can tell are coming but can't yet pin down, because they hang on questions still open. Resolving a ticket clears the fog ahead of it, graduating whatever's now specifiable into fresh tickets, one at a time, until the way to the destination is clear and no tickets remain.\n\nThe map's **Not yet specified** section is where that dim view is written down: the suspected question, the area to revisit later. It's the undiscovered frontier _toward_ the destination: everything here is in scope, just not sharp enough to ticket. Write as loosely or as fully as the view allows; it doubles as a signpost for collaborators reading where the effort is headed.\n\n**Fog or ticket?** The test is whether you can state the question precisely now, _not_ whether you can answer it now.\n\n- **Ticket when** the question is already sharp, even if it's blocked and you can't act on it yet.\n- **Not yet specified when** you can't yet phrase it that sharply. Don't pre-slice the fog into ticket-sized pieces: it's coarser than a ticket, and one patch may graduate into several tickets, or none, once the frontier reaches it.\n\n**Not yet specified** excludes what's already decided (Decisions so far), what's already a live ticket, and what's out of scope (the next section).\n\n## Out of scope\n\nFog only ever gathers _toward_ the destination. The destination fixes the scope, so work beyond it is **out of scope**: it isn't fog, and it doesn't belong in **Not yet specified**. It gets its own **Out of scope** section on the map: work you've consciously ruled out of _this_ effort. Scope, not sharpness, lands it here.\n\nOut-of-scope work never graduates (the frontier stops at the destination), so it returns only if the destination is redrawn, and then as a fresh effort, not a resumption.\n\nRuling something out of scope is a scoping act, not a step on the route. When a ticket that already exists turns out to sit past the destination (mis-scoped in while charting, or exposed by a resolution), **close it** (a closed ticket is unambiguously off the frontier) and leave one line in the **Out of scope** section: the gist plus why it's out of scope, linking the closed ticket. It stays out of **Decisions so far**, which records the route actually walked; a scope boundary isn't a step on it.\n\n## Invocation\n\nTwo modes. Either way, **never resolve more than one ticket per session**, with the exception of research tickets.\n\n### Chart the map\n\nUser invokes with a loose idea.\n\n1. **Name the destination.** Call the Skill tool twice, for \"grilling\" and \"domain-modeling\", to pin down what this map is finding its way to: the spec, decision, or change. The destination fixes the scope, so it's settled first.\n2. **Map the frontier.** Grill again, **breadth-first** this time: fan out across the whole space rather than deep on any one thread, surfacing the open decisions and the first steps takeable now. **If this surfaces no fog** (the way to the destination is already clear, the whole journey small enough for one session), you don't need a map. Stop and ask the user how they'd like to proceed.\n3. **Create the map** (label `wayfinder:map`): Destination and Notes filled in, Decisions-so-far empty, the fog sketched into **Not yet specified**.\n4. **Create the tickets you can specify now** as child issues of the map, then wire blocking edges in a **second pass** (issues need ids before they can reference each other). Wiring sorts them into the frontier and the blocked; everything you can't yet specify stays in the fog: the **Not yet specified** section.\n5. **Fire the research subagents.** For each `research` ticket you just created, spin up a subagent that calls the Skill tool with \"research\" to resolve it in parallel, capturing its findings on a throwaway `research/\u003cname>` branch with a context pointer from the ticket.\n6. Stop: charting is one session's work; it hand-resolves nothing.\n\n### Work through the map\n\nUser invokes with a map (URL or number). A ticket is **optional**: without one, you pick the next decision, not the user.\n\n1. Load the **map**: the low-res view, not every ticket body.\n2. Choose the ticket. If the user named one, use it. Otherwise take the first frontier ticket in order. **Claim it**: assign it to yourself before any work.\n3. Resolve it. **Zoom as needed**: fetch the full body of any related or closed ticket on demand; call the Skill tool for whichever skills the `## Notes` block names. If in doubt, call the Skill tool twice, for \"grilling\" and \"domain-modeling\".\n4. Record the resolution: post the answer as a **resolution comment**, **close** the issue, and **append a context pointer** to the map's Decisions-so-far.\n5. Add newly-surfaced tickets (create-then-wire); graduate any fog the answer has made specifiable, clearing each graduated patch from **Not yet specified** so it lives only as its new ticket. If the answer reveals that a ticket (this one or another) sits beyond the destination, **rule it out of scope** rather than resolving it on the route. If the decision invalidates other parts of the map, update or delete those tickets.\n\nThe user may run unblocked tickets in parallel, so expect other sessions to be editing the tracker concurrently.\n", "bytes": 11908}], "links": {"README.md": {"docs/agents/setup.md": {"kind": "doc", "doc": "docs/agents/setup.md", "anchor": ""}, "docs/ux/mockups/dealer.html": {"kind": "mockup", "which": "dealer", "anchor": "", "path": "docs/ux/mockups/dealer.html"}, "docs/ux/mockups/validation.html": {"kind": "mockup", "which": "validation", "anchor": "", "path": "docs/ux/mockups/validation.html"}, "docs/tasks/README.md": {"kind": "doc", "doc": "docs/tasks/README.md", "anchor": ""}, "docs/atlas/README.md": {"kind": "doc", "doc": "docs/atlas/README.md", "anchor": ""}, "docs/tasks/01-chart-the-map.md": {"kind": "doc", "doc": "docs/tasks/01-chart-the-map.md", "anchor": ""}, "docs/tasks/02-walk-the-screens.md": {"kind": "doc", "doc": "docs/tasks/02-walk-the-screens.md", "anchor": ""}, "docs/tasks/03-write-the-demo-story-and-answer-key.md": {"kind": "doc", "doc": "docs/tasks/03-write-the-demo-story-and-answer-key.md", "anchor": ""}, "docs/build-workflow.md": {"kind": "doc", "doc": "docs/build-workflow.md", "anchor": ""}, "specs/README.md": {"kind": "doc", "doc": "specs/README.md", "anchor": ""}}, "CLAUDE.md": {}, "GLOSSARY.md": {}, "docs/adr/0001-llm-extracts-rules-engine-decides.md": {}, "docs/adr/0002-no-llm-at-check-time.md": {"0001-llm-extracts-rules-engine-decides.md": {"kind": "doc", "doc": "docs/adr/0001-llm-extracts-rules-engine-decides.md", "anchor": ""}}, " o AI at all.\u003c/p>\u003c/div>\n      \u003cdiv>\u003cdiv class=\"eyebrow\">2 · Rule Engine\u003c/div>\u003cp class=\"small\" style=\"margin:6px 0 0\">Validated Rule Cards decide every Verdict. No AI takes part in the decision.\u003c/p>\u003c/div>\n      \u003cdiv>\u003cdiv class=\"eyebrow\">3 · Reply\u003c/div>\u003cp class=\"small\" style=\"margin:6px 0 0\">The AI drafts the reply. Each claim in it cites the fund document it comes from.\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ================= WORKING (progress) ================= -->\n  \u003csection data-state=\"working\">\n    \u003cdiv class=\"card request\">\n      \u003cdiv class=\"grow\">\u003cdiv class=\"from\">Request from Marc Aebi\u003c/div>\u003cdiv class=\"subject\">Subscription Nordea Global Climate - LOC90000101, LOC90000102\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"with-rail\" style=\"margin-top: var(--space-4)\">\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"steps\">\n          \u003cdiv class=\"step done\">\u003cspan class=\"dot\">✓\u003c/span>\u003cdiv>\u003cb>Privacy Gate\u003c/b> \u003cspan class=\"note\">2 Portfolio References swapped for Portfolio Ids, no client name found\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"step done\">\u003cspan class=\"dot\">✓\u003c/span>\u003cdiv>\u003cb>Reading the request\u003c/b> \u003cspan class=\"note\">2 Subscription Requests: Nordea 1 Global Climate BI-EUR, EUR 80,000\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"step now\">\u003cspan class=\"dot\">\u003c/span>\u003cdiv>\u003cb>Checking the rules\u003c/b> \u003cspan class=\"note\">Rule Card v1, validated 2 Nov by J. Keller\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"step todo\">\u003cspan class=\"dot\">\u003c/span>\u003cdiv>Drafting the reply\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"padding: 0 var(--space-6) var(--space-6); display:flex; flex-direction:column div class=\"running\">\u003cspan>Nordea 1, SICAV · Prospectus · June 2026\u003c/span>\u003cspan>page 123 of 944\u003c/span>\u003c/div>\n        \u003ch4>Share classes\u003c/h4>\n        \u003cp>The SICAV may issue shares of the following classes in each fund. The classes differ in the investors they may be offered to, the minimum initial investment and the fees charged.\u003c/p>\n        \u003cp>\u003cb>P\u003c/b> All investors. No minimum initial investment.\u003c/p>\n        \u003cp>\u003cmark>I Institutional investors.\u003c/mark> Minimum initial investment: \u003cmark>EUR 75,000 or equivalent in other currencies\u003c/mark>, waived for funds of the Nordea group.\u003c/p>\n        \u003cp>\u003cb>X\u003c/b> Institutional investors that have a specific agreement with the management company.\u003c/p>\n        \u003cp>Shares of class I may only be acquired by institutional investors within the meaning of article 174 of the 2010 Law. The board may refuse an application for class I shares where the applicant cannot demonstrate its status.\u003c/p>\n        \u003cp class=\"muted\">Classes are available in the reference currency of the fund and in the currencies shown in the table of each fund.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- Decision -->\n    \u003cdiv class=\"card card-pad stack\" style=\"gap: var(--space-4)\" data-state=\"draft\">\n      \u003cdiv>\n        \u003cdiv class=\"eyebrow\">Investor category · BI-EUR\u003c/div>\n        \u003cdiv style=\"font-size: var(--text-lg); font-weight: 600; margin-top: 4px\">Institutional only\u003c/div>\n      \u003c/div>\n      \u003cp class=\"small\" style=\"margin:0; color: var(--ink-700)\">The prospectus restricts class I to institutional investors under art. 174 of the 2010 Law, which includes professionals investing for retail clients under a discretionary mandate. The BI-EUR KID says the fund suits all investors.\u003c/p>\n      \u003cdiv class=\"signals\">\n        \u003cdiv class=\"signal goo 17px;   /* Verdict lines, card titles */\n  --text-xl: 20px;   /* screen title */\n  --text-2xl: 24px;\n  --leading: 1.55;\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* Space: 4px scale */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n\n  /* Shape */\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 14px;\n  --radius-pill: 999px;\n  --shadow-card: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.06);\n  --shadow-raised: 0 4px 12px rgba(16, 24, 40, 0.08), 0 2px 4px rgba(16, 24, 40, 0.04);\n  --shadow-drawer: -12px 0 32px rgba(16, 24, 40, 0.14);\n\n  /* Layout */\n  --topbar-height: 56px;\n  --page-max: 1320px;\n  --rail-width: 380px;\n  --focus-ring: 0 0 0 3px rgba(43, 90, 149, 0.35);\n  --motion: 160ms cubic-bezier(0.2, 0, 0, 1);\n}\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\n:host {\n  margin: 0;\n  background: var(--ground);\n  color: var(--ink-900);\n  font-family: var(--font-sans);\n  font-size: var(--text-md);\n  line-height: var(--leading);\n  -webkit-font-smoothing: antialiased;\n}\n\ncode,\n.mono {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n}\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--focus-ring);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :host {\n    --motion: 0ms;\n  }\n}\n\n/* Mockup styles for the components of docs/ux/design-system.md. Reference for the look, not code to copy. */\n\n/* ---------- Shell ---------- */\n.topbar {\n  position: sticky; top: 0; z-index: 20;\n  height: var(--topbar-height);\n  display: flex; align-items: center; gap: var(--space-8);\n  padding: 0 var(--space-6);\n  background: var(--brand-900); color: #fff;\n}\n.wordmark { display: flex; align-items: center; gap: var(--space-2); font-weight: var(--weight-bold); font-size: var(--text-lg); letter-spacing: -0.01em; }\n.wordmark .logo { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #4f86c6, #9bc1ea); display: grid; place-items: center; font-size: 13px; color: var(--brand-900); font-weight: 800; }\n.nav { display: flex; gap: var(--space-1); height: 100%; }\n.nav a { display: flex; align-items: center; padding: 0 var(--space-3); color: #c7d4e6; text-decoration: none; font-size: var(--text-sm); font-weight: var(--weight-medium); border-bottom: 2px solid transparent; }\n.nav a.active { color: #fff; border-bottom-color: #7fb0e8; }\n.nav a .count { margin-left: var(--space-2); background: rgba(255,255,255,0.14); border-radius: var(--radius-pill); padding: 0 7px; font-size: var(--text-xs); }\n.role { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); color: #c7d4e6; }\n.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-600); color: #fff; display: grid; place-items: center; font-size: var(--text-xs); font-weight: var(--weight-semibold); }\n\n.page { max-width: var(--page-max); margin: 0 auto; padding: var(--space-6); }\n.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); }\n.page-head h1 { margin: 0; font-size: var(--text-xl); font-weight: var(--weight-semibold); letter-spacing: -0.01em; }\n.page-head .sub { color: var(--ink-500); font-size: var(--text-sm); margin-top: 2px; }\n\n.with-rail { display: grid; grid-template-columns: minmax(0, 1fr) var(--rail-width); gap: var(--space-6); align-items: start; }\n.rail { position: sticky; top: calc(var(--topbar-height) + var(--space-6)); display: flex; flex-direction: column; gap: var(--space-3); }\n.stack { display: flex; flex-direction: column; gap: var(--space-4); }\n\n/* ---------- Card ---------- */\n.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }\n.card-pad { padding: var(--space-5) var(--space-6); }\n.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--line); }\n.card-title { font-size: var(--text-md); font-weight: var(--weight-semibold); margin: 0; }\n.eyebrow { font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-500); }\n.muted { color: var(--ink-500); }\n.small { font-size: var(--text-sm); }\n.xs { font-size: var(--text-xs); }\n\n/* ---------- Buttons ---------- */\n.btn { display: inline-flex; align-items: center; gap: var(--space-2); height: 38px; padding: 0 var(--space-4); border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-900); font: inherit; font-size: var(--text-sm); font-weight: var(--weight-semibold); cursor: pointer; transition: background var(--motion); }\n.btn:hover { background: var(--sunken); }\n.btn-primary { background: var(--brand-700); border-color: var(--brand-700); color: #fff; }\n.btn-primary:hover { background: var(--brand-800); }\n.btn-primary[disabled] { background: var(--line-strong); border-color: var(--line-strong); color: var(--ink-500); cursor: not-allowed; }\n.btn-success { background: var(--eligible-600); border-color: var(--eligible-600); color: #fff; }\n.btn-ghost { border-color: transparent; background: transparent; color: var(--brand-700); }\n.btn-ghost:hover { background: var(--brand-50); }\n.btn-lg { height: 44px; padding: 0 var(--space-5); font-size: var(--text-md); }\n.kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.25); }\n.kbd.light { background: var(--sunken); border-color: var(--line-strong); color: var(--ink-500); }\n\n/* ---------- Status chip ---------- */\n.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: var(--weight-semibold); white-space: nowrap; }\n.chip .ic { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 800; }\n.chip.eligible { background: var(--eligible-100); color: var(--eligible-700); } .chip.eligible .ic { background: var(--eligible-600); }\n.chip.not-eligible { background: var(--not-eligible-100); color: var(--not-eligible-700); } .chip.not-eligible .ic { background: var(--not-eligible-600); }\n.chip.review { background: var(--review-100); color: var(--review-700); } .chip.review .ic { background: var(--review-600); }\n.chip.ai { background: var(--ai-100); color: var(--ai-700); }\n.chip.neutral { background: var(--sunken); color: var(--ink-700); border: 1px solid var(--line); }\n.chip.safe { background: var(--eligible-50); color: var(--eligible-700); border: 1px solid var(--eligible-100); }\n\n/* ---------- Request summary ---------- */\n.request { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-6); }\n.request .from { font-weight: var(--weight-semibold); }\n.request .subject { color: var(--ink-500); font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.request .grow { flex: 1; min-width: 0; }\n.gate { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--eligible-700); }\n.swap { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--sunken); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 1px 6px; color: var(--ink-700); }\n\n/* ---------- Summary strip ---------- */\n.summary { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }\n.summary .total { font-size: var(--text-sm); color: var(--ink-500); margin-right: var(--space-2); }\n\n/* ---------- Verdict line ---------- */\n.verdict { position: relative; display: grid; grid-template-columns: 128px 1fr auto; gap: var(--space-4); align-items: start; padding: var(--space-4) var(--space-6) var(--space-4) var(--space-6); border-left: 4px solid; border-radius: var(--radius-lg); }\n.verdict.eligible { border-left-color: var(--eligible-600); }\n.verdict.not-eligible { border-left-color: var(--not-eligible-600); }\n.verdict.review { border-left-color: var(--review-600); }\n.verdict .headline { font-size: var(--text-lg); line-height: 1.4; }\n.verdict .headline b { font-weight: var(--weight-bold); }\n.verdict.eligible .headline b { color: var(--eligible-700); }\n.verdict.not-eligible .headline b { color: var(--not-eligible-700); }\n.verdict.review .headline b { color: var(--review-700); }\n.verdict .why { margin-top: 2px; color: var(--ink-700); }\n.verdict .meta { margin-top: var(--space-2); display: flex; gap: var(--space-3); flex-wrap: wrap; font-size: var(--text-xs); color: var(--ink-500); }\n.portfolio { font-family: var(--font-mono); font-size: 0.9em; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 1px 6px; }\n.alt-tag { font-size: var(--text-xs); color: var(--brand-700); background: var(--brand-50); border: 1px solid var(--brand-100); border-radius: var(--radius-pill); padding: 1px 8px; vertical-align: 2px; font-weight: var(--weight-medium); }\n.link { color: var(--brand-700); text-decoration: none; font-weight: var(--weight-medium); cursor: pointer; }\n.link:hover { text-decoration: underline; }\n\n/* ---------- Citation marker ---------- */\n.cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; margin: 0 1px; border-radius: 5px; background: var(--brand-100); color: var(--brand-700); font-size: 11px; font-weight: var(--weight-bold); vertical-align: 2px; cursor: pointer; text-decoration: none; }\n.cite:hover, .cite.on { background: var(--brand-700); color: #fff; }\n\n/* (--ink-900); padding: 0 2px; border-radius: 2px; }\n.source { font-size: var(--text-xs); color: var(--ink-500); display: flex; gap: var(--space-2); align-items: center; }\n.verified { color: var(--eligible-700); font-weight: var(--weight-medium); }\n\n/* ---------- Banner ---------- */\n.banner { display: flex; gap: var(--space-4); align-items: flex-start; padding: var(--space-4) var(--space-5); border-radius: var(--radius-lg); border: 1px solid; }\n.banner .bi { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; }\n.banner h3 { margin: 0 0 2px; font-size: var(--text-md); }\n.banner p { margin: 0; font-size: var(--text-sm); color: var(--ink-700); }\n.banner.danger { background: var(--not-eligible-50); border-color: var(--not-eligible-100); } .banner.danger .bi { background: var(--not-eligible-600); }\n.banner.warning { background: var(--review-50); border-color: #fde68a; } .banner.warning .bi { background: var(--review-600); }\n.banner.success { background: var(--eligible-50); border-color: var(--eligible-100); } .banner.success .bi { background: var(--eligible-600); }\n.banner.ai { background: var(--ai-50); border-color: var(--ai-100); border-style: dashed; } .banner.ai .bi { background: var(--ai-600); }\n\n/* ---------- Suggestions ---------- */\n.suggestion { display: grid; grid-template-columns: 1fr auto; gap: var(--space-1) var(--space-4); padding: var(--space-3) 0; border-top: 1px solid var(--ai-100); }\n.suggestion:first-of-type { border-top: 0; }\n.suggestion .q { font-weight: var(--weight-semibold); }\n.suggestion .d { grid-column: 1; font-size: var(--text-sm); color: var(--ink-700); }\n.suggestion .acts { grid-row: span 2; display: flex; gap: var(--space-2); align-items: center; }\n.suggestion.accepted .q::before { content: \"✓ \"; color: var(--eligible-600); }\n.group-title { margin: var(--space-3) 0 0; font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ai-700); }\n\n/* ---------- Disclosure ---------- */\ndetails.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-6); font-weight: var(--weight-semibold); }\ndetails.fold > summary::-webkit-details-marker { display: none; }\ndetails.fold > summary::before { content: \"›\"; display: inline-block; width: 12px; color: var(--ink-500); font-size: 20px; line-height: 1; transition: transform var(--motion); }\ndetails.fold[open] > summary::before { transform: rotate(90deg); }\n\n/* ---------- Table ---------- */\n.table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }\n.table th { text-align: left; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.05em; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); }\n.table td { padding: var(--space-3); border-bottom: 1px solid var(--line); vertical-align: top; }\n\n/* ---------- Form ---------- */\n.field { display: flex; flex-direction: column; gap: var(--space-1); }\n.field label { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--ink-700); }\n.field .hint { font-size: var(--text-xs); color: var(--ink-500); }\n.input, select.input, textarea.input { height: 38px; padding: 0 var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); font: inherit; font-size: var(--text-sm); background: var(--surface); color: var(--ink-900); }\ntextarea.input { height: auto; padding: var(--space-3); line-height: 1.6; resize: vertical; }\n.input[readonly] { background: var(--sunken); color: var(--ink-700); font-family: var(--font-mono); }\n.form-row { display: grid; grid-template-columns: 1.1fr 2fr 1fr 0.8fr auto; gap: var(--space-3); align-items: end; }\n\n/* ---------- Drawer ---------- */\n.scrim { position: fixed; inset: 0; background: rgba(15, 36, 64, 0.28); z-index: 30; }\n.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 92vw); background: var(--surface); box-shadow: var(--shadow-drawer); z-index: 31; overflow-y: auto; }\n.drawer-head { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--line); }\n.drawer-body { padding: var(--space-5) var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }\n.llm-call { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }\n.llm-call header { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) var(--space-4); background: var(--sunken); border-bottom: 1px solid var(--line); }\n.llm-call .body { padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }\npre.prompt { margin: 0; padding: var(--space-3); background: var(--brand-900); color: #dbe6f5; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; }\npre.prompt .pid { color: #9be3b1; }\n.field-tag { font-family: var(--font-mono); font-size: 11px; background: var(--eligible-50); color: var(--eligible-700); border: 1px solid var(--eligible-100); border-radius: 4px; padding: 0 5px; }\n\n/* ---------- Empty / progress ---------- */\n.paste { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }\n.paste textarea { min-height: 220px; font-size: var(--text-md); }\n.paste-actions { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }\n.samples { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; margin-left: auto; }\n.steps { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-6); }\n.step { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-md); }\n.step .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }\n.step.done .dot { background: var(--eligible-600); color: #fff; }\n.step.now .dot { border: 2px solid var(--brand-600); border-top-color: transparent; animation: spin 0.9s linear infinite; }\n.step.todo { color: var(--ink-400); } .step.todo .dot { border: 2px solid var(--line-strong); }\n.step .note { color: var(--ink-500); font-size: var(--text-sm); }\n@keyframes spin { to { transform: rotate(360deg); } }\n.skeleton { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--line) 0%, var(--sunken) 50%, var(--line) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }\n@keyframes shimmer { to { background-position: -200% 0; } }\n\n/* ---------- Toast ---------- */\n.toast { position: fixed; bottom: var(--space-6); left: 50%; transform: translateX(-50%); background: var(--ink-900); color: #fff; padding: var(--space-3) var(--space-5); border-radius: var(--radius-pill); font-size: var(--text-sm); box-shadow: var(--shadow-raised); z-index: 40; }\n\n/* ---------- Validation screen ---------- */\n.card-header { display: grid; grid-template-columns: 1fr auto; gap: var(--space-4); align-items: center; padding: var(--space-5) var(--space-6); }\n.card-header h1 { margin: 0; font-size: var(--text-xl); font-weight: var(--weight-semibold); letter-spacing: -0.01em; }\n.facts { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); margin-top: var(--space-2); font-size: var(--text-sm); color: var(--ink-500); }\n.progress { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-2); min-width: 240px; }\n.bar { width: 100%; height: 8px; background: var(--line); border-radius: var(--radius-pill); overflow: hidden; }\n.bar > span { display: block; height: 100%; background: var(--brand-600); border-radius: var(--radius-pill); }\n.bar.full > span { background: var(--eligible-600); }\n.three { display: grid; grid-template-columns: 340px minmax(0, 1fr) 380px; gap: var(--space-5); align-items: start; }\n.rules { padding: var(--space-2); max-height: calc(100vh - 300px); overflow-y: auto; }\n.rule-group { padding: var(--space-3) var(--space-3) var(--space-1); }\n.rule-item { display: grid; grid-template-columns: 22px 1fr auto; gap: var(--space-3); align-items: start; padding: var(--space-3); border-radius: var(--radius-md); cursor: pointer; }\n.rule-item:hover { background: var(--sunken); }\n.rule-item.sel { background: var(--brand-50); box-shadow: inset 3px 0 0 var(--brand-600); }\n.rule-item .k { font-weight: var(--weight-semibold); font-size: var(--text-sm); }\n.rule-item .v { font-size: var(--text-sm); color: var(--ink-500); }\n.rule-item .scope { font-size: var(--text-xs); color: var(--ink-500); white-space: nowrap; }\n.st { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; }\n.st.open { border: 2px solid var(--line-strong); }\n.st.ok { background: var(--eligible-600); color: #fff; }\n.st.fixed { background: var(--brand-600); color: #fff; }\n.st.bang { background: var(--review-600); color: #fff; }\n.tabs { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }\n.tab { height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-pill); border: 1px solid var(--line-strong); background: var(--surface); font: inherit; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--ink-700); display: inline-flex; align-items: center; gap: var(--space-2); }\n.tab.on { background: var(--brand-800); color: #fff; border-color: var(--brand-800); }\n.doc-page { padding: var(--space-8) var(--space-8); font-family: Georgia, \"Times New Roman\", serif; font-size: 14px; line-height: 1.75; color: var(--ink-700); min-height: 560px; }\n.doc-page .running { display: flex; justify-content: space-between; font-family: var(--font-sans); font-size: var(--text-xs); color: var(--ink-500); border-bottom: 1px solid var(--line); padding-bottom: var(--space-2); margin-bottom: var(--space-5); }\n.doc-page p { margin: 0 0 var(--space-3); }\n.doc-page mark { background: var(--quote-bg); box-shadow: 0 0 0 2px var(--quote-bg); color: var(--ink-900); border-radius: 2px; }\n.doc-page h4 { font-family: var(--font-sans); margin: var(--space-4) 0 var(--space-2); font-size: var(--text-sm); color: var(--ink-900); }\n.signals { display: flex; flex-direction: column; gap: var(--space-2); font-size: var(--text-sm); }\n.signal { display: flex; gap: var(--space-2); align-items: flex-start; }\n.signal .s { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; margin-top: 2px; }\n.signal.good .s { background: var(--eligible-600); }\n.signal.warn .s { background: var(--review-600); }\n.choice { display: flex; gap: var(--space-3); padding: var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-md); cursor: pointer; }\n.choice.on { border-color: var(--brand-600); background: var(--brand-50); }\n.choice input { margin-top: 3px; }\n.divider { height: 1px; background: var(--line); margin: var(--space-2) 0; }\n\n/* ---------- Mockup state switcher (mockups only, not part of the app) ---------- */\n.mock-switch { position: fixed; bottom: 12px; left: 12px; z-index: 50; display: flex; gap: 4px; padding: 6px; background: rgba(17,24,39,0.88); border-radius: 10px; font-size: 12px; }\n.mock-switch a { color: #d1d5db; text-decoration: none; padding: 4px 8px; border-radius: 6px; }\n.mock-switch a.on { background: #fff; color: #111827; }\n\n", "stats": {"docs": 63, "bytes": 379276, "links": 185, "external": 23, "adrs": 9}}</script>
<script src="marked.min.js"></script>
<script>
(function(){
"use strict";
var A = JSON.parse(document.getElementById('atlas').textContent);
var byPath = {}, bySlug = {};
A.docs.forEach(function(d){ byPath[d.path] = d; bySlug[d.slug] = d; });

var main = document.getElementById('main');
var aside = document.getElementById('aside');
var rail = document.getElementById('rail');
var tree = document.getElementById('tree');
var search = document.getElementById('search');
var filter = document.getElementById('filter');

search.placeholder = 'Search ' + A.stats.docs + ' documents…  ⌘K';

/* ---- theme ---------------------------------------------------------- */
try{ var sv = localStorage.getItem('atlas-theme'); if(sv) document.documentElement.setAttribute('data-theme', sv); }catch(e){}
document.getElementById('theme').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  if(!cur) cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('atlas-theme', next); }catch(e){}
});

/* ---- helpers -------------------------------------------------------- */
function slugify(s){
  return String(s).toLowerCase().replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-');
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}

/* ---- left rail ------------------------------------------------------ */
var railBtns = [];
function buildTree(){
  tree.textContent = '';
  railBtns = [];
  A.groups.forEach(function(g){
    var key = g[0], name = g[1];
    var items = A.docs.filter(function(d){ return d.group === key; });
    if(!items.length) return;
    var box = el('div','gp');
    box.appendChild(el('div','gph', name));
    if(key === 'ux'){
      Object.keys(A.mockups).forEach(function(k){
        var b = el('button','rail-a');
        b.type = 'button';
        b.appendChild(el('span', null, '▸ ' + A.mockups[k].title));
        b.dataset.path = 'mockup-' + k;
        b.dataset.hay = ('mockup ' + A.mockups[k].title + ' ' + A.mockups[k].file).toLowerCase();
        b.addEventListener('click', function(){ goMockup(k); if(window.innerWidth<=860) closeRail(); });
        box.appendChild(b);
        railBtns.push(b);
      });
    }
    items.forEach(function(d){
      var b = el('button','rail-a');
      b.type = 'button';
      b.appendChild(el('span', null, d.label));
      var n = (A.backlinks[d.path] || []).length;
      if(n) { var s = el('span','n', '←' + n); s.title = n + ' document' + (n>1?'s':'') + ' link here'; b.appendChild(s); }
      b.addEventListener('click', function(){ go(d.path); if(window.innerWidth<=860) closeRail(); });
      b.dataset.path = d.path;
      b.dataset.hay = (d.label + ' ' + d.title + ' ' + d.path).toLowerCase();
      box.appendChild(b);
      railBtns.push(b);
    });
    tree.appendChild(box);
  });
}
filter.addEventListener('input', function(){
  var q = filter.value.trim().toLowerCase();
  railBtns.forEach(function(b){ b.hidden = q && b.dataset.hay.indexOf(q) < 0; });
  Array.prototype.forEach.call(tree.querySelectorAll('.gp'), function(g){
    var any = Array.prototype.some.call(g.querySelectorAll('.rail-a'), function(b){ return !b.hidden; });
    g.hidden = !any;
  });
});
function closeRail(){ rail.classList.remove('open'); document.getElementById('menu').setAttribute('aria-expanded','false'); }
document.getElementById('menu').addEventListener('click', function(){
  var o = rail.classList.toggle('open');
  this.setAttribute('aria-expanded', o ? 'true' : 'false');
});
function markCurrent(path){
  railBtns.forEach(function(b){
    if(b.dataset.path === path) b.setAttribute('aria-current','true');
    else b.removeAttribute('aria-current');
  });
}

/* ---- markdown ------------------------------------------------------- */
marked.setOptions({ gfm:true, breaks:false });

function renderDoc(d){
  var host = el('div','md');
  host.innerHTML = marked.parse(d.body);
  var map = A.links[d.path] || {};

  /* heading ids for in-page anchors */
  Array.prototype.forEach.call(host.querySelectorAll('h1,h2,h3,h4'), function(h){
    if(!h.id) h.id = slugify(h.textContent);
  });
  /* tables and wide blocks get their own scroll container */
  Array.prototype.forEach.call(host.querySelectorAll('table'), function(t){
    var w = el('div','scroller'); t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  /* resolve every link through the graph built at generation time */
  Array.prototype.forEach.call(host.querySelectorAll('a[href]'), function(a){
    var raw = a.getAttribute('href');
    var r = map[raw];
    if(!r){
      if(/^https?:/.test(raw)){ a.className = 'ext'; a.target = '_blank'; a.rel = 'noopener'; }
      return;
    }
    if(r.kind === 'doc'){
      a.className = 'doc';
      a.href = '#' + byPath[r.doc].slug;
      a.title = r.doc + (r.anchor ? '#' + r.anchor : '');
      a.addEventListener('click', function(ev){ ev.preventDefault(); go(r.doc, r.anchor); });
    } else if(r.kind === 'mockup'){
      a.className = 'doc';
      a.href = '#mockup-' + r.which;
      a.title = r.path + ' — opens in the atlas';
      a.addEventListener('click', function(ev){ ev.preventDefault(); goMockup(r.which, r.anchor); });
    } else if(r.kind === 'external'){
      a.className = 'ext'; a.target = '_blank'; a.rel = 'noopener';
    } else if(r.kind === 'asset'){
      a.href = r.href + (r.anchor ? '#' + r.anchor : '');
      a.target = '_blank'; a.rel = 'noopener'; a.className = 'ext';
      a.title = r.path;
    } else if(r.kind === 'anchor'){
      a.addEventListener('click', function(ev){
        var sel = window.CSS && CSS.escape ? CSS.escape(r.anchor) : r.anchor;
        var t = host.querySelector('#' + sel);
        if(t){ ev.preventDefault(); t.scrollIntoView({block:'start', behavior:'smooth'}); }
      });
    } else {
      /* a file that lives in the repo and cannot be served here */
      var chip = el('code','filechip', r.path || raw);
      chip.title = 'File in the repo — not part of this page';
      a.parentNode.replaceChild(chip, a);
    }
  });
  /* images: point at the published copies */
  Array.prototype.forEach.call(host.querySelectorAll('img[src]'), function(img){
    var r = map[img.getAttribute('src')];
    if(r && r.kind === 'asset') img.src = r.href;
    else if(r && (r.kind === 'file' || r.kind === 'broken')) img.replaceWith(el('code','filechip', r.path));
    img.loading = 'lazy';
  });
  return host;
}

/* ---- navigation ------------------------------------------------------
   Every move goes through the hash, so each one becomes a history entry
   and the browser's own Back gesture walks the trail. route() does the
   rendering; go() only changes the address. */
var pendingAnchor = null;
function go(path, anchor){
  var d = byPath[path];
  if(!d) return goHome();
  pendingAnchor = anchor || null;
  if(location.hash.slice(1) === d.slug) open(path, anchor);
  else location.hash = d.slug;
}
function goHome(){
  if(location.hash.slice(1) === 'start') home();
  else location.hash = 'start';
}
function goRefs(){
  if(location.hash.slice(1) === 'references') refs();
  else location.hash = 'references';
}
var pendingState = null;
function goMockup(which, state){
  if(!A.mockups[which]) return goHome();
  pendingState = state || null;
  var h = 'mockup-' + which;
  if(location.hash.slice(1) === h) mockup(which, state);
  else location.hash = h;
}
function homeCrumb(){
  var b = el('button','homeb','⌂  Atlas home');
  b.type = 'button';
  b.title = 'Back to the atlas home page';
  b.addEventListener('click', goHome);
  return b;
}

/* ---- document view -------------------------------------------------- */
function open(path, anchor){
  var d = byPath[path];
  if(!d) return home();
  if(location.hash.slice(1) !== d.slug) history.replaceState(null,'','#'+d.slug);
  main.textContent = '';

  var crumb = el('div','crumb');
  crumb.appendChild(homeCrumb());
  crumb.appendChild(el('span','tag', d.path));
  var g = A.groups.filter(function(x){ return x[0]===d.group; })[0];
  if(g) crumb.appendChild(el('span', null, g[1]));
  crumb.appendChild(el('span', null, '· ' + (d.bytes/1024).toFixed(1) + ' kB'));
  main.appendChild(crumb);

  var body = renderDoc(d);
  main.appendChild(body);
  markCurrent(path);
  buildAside(d, body);

  if(anchor){
    var t = body.querySelector('#' + (window.CSS && CSS.escape ? CSS.escape(anchor) : anchor));
    if(t){ t.scrollIntoView({block:'start'}); return; }
  }
  window.scrollTo(0,0);
}

function buildAside(d, body){
  aside.textContent = '';
  var hs = body.querySelectorAll('h2,h3');
  if(hs.length){
    var s = el('div','asec');
    s.appendChild(el('h4', null, 'On this page'));
    Array.prototype.forEach.call(hs, function(h){
      var b = el('button','toc-a' + (h.tagName==='H3' ? ' h3' : ''), h.textContent);
      b.type = 'button';
      b.addEventListener('click', function(){ h.scrollIntoView({block:'start', behavior:'smooth'}); });
      s.appendChild(b);
    });
    aside.appendChild(s);
  }
  var bl = A.backlinks[d.path] || [];
  var s2 = el('div','asec');
  s2.appendChild(el('h4', null, 'Referenced by (' + bl.length + ')'));
  if(!bl.length) s2.appendChild(el('p','empty','Nothing links here yet.'));
  bl.forEach(function(b){
    var src = byPath[b.doc];
    var btn = el('button','back-a');
    btn.type = 'button';
    btn.appendChild(el('span', null, src ? src.title : b.doc));
    btn.appendChild(el('span','bp', b.doc + (b.label ? '  “' + b.label + '”' : '')));
    btn.addEventListener('click', function(){ go(b.doc); });
    s2.appendChild(btn);
  });
  aside.appendChild(s2);
}

/* ---- home ----------------------------------------------------------- */
function chip(label, path, cls){
  var b = el('button','chip' + (cls ? ' ' + cls : ''), label);
  b.type = 'button';
  if(path){ b.addEventListener('click', function(){ go(path); }); b.title = path; }
  else b.style.cursor = 'default';
  return b;
}
function row(label, chips){
  var r = el('div','flowrow');
  r.appendChild(el('div','flowlab', label));
  var c = el('div','chips');
  chips.forEach(function(x){ c.appendChild(x); });
  r.appendChild(c);
  return r;
}
function home(){
  history.replaceState(null,'','#start');
  main.textContent = '';
  markCurrent(null);

  var hero = el('div','hero');
  hero.appendChild(el('h1','','The decisions behind FundEli5, one page deep'));
  hero.appendChild(el('p','','Every document in the starting repo, with its links resolved: click a reference instead of hunting for the file. The right rail shows what points back at the page you are reading.'));
  main.appendChild(hero);

  var st = el('div','stats');
  [['Documents', A.stats.docs], ['ADRs', A.stats.adrs],
   ['Cross-links', A.stats.links], ['External refs', A.stats.external],
   ['Words', Math.round(A.stats.bytes/6/100)*100]].forEach(function(p){
    var s = el('span','stat');
    s.innerHTML = '<b>' + p[1] + '</b> ' + esc(p[0].toLowerCase());
    st.appendChild(s);
  });
  main.appendChild(st);

  var h2 = el('h2'); h2.textContent = 'The four promises';
  h2.style.cssText = 'font-size:18px;margin:4px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)';
  main.appendChild(h2);
  var pw = el('div','promise');
  [['An LLM never decides a Verdict','docs/adr/0001-llm-extracts-rules-engine-decides.md','ADR 0001'],
   ['No LLM runs at check time','docs/adr/0002-no-llm-at-check-time.md','ADR 0002'],
   ['No client data reaches an LLM','docs/adr/0004-two-runtimes-one-llm-egress.md','ADR 0004'],
   ['Suggestions never change a Verdict','docs/adr/0007-advisory-suggestions-never-change-the-verdict.md','ADR 0007']
  ].forEach(function(p){
    var b = el('button','pr'); b.type='button';
    b.appendChild(el('b', null, p[0]));
    b.appendChild(el('span', null, p[2]));
    b.addEventListener('click', function(){ go(p[1]); });
    pw.appendChild(b);
  });
  main.appendChild(pw);

  var h3 = el('h2'); h3.textContent = 'How the build runs';
  h3.style.cssText = 'font-size:18px;margin:30px 0 14px;padding-bottom:6px;border-bottom:1px solid var(--line)';
  main.appendChild(h3);
  var flow = el('div','flow');
  flow.appendChild(row('Tasks', [
    chip('1 · Chart the map','docs/tasks/01-chart-the-map.md','k'),
    chip('2 · Walk the screens','docs/tasks/02-walk-the-screens.md','k'),
    chip('3 · Story + answer key','docs/tasks/03-write-the-demo-story-and-answer-key.md','k')
  ]));
  flow.appendChild(el('div','arrowrow','↓'));
  flow.appendChild(row('Spine', [
    chip('S1 Skeleton','docs/build-workflow.md'), chip('S2 Schemas & ports','docs/build-workflow.md'),
    chip('S3 Walking skeleton','docs/build-workflow.md'),
    chip('S4 Rule Engine · the team’s rows','docs/build-workflow.md','k')
  ]));
  flow.appendChild(el('div','arrowrow','↓'));

/* ---- the live mockups ------------------------------------------------
   The mockup's markup goes into a shadow root with its own tokens.css and
   components.css, so its styles and the atlas's cannot reach each other.
   Its state script is replaced by setState, which applies the same rule. */
function mockup(which, state){
  var m = A.mockups[which];
  if(!m) return goHome();
  var cur = state || m.default;
  if(!m.states.some(function(s){ return s.id === cur; })) cur = m.default;

  main.textContent = '';
  markCurrent(null);
  var crumb = el('div','crumb');
  crumb.appendChild(homeCrumb());
  crumb.appendChild(el('span','tag', m.file));
  crumb.appendChild(el('span', null, 'live mockup'));
  main.appendChild(crumb);

  var h = el('h1'); h.textContent = m.title;
  h.style.cssText = 'font-size:24px;letter-spacing:-.02em;margin:0 0 12px';
  main.appendChild(h);

  var tabs = el('div','mocktabs');
  Object.keys(A.mockups).forEach(function(k){
    var b = el('button', null, A.mockups[k].title);
    b.type = 'button';
    if(k === which) b.setAttribute('aria-current','true');
    b.addEventListener('click', function(){ goMockup(k); });
    tabs.appendChild(b);
  });
  main.appendChild(tabs);

  var bar = el('div','mockbar');
  main.appendChild(bar);
  var frame = el('div','mockframe');
  main.appendChild(frame);

  var note = el('p','mocknote');
  note.textContent = 'The real mockup from ' + m.file + ', every state. Drag the bottom edge to resize. '
    + 'The matching screenshots live in docs/ux/screens/.';
  main.appendChild(note);

  var sr = frame.attachShadow({mode:'open'});
  var style = document.createElement('style');
  style.textContent = A.mockupCss;
  sr.appendChild(style);
  var holder = document.createElement('div');
  holder.innerHTML = m.html;
  sr.appendChild(holder);

  function apply(s){
    cur = s;
    Array.prototype.forEach.call(sr.querySelectorAll('[data-state]'), function(n){
      var on = (n.getAttribute('data-state') || '').split(' ').indexOf(s) >= 0 && n.id !== 'toast';
      n.style.display = on ? '' : 'none';
    });
    Array.prototype.forEach.call(bar.children, function(b){
      b.setAttribute('aria-pressed', b.dataset.state === s ? 'true' : 'false');
    });
    frame.scrollTop = 0;
  }
  m.states.forEach(function(s){
    var b = el('button','st', s.label);
    b.type = 'button';
    b.dataset.state = s.id;
    b.addEventListener('click', function(){ apply(s.id); });
    bar.appendChild(b);
  });
  /* the mockup's own links: states, the other mockup, nothing else */
  sr.addEventListener('click', function(ev){
    var node = ev.target, a = null;
    while(node && node !== sr){
      if(node.tagName === 'A'){ a = node; break; }
      node = node.parentNode;
    }
    if(!a) return;
    ev.preventDefault();
    var href = a.getAttribute('href') || '';
    if(href.charAt(0) === '#'){ apply(href.slice(1)); return; }
    var other = href.match(/^(dealer|validation)\.html(?:#(.+))?$/);
    if(other) goMockup(other[1], other[2] || '');
  });
  apply(cur);

  aside.textContent = '';
  var s2 = el('div','asec');
  s2.appendChild(el('h4', null, 'States'));
  m.states.forEach(function(s){
    var b = el('button','toc-a', s.label);
    b.type = 'button';
    b.addEventListener('click', function(){ apply(s.id); });
    s2.appendChild(b);
  });
  aside.appendChild(s2);
  var s3 = el('div','asec');
  s3.appendChild(el('h4', null, 'Read with it'));
  [['docs/ux/README.md','The state-by-state spec'],
   ['docs/ux/design-system.md','The shared components'],
   ['docs/tasks/02-walk-the-screens.md','Task 2: walk the screens']].forEach(function(p){
    if(!byPath[p[0]]) return;
    var b = el('button','back-a');
    b.type = 'button';
    b.appendChild(el('span', null, p[1]));
    b.appendChild(el('span','bp', p[0]));
    b.addEventListener('click', function(){ go(p[0]); });
    s3.appendChild(b);
  });
  aside.appendChild(s3);
  window.scrollTo(0,0);
}

  rc.appendChild(homeCrumb());

  main.appendChild(rc);

  main.appendChild(sub);

  A.external.forEach(function(r){
    var box = el('div','ref');
    box.appendChild(el('div','host', r.host));

    box.appendChild(a);
    var uses = el('div','uses');

      var d = byPath[c.doc];
      var b = el('button', null, d ? d.label : c.doc);
      b.type = 'button'; b.title = c.doc;
      b.addEventListener('click', function(){ go(c.doc); });
      uses.appendChild(b);
    });
    box.appendChild(uses);

  });

  if(A.broken.length){
    var h2 = el('h2'); h2.textContent = 'Unresolved links';
    h2.style.cssText = 'font-size:18px;margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)';
    main.appendChild(h2);
    A.broken.forEach(function(b){
      var box = el('div','ref');
      box.appendChild(el('div','host','no such file'));
      box.appendChild(el('a', null, b.resolved)).removeAttribute('href');
      var u = el('div','uses');
      var btn = el('button', null, 'in ' + b.doc);
      btn.type = 'button';
      btn.addEventListener('click', function(){ go(b.doc); });
      u.appendChild(btn);
      box.appendChild(u);
      main.appendChild(box);
    });
  }
  aside.textContent = '';
  window.scrollTo(0,0);
}

/* ---- search --------------------------------------------------------- */
function snippet(body, terms){
  var low = body.toLowerCase(), at = -1;
  for(var i=0;i<terms.length;i++){ at = low.indexOf(terms[i]); if(at >= 0) break; }
  if(at < 0) at = 0;
  var from = Math.max(0, at - 70);
  var raw = body.slice(from, from + 230).replace(/\s+/g,' ').trim();
  var out = esc(raw);
  terms.forEach(function(t){
    out = out.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'), '<mark>$1</mark>');
  });
  return (from > 0 ? '…' : '') + out + '…';
}
function runSearch(q){
  var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length) return home();
  var hits = [];
  A.docs.forEach(function(d){
    var low = (d.title + ' ' + d.path + ' ' + d.body).toLowerCase();
    var score = 0, all = true;
    terms.forEach(function(t){
      var n = low.split(t).length - 1;
      if(!n) all = false;
      score += n;
      if(d.title.toLowerCase().indexOf(t) >= 0) score += 25;
      if(d.path.toLowerCase().indexOf(t) >= 0) score += 12;
    });
    if(all && score) hits.push({d:d, score:score});
  });
  hits.sort(function(a,b){ return b.score - a.score; });

  main.textContent = '';
  markCurrent(null);
  var sc = el('div','crumb');
  sc.appendChild(homeCrumb());
  sc.appendChild(el('span','tag','search'));
  sc.appendChild(el('span', null, 'Esc clears'));
  main.appendChild(sc);
  var h = el('h1'); h.textContent = hits.length + ' document' + (hits.length===1?'':'s') + ' for “' + q + '”';
  h.style.cssText = 'font-size:21px;letter-spacing:-.02em;margin:0 0 16px';
  main.appendChild(h);
  if(!hits.length){
    main.appendChild(el('p','empty','Nothing matched. Every term has to appear in the document.'));
    aside.textContent = ''; return;
  }
  hits.slice(0,40).forEach(function(hit){
    var b = el('button','hit'); b.type = 'button';
    b.appendChild(el('b', null, hit.d.title));
    b.appendChild(el('span','hp', hit.d.path));
    var sn = el('span','sn');
    sn.innerHTML = snippet(hit.d.body, terms);
    b.appendChild(sn);
    b.addEventListener('click', function(){ search.value = ''; go(hit.d.path); });
    main.appendChild(b);
  });
  aside.textContent = '';
  window.scrollTo(0,0);
}
var tmr;
search.addEventListener('input', function(){
  clearTimeout(tmr);
  var q = search.value.trim();
  tmr = setTimeout(function(){
    if(q) runSearch(q);
    else route();
  }, 140);
});
search.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ search.value=''; search.blur(); route(); } });
document.addEventListener('keydown', function(e){
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); search.focus(); search.select(); }
  else if(e.key === '/' && document.activeElement !== search && document.activeElement !== filter){
    e.preventDefault(); search.focus();
  }
});

/* ---- routing -------------------------------------------------------- */
function route(){
  var h = location.hash.replace(/^#/,'');
  if(!h || h === 'start') return home();
  if(h === 'references') return refs();
  if(h.indexOf('mockup-') === 0){
    var st = pendingState; pendingState = null;
    return mockup(h.slice(7), st);
  }
  if(bySlug[h]){
    var a = pendingAnchor; pendingAnchor = null;
    return open(bySlug[h].path, a);
  }
  home();
}
document.getElementById('home-btn').addEventListener('click', function(){ search.value=''; goHome(); });
window.addEventListener('hashchange', route);
buildTree();
route();
})();
</script>
