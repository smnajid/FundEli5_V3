<style>
/* Layout: fixed left rail of grouped documents, scrolling reader, right rail of
   outline + backlinks. Palette and type come from docs/ux/tokens.css. */
:root{
  --brand-900:#0f2440; --brand-800:#163257; --brand-700:#1f4373; --brand-600:#2b5a95;
  --brand-100:#e6eef8; --brand-50:#f3f7fc;
  --ink-900:#111827; --ink-700:#374151; --ink-500:#6b7280; --ink-400:#9ca3af;
  --line:#e5e7eb; --line-strong:#d1d5db;
  --surface:#ffffff; --ground:#f4f6f9; --sunken:#f9fafb;
  --eligible-700:#166534; --eligible-100:#dcfce7;
  --not-eligible-700:#991b1b; --not-eligible-100:#fee2e2;
  --review-700:#92400e; --review-100:#fef3c7;
  --ai-700:#5b21b6; --ai-100:#ede9fe;
  --quote-bg:#fef9c3; --quote-line:#eab308;
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
  --shadow-card:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --focus-ring:0 0 0 3px rgba(43,90,149,.35);
  --rail:252px; --outline:208px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand-900:#cfe0f5; --brand-800:#b9d2ef; --brand-700:#8fb6e2; --brand-600:#7aa8dc;
  --brand-100:#1b2b43; --brand-50:#16202f;
  --ink-900:#e8edf4; --ink-700:#bcc6d4; --ink-500:#8b97a8; --ink-400:#6b7686;
  --line:#26303d; --line-strong:#36424f;
  --surface:#131a23; --ground:#0d1218; --sunken:#1a222c;
  --eligible-700:#86efac; --eligible-100:#14321f;
  --not-eligible-700:#fca5a5; --not-eligible-100:#3a1a1a;
  --review-700:#fcd34d; --review-100:#3a2a10;
  --ai-700:#c4b5fd; --ai-100:#2a1f45;
  --quote-bg:#33300f; --quote-line:#a1860f;
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
  --focus-ring:0 0 0 3px rgba(122,168,220,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand-900:#cfe0f5; --brand-800:#b9d2ef; --brand-700:#8fb6e2; --brand-600:#7aa8dc;
  --brand-100:#1b2b43; --brand-50:#16202f;
  --ink-900:#e8edf4; --ink-700:#bcc6d4; --ink-500:#8b97a8; --ink-400:#6b7686;
  --line:#26303d; --line-strong:#36424f;
  --surface:#131a23; --ground:#0d1218; --sunken:#1a222c;
  --eligible-700:#86efac; --eligible-100:#14321f;
  --not-eligible-700:#fca5a5; --not-eligible-100:#3a1a1a;
  --review-700:#fcd34d; --review-100:#3a2a10;
  --ai-700:#c4b5fd; --ai-100:#2a1f45;
  --quote-bg:#33300f; --quote-line:#a1860f;
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
  --focus-ring:0 0 0 3px rgba(122,168,220,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink-900);font-family:var(--font-sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand-900);
  color:#fff;border-bottom:1px solid var(--line)}
:root[data-theme="dark"] #top,
:root:not([data-theme="light"]) #top{color:var(--ink-900)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #top{color:#fff}}
:root[data-theme="light"] #top{color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:21;background:var(--brand-900)}
.topin{display:flex;align-items:center;gap:12px;min-height:52px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;
  background:none;border:0;color:inherit;font-family:inherit;font-size:15px;cursor:pointer;padding:0}
.logo{display:grid;place-items:center;width:24px;height:24px;border-radius:var(--radius-sm);
  background:var(--brand-600);color:#fff;font-size:11px;font-weight:700}
:root[data-theme="dark"] .logo,:root:not([data-theme="light"]) .logo{color:#0d1218}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .logo{color:#fff}}
.mark .sub{font-weight:500;opacity:.62;font-size:13px}
.mark:hover{opacity:.82}
.mark:hover .sub{text-decoration:underline;text-underline-offset:2px}
#search{flex:1;min-width:0;max-width:420px;margin-left:auto;font:inherit;font-size:13px;
  padding:7px 11px;border-radius:var(--radius-pill);border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.10);color:inherit}
#search::placeholder{color:rgba(255,255,255,.55)}
:root[data-theme="dark"] #search::placeholder,
:root:not([data-theme="light"]) #search::placeholder{color:var(--ink-500)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #search::placeholder{color:rgba(255,255,255,.55)}}
.iconbtn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:inherit;
  width:30px;height:30px;border-radius:var(--radius-sm);cursor:pointer;display:grid;place-items:center;
  font-size:13px;flex:none}
#menu{display:none}

/* shell */
#shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--outline);gap:22px;
  max-width:1360px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;align-items:start}

/* left rail */
#rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);
  max-height:calc(100vh - 96px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);padding:10px;min-width:0}
#filter{width:100%;font:inherit;font-size:12.5px;padding:6px 9px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--sunken);color:inherit}
.gp{margin-bottom:10px}
.gph{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-500);padding:4px 8px}
.rail-a{display:flex;gap:7px;align-items:baseline;width:100%;text-align:left;background:none;border:0;
  font:inherit;font-size:12.8px;color:var(--ink-700);padding:5px 8px;border-radius:var(--radius-sm);
  cursor:pointer;line-height:1.35}
.rail-a:hover{background:var(--brand-50);color:var(--brand-700)}
.rail-a[aria-current="true"]{background:var(--brand-100);color:var(--brand-800);font-weight:600}
.rail-a .n{color:var(--ink-400);font-size:11px;font-variant-numeric:tabular-nums;flex:none}

/* reader */
#main{min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:26px 30px 34px;min-height:70vh}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-500);
  font-family:var(--font-mono);margin-bottom:14px}
.crumb .tag{background:var(--sunken);border:1px solid var(--line);border-radius:var(--radius-pill);
  padding:2px 9px}
.crumb .homeb{font:inherit;font-family:var(--font-mono);font-size:11.5px;cursor:pointer;
  background:var(--brand-50);border:1px solid var(--brand-600);color:var(--brand-700);
  border-radius:var(--radius-pill);padding:2px 11px}
.crumb .homeb:hover{background:var(--brand-100);color:var(--brand-800)}
.md{min-width:0}
.md h1{font-size:25px;line-height:1.25;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.md h2{font-size:18px;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);
  letter-spacing:-.01em;text-wrap:balance;scroll-margin-top:110px}
.md h3{font-size:15.5px;margin:22px 0 7px;color:var(--brand-800);scroll-margin-top:110px}
.md h4{font-size:14px;margin:18px 0 6px;color:var(--ink-700);scroll-margin-top:110px}
.md p,.md li{font-size:14.6px}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 12px;padding-left:22px}
.md li{margin-bottom:5px}
.md li>p{margin:0 0 6px}
.md strong{font-weight:600;color:var(--ink-900)}
.md hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.md blockquote{margin:0 0 14px;padding:10px 14px;background:var(--quote-bg);
  border-left:3px solid var(--quote-line);border-radius:0 var(--radius-sm) var(--radius-sm) 0;color:var(--ink-900)}
.md blockquote p:last-child{margin:0}
.md code{font-family:var(--font-mono);font-size:.88em;background:var(--sunken);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.md pre{margin:0 0 14px;background:var(--sunken);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:13px 15px;overflow-x:auto}
.md pre code{background:none;border:0;padding:0;font-size:12.3px;line-height:1.5;white-space:pre}
.scroller{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:var(--radius-md)}
.md table{border-collapse:collapse;width:100%;font-size:13.2px}
.md th,.md td{text-align:left;vertical-align:top;padding:8px 11px;border-bottom:1px solid var(--line)}
.md th{background:var(--sunken);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-500);font-weight:700;white-space:nowrap}
.md tr:last-child td{border-bottom:0}
.md td code{white-space:nowrap}
.md img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:var(--radius-md);display:block}
.md a{color:var(--brand-700);text-decoration-color:var(--line-strong);text-underline-offset:2px}
.md a:hover{color:var(--brand-600)}
.md a.doc{cursor:pointer}
.md a.ext::after{content:"\2197";font-size:.8em;margin-left:2px;color:var(--ink-400)}
.md .filechip{font-family:var(--font-mono);font-size:12px;background:var(--sunken);
  border:1px dashed var(--line-strong);border-radius:var(--radius-sm);padding:1px 6px;color:var(--ink-500)}
.md input[type="checkbox"]{margin-right:6px}

/* right rail */
#aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);
  max-height:calc(100vh - 96px);overflow-y:auto;overscroll-behavior:contain;min-width:0;
  display:flex;flex-direction:column;gap:16px}
.asec h4{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-500);margin:0 0 7px}
.toc-a,.back-a{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;
  font-size:12.2px;color:var(--ink-700);padding:3px 0 3px 9px;border-left:2px solid var(--line);
  cursor:pointer;line-height:1.4}
.toc-a:hover,.back-a:hover{color:var(--brand-700);border-left-color:var(--brand-600)}
.toc-a.h3{padding-left:19px;font-size:11.6px;color:var(--ink-500)}
.back-a{border-left:0;padding-left:0;border-bottom:1px solid var(--line);padding-block:5px}
.back-a:last-child{border-bottom:0}
.back-a .bp{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-400)}
.empty{font-size:12px;color:var(--ink-400);font-style:italic}

/* home */
.hero{margin-bottom:22px}
.hero h1{font-size:28px;letter-spacing:-.025em;margin:0 0 8px;text-wrap:balance}
.hero p{font-size:15.4px;color:var(--ink-700);margin:0;max-width:66ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 26px}
.stat{background:var(--sunken);border:1px solid var(--line);border-radius:var(--radius-pill);
  padding:4px 12px;font-size:12px;color:var(--ink-700)}
.stat b{font-variant-numeric:tabular-nums;color:var(--ink-900)}
.flow{display:grid;gap:10px;margin:0 0 8px}
.flowrow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:start}
.flowlab{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-500);padding-top:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  padding:6px 11px;font-size:12.6px;color:var(--ink-700);cursor:pointer;font:inherit;font-size:12.6px;
  text-align:left;line-height:1.3}
.chip:hover{border-color:var(--brand-600);color:var(--brand-700);background:var(--brand-50)}
.chip.k{border-color:var(--brand-600);background:var(--brand-50);color:var(--brand-800);font-weight:600}
.chip.gate{border-color:var(--eligible-700);background:var(--eligible-100);color:var(--eligible-700)}
.chip.done{border-color:var(--review-700);background:var(--review-100);color:var(--review-700)}
.arrowrow{font-size:11px;color:var(--ink-400);padding-left:98px;letter-spacing:.2em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin:8px 0 0}
.card{background:var(--sunken);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:13px 15px;text-align:left;cursor:pointer;font:inherit}
.card:hover{border-color:var(--brand-600);background:var(--brand-50)}
.card b{display:block;font-size:13.6px;margin-bottom:3px;color:var(--ink-900)}
.card span{font-size:12.2px;color:var(--ink-500);display:block}
.promise{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.pr{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand-600);
  border-radius:var(--radius-sm);padding:11px 13px;text-align:left;cursor:pointer;font:inherit}
.pr:hover{background:var(--brand-50);border-color:var(--brand-600)}
.pr b{display:block;font-size:12.8px;margin-bottom:2px}
.pr span{font-size:11.8px;color:var(--ink-500);font-family:var(--font-mono)}

/* embedded mockups: contain:paint makes the box the containing block for the
   mockup's own fixed-position scrim, drawer and toast */
.mockbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 12px}
.mockbar .st{font:inherit;font-size:12.4px;padding:5px 11px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  color:var(--ink-700)}
.mockbar .st:hover{border-color:var(--brand-600);color:var(--brand-700)}
.mockbar .st[aria-pressed="true"]{background:var(--brand-800);border-color:var(--brand-800);
  color:#fff;font-weight:600}
.mockframe{contain:layout paint;position:relative;overflow:auto;
  height:min(78vh,820px);min-height:420px;resize:vertical;
  border:1px solid var(--line-strong);border-radius:var(--radius-md);background:#f4f6f9}
.mocknote{font-size:12.2px;color:var(--ink-500);margin:9px 0 0}
.mocktabs{display:flex;gap:7px;margin:0 0 14px}
.mocktabs button{font:inherit;font-size:13px;padding:6px 13px;cursor:pointer;
  background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-500)}
.mocktabs button[aria-current="true"]{color:var(--brand-800);border-bottom-color:var(--brand-600);
  font-weight:600}

/* search + refs views */
.hit{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:11px 2px;cursor:pointer;font:inherit}
.hit:hover{background:var(--brand-50)}
.hit b{font-size:13.8px;display:block}
.hit .hp{font-family:var(--font-mono);font-size:10.8px;color:var(--ink-400);display:block;margin:1px 0 4px}
.hit .sn{font-size:12.6px;color:var(--ink-700);display:block}
.hit mark{background:var(--review-100);color:var(--review-700);border-radius:3px;padding:0 2px}
.ref{border-bottom:1px solid var(--line);padding:12px 0}
.ref:last-child{border-bottom:0}
.ref a{font-size:13.4px;font-family:var(--font-mono);word-break:break-all;color:var(--brand-700)}
.ref .host{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  background:var(--sunken);border:1px solid var(--line);border-radius:var(--radius-pill);
  padding:1px 8px;color:var(--ink-500);margin-bottom:5px}
.ref .uses{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ref .uses button{background:var(--sunken);border:1px solid var(--line);border-radius:var(--radius-sm);
  font:inherit;font-size:11.4px;padding:3px 8px;color:var(--ink-700);cursor:pointer}
.ref .uses button:hover{border-color:var(--brand-600);color:var(--brand-700)}

@media (max-width:1100px){
  #shell{grid-template-columns:var(--rail) minmax(0,1fr)}
  #aside{display:none}
}
@media (max-width:860px){
  #shell{grid-template-columns:minmax(0,1fr);gap:14px}
  #menu{display:grid}
  #rail{position:static;max-height:none;display:none}
  #rail.open{display:block}
  #main{padding:20px 18px 28px}
  .hero h1{font-size:23px}
  .flowrow{grid-template-columns:minmax(0,1fr);gap:5px}
  .flowlab{padding-top:0}
  .arrowrow{display:none}
}
</style>

<script type="application/json" id="atlas">{"groups": [["start", "Start here"], ["vocab", "Vocabulary"], ["adr", "Decisions · ADR"], ["build", "Architecture & build"], ["tasks", "The team's tasks"], ["ux", "Screens"], ["contracts", "Data contracts"], ["specs", "Specification"], ["research", "Research & reference"], ["agents", "Agent setup"], ["gates", "Gate agents"], ["skills", "Skills"]], "docs": [{"path": "README.md", "slug": "readme", "title": "FundEli5", "label": "FundEli5", "group": "start", "body": "# FundEli5\n\nFundEli5 helps a private bank's fund dealing desk answer \"may this client subscribe to this fund?\" in seconds, with a cited Verdict and a reply the dealer can send. An LLM drafts Rule Cards from public fund documents, a person validates them, and a deterministic Rule Engine decides. No client data ever reaches an LLM.\n\nThis is the starting repo for the hackathon. It holds **decisions, no code**: the platform gets built here at the event from these documents, and the business content (demo story, rules, answer key) is written by the team.\n\n## Start here\n\n1. **Set up** Claude Code: [docs/agents/setup.md](docs/agents/setup.md) (10 minutes).\n2. **Open the screens** in a browser: [dealer](docs/ux/mockups/dealer.html), [validation](docs/ux/mockups/validation.html). Use the switcher in the bottom-left corner.\n3. **Do the team's first three tasks**: [docs/tasks/](docs/tasks/README.md).\n\nTo read these documents without hunting for files, open `docs/atlas/index.html` in a browser: every page here in one searchable page, with its links and backlinks resolved and both mockups embedded ([how it works](docs/atlas/README.md)).\n\n| # | Task | Time |\n|---|---|---|\n| 1 | [Chart the map](docs/tasks/01-chart-the-map.md): `/wayfinder` with the whole team | 60 min |\n| 2 | [Walk the screens](docs/tasks/02-walk-the-screens.md): the business decides on the mockups before any screen code | 45 min |\n| 3 | [Write the demo story and the answer key](docs/tasks/03-write-the-demo-story-and-answer-key.md): `specs/`, written before the code | 2–3 h |\n\nWhile the team runs tasks 2 and 3, the builder starts the platform spine ([build-workflow.md](docs/build-workflow.md)).\n\n## What's here\n\n| Path | What |\n|---|---|\n| `GLOSSARY.md`, `docs/adr/` | The domain vocabulary and the nine decisions, including the four promises |\n| `docs/architecture.md` | Modules, data flow, privacy boundary |\n| `docs/tech-choices.md` | Stack and versions, packages and ports, ArchUnit rules, LLM egress, Rule Card pipeline, how the screens are built |\n| `docs/build-workflow.md` | The two tracks (platform, content), the spine and waves, the build-ticket template |\n| `docs/ux/` | The screens: principles, lessons from the last build, state-by-state spec, design system, tokens, clickable mockups and their screenshots |\n| `docs/tasks/` | The team's first three tasks, step by step, with the prompts to paste |\n| `docs/contracts/` | The bank data contracts (Client Profile, Share Classes, Fund Documents, Fund Registrations) and the seed fixtures |\n| `docs/hypotheses.md` | The register of working answers to open business questions |\n| `docs/reference/rule-card-extraction/` | The extraction spike: findings, prompts, Rule Card schema, gold cards |\n| `docs/research/` | Sample funds, LLM rule extraction, Claude on Azure Foundry |\n| `fund-documents/` | Public prospectuses and KIDs of the four seed funds |\n| `specs/` | Empty: the team's executable specification goes here ([specs/README.md](specs/README.md)) |\n| `docs/atlas/` | All of the above as one offline HTML page, generated from the files, with a link check ([README](docs/atlas/README.md)) |\n| `.claude/` | Settings and plugins, the gate agents, the skills the tasks use |\n", "bytes": 3218}, {"path": "CLAUDE.md", "slug": "claude", "title": "CLAUDE", "label": "CLAUDE", "group": "start", "body": "## Agent skills\n\n### Issue tracker\n\nIssues are tracked in GitHub Issues through the `gh` CLI. See `docs/agents/issue-tracker.md`.\n\n### Triage labels\n\nUses the five default labels: needs-triage, needs-info, ready-for-agent, ready-for-human, wontfix. See `docs/agents/triage-labels.md`.\n\n### Domain docs\n\nSingle-context: one `GLOSSARY.md` plus `docs/adr/` at the repo root. See `docs/agents/domain.md`.\n\n## How this repo is built\n\nThe repo starts with decisions and no code (README.md). The platform follows `docs/architecture.md`, `docs/tech-choices.md` and `docs/build-workflow.md`; the content follows the team's `specs/`. Never edit `specs/` or `docs/hypotheses.md`: a scenario that looks wrong or a missing business answer stops the ticket.\n\n## Screens\n\nEvery screen matches its mockup in `docs/ux/mockups/` (screenshots in `docs/ux/screens/`) and meets the definition of done in `docs/ux/README.md`: only the tokens of `docs/ux/tokens.css`, the shared components of `docs/ux/design-system.md`, words from `ui/labels.ts` (never a raw enum, ISO date or file id), every state designed, and a Playwright screenshot per state. If the screen needs a value, the API returns it.\n\n## Gates\n\nBefore merging, run the `privacy-gate-auditor` agent on changes touching an LLM call or client field, `engine-purity-reviewer` on Rule Engine changes, and `java-reviewer` or `typescript-reviewer` on the stack. Setup: `docs/agents/setup.md`.\n", "bytes": 1427}, {"path": "GLOSSARY.md", "slug": "glossary", "title": "Fund Gate", "label": "Fund Gate", "group": "vocab", "body": "# Fund Gate\n\nHelping a private bank's fund dealing desk decide, quickly and defensibly, whether a given client may subscribe to a given fund. Regimes in view: Switzerland (FinSA/CISA) and Luxembourg (EU MiFID II, UCITS/AIF, PRIIPs).\n\n## Language\n\n### The decision\n\n**Eligibility Check**:\nThe assessment of whether a given portfolio (by Portfolio Reference) may subscribe to a given Share Class, covering Hard Restrictions, Fund Registration and Target Market match. Excludes Suitability.\n_Avoid_: Suitability check, compliance check, KYC check\n\n**Verdict**:\nThe outcome of an Eligibility Check: Eligible, Not Eligible, or Needs Review.\n_Avoid_: Result, answer, status\n\n**Justification**:\nThe rule-by-rule explanation behind a Verdict, each rule outcome tied to a Citation.\n_Avoid_: Reason, explanation, rationale\n\n**Citation**:\nA pointer from a rule outcome to the exact passage of Fund Documentation (or field of Client Profile) it relies on.\n_Avoid_: Reference, source\n\n**Advisory Suggestion**:\nAn AI-drafted hint attached to a Needs Review, telling the Fund Dealer what to check or which evidence to file; it never changes the Verdict. Each one is a Requester Question or a Dealer To-do, and the Fund Dealer accepts or dismisses it.\n_Avoid_: Recommendation, AI verdict, advice\n\n**Requester Question**:\nAn Advisory Suggestion addressed to the Requester; once accepted, it is asked in the reply.\n_Avoid_: Clarification, query\n\n**Dealer To-do**:\nAn Advisory Suggestion the Fund Dealer carries out themselves, such as filing evidence; it stays internal and never appears in the reply.\n_Avoid_: Task, action item\n\n### The rules\n\n**Hard Restriction**:\nA binary condition stated in Fund Documentation that excludes a Client outright, e.g. investor category, US Person exclusion, minimum initial subscription, mandate-only share class, KID required for retail.\n_Avoid_: Constraint, criterion\n\n**Unmodelled Restriction**:\nA restriction found in Fund Documentation that fits no known kind of Hard Restriction; it is kept with its Citation and leads to Needs Review unless the Rule Card Validator marks it Noted.\n_Avoid_: Other rule, free-text rule\n\n**Noted Restriction**:\nAn Unmodelled Restriction the Rule Card Validator has judged to set no condition on the client (e.g. the board's right to reject applications or close a Share Class); it is shown in the Justification with its Citation but does not affect the Verdict. Its opposite is a Blocking Restriction.\n_Avoid_: Ignored rule, informational rule\n\n**Blocking Restriction**:\nAn Unmodelled Restriction that sets a condition the client may not meet (e.g. \"subscribing through Nordea Group\"); it leads to Needs Review on every check. The default until a Rule Card Validator marks it Noted.\n_Avoid_: Open rule, unresolved rule\n\n**Fund Registration**:\nThe bank's record, from its fund master data or the desk's fund list, that a Share Class may be offered to a given Investor Classification in a given country. Not part of the Rule Card, and not what the Fund Documentation says about it (that is a Selling Restriction).\n_Avoid_: Distribution jurisdiction, passport, country list\n\n**Selling Restriction**:\nA statement in Fund Documentation about where, or to whom, the fund may be offered, e.g. \"not offered in Switzerland\". It is kept with its Citation to cross-check the Fund Registration, and never decides a Verdict.\n_Avoid_: Fund registration (for the document's claim), distribution restriction\n\n**Rule Card**:\nThe validated, structured set of Hard Restrictions and Target Market criteria for one Fund, each rule scoped to the whole Fund or to one of its Share Classes and carrying its Citation.\n_Avoid_: Rule set, fund profile, extraction\n\n**Stale Rule Card**:\nA Validated Rule Card drafted from an edition of Fund Documentation older than the one the bank's fund master data lists. It still decides Verdicts, with a warning, until it is re-drafted and validated.\n_Avoid_: Outdated card, expired card\n\n**Target Market**:\nThe manufacturer-defined profile of clients a Fund is designed for (client type, knowledge and experience, loss-bearing capacity, risk tolerance, objectives, horizon), as published in the EMT/KID.\n_Avoid_: Target audience, investor profile\n\n**Suitability**:\nWhether an investment fits a client's overall portfolio and objectives; an advisory judgement outside the Eligibility Check.\n_Avoid_: Appropriateness (a distinct, narrower MiFID test)\n\n### The inputs\n\n**Client Profile**:\nEverything an Eligibility Check reads about one portfolio: client-level facts (residence, nationalities, US Person facts, knowledge and experience), the Investor Classification given by the portfolio's Legal Entity, and portfolio-level facts (mandate type, risk profile, ability to bear losses, horizon).\n_Avoid_: Client data, customer record, KYC file\n\n**Portfolio Reference**:\nThe bank's identifier of a portfolio, e.g. LOC12345678: a 3-letter legal entity code (LOC = Switzerland, LUX = Luxembourg, SIN = Singapore, …), the 6-digit client number (nocli) and the 2-digit dossier number (nodos), since one client can hold several portfolios. It identifies the client, so it is client-identifying data.\n_Avoid_: Account number, PortfolioRef (in prose)\n\n**Portfolio Id**:\nThe bank's opaque identifier (a UUID) for a portfolio. It maps one-to-one to a Portfolio Reference through the CRM, appears on no official document and reveals nothing about the client, so it may be shared with an LLM.\n_Avoid_: Portfolio key, pseudonym\n\n**Legal Entity**:\nThe bank entity that holds a portfolio, named by the 3-letter code opening its Portfolio Reference (LOC = Switzerland, LUX = Luxembourg, PAR = France, SIN = Singapore, …); it determines the regulatory regime of an Eligibility Check.\n_Avoid_: Booking centre, booking entity\n\n**Subscription Request**:\nWhat a Fund Dealer is asked to check: a portfolio, a Share Class, an amount and currency, and whether the client initiated the order.\n_Avoid_: Order, ticket, request email\n\n**Order**:\nAn instruction to subscribe to a Share Class for a portfolio, created by a portfolio manager in GX (the next version of G2) and sent to Negoce for execution; no subscription is executed without one. An Eligibility Check on an Order runs on a Subscription Request derived from it, without an LLM.\n_Avoid_: Trade, ticket\n\n**Scale Mapping**:\nThe validated correspondence between the bank's own client scales (risk profile, knowledge and experience, …) and the Target Market scales.\n_Avoid_: Conversion table, risk mapping\n\n**Investor Classification**:\nThe regulatory category a Legal Entity gives a client: retail, professional or institutional/eligible counterparty. Qualified investor (CH) and well-informed investor (LU) are derived from it plus mandate and declarations, never stored as such.\n_Avoid_: Client type, segment\n\n**Fund Documentation**:\nThe published documents defining a Fund's restrictions and Target Market: prospectus, KID/KIID, EMT, fund factsheet.\n_Avoid_: Fund docs, fund papers\n\n**Share Class**:\nA subscribable variant of a Fund with its own currency, fees, minimum subscription, and investor restrictions; the actual unit an Eligibility Check targets.\n_Avoid_: Tranche\n\n### The people\n\n**Fund Dealer**:\nA member of the fund dealing desk who receives subscription requests and must answer and justify them.\n_Avoid_: Trader, operator, user\n\n**Requester**:\nThe bank employee (relationship manager or portfolio manager) who asks the fund dealing desk whether one or more portfolios may subscribe to a fund, identifying them by Portfolio Reference only, never by client data.\n_Avoid_: RM, PM, advisor, sender\n\n**Rule Card Validator**:\nThe person who reviews a drafted Rule Card against its Citations, corrects it, marks each Unmodelled Restriction Blocking or Noted, and validates it; typically compliance or a senior Fund Dealer, distinct from the Fund Dealer who uses the card.\n_Avoid_: Reviewer, approver, checker\n", "bytes": 7918}, {"path": "docs/adr/0001-llm-extracts-rules-engine-decides.md", "slug": "docs-adr-0001-llm-extracts-rules-engine-decides", "title": "The LLM drafts Rule Cards; a deterministic engine decides", "label": "0001 · The LLM drafts Rule Cards; a deterministic engine decides", "group": "adr", "body": "---\nstatus: accepted, amended by ADR-0002 (no LLM at check time)\n---\n\n# The LLM drafts Rule Cards; a deterministic engine decides\n\nAn LLM reads Fund Documentation once per Share Class and drafts a Rule Card (each rule carrying its Citation); a human validates it; a deterministic rule engine then evaluates Hard Restrictions against the Client Profile to produce the Verdict. The LLM is used at check time only for fuzzy Target Market matching and for flagging Needs Review, never to decide a Hard Restriction. We chose this over asking an LLM for a Verdict per check (RAG-style) because a bank must be able to reproduce, audit, and defend every Verdict, and \"the AI drafts, a human approves, the engine decides with citations\" is the answer to \"what if the AI is wrong?\".\n\n## Considered Options\n\n- **LLM at check time (retrieve passages, ask for a Verdict)**: fastest to build, but non-reproducible, hallucination-prone, and unauditable.\n- **Fully deterministic, rules hand-encoded**: auditable but doesn't scale to new funds and throws away the \"rapid\" half of the brief.\n", "bytes": 1074}, {"path": "docs/adr/0002-no-llm-at-check-time.md", "slug": "docs-adr-0002-no-llm-at-check-time", "title": "No LLM at check time; Target Market matched by fixed rules", "label": "0002 · No LLM at check time; Target Market matched by fixed rules", "group": "adr", "body": "---\nstatus: accepted, amended by ADR-0005 (advisory LLM lane after the engine); ELI5 note added with #12\n---\n\n# No LLM at check time; Target Market matched by fixed rules\n\nAmends [ADR 0001](0001-llm-extracts-rules-engine-decides.md), which allowed an LLM at check time for fuzzy Target Market matching. Target Market data comes as structured EMT/KID fields. So the Client Profile is kept in the bank's own scales, and a validated Scale Mapping translates it onto the Target Market scales. The Target Market match is then done entirely by fixed rules, and an Eligibility Check involves no LLM at all. We chose this for two reasons. Every Verdict becomes reproducible end to end. And the organisers forbid sending client-identifying data to an external LLM, which a check-time LLM reading the Client Profile would risk. The LLM still drafts Rule Cards from Fund Documentation and may draft the reply to the dealer, but only from pseudonymised text carrying Portfolio Ids.\n\nThe plain-language (\"explain like I'm five\") explanation FundEli5 adds is presentation, not decision. It is rendered from the Justification by a fixed template per rule kind, and the LLM may only rephrase or translate it after the Verdict, like the Reply Drafter.\n\n## Considered Options\n\n- **LLM matches Target Market at check time** (ADR 0001 as written): tolerant of messy client data, but sends client facts to an external model and makes part of the Verdict non-reproducible.\n", "bytes": 1451}, {"path": "docs/adr/0003-validator-marks-unmodelled-restrictions-noted.md", "slug": "docs-adr-0003-validator-marks-unmodelled-restrictions-noted", "title": "Validator may mark an Unmodelled Restriction as Noted", "label": "0003 · Validator may mark an Unmodelled Restriction as Noted", "group": "adr", "body": "# Validator may mark an Unmodelled Restriction as Noted\n\nAmends the Rule Card model (an Unmodelled Restriction always gives Review). Nearly every prospectus carries clauses that set no condition on the client, such as the board's right to reject applications or to close a Share Class (Nordea 1, prospectus p.138). If each gave Review, no check could ever be Eligible. So when validating a Rule Card, the validator marks each Unmodelled Restriction **Blocking** (Review on every check) or **Noted** (Pass, still shown in the Justification with its Citation). The extractor proposes Blocking, so an unreviewed clause never passes silently, and each marking is kept in the card's history with who made it and when. A \"legal only where registered\" clause is not an Unmodelled Restriction at all: it is filed under Fund Registration.\n\n## Considered Options\n\n- **Add rule kinds such as \"issuer discretion\"**: rejected because each new prospectus can bring another clause that sets no condition on the client, so the set of kinds would keep growing. One human call covers them all.\n- **Keep \"always Review\"**: rejected because Eligible would become unreachable for every real fund.\n", "bytes": 1176}, {"path": "docs/adr/0004-two-runtimes-one-llm-egress.md", "slug": "docs-adr-0004-two-runtimes-one-llm-egress", "title": "Two runtimes split on client data; one LLM egress behind a Privacy Gate", "label": "0004 · Two runtimes split on client data; one LLM egress behind a Privacy Gate", "group": "adr", "body": "# Two runtimes split on client data; one LLM egress behind a Privacy Gate\n\nThe system is split into an offline Rule Card pipeline, which only ever reads public Fund Documentation, and an online dealer app, which holds client data; they share one store. Every LLM call from the dealer app goes through a single egress client that only accepts Privacy Gate output. The Gate swaps Portfolio References for Portfolio Ids through the CRM, sends client facts only from a per-call allow-list, and fails closed: if a known client name or an unknown reference remains, no LLM call is made and the dealer enters the request by hand. Requesters identify portfolios by Portfolio Reference only, so the Gate stays deterministic. We chose this because the organisers forbid client-identifying data reaching an external LLM, and a boundary drawn in the deployment and enforced in one place is something a bank's DEV, OPS and INFRA heads can verify.\n\n## Considered Options\n\n- **One app, LLM called wherever needed**: simpler, but the privacy guarantee would rest on every module's discipline instead of one checkpoint.\n- **NER-based redaction (e.g. Presidio) of free-text emails**: catches names we don't know, but it is probabilistic and needs tuning; unnecessary once Requesters send references only.\n- **No LLM on emails at all (form only)**: safest, but drops the email-to-reply demo and the \"rapid\" half of the brief.\n", "bytes": 1407}, {"path": "docs/adr/0005-advisory-llm-lane-after-the-engine.md", "slug": "docs-adr-0005-advisory-llm-lane-after-the-engine", "title": "An advisory LLM lane runs after the engine: downgrade-only, allow-listed facts", "label": "0005 · An advisory LLM lane runs after the engine: downgrade-only, allow-listed facts", "group": "adr", "body": "---\nstatus: accepted, amends ADR-0002 (no LLM at check time); amended by ADR-0007 (suggestions never change the Verdict)\n---\n\n# An advisory LLM lane runs after the engine: downgrade-only, allow-listed facts\n\nThe bank allows pseudonymised client facts (no name, Portfolio Reference, address or birth date) to reach the LLM, pending written confirmation from the sponsor. So an advisory lane runs after the Rule Engine. On a Needs Review it drafts what the dealer should check and which evidence to file, from the Justification's Citations and allow-listed facts. The Verdict itself stays deterministic and reproducible as ADR 0002 requires. The lane may only downgrade a Verdict, never move it toward Eligible. Its suggestions are labelled AI-generated, stored in the Check Record with the exact fields sent, and a human accepts them. A wrong suggestion can therefore cost the dealer time but can never let through a subscription the rules forbid.\n\n## Considered Options\n\n- **Suggest Blocking/Noted for an Unmodelled Restriction per client**: overlaps with the Rule Card Validator's once-per-card decision (ADR 0003); left for production.\n- **Propose facts from free-text KYC notes**: the most powerful, but no data source exists yet; left for production.\n- **No lane**: Needs Review would stay a bare list of Citations, the weakest moment of the demo.\n", "bytes": 1352}, {"path": "docs/adr/0006-spring-boot-and-angular-python-only-for-real-added-value.md", "slug": "docs-adr-0006-spring-boot-and-angular-python-only-for-real-added-value", "title": "Spring Boot 4 and Angular for the POC; Python only where it adds real value", "label": "0006 · Spring Boot 4 and Angular for the POC; Python only where it adds real value", "group": "adr", "body": "# Spring Boot 4 and Angular for the POC; Python only where it adds real value\n\nThe hackathon builds a throwaway proof of concept. If it shows value, the bank rebuilds it in its own stack. So the POC stack is chosen for how many features we can explore in 36 hours, not for production. We still build it in the bank's standard stack: Spring Boot 4 (Java) for the backend and the Rule Card pipeline, and Angular for the dealer screen and the Rule Card validation screen. With coding agents writing most of the code, the slow step is checking it: reviewing generated code, getting an agent unstuck, steering the design, and fixing things on demo day. The driver and the likely teammates are fluent in Java and less so in TypeScript, so a Java backend is where we check code fastest and catch the most bugs. The Rule Engine and the Privacy Gate need the most careful checking, and they stay in Java. The Angular screens are TypeScript, but UI bugs show on screen, so they are easy to verify.\n\nTo recover most of the speed a single-language stack would give, we use three practices:\n- **Generated client types.** The backend publishes an OpenAPI spec (springdoc), and the Angular types and HTTP client are generated from it, so nobody hand-copies DTOs.\n- **One codebase.** The Rule Card pipeline is a command-line mode of the same Spring Boot app, which gives one build, one image and shared domain types. It runs as its own process with no access to client data, so the two runtimes of ADR 0004 stay separate.\n- **Tests catch what review misses.** Spring Boot DevTools keeps restarts to seconds, and the Rule Engine is built test-first against the coverage set, so a wrong Verdict fails a test even when a review misses it.\n\nPython is used only when a module needs something the JVM cannot do well, because the IT department is still young on Python. Today no module does. The extraction spike was written in Python, but everything it relied on has a Java equivalent. The official Anthropic Java SDK supports PDF document blocks, Citations with page locations and structured outputs, and has a Microsoft Foundry backend (`anthropic-java-foundry`). Apache PDFBox replaces pypdf for page selection and the quote-on-page check. The spike's code could not be reused anyway, because the organisers forbid pre-built product code. The egress client calls the official SDK directly, so Citations reach the Rule Card unchanged.\n\nIf the team, once recruited, turns out to be stronger in TypeScript than in Java, revisit this decision at team formation. The language the reviewers know best wins.\n\n## Considered Options\n\n- **TypeScript end to end (Angular + NestJS)**: one language, shared schema types, sub-second reloads and less boilerplate per feature. But it costs review speed and debugging fluency for a Java-first team, and in 36 hours that loss is larger than the gain.\n- **Python for the offline Rule Card pipeline**: closest to the spike and quick for prompt iteration, but it adds a second build, a second container and a stack the team is new to, for no capability Java lacks.\n- **Python with Streamlit for the screens**: fastest to start, but it looks like a prototype in front of the business jury.\n- **Spring AI as the LLM layer**: portable across providers, but we have not checked that it exposes page-level Citations and Foundry hosting options, and it adds an abstraction between the Privacy Gate and the one egress client.\n- **React instead of Angular**: the stack AI tools know best, but the bank runs Angular, and Angular's own agent skill and MCP server close most of that gap.\n", "bytes": 3587}, {"path": "docs/adr/0007-advisory-suggestions-never-change-the-verdict.md", "slug": "docs-adr-0007-advisory-suggestions-never-change-the-verdict", "title": "Advisory Suggestions never change the Verdict; accepted Requester Questions go into the reply", "label": "0007 · Advisory Suggestions never change the Verdict; accepted Requester Questions go into the reply", "group": "adr", "body": "---\nstatus: accepted, amends ADR-0005 (advisory LLM lane after the engine)\n---\n\n# Advisory Suggestions never change the Verdict; accepted Requester Questions go into the reply\n\nADR 0005 let the advisory lane downgrade a Verdict, but a downgrade means the AI arguing for a refusal from facts the engine already read: if the rules support Not Eligible the engine says so, and if they don't the AI shouldn't. So the lane only says what to check or which evidence to file, and never changes the Verdict in either direction. Each Advisory Suggestion is a **Requester Question** or a **Dealer To-do**. The Fund Dealer accepts or dismisses each one (dismissal with an optional one-line note), and every decision is appended to the Check Record with who and when. An accepted Requester Question is asked in the reply; an accepted Dealer To-do is only recorded. On a check with suggestions the dealer drafts the reply after deciding, in one Reply Drafter call in the request's language; undecided suggestions are left out with a warning, and changing a decision afterwards offers a redraft that never overwrites the dealer's edits. A check still ends when the reply is sent: the app does not track the follow-up of a Needs Review.\n\n## Considered Options\n\n- **Keep downgrade proposals**: rejected; no demo case uses them and they blur \"the AI never decides\".\n- **Draft the reply at once and redraft on every decision**: one LLM call per click, and the dealer's edits are lost.\n- **Append accepted questions to the draft without a new call**: cheap, but the questions stay in the dealer's language inside a reply in the Requester's language.\n- **Track a Needs Review to its final answer (a dealer decision beside the Verdict), or require a reason list on dismissal**: worth having in production, where the reason list measures how often the lane is wrong; left for the production slide.\n", "bytes": 1876}, {"path": "docs/adr/0008-bank-data-enters-through-canonical-contracts.md", "slug": "docs-adr-0008-bank-data-enters-through-canonical-contracts", "title": "Bank data enters through canonical contracts; scales stay bank codes", "label": "0008 · Bank data enters through canonical contracts; scales stay bank codes", "group": "adr", "body": "# Bank data enters through canonical contracts; scales stay bank codes\n\nThe app is built in an external cloud environment that cannot reach the bank, then cloned into an internal environment where the bank's APIs live (the CRM, a GraphQL API with `portfolio` and `person` queries; FMD for instruments and their documents). So the app reads bank data only through out ports whose models we define ourselves ([Client Profile](../contracts/client-profile.md), [Share Classes](../contracts/share-classes.md), [Fund Documents](../contracts/fund-documents.md), [Fund Registrations](../contracts/fund-registrations.md)), each with a fixture adapter and a bank adapter. **The adapter is chosen per port, not per environment**: inside the bank, a port whose bank data is not usable keeps its fixture or folder adapter. No REST endpoint sits between the app and its adapters, and nothing above a port knows the bank's schema or protocol: moving inside the bank means writing the bank adapters and nothing else.\n\nInside the contracts, the bank's **scales** (risk profile, knowledge and experience, ability to bear losses) are passed through as bank codes and translated only by the validated Scale Mapping, because translating them is a judgement someone must check, and it must change with the bank's real scales without code. **Legal categories** (Investor Classification, opting declarations, mandate type) become canonical enums in the bank adapter, because they are closed lists set by law that rules branch on directly. Every fact is optional: absent means unknown, unknown gives Review, and adapters never fill defaults.\n\n**Amended 2026-10-24: adapters per port.** The internal environment we reach at the event is the bank's DEV environment. There, FMD's instrument data, document metadata and registration data are real, but its document PDFs and the CRM's client data are mocks, and we can't reach TEST or UAT. So at the event `ShareClasses` and `FundRegistrations` read DEV FMD, while `FundDocuments` reads a folder of real PDFs (its manifest generated from FMD's metadata) and `ClientProfiles` reads the demo fixtures, which are the coverage set's answer key. The FMD document adapter and the CRM GraphQL adapter are specified but not built. In production they replace the folder and fixture adapters, and nothing else changes. Only out-port adapters switch: the Privacy Gate and the LLM egress client are the same in every environment.\n\n## Considered Options\n\n- **Guess the bank's GraphQL schema and mock it outside**: the adapter would look written early, but a guessed schema would almost certainly be wrong and get rewritten at the event anyway.\n- **A small REST facade serving the contract, mocked outside, real inside the bank**: the app would be one build moved by a URL, but it adds a deployable for a 20-hour build, and only the adapter's code differs between the two environments either way.\n- **Bank adapter translates the scales too**: one place for all mapping, but it would bury a validated, regulatory correspondence in code no validator reads.\n- **One Spring profile per environment** (the first version of this ADR): simple, but in DEV it would make a Rule Card from a mock PDF and Verdicts on mock clients with no answer key.\n- **Build the CRM and FMD document adapters against DEV's mocks anyway**: proves the plumbing, but costs event hours on something no one sees, and a mock PDF fed by mistake gives a nonsense card.\n", "bytes": 3441}, {"path": "docs/adr/0009-presidio-detects-personal-data-in-emails.md", "slug": "docs-adr-0009-presidio-detects-personal-data-in-emails", "title": "Presidio detects personal data left in an email; the fixture detector stands in for tests", "label": "0009 · Presidio detects personal data left in an email; the fixture detector stands in for tests", "group": "adr", "body": "# Presidio detects personal data left in an email; the fixture detector stands in for tests\n\nThe Privacy Gate no longer looks client names up in a list. After the Portfolio References are swapped for Portfolio Ids, it scans the pseudonymised text with a `PersonalDataDetector` out port. In production that is Microsoft Presidio's analyzer service (a Python service, allowed by [ADR 0006](0006-spring-boot-and-angular-python-only-for-real-added-value.md) because it adds real value: no list of names is complete). Any PERSON found, an unknown reference, or a detector that is unreachable or errors, means no LLM call and the dealer fills the request form by hand. This refines [ADR 0004](0004-two-runtimes-one-llm-egress.md), which set NER aside as \"unnecessary once Requesters send references only\": the Gate must still catch the Requester who names the client anyway, and a bank cannot list every client name.\n\nPresidio is probabilistic, so the guard is asymmetric: the Gate never downgrades a detection, and it treats \"detector down\" exactly like a detected name. A missed name is still possible; the Gate narrows the risk, it does not remove it, and the allow-list and Check Record stay as the other defences.\n\n## Adapters\n\nChosen by `fundeli5.privacygate.detector`, as for every port ([ADR 0008](0008-bank-data-enters-through-canonical-contracts.md)):\n\n- `fixture` (tests only, set in the test config): deterministic detection of the named demo clients (full name or surname) from docs/contracts/fixtures/README.md. Used by tests and the specification; no Docker.\n- `presidio` (default, so a forgotten property fails closed when the service is down): `POST \u003cfundeli5.privacygate.presidio.url>/analyze` with `{text, language, entities: [\"PERSON\"]}`, once per language in `fundeli5.privacygate.presidio.languages`, results united. The analyzer image is `mcr.microsoft.com/presidio-analyzer` (container port 3000; the default URL is `http://localhost:5002`, i.e. `docker run -p 5002:3000 mcr.microsoft.com/presidio-analyzer`). Tested against a stubbed HTTP server.\n\n## Languages\n\nEmails are EN, FR or DE. The stock image ships an English NLP model only, so **only `en` works out of the box**. FR and DE need the analyzer started with an NLP configuration that loads spaCy `fr_core_news_lg` and `de_core_news_lg` (Presidio's NLP engine configuration file); until then set `languages=en` and a request for `fr` or `de` is answered 400, which the Gate treats as unavailable and refuses. A consequence to know: Presidio also flags the Requester's own name (e.g. a signature). Every email with a PERSON in it goes to the dealer by hand under this rule; tuning (ignoring the sender's header and signature) is a later decision for the business.\n\n## Run order\n\n1. Swap each `[A-Z]{3}\\d{8}` for its Portfolio Id through `ClientProfiles`; an unknown reference refuses.\n2. Detect on the pseudonymised text; any PERSON refuses, the detector failing refuses.\n\nNames stay out of the Client Profile (client-profile.md, \"Not in the contract\").\n\n## Considered Options\n\n- **A list of known client names from the CRM**: needs a new port returning client names, which the contract deliberately leaves out, and misses every name not in the list.\n- **Client name in `ClientProfiles`**: changes a port and the contract.\n- **Regex heuristics for capitalised words**: no Python service, but far noisier than a trained recogniser.\n\n## Boundaries of this decision\n\n- The Gate looks for **names** (PERSON). Other free-text personal data (email address, phone, street address, birth date) is not detected; Requesters send references only, and widening the entities is a later decision.\n- The Presidio service receives pseudonymised text that may still hold a name, so it must run inside the bank's boundary (local container or in-bank host), never a public endpoint. The adapter accepts http(s) URLs only and follows no redirects.\n- After the swap the Gate also refuses anything shaped like a reference that it could not swap (other case, a separator, extra digits).\n\n## Known limits\n\nRecorded at the Integrate checkpoint (#27); mohamed decides on each later.\n\n- Detection is PERSON only; the \"never sent\" list is wider (see Boundaries above).\n- A failed Request Parser call writes no Check Record.\n- Presidio languages default to `en,fr,de` (`fundeli5.privacygate.presidio.languages`), decided by mohamed on 2026-11-03. The stock Presidio image knows English only: run `docker/presidio` (spaCy `en_core_web_lg`, `fr_core_news_md`, `de_core_news_md`). The configuration there has not been run yet; with the stock image the Gate refuses every email, because a language Presidio does not support is a detector failure.\n- There is no deterministic rescan of the CRM client names after the Gate's swap.\n", "bytes": 4771}, {"path": "docs/agents/domain.md", "slug": "docs-agents-domain", "title": "Domain Docs", "label": "Domain Docs", "group": "vocab", "body": "# Domain Docs\n\nHow the engineering skills should consume this repo's domain documentation when exploring the codebase.\n\n## Before exploring, read these\n\n- **`GLOSSARY.md`** at the repo root, or\n- **`GLOSSARY-MAP.md`** at the repo root if it exists: it points at one `GLOSSARY.md` per context. Read each one relevant to the topic.\n- **`docs/adr/`**: read ADRs that touch the area you're about to work in. In multi-context repos, also check `src/\u003ccontext>/docs/adr/` for context-scoped decisions.\n\nIf any of these files don't exist, **proceed silently**. Don't flag their absence; don't suggest creating them upfront. The `/domain-modeling` skill (reached via `/grill-with-docs` and `/improve-codebase-architecture`) creates them lazily when terms or decisions actually get resolved.\n\n## File structure\n\nSingle-context repo (most repos):\n\n```\n/\n├── GLOSSARY.md\n├── docs/adr/\n│   ├── 0001-event-sourced-orders.md\n│   └── 0002-postgres-for-write-model.md\n└── src/\n```\n\nMulti-context repo (presence of `GLOSSARY-MAP.md` at the root):\n\n```\n/\n├── GLOSSARY-MAP.md\n├── docs/adr/                          ← system-wide decisions\n└── src/\n    ├── ordering/\n    │   ├── GLOSSARY.md\n    │   └── docs/adr/                  ← context-specific decisions\n    └── billing/\n        ├── GLOSSARY.md\n        └── docs/adr/\n```\n\n## Use the glossary's vocabulary\n\nWhen your output names a domain concept (in an issue title, a refactor proposal, a hypothesis, a test name), use the term as defined in `GLOSSARY.md`. Don't drift to synonyms the glossary explicitly avoids.\n\nIf the concept you need isn't in the glossary yet, that's a signal: either you're inventing language the project doesn't use (reconsider) or there's a real gap (note it for `/domain-modeling`).\n\n## Flag ADR conflicts\n\nIf your output contradicts an existing ADR, surface it explicitly rather than silently overriding:\n\n> _Contradicts ADR-0007 (event-sourced orders), but worth reopening because…_\n", "bytes": 2042}, {"path": "docs/agents/issue-tracker.md", "slug": "docs-agents-issue-tracker", "title": "Issue tracker: GitHub", "label": "Issue tracker: GitHub", "group": "agents", "body": "# Issue tracker: GitHub\n\nIssues and specs for this repo live as GitHub issues. Use the `gh` CLI for all operations.\n\n## Conventions\n\n- **Create an issue**: `gh issue create --title \"...\" --body \"...\"`. Use a heredoc for multi-line bodies.\n- **Read an issue**: `gh issue view \u003cnumber> --comments`, filtering comments by `jq` and also fetching labels.\n- **List issues**: `gh issue list --state open --json number,title,body,labels,comments --jq '[.[] | {number, title, body, labels: [.labels[].name], comments: [.comments[].body]}]'` with appropriate `--label` and `--state` filters.\n- **Comment on an issue**: `gh issue comment \u003cnumber> --body \"...\"`\n- **Apply / remove labels**: `gh issue edit \u003cnumber> --add-label \"...\"` / `--remove-label \"...\"`\n- **Close**: `gh issue close \u003cnumber> --comment \"...\"`\n\nInfer the repo from `git remote -v`; `gh` does this automatically when run inside a clone.\n\n## Pull requests as a triage surface\n\n**PRs as a request surface: no.** _(Set to `yes` if this repo treats external PRs as feature requests; `/triage` reads this flag.)_\n\nWhen set to `yes`, PRs run through the same labels and states as issues, using the `gh pr` equivalents:\n\n- **Read a PR**: `gh pr view \u003cnumber> --comments` and `gh pr diff \u003cnumber>` for the diff.\n- **List external PRs for triage**: `gh pr list --state open --json number,title,body,labels,author,authorAssociation,comments` then keep only `authorAssociation` of `CONTRIBUTOR`, `FIRST_TIME_CONTRIBUTOR`, or `NONE` (drop `OWNER`/`MEMBER`/`COLLABORATOR`).\n- **Comment / label / close**: `gh pr comment`, `gh pr edit --add-label`/`--remove-label`, `gh pr close`.\n\nGitHub shares one number space across issues and PRs, so a bare `#42` may be either: resolve with `gh pr view 42` and fall back to `gh issue view 42`.\n\n## When a skill says \"publish to the issue tracker\"\n\nCreate a GitHub issue.\n\n## When a skill says \"fetch the relevant ticket\"\n\nRun `gh issue view \u003cnumber> --comments`.\n\n## Wayfinding operations\n\nUsed by `/wayfinder`. The **map** is a single issue with **child** issues as tickets.\n\n- **Map**: a single issue labelled `wayfinder:map`, holding the Notes / Decisions-so-far / Fog body. `gh issue create --label wayfinder:map`.\n- **Child ticket**: an issue linked to the map as a GitHub sub-issue (`gh api` on the sub-issues endpoint). Where sub-issues aren't enabled, add the child to a task list in the map body and put `Part of #\u003cmap>` at the top of the child body. Labels: `wayfinder:\u003ctype>` (`research`/`prototype`/`grilling`/`task`). Once claimed, the ticket is assigned to the driving dev.\n- **Blocking**: GitHub's **native issue dependencies**, the canonical, UI-visible representation. Add an edge with `gh api --method POST repos/\u003cowner>/\u003crepo>/issues/\u003cchild>/dependencies/blocked_by -F issue_id=\u003cblocker-db-id>`, where `\u003cblocker-db-id>` is the blocker's numeric **database id** (`gh api repos/\u003cowner>/\u003crepo>/issues/\u003cn> --jq .id`, _not_ the `#number` or `node_id`). GitHub reports `issue_dependencies_summary.blocked_by` (open blockers only, the live gate). Where dependencies aren't available, fall back to a `Blocked by: #\u003cn>, #\u003cn>` line at the top of the child body. A ticket is unblocked when every blocker is closed.\n- **Frontier query**: list the map's open children (`gh issue list --state open`, scoped to the map's sub-issues / task list), drop any with an open blocker (`issue_dependencies_summary.blocked_by > 0`, or an open issue in the `Blocked by` line) or an assignee; first in map order wins.\n- **Claim**: `gh issue edit \u003cn> --add-assignee @me`, the session's first write.\n- **Resolve**: `gh issue comment \u003cn> --body \"\u003canswer>\"`, then `gh issue close \u003cn>`, then append a context pointer (gist + link) to the map's Decisions-so-far.\n", "bytes": 3731}, {"path": "docs/agents/setup.md", "slug": "docs-agents-setup", "title": "Setup: install before you build", "label": "Setup: install before you build", "group": "start", "body": "# Setup: install before you build\n\nThe Claude Code setup for anyone who builds, and for any team member who wants to try an agent. Target time: 10 minutes.\n\n## 1. Model access\n\n| Who calls | Through | Setup |\n|---|---|---|\n| Claude Code (building) | the event's Claude access on the cloud VM | `claude`, then `/status` shows the account or the Foundry resource. Settings for Foundry: `CLAUDE_CODE_USE_FOUNDRY=1`, `ANTHROPIC_FOUNDRY_RESOURCE`, pinned `ANTHROPIC_DEFAULT_*_MODEL` deployments ([foundry-models.md](../research/foundry-models.md)) |\n| The app's LLM egress (Request Parser, Reply Drafter, pipeline drafting) | Claude on Azure Foundry, through the `foundry` egress adapter | the Foundry endpoint and key as environment variables, never in the repo. Tests run on the `replay` adapter and need no model |\n| Page selection in the Rule Card pipeline | TypeSafe Jev, `https://api.typesafe.ai`, model `jev-latest` | `export TYPESAFE_API_KEY=…`. If Jev is not allowed at the bank, the keyword fallback in [tech-choices.md](../tech-choices.md#rule-card-pipeline) applies |\n\nThe data rules are the same on every adapter ([ADR 0004](../adr/0004-two-runtimes-one-llm-egress.md)): only Privacy Gate output reaches an LLM.\n\n## 2. Clone and trust the repo\n\n```bash\ngit clone \u003crepo url> && cd \u003crepo>\nclaude          # accept the trust prompt\n```\n\nTrusting the folder loads `.claude/settings.json`: the plugins (`frontend-design`, `playwright`, `pr-review-toolkit`, `jdtls-lsp`, `typescript-lsp`), the gate agents in `.claude/agents/` and the skills in `.claude/skills/`. The language plugins need their servers on the `PATH`: `brew install jdtls` (JDK 17+) and `npm install -g typescript-language-server typescript`. Playwright needs its browser once: `npx playwright install chromium`.\n\nCheck: `/plugin` lists the plugins as enabled; `/agents` lists `privacy-gate-auditor`, `engine-purity-reviewer`, `demo-flow-verifier` and the stack reviewers; typing `/` shows `wayfinder`, `to-tickets`, `tdd` and `implement`.\n\n## 3. Angular CLI MCP\n\nGives the agent `ng` targets, the Angular docs and the best-practices guide:\n\n```bash\nclaude mcp add angular-cli -- npx -y @angular/cli mcp\n```\n\n## 4. Look at the screens before building them\n\nOpen `docs/ux/mockups/dealer.html` and `docs/ux/mockups/validation.html` in a browser; the switcher in the bottom-left corner walks through every state. These pages are the target of every screen ticket ([ux/README.md](../ux/README.md)).\n\n## 5. Run the executable specification\n\n`specs/` holds the team's scenarios in Gherkin ([specs/README.md](../../specs/README.md)). Cucumber is wired in the skeleton (spine S1):\n- a `@Suite` runner, `SpecificationSuite`, with `@SelectDirectories(\"../specs\")` relative to `backend/`. Not the `cucumber.features` property: under the JUnit 6 Suite engine it finds nothing;\n- an undefined step is an error, so `./mvnw test` runs `SpecificationRunsTest` instead, which fails only on a scenario that really fails. One module's scenarios: `./mvnw test -Dtest=SpecificationSuite -Dcucumber.filter.tags=\"\u003ctags>\"`;\n- default filter `not @live-llm`, with the egress in replay mode, so a run makes no model call;\n- one step-definition package per module. An undefined step is that module's to-do list.\n\n`@assumed` scenarios still run. A failing `@answer-key` row blocks the rehearsal.\n\n## 6. Daily moves\n\n| When | Do |\n|---|---|\n| Two modules at once | `claude --worktree \u003cmodule>`, one worktree per agent |\n| API changed | regenerate the Angular client, commit both sides together |\n| Build broken | `java-build-resolver` (Spring Boot) or `ts-build-resolver` (Angular) |\n| Before merging | the module's tests; the stack reviewer agent; `privacy-gate-auditor` if an LLM call or client field is touched; `engine-purity-reviewer` for the engine; for a screen, its Playwright screenshots |\n| Integration, freeze, rehearsal | the `demo-flow-verifier` agent |\n", "bytes": 3909}, {"path": "docs/agents/triage-labels.md", "slug": "docs-agents-triage-labels", "title": "Triage Labels", "label": "Triage Labels", "group": "agents", "body": "# Triage Labels\n\nThe skills speak in terms of five canonical triage roles. This file maps those roles to the actual label strings used in this repo's issue tracker.\n\n| Label in mattpocock/skills | Label in our tracker | Meaning                                  |\n| -------------------------- | -------------------- | ---------------------------------------- |\n| `needs-triage`             | `needs-triage`       | Maintainer needs to evaluate this issue  |\n| `needs-info`               | `needs-info`         | Waiting on reporter for more information |\n| `ready-for-agent`          | `ready-for-agent`    | Fully specified, ready for an AFK agent  |\n| `ready-for-human`          | `ready-for-human`    | Requires human implementation            |\n| `wontfix`                  | `wontfix`            | Will not be actioned                     |\n\nWhen a skill mentions a role (e.g. \"apply the AFK-ready triage label\"), use the corresponding label string from this table.\n\nEdit the right-hand column to match whatever vocabulary you actually use.\n", "bytes": 1045}, {"path": "docs/architecture.md", "slug": "docs-architecture", "title": "Reference architecture", "label": "Reference architecture", "group": "build", "body": "# Reference architecture\n\nStack: Spring Boot 4 for both runtimes (the pipeline is a command-line mode of the same app, run as its own process) and Angular for both screens, with the Angular client generated from the backend's OpenAPI spec; Python only where it adds real value, which today is nowhere ([ADR 0006](adr/0006-spring-boot-and-angular-python-only-for-real-added-value.md)). Screens: [screens.md](ux/README.md). Every module below is a seam with a typed interface, so one person can own it. Vocabulary: [GLOSSARY.md](../GLOSSARY.md). Decisions: [ADR 0004](adr/0004-two-runtimes-one-llm-egress.md) (shape and privacy boundary), [ADR 0005](adr/0005-advisory-llm-lane-after-the-engine.md) and [ADR 0007](adr/0007-advisory-suggestions-never-change-the-verdict.md) (advisory lane), [ADR 0002](adr/0002-no-llm-at-check-time.md) (the Verdict involves no LLM).\n\n## Shape\n\nTwo runtimes, split on whether they touch client data, sharing one store.\n\n```\n OFFLINE: public data only                 ONLINE: dealer app, client data stays inside\n ┌───────────────────────────┐             ┌─────────────────────────────────────────────────┐\n │ Rule Card pipeline (CLI)  │             │ Intake (paste / .eml)                           │\n │  page selection           │             │  → Privacy Gate (Portfolio Ref → Portfolio Id,  │\n │  extract (LLM, Citations) │             │     fail-closed guard, fact allow-list)         │\n │  quote-on-page check      │             │  → Request Parser (LLM) → Share Class catalog   │\n └─────────────┬─────────────┘             │  → Rule Engine (deterministic)                  │\n               │ Draft cards               │      ← Client Profile, CRM, Fund Registration,  │\n               ▼                           │        Scale Mapping (adapters)                 │\n        ┌──────────────┐                   │  → Advisory lane (LLM, Needs Review only)       │\n        │ Store        │◄─────────────────►│  → Reply Drafter (LLM, template fallback)       │\n        │ Rule Cards,  │                   │  → Check Record (append-only)                   │\n        │ Scale Mapping│                   │ Validation UI (Draft → Validated)               │\n        │ Check Records│                   │ Reverse lookup (engine × every catalog class)   │\n        └──────────────┘                   │ LLM egress client: the only path to Foundry     │\n                                           └─────────────────────────────────────────────────┘\n```\n\n## Modules\n\n| Module | Runtime | Input → output | LLM? |\n|---|---|---|---|\n| **Rule Card pipeline** | offline CLI | Fund Documentation PDF → Draft Rule Card (cited), quotes checked on their page. Findings of the extraction spike: [reference/rule-card-extraction](reference/rule-card-extraction/spike-README.md) | yes, public documents only |\n| **Share Class catalog** | online | fund/class mention or ISIN → Share Class(es); a fund named without a class fans out to all its classes. The same matcher serves the reverse-lookup search ([screens](ux/README.md)) | no |\n| **Validation UI** | online | Draft card → corrected, Validated card; Unmodelled Restrictions marked Blocking/Noted (ADR 0003); who and when kept per version | no |\n| **Intake** | online | pasted text or `.eml` → raw request text | no |\n| **Privacy Gate** | online | raw text → pseudonymised text + local Portfolio Reference ↔ Portfolio Id map, then a personal-data scan of that text by the `PersonalDataDetector` port (Presidio, [ADR 0009](adr/0009-presidio-detects-personal-data-in-emails.md)); a PERSON left, an unknown reference or a detector that is down refuses; client facts → allow-listed fields for one call; the email sent to the Request Parser is Portfolio Ids plus the Requester's free text, cleared of persons only (`fieldsSent`: portfolioId, freeText) | no |\n| **Request Parser** | online | pseudonymised text → editable list of Subscription Requests (Portfolio Id, Share Class mention, amount, currency, client-initiated) | yes |\n| **Rule Engine** | online | Subscription Request + Validated Rule Card + Client Profile + Fund Registration + Scale Mapping → Verdict + Justification | **never** |\n| **Reverse lookup** | online | portfolio + amount → engine run against every Share Class in the catalog; Draft-only or card-less classes give Needs Review, as a single check would | no |\n| **Advisory lane** | online | Needs Review Justification + allow-listed facts → Advisory Suggestions, each a Requester Question or a Dealer To-do; never changes the Verdict | yes |\n| **Reply Drafter** | online | Verdict + Justification + accepted Requester Questions + allow-listed facts → reply in the request's language; Portfolio Ids swapped back afterwards; template per Verdict as fallback, listing accepted Requester Questions verbatim | yes |\n| **Check Record** | online | everything a check read and produced → append-only record | no |\n| **LLM egress client** | both | the only code that calls Foundry; the online side accepts only Privacy Gate output | — |\n| **Adapters** | online | Behind out ports with canonical models ([ADR 0008](adr/0008-bank-data-enters-through-canonical-contracts.md)): `ClientProfiles` gives the Client Profile and the Portfolio Id ([contract](contracts/client-profile.md)); `ShareClasses` the Share Class catalog ([contract](contracts/share-classes.md)); `FundDocuments` the pipeline's documents ([contract](contracts/fund-documents.md)); `FundRegistrations` the bank's Fund Registration ([contract](contracts/fund-registrations.md)). The adapter is chosen per port: at the event, FMD for Share Classes and Fund Registration, a folder of real PDFs for documents, fixtures for Client Profiles (DEV's CRM and FMD PDFs are mocks) | no |\n\nThe **Client Profile**, **Share Classes**, **Fund Documents** and **Fund Registrations** contracts are written before the event ([contracts/](contracts/), with fixtures); the **Rule Card**, **Subscription Request** and **Check Record** schemas are fixed with the skeleton (spine S2). Everything is built against fixtures from [demo-dataset.md](contracts/fixtures/README.md); the behaviour it must produce is the team's executable specification in [`specs/`](../specs/README.md).\n\n## Data flow of one request\n\n1. The Fund Dealer pastes the Requester's email. Requesters identify portfolios by **Portfolio Reference only, never client data** (*provisional: to confirm with the business partners and the desk*).\n2. The Privacy Gate swaps every `[A-Z]{3}\\d{8}` match for its Portfolio Id through the CRM, then scans the result for personal data (Presidio, ADR 0009). If a person's name or a reference the CRM does not know is still there, **no LLM call is made** and the dealer fills the request form by hand.\n3. The Request Parser turns the pseudonymised text into Subscription Requests. The dealer sees them in an editable form; several references give several checks; anything unresolved becomes Needs Review \"request unclear\", never a guess.\n4. The Rule Engine runs each check, with no LLM. A Share Class with only a Draft card, or no card, gives Needs Review (\"Rule Card not validated\" / \"Fund not covered\"); a Draft card never gives Eligible or Not Eligible.\n5. On Needs Review, the advisory lane drafts Advisory Suggestions: Requester Questions and Dealer To-dos. They are labelled AI-generated and **never change the Verdict** ([ADR 0007](adr/0007-advisory-suggestions-never-change-the-verdict.md)). The dealer accepts or dismisses each one, optionally noting why on a dismissal.\n6. The Reply Drafter writes the reply: at once on checks without suggestions, and when the dealer clicks **Draft reply** on checks with suggestions, so accepted Requester Questions are asked in it. Undecided suggestions are left out with a warning; changing a decision afterwards offers a redraft that never overwrites the dealer's edits. The Portfolio Ids are swapped back to Portfolio References locally.\n7. A Check Record is written. The check ends when the reply is sent; the follow-up of a Needs Review happens outside the app.\n\n## Privacy boundary\n\n- **Never sent to an LLM**: client name, Portfolio Reference, address, phone, email, exact birth date, place of birth, balances.\n- **Allow-listed pseudonymised facts**, only the fields each call needs: Portfolio Id, Legal Entity code, Investor Classification, mandate type, residence country, nationalities, tax residence, US Person / FATCA flags, knowledge and experience, risk profile, ability to bear losses, horizon. Derived values when needed (age band, \"US-born yes/no\"). *Permitted pending written confirmation from the sponsor.*\n- Minimum per call, because combinations of quasi-identifiers can re-identify private-bank clients.\n- Each Check Record logs exactly which fields went out.\n\n## Pre-computed vs live\n\n| Pre-computed | Live |\n|---|---|\n| Rule Cards for the 4 sample funds (1–2 min, $0.2–1.2 each) | Validating one Draft card on stage |\n| Share Class catalog | Intake → Gate → Parser → Engine → advisory lane → Reply |\n| Scale Mapping, Fund Registration, fixtures | Reverse lookup |\n\n**Versioning.** A new Fund Documentation edition gives a new Draft version. The previous Validated version stays in force until the new one is validated. Versions are never edited, only superseded.\n\n## Audit\n\nOne append-only **Check Record** per Eligibility Check: the Subscription Request, Rule Card version, Scale Mapping version, snapshot of the Client Profile fields read, engine version, Verdict, Justification, every accept or dismiss of an Advisory Suggestion (who, when, optional note), and for every LLM call the gated prompt, the response and the model id. The dealer UI has a \"View Check Record\" panel showing exactly what the LLM saw. Replaying a past Verdict (deterministic engine + pinned versions) is mentioned on the production slide, not built.\n\n## Roles\n\n- **Fund Dealer** runs checks and sends replies.\n- **Rule Card Validator** (compliance or a senior dealer) validates cards. Separation of duties in production; one person plays both on stage.\n\n## Runtime\n\n- **Two environments**: we build in an external cloud environment that cannot reach the bank, with the fixture adapters. The app is then cloned into the bank's internal environment, the bank's DEV environment. There each port keeps its fixture adapter or switches to its bank adapter on its own, as a Spring property per port: FMD's instrument and registration data are real, its PDFs and the CRM's clients are mocks. The bank adapters are the only code written there ([ADR 0008](adr/0008-bank-data-enters-through-canonical-contracts.md)).\n- **Demo**: runs locally on our laptops (one compose file: dealer app + store; the pipeline as a CLI against the same store). Claude on Microsoft Foundry through the egress client. Fallbacks by config switch: our own Anthropic key, then a recorded-responses mode for offline rehearsal.\n- **Production path (slide only)**: Container Apps, Entra ID SSO for dealers and validators, Key Vault, Foundry over a private endpoint, logs to Log Analytics, Check Record store as the audit source. Next lanes: NER-based redaction is not needed while Requesters send references only; advisory options (b) suggest Blocking/Noted per client and (c) propose facts from free-text KYC notes; a required reason list on dismissing an Advisory Suggestion (to measure how often the lane is wrong) and tracking a Needs Review to its final answer; Microsoft Graph mailbox intake.\n", "bytes": 11996}, {"path": "docs/atlas/README.md", "slug": "docs-atlas-readme", "title": "The atlas: every document in one page", "label": "The atlas: every document in one page", "group": "start", "body": "# The atlas: every document in one page\n\n`index.html` is the whole repo's documentation as a single page you can open in a browser, with no server and no network. Open it directly:\n\n```bash\nopen docs/atlas/index.html          # macOS\nxdg-open docs/atlas/index.html      # Linux\n```\n\nIt exists because the documents cross-reference each other heavily — 183 links over 62 files — and following one of them in an editor means leaving what you were reading. In the atlas every relative link is resolved into a jump inside the page, and each document shows **what points back at it**.\n\n## What it gives you\n\n| | |\n|---|---|\n| **Resolved links** | Every `[build-workflow.md](../build-workflow.md)` becomes an in-page jump, section anchors included. A link to a folder opens that folder's README |\n| **Backlinks** | \"Referenced by\" on every document, with the words used to link to it. The rail shows each document's inbound count |\n| **Search** | Full text over every document, `⌘K` or `/` |\n| **The mockups, live** | `dealer.html` and `validation.html` embedded with all their states, in a shadow root so their styles and the page's stay apart |\n| **The screens** | `docs/ux/README.md` renders its nine state screenshots inline |\n| **One reference index** | Every link out of the repo, grouped by host, with the documents citing it — the reference build among them |\n| **A link c
